# Standby host for Study Space (Render). Create it from this file when Vercel is unavailable.
services:
  - type: web
    name: study-space-standby
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node standby/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_SETUP_CODE
        sync: false
      - key: NOTIFY_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
