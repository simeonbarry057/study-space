nded data."}, {"id": "x-workbook-basics/Hard/11", "q": "You want to move to the next field while entering the header row. Which taught action fits?", "o": ["Press Save to move one column", "Rename the worksheet after each word", "Press Tab to move right", "Close and reopen after each cell"], "c": 2, "h": "Tab moves the active selection to the right during ordinary cell entry."}], "Very Hard": [{"id": "x-workbook-basics/Very Hard/0", "q": "A file opens with only one sheet after someone exported a CSV. What can you conclude?", "o": ["Changing the extension back always restores everything", "The CSV does not preserve the original multi-sheet workbook; locate the .xlsx master", "Excel has deleted every original backup", "The missing sheets are definitely hidden inside the CSV"], "c": 1, "h": "CSV cannot retain the workbook structure; do not invent a recovery guarantee."}, {"id": "x-workbook-basics/Very Hard/1", "q": "A review asks you to prove the file is usable tomorrow. Which evidence is strongest?", "o": ["The Excel application icon on the taskbar", "Reopen the named .xlsx from its saved location and verify the two tabs and sample cells", "A renamed folder with no checked workbook", "A screenshot of an unsaved Book 1 window"], "c": 1, "h": "Reopening the actual saved artifact verifies the deliverable rather than its appearance."}, {"id": "x-workbook-basics/Very Hard/2", "q": "You select A2:C4 for a check. What is included and what is excluded?", "o": ["Twelve cells including row 1", "Three records plus the Notes worksheet", "All three sample records, but not the header row", "Only the header row and one record"], "c": 2, "h": "A2:C4 contains nine cells in rows 2 through 4; row 1 is outside the range."}, {"id": "x-workbook-basics/Very Hard/3", "q": "A new purchase occupies row 5. What updates the range covering headers and every record?", "o": ["Change the workbook name to A5", "Select A5 only and assume prior rows are included", "Select C1:C5 and ignore Item and Quantity", "Extend A1:C4 to A1:C5"], "c": 3, "h": "The additional row must be included while keeping all fields."}, {"id": "x-workbook-basics/Very Hard/4", "q": "A worksheet is renamed from Sheet 1 to Purchases. What has actually changed?", "o": ["The number of records in the list", "The worksheet tab name, not necessarily the workbook filename", "The saved file extension", "Every value in column A"], "c": 1, "h": "Worksheet names and workbook filenames refer to different objects."}, {"id": "x-workbook-basics/Very Hard/5", "q": "You edited the wrong cell, then made several intentional changes. Why be careful with repeated Undo?", "o": ["Undo always affects only misspellings", "Undo saves an automatic second workbook", "Undo can never change numeric data", "Each Undo can also reverse later intentional edits"], "c": 3, "h": "Undo reverses editing history; inspect what each reversal will affect."}, {"id": "x-workbook-basics/Very Hard/6", "q": "A colleague wants the total number of cells in B2:D6. Your reasoning is:", "o": ["B plus D gives 6 cells regardless of rows", "Three columns and five rows give 15 cells", "Only B2 and D6 exist in that range", "Two columns and four rows give 8 cells"], "c": 1, "h": "Count B,C,D and rows 2,3,4,5,6, including endpoints."}, {"id": "x-workbook-basics/Very Hard/7", "q": "A team says a saved filename proves the list is correct. What is still missing?", "o": ["A more decorative filename", "A fourth worksheet named Correct", "A screenshot of the operating system clock", "Checking the actual records and their cell locations against the intended data"], "c": 3, "h": "Saving preserves content but does not establish that the content was entered accurately."}, {"id": "x-workbook-basics/Very Hard/8", "q": "You need to hand over a reusable purchasing workbook. Which design supports that purpose?", "o": ["Mixed fields in unlabelled cells", "An image of the grid as the only working copy", "A CSV master expected to contain multiple worksheet tabs", "Clearly named worksheets and consistent field columns with a verified .xlsx file"], "c": 3, "h": "A usable workbook needs both a clear structure and a verified saved artifact."}, {"id": "x-workbook-basics/Very Hard/9", "q": "A laptop has AutoSave disabled for a local file. Which habit still protects this lab?", "o": ["Save explicitly and reopen the saved file to verify it", "Assume the account-saved quiz also saves desktop workbooks", "Change the course theme before closing Excel", "Keep the website open instead of saving the workbook"], "c": 0, "h": "Course progress and desktop workbook storage are separate; explicit saving remains necessary."}]}, "x-data-and-formatting": {"Easy": [{"id": "x-data-and-formatting/Easy/0", "q": "What should one row represent in the taught purchase list?", "o": ["Every purchase by every person together", "One complete purchase record", "A separate application account", "One font choice"], "c": 1, "h": "A row groups the fields belonging to the same record."}, {"id": "x-data-and-formatting/Easy/1", "q": "How should you protect a staff code 0017 before entering it?", "o": ["Apply Percentage after typing 17", "Format the empty identifier cells as Text", "Round it to two decimals", "Multiply it by 100"], "c": 1, "h": "Formatting as Text before entry preserves the identifier characters."}, {"id": "x-data-and-formatting/Easy/2", "q": "What does number formatting normally change?", "o": ["The number of worksheet tabs", "How a stored value is displayed", "The record owner", "The actual exchange rate"], "c": 1, "h": "A display format generally leaves the value used for calculation unchanged."}, {"id": "x-data-and-formatting/Easy/3", "q": "Which stored numeric value displays as 15% with Percentage format?", "o": ["1.5", "0.15", "15", "150"], "c": 1, "h": "Percentage display multiplies the underlying value by 100."}, {"id": "x-data-and-formatting/Easy/4", "q": "Which date presentation is least ambiguous to readers in different regions?", "o": ["A bare number 03", "03 Apr 2026", "The text this month", "03/04/2026 without explanation"], "c": 1, "h": "Writing the month name makes the intended month explicit."}, {"id": "x-data-and-formatting/Easy/5", "q": "What should you do if a heading is too long for its column?", "o": ["Delete the heading’s last words", "Adjust the width or use Wrap Text", "Replace the heading with a cost value", "Change every record into a title"], "c": 1, "h": "Readability can improve without removing information."}], "Hard": [{"id": "x-data-and-formatting/Hard/0", "q": "Your staff code 0017 becomes 17 after numeric entry. What prevents this for future codes?", "o": ["Set the empty code column to Text before pasting", "Increase the currency decimal places", "Apply 15% formatting to the code", "Use a wider column only"], "c": 0, "h": "Width and numeric formats do not preserve the original identifier text at entry."}, {"id": "x-data-and-formatting/Hard/1", "q": "A cell holds 12.345 and shows 12.35. Which statement is accurate?", "o": ["Excel has multiplied the value by 100", "The original value is always destroyed", "The cell must contain text", "The two-decimal display has not necessarily rounded the stored value"], "c": 3, "h": "Check the formula bar: the original precision can remain."}, {"id": "x-data-and-formatting/Hard/2", "q": "A rate entered as 15 now displays 1500%. What should you correct?", "o": ["The workbook extension", "The underlying rate to 0.15 or enter 15% directly", "Only the number of decimal places", "Only the font size"], "c": 1, "h": "The percentage format is displaying the entered value consistently."}, {"id": "x-data-and-formatting/Hard/3", "q": "A cost displays$250.00 instead of 250. What happened?", "o": ["The numeric value became 25000", "The quantity was added automatically", "A currency display format was applied", "A foreign-exchange conversion was calculated"], "c": 2, "h": "A symbol does not perform currency conversion."}, {"id": "x-data-and-formatting/Hard/4", "q": "You must preserve a long numeric-looking customer identifier exactly. Best entry type?", "o": ["Text, prepared before entering the identifier", "Percentage", "A two-decimal cost", "A date with a month name"], "c": 0, "h": "Identifiers are labels; storing them as numbers may alter their representation or precision."}, {"id": "x-data-and-formatting/Hard/5", "q": "A date column shows hashes after you narrow it. What should you inspect first?", "o": ["Widen the column and verify the actual date value", "Delete every affected record", "Convert the whole workbook to an image", "Change the date to today without checking"], "c": 0, "h": "An insufficient display width is a common cause; inspect before changing data."}, {"id": "x-data-and-formatting/Hard/6", "q": "A list contains an item and quantity inside the same field. Why separate them?", "o": ["Because every cell must hold exactly five characters", "Each column should have one clear meaning", "Because worksheets cannot contain numbers", "Because text cannot appear in Excel"], "c": 1, "h": "Separate fields support readable and reliable data entry."}, {"id": "x-data-and-formatting/Hard/7", "q": "A formatted heading is neat, but quantities and costs were swapped. What takes priority?", "o": ["Hide both columns permanently", "Save asCSV to repair the values", "Correct the data and field placement before styling", "Add a brighter heading colour"], "c": 2, "h": "Presentation does not repair incorrect data."}, {"id": "x-data-and-formatting/Hard/8", "q": "You enter 0.075 and apply Percentage with one decimal. What display should you expect?", "o": ["75%", "7.5%", "750%", "0.075%"], "c": 1, "h": "0.075 multiplied by 100 gives 7.5 percent."}, {"id": "x-data-and-formatting/Hard/9", "q": "A date 03/04/2026 was interpreted differently on two systems. What is the safest response?", "o": ["Swap the numbers without asking", "Confirm the intended date and use an unambiguous month-name display", "Format it as Currency", "Assume every system uses the same regional order"], "c": 1, "h": "Regional date interpretation can differ; confirm meaning before changing it."}, {"id": "x-data-and-formatting/Hard/10", "q": "Your work list uses merged cells across several data records. What structure fits the lesson?", "o": ["Unmerged field columns with one record per row", "A separate colour for every character", "One merged cell for all records", "No header row"], "c": 0, "h": "A consistent rectangular list is easier to inspect and extend."}, {"id": "x-data-and-formatting/Hard/11", "q": "Before submitting the formatted register, what verification matters?", "o": ["Only the chosen theme name", "Only whether the file is open", "Only whether all borders are identical", "Codes, units and values still match the original records"], "c": 3, "h": "Accuracy and retained meaning come before decoration."}], "Very Hard": [{"id": "x-data-and-formatting/Very Hard/0", "q": "You receive code 17 but cannot tell whether the source was 17,017 or 0017. What is defensible?", "o": ["Assume every code must have four digits", "Always add exactly two zeros", "Convert 17 to 17%", "Check the original source instead of inventing the missing zeros"], "c": 3, "h": "Once information is lost, formatting alone cannot establish its original form."}, {"id": "x-data-and-formatting/Very Hard/1", "q": "Two expenses each store 12.345 and display 12.35. Why might a calculation differ from adding the visible rounded amounts?", "o": ["Calculations can use underlying precision rather than displayed rounding", "Currency symbols always add a hidden fee", "Every formatted number becomes an integer", "A wider column changes arithmetic"], "c": 0, "h": "Displayed decimals and stored values can differ; decide separately whether actual rounding is required."}, {"id": "x-data-and-formatting/Very Hard/2", "q": "A numeric code must display four digits, but another system needs the exact identifier text. Which approach is safer?", "o": ["Rely only on a custom visual zero format", "Apply Currency to the code", "Preserve it as text before entry and verify exported data", "Multiply every identifier by 1000"], "c": 2, "h": "A display-only format does not guarantee another system receives the intended identifier characters."}, {"id": "x-data-and-formatting/Very Hard/3", "q": "A manager wants every amount labelledUSD although the source amounts areGYD. What should you explain?", "o": ["Changing the symbol alone does not convert the currency", "The USD symbol automatically fetches an exchange rate", "Excel assumes all currencies are equal", "Decimal formatting converts between currencies"], "c": 0, "h": "Unit labels and currency conversion are different; this lesson does not perform a conversion."}, {"id": "x-data-and-formatting/Very Hard/4", "q": "A discount is meant to be 15%, but the stored value is 15. Why does changing from 0 to 2 displayed decimals not repair it?", "o": ["The workbook has too many sheets", "Formatting can only be applied before saving", "It changes display precision, not the underlying rate", "Two decimals always erase percentage symbols"], "c": 2, "h": "The underlying value must be corrected to match the intended rate."}, {"id": "x-data-and-formatting/Very Hard/5", "q": "A phone number starts with 0 and is not used for arithmetic. Which reason supports Text?", "o": ["It preserves identifier characters rather than treating the value as a quantity", "Text guarantees the phone is connected", "Text adds missing digits from the internet", "Text automatically verifies the number exists"], "c": 0, "h": "Text preserves representation; it does not verify the real-world identifier."}, {"id": "x-data-and-formatting/Very Hard/6", "q": "One person changed 03Aprto 04Mar while trying to improve the date format. What failed?", "o": ["Only the font weight changed", "The row count increased automatically", "The underlying meaning changed, rather than only its presentation", "A CSV file gained two worksheets"], "c": 2, "h": "A formatting task should retain the intended date; confirm both value and display."}, {"id": "x-data-and-formatting/Very Hard/7", "q": "A quantity column contains both 5 and the text five. What problem should you address before later calculations?", "o": ["Inconsistent data representation in a numeric field", "The column letter is too short", "All text must be deleted from the workbook", "The header must be merged with row 2"], "c": 0, "h": "Consistent field types reduce calculation and interpretation problems."}, {"id": "x-data-and-formatting/Very Hard/8", "q": "An attractive register hides the last digits of staff codes. What should you change?", "o": ["Make the full codes visible and verify their stored text", "Remove the code column’s heading", "Approve it because the colour scheme is professional", "Replace the codes with rounded costs"], "c": 0, "h": "A reader must be able to inspect identifiers accurately."}, {"id": "x-data-and-formatting/Very Hard/9", "q": "A colleague says every formatted date is proof the input was correct. Best response?", "o": ["Wider columns fix ambiguous original meaning", "Month names stop all entry mistakes", "Date formatting validates every source automatically", "A plausible date display can still represent the wrong day; compare with the intended source"], "c": 3, "h": "Formatting improves clarity but does not prove correct source interpretation."}]}, "x-formulas-and-references": {"Easy": [{"id": "x-formulas-and-references/Easy/0", "q": "Which character normally starts an Excel formula?", "o": ["=", ";", "#", "@"], "c": 0, "h": "The equals sign begins an ordinary formula entry."}, {"id": "x-formulas-and-references/Easy/1", "q": "Which formula calculates quantity B2 times unit cost C2?", "o": ["=B2/C2", "=B2+C2", "=B2*C2", "=B2-C2"], "c": 2, "h": "Multiplication calculates quantity times unit cost."}, {"id": "x-formulas-and-references/Easy/2", "q": "Which formula adds line totalsD2 throughD4?", "o": ["=SUM(D5:D5)", "=D2*D4", "=SUM(D2:D4)", "=SUM(D2,D4)"], "c": 2, "h": "The colon describes the whole inclusive range, not only its endpoints."}, {"id": "x-formulas-and-references/Easy/3", "q": "Copying=B2*C2 down one row normally produces:", "o": ["=B3*C3", "=B1*C1", "=B2*C2", "=C2*D2"], "c": 0, "h": "Relative references move with the copied formula."}, {"id": "x-formulas-and-references/Easy/4", "q": "Which reference fixes both column H and row 2 when copying?", "o": ["$H$2", "$H2", "H2", "H$2"], "c": 0, "h": "A dollar sign before each part fixes that part."}, {"id": "x-formulas-and-references/Easy/5", "q": "Which test checks that your formula uses its inputs?", "o": ["Change a source quantity and verify the result, then restore it", "Replace the formula with its old answer", "Rename the worksheet without checking results", "Change only the font colour"], "c": 0, "h": "A controlled input change tests the calculation connection."}], "Hard": [{"id": "x-formulas-and-references/Hard/0", "q": "Notebook quantity is 3 and cost is 250. What should=B2*C2 return?", "o": ["750", "253", "247", "83.333333"], "c": 0, "h": "Three units at 250 each cost 750."}, {"id": "x-formulas-and-references/Hard/1", "q": "The next row has quantity 10 and cost 100. After filling D2 down, D3 should be:", "o": ["=B2*C2, returning 750", "=D3*D3, returning 0", "=B3*C3, returning 1000", "=B3+C3, returning 110"], "c": 2, "h": "Each copied row should use its own input cells."}, {"id": "x-formulas-and-references/Hard/2", "q": "The three line totals are 750,1000 and 3600. What should the grand total be?", "o": ["5350", "4350", "6350", "4600"], "c": 0, "h": "Adding all three totals gives 5350."}, {"id": "x-formulas-and-references/Hard/3", "q": "Why does=SUM(D2,D4)return 4350 with the sample?", "o": ["It always ignoresD2", "It multipliesD2 byD4", "It adds only the two listed endpoints and omitsD3", "It includes every cell betweenD2 andD4"], "c": 2, "h": "A comma-separated list and a colon range are different expressions."}, {"id": "x-formulas-and-references/Hard/4", "q": "A shared practice rate is in H2. Which formula in E2 can be copied down correctly?", "o": ["=D2*$H$2", "=D2*$H2", "=$D$2*H2", "=D2*H2"], "c": 0, "h": "The line total should move; the shared rate should not."}, {"id": "x-formulas-and-references/Hard/5", "q": "Why is a dollar sign in$H$2 not cell protection?", "o": ["It assigns a password to H2", "It encrypts the workbook", "It makes the cell read-only for all users", "It controls reference movement during copying, not permission to editH2"], "c": 3, "h": "Reference anchoring and worksheet protection are separate features."}, {"id": "x-formulas-and-references/Hard/6", "q": "Move=B2*$H$2 one column right. What is the copied formula?", "o": ["=C2*$H$2", "=C2*$I$2", "=B2*H3", "=B3*$H$2"], "c": 0, "h": "The relativeBcolumn moves toC; the absolute rate staysH2."}, {"id": "x-formulas-and-references/Hard/7", "q": "Move=B2*$H$2 one row down. What is the copied formula?", "o": ["=B2*$H$3", "=B3*$H$2", "=B3*H3", "=C2*$H$2"], "c": 1, "h": "The relative row moves from 2 to 3; the fixed reference does not."}, {"id": "x-formulas-and-references/Hard/8", "q": "Which part stays fixed inH$2?", "o": ["Row 2", "BothH and 2", "Neither part", "ColumnH"], "c": 0, "h": "Only the row has a preceding dollar sign."}, {"id": "x-formulas-and-references/Hard/9", "q": "Which part stays fixed in$H2?", "o": ["ColumnH", "The whole worksheet", "The displayed answer", "Row 2"], "c": 0, "h": "Only the column has a preceding dollar sign."}, {"id": "x-formulas-and-references/Hard/10", "q": "B2 changes from 3 to 4 whileC2 stays 250. What new D2 and grand total are expected?", "o": ["D2=254 and grand total=4854", "D2=4000 and grand total=8600", "D2=750 and grand total=5350", "D2=1000 and grand total=5600"], "c": 3, "h": "The changed line increases by 250, so 5350 becomes 5600."}, {"id": "x-formulas-and-references/Hard/11", "q": "D2 contains the typed value 750, not a formula. What happens whenB2 changes?", "o": ["D2 automatically discovers the multiplication", "The stored value becomes$H$2", "D2 always changes to 1000", "D2 does not recalculate from that input"], "c": 3, "h": "A hard-coded answer is not linked to the input cells."}], "Very Hard": [{"id": "x-formulas-and-references/Very Hard/0", "q": "A total in D5 uses=SUM(D2:D5). What is the structural problem?", "o": ["It locks row 5 against editing", "It includes its own result cell and can create a circular reference", "It calculates onlyD4", "It omitsD2"], "c": 1, "h": "A result should not normally depend on itself."}, {"id": "x-formulas-and-references/Very Hard/1", "q": "Every surcharge row repeats 75 even though the line totals differ. The copied formula is=$D$2*$H$2. What needs changing?", "o": ["Remove every dollar sign from both references", "FixD2 and allowH2 to move", "Change 75 to a coloured font", "Use a relative line-total referenceD2 while keeping$H$2 fixed"], "c": 3, "h": "The calculation wrongly fixes the first line total in every row."}, {"id": "x-formulas-and-references/Very Hard/2", "q": "E3 uses=D3*H3 after copyingE2. H3 isblank. What caused the shared-rate error?", "o": ["SUM skipped the middle record", "The rate reference was relative and moved from H2 to H3", "The worksheet filename was incorrect", "The multiplication sign changed into addition"], "c": 1, "h": "Fix the shared-rate reference with$H$2 before filling."}, {"id": "x-formulas-and-references/Very Hard/3", "q": "A practice rate in H2 changes from 10%to 20%. With correct references, what are the three new surcharges?", "o": ["75,100 and 360", "750,1000 and 3600", "20,20 and 20", "150,200 and 720"], "c": 3, "h": "Multiply 750,1000 and 3600 by 0.20."}, {"id": "x-formulas-and-references/Very Hard/4", "q": "Copy=B2*H$2 one column right. Which result exposes the remaining relative part?", "o": ["=C2*$H$2", "=C2*I$2", "=C2*H$3", "=B3*H$2"], "c": 1, "h": "H$2 fixes only the row, so its column moves sideways."}, {"id": "x-formulas-and-references/Very Hard/5", "q": "Copy=B2*$H2 one row down. What is the result?", "o": ["=B3*$H$2", "=B3*$H3", "=B2*$I2", "=C2*$H2"], "c": 1, "h": "$H2 fixes only the column, so the rate row still moves."}, {"id": "x-formulas-and-references/Very Hard/6", "q": "A copied formula displays its text rather than a number. Which taught check is useful?", "o": ["Replace all formulas with unverified answers", "Inspect whether it was entered as a formula or stored as text, and check calculation settings", "Change every amount to a percentage", "Delete the source data to force recalculation"], "c": 1, "h": "Check the entry and settings instead of assuming arithmetic failure."}, {"id": "x-formulas-and-references/Very Hard/7", "q": "A new purchase is entered on row 5 and the old total is moved to D6. Which range now includes all four line totals?", "o": ["=SUM(D2:D4)in D6", "=SUM(D2:D6)in D6", "=SUM(D2:D5)in D6", "=D2+D5 in D6"], "c": 2, "h": "Extend the input range and keep the result cell outside it."}, {"id": "x-formulas-and-references/Very Hard/8", "q": "A copied formula refers to correct cells, but B2 contains the wrong quantity. Can a correct-looking formula prove the final amount is correct?", "o": ["Yes; any formula validates its source values", "Yes; absolute references guarantee correct data", "No; formulas can never calculate a correct result", "No; verify both input accuracy and the formula"], "c": 3, "h": "Correct calculation logic cannot repair incorrect input data."}, {"id": "x-formulas-and-references/Very Hard/9", "q": "After testing B2=4, you restore B2=3. What final evidence supports this workbook check?", "o": ["H2 changes itself into a password", "D2 returns 750 andD5 returns 5350, with formulas still present", "Only the original heading colour returns", "D5 remains 5600 because tests cannot be reversed"], "c": 1, "h": "The restored input should restore the original results when formulas and settings are correct."}]}}, "practice": {"x-workbook-basics": {"Easy": [{"task": "Select the cell in column C,row 2.", "answer": "C2", "reason": "Read the column letter first, then the row number."}, {"task": "Select A1:B3 and count its cells.", "answer": "6 cells", "reason": "There are 2 columns and 3 rows."}, {"task": "Put a Quantity heading in the second column of row 1.", "answer": "Enter Quantity in B1.", "reason": "The second column isB."}, {"task": "Create a sheet for notes without replacing Purchases.", "answer": "Add a worksheet and rename it Notes.", "reason": "A workbook can contain multiple worksheets."}, {"task": "Save a working copy with two sheets.", "answer": "Save as .xlsx and reopen it.", "reason": "Verify both tabs rather than trusting the name alone."}], "Hard": [{"task": "Your supplier list has headers plus 5 records across 4 columns. Select it.", "answer": "A1:D6", "reason": "Include the header row and every record."}, {"task": "The wrong price was overwritten during a spelling correction. Recover safely.", "answer": "Undo the wrong edit and select the item-name cell before correcting it.", "reason": "Check the active cell and verify neighbouring data."}, {"task": "Share plain data but keep your multi-sheet master.", "answer": "Retain the .xlsx and export a separate CSV.", "reason": "The exchange copy and working file serve different purposes."}, {"task": "Create a weekly purchase record using the sample structure.", "answer": "Use Item, Quantity and Unit cost as headers, with one purchase per row.", "reason": "Keep each field consistent."}, {"task": "Two workbook copies have similar names. Choose the handover copy.", "answer": "Open the intended copy and compare its sheets and values with the source.", "reason": "A similar name does not prove current content."}], "Very Hard": [{"task": "Explain why a screenshot is insufficient as the only reusable workbook.", "answer": "It does not retain the editable workbook structure and cell contents as a workbook.", "reason": "A picture is evidence of appearance, not a working spreadsheet file."}, {"task": "An extra record is on row 7 under headers inrow 1 acrossA:C. Select the complete list.", "answer": "A1:C7", "reason": "The inclusive rectangle must reach the final row."}, {"task": "A colleague says renaming a sheet also renames the saved file. Test the claim.", "answer": "Check the tab name and workbook filename separately; they identify different objects.", "reason": "Distinguish container from content."}, {"task": "Design a handover check for a two-sheet purchase workbook.", "answer": "Reopen the named .xlsx, verify both tabs and compare representative cell values.", "reason": "Check a real saved artifact."}, {"task": "An accidental edit occurred before three correct edits. Explain the risk of repeated Undo.", "answer": "It may reverse the three later correct edits before reaching the mistake.", "reason": "Undo follows editing history; inspect each reversal."}]}, "x-data-and-formatting": {"Easy": [{"task": "Store staff code 0008 exactly.", "answer": "Set the empty code cell to Text before entering 0008.", "reason": "Treat the code as an identifier."}, {"task": "Display 0.25 as a percentage.", "answer": "25%", "reason": "Percentage display multiplies the underlying number by 100."}, {"task": "Show 12.678 with two displayed decimals.", "answer": "12.68", "reason": "The display may round while the stored value remains 12.678."}, {"task": "Make a long column heading visible without deleting words.", "answer": "Widen the column or use Wrap Text.", "reason": "Improve presentation while retaining information."}, {"task": "Show an intended date of 4March clearly.", "answer": "Use a month-name format such as 04Mar 2026 and verify the date.", "reason": "Avoid an ambiguous numeric date."}], "Hard": [{"task": "A15%rate appears as 1500%. Repair it.", "answer": "Correct the stored rate to 0.15 or enter 15% directly.", "reason": "Decimal-place controls cannot fix the underlying rate."}, {"task": "A code already lost its zeros. Decide what to do.", "answer": "Check the original source before restoring any digits.", "reason": "Do not invent missing identifier characters."}, {"task": "A currency symbol is changed fromGYDtoUSDwithout a calculation. Explain the result.", "answer": "The amount is relabelled, not converted.", "reason": "Formatting is not exchange-rate logic."}, {"task": "A narrow date column shows hashes. Investigate safely.", "answer": "Widen it and inspect the underlying date first.", "reason": "Do not delete data based only on its display."}, {"task": "An expense list has quantity and item mixed in one column. Reorganise it.", "answer": "Separate fields and keep one record per row.", "reason": "Each column should have one meaning."}], "Very Hard": [{"task": "Two values store 1.234 but each displays 1.23. Explain why calculation and visible addition can differ.", "answer": "Underlying precision can be used instead of the displayed rounded values.", "reason": "Display rounding and calculation rounding are separate."}, {"task": "A long identifier will be sent to another system. Choose a storage strategy.", "answer": "Use Text before entry and inspect the exported identifier.", "reason": "A visual number mask alone may not preserve intended characters elsewhere."}, {"task": "A date format looks valid but the source had ambiguous day/month order. Validate it.", "answer": "Confirm the intended day and month against the source before reformatting.", "reason": "A plausible display is not proof of correct interpretation."}, {"task": "Your formatted list is attractive but quantities are in the cost column. Prioritise fixes.", "answer": "Repair values and field placement before styling.", "reason": "Accuracy is more important than decoration."}, {"task": "Create a verification checklist for the formatted sample.", "answer": "Check retained zeros, correct field placement, numeric precision, intended dates and readable widths.", "reason": "Formatting should preserve source meaning."}]}, "x-formulas-and-references": {"Easy": [{"task": "Calculate 4 units at 125 each with a formula.", "answer": "=4*125 gives 500.", "reason": "A formula starts with=and uses*for multiplication."}, {"task": "Add D2 throughD6.", "answer": "=SUM(D2:D6)", "reason": "The range includes every row from 2 to 6."}, {"task": "Copy=B2*C2 one row down.", "answer": "=B3*C3", "reason": "Both references are relative."}, {"task": "Keep the shared rate in H2 fixed.", "answer": "Use$H$2.", "reason": "Fix both column and row."}, {"task": "Explain the result cell versus formula bar.", "answer": "The cell can show the result while the formula bar shows the expression.", "reason": "Value display and stored formula are different."}], "Hard": [{"task": "Calculate the original sample line totals and total.", "answer": "750,1000,3600; grand total 5350.", "reason": "Multiply quantity by unit cost in each row, then add the line totals."}, {"task": "Increase the paper-pack quantity from 2 to 3.", "answer": "Its total becomes 5400 and the grand total becomes 7150.", "reason": "One extra pack adds 1800 to 5350."}, {"task": "Apply a shared 5%practice rate in H2 to the original line totals.", "answer": "37.5,50 and 180 using=D2*$H$2 filled down.", "reason": "Keep the rate fixed while each row total moves."}, {"task": "Copy=C4*$H$2 two rows down.", "answer": "=C6*$H$2", "reason": "The relative row advances by 2."}, {"task": "Explain why=SUM(D2,D4)does not equal=SUM(D2:D4)for this sample.", "answer": "The comma expression omitsD3, while the range includes it.", "reason": "Distinguish a list of cells from a contiguous range."}], "Very Hard": [{"task": "A copied rate formula uses=D3*H3 but the shared rate isH2. Repair the source formula.", "answer": "Use=D2*$H$2 and refill the column.", "reason": "Relative rate references drift when copied."}, {"task": "A formula in D6 uses=SUM(D2:D6). Diagnose it.", "answer": "The sum includes its own result cell; use the intended input range outsideD6.", "reason": "Avoid circular references."}, {"task": "Predict=B2*H$2 copied two columns right.", "answer": "=D2*J$2", "reason": "The fixed row stays 2, but both relative columns move."}, {"task": "Predict=B2*$H2 copied three rows down.", "answer": "=B5*$H5", "reason": "The shared reference fixesHbut does not fix its row."}, {"task": "Design an input-change test for the purchase workbook.", "answer": "Record 5350, changeNotebook quantity 3 to 4 and expect 5600, then restore 3 and expect 5350.", "reason": "A controlled change tests the formula connection and restoration."}]}}, "roadmap": ["Workbook basics", "Clean data and formatting", "Formulas and references", "Functions: SUM, AVERAGE, MIN, MAX and counting", "Excel Tables, sorting and filtering", "Logical decisions with IF and error handling", "Lookups: XLOOKUP and compatible alternatives", "Charts and clear reporting", "PivotTables and summaries", "Data validation and conditional formatting", "Power Query and repeatable cleaning", "A complete work project and review"]}}</script>

<script>
(function(){
 var ME={id:null};
 var ready=fetch('/api/me',{credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {id:null};}).then(function(m){ME=m||{id:null};});
 function call(o){return fetch('/api/db',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-ss':'1'},body:JSON.stringify(o)}).then(function(r){return r.json().then(function(j){return {status:r.status,j:j};},function(){return {status:r.status,j:{}};});});}
 function snapDoc(p,r){return {id:p.split('/').pop(),exists:!!r.exists,data:function(){return r.data;}};}
 function fail(r){var e=new Error(r.j&&r.j.err||'error');e.code=(r.j&&r.j.err)||'error';return e;}
 function poll(fn,ms){var stop=false,t;function tick(){if(stop)return;if(document.visibilityState==='hidden'){t=setTimeout(tick,ms);return;}fn().then(function(){t=setTimeout(tick,ms);});}tick();return function(){stop=true;clearTimeout(t);};}
 function doc(p){return {
  get:function(){return call({t:'get',p:p}).then(function(r){if(r.status!==200)throw fail(r);return snapDoc(p,r.j);});},
  set:function(d){return call({t:'set',p:p,d:d}).then(function(r){if(r.status!==200)throw fail(r);});},
  update:function(d){return call({t:'update',p:p,d:d}).then(function(r){if(r.status!==200)throw fail(r);});},
  delete:function(){return call({t:'delete',p:p}).then(function(r){if(r.status!==200)throw fail(r);});},
  onSnapshot:function(next,err){var last=null;return poll(function(){return call({t:'get',p:p}).then(function(r){if(r.status!==200){if(err&&last!=='E'){last='E';err(fail(r));}return;}var s=JSON.stringify(r.j);if(s!==last){last=s;next(snapDoc(p,r.j));}});},3000);}};}
 function collection(p){return {onSnapshot:function(next,err){var last=null;return poll(function(){return call({t:'list',p:p}).then(function(r){if(r.status!==200){if(err&&last!=='E'){last='E';err(fail(r));}return;}var s=JSON.stringify(r.j);if(s!==last){last=s;next({docs:r.j.docs.map(function(d){return {id:d.id,data:function(){return d.data;}};})});}});},4000);}};}
 var db={doc:doc,collection:collection};
 var user={isOwner:function(){return Promise.resolve(!!ME.isOwner);},canEdit:function(){return Promise.resolve(!!ME.canEdit);},id:function(){return Promise.resolve(ME.id||null);},email:function(){return Promise.resolve(ME.email||'');},name:function(){return Promise.resolve(ME.name||'');},me:function(){return Promise.resolve(ME);}};
 window.claude={use:function(n){return ready.then(function(){if(!ME.id)return null;return n==='db'?db:n==='user'?user:null;});}};
 window.__webLogout=function(){try{localStorage.removeItem('ccna-out');}catch(e){}fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:{'x-ss':'1','Content-Type':'application/json'},body:'{}'}).then(function(){location.href=location.pathname;},function(){location.href=location.pathname;});};
 // sign-in / sign-up form handling
 function post(path,body){return fetch('/api/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-ss':'1'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});});}
 document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-web="tab"]');if(!b)return;var up=b.getAttribute('data-t')==='up';
  document.querySelectorAll('[data-web="tab"]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
  var a=document.getElementById('web-up'),c=document.getElementById('web-in');if(a)a.hidden=!up;if(c)c.hidden=up;var er=document.getElementById('web-err');if(er)er.textContent='';});
 document.addEventListener('submit',function(e){var f=e.target;if(!f||!f.getAttribute||!f.getAttribute('data-web-form'))return;e.preventDefault();
  var up=f.getAttribute('data-web-form')==='up',er=document.getElementById('web-err'),btn=f.querySelector('button[type=submit]');
  var v=function(n){var el=f.elements[n];return el?el.value:'';};
  er.textContent='';btn.disabled=true;
  post(up?'signup':'login',up?{name:v('name'),email:v('email'),password:v('password'),setup:v('setup')}:{email:v('email'),password:v('password')}).then(function(r){
   if(r.ok){location.reload();return;}er.textContent=(r.j&&r.j.error)||'Something went wrong. Try again.';btn.disabled=false;
  }).catch(function(){er.textContent='Could not reach the site. Check your connection.';btn.disabled=false;});});
})();

<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('site-data').textContent);
var ART=JSON.parse(document.getElementById('site-art').textContent);
var T=D.topics, TB={}; T.forEach(function(t){TB[t.id]=t;});
var QIDX={}; Object.keys(D.quiz).forEach(function(tid){Object.keys(D.quiz[tid]).forEach(function(df){D.quiz[tid][df].forEach(function(q){QIDX[q.id]={q:q,tid:tid,diff:df};});});});
var DIFFS=['Easy','Hard','Very Hard'];
var TOTAL_Q=0; Object.keys(D.quiz).forEach(function(k){DIFFS.forEach(function(df){TOTAL_Q+=D.quiz[k][df].length;});});
var TOTAL_CREDITS=TOTAL_Q+T.length;
var EX=(D.excel&&D.excel.topics)||[];
EX.forEach(function(t){TB[t.id]=t;D.quiz[t.id]=D.excel.quiz[t.id];Object.keys(D.quiz[t.id]).forEach(function(df){D.quiz[t.id][df].forEach(function(q){QIDX[q.id]={q:q,tid:t.id,diff:df};});});});
var SUBJ={ccna:{id:'ccna',name:'CCNA',list:T},excel:{id:'excel',name:'Excel',list:EX}};
function subjOfTopic(t){return t&&t.subject==='excel'?'excel':'ccna';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
var LS={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- state ---------- */

var dbTimer=null,progressLoaded=false;

function effDark(){return S.theme==='dark'||(S.theme!=='light'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}

function save(){if(A.out)return;LS.set('ccna-site-v1',JSON.stringify(S));if(A.db&&A.id&&progressLoaded){clearTimeout(dbTimer);dbTimer=setTimeout(function(){try{A.db.doc('data/users/'+A.id+'/progress').set({json:JSON.stringify(S),at:new Date().toISOString()}).catch(function(){});}catch(e){}},1500);}}

/* ---------- progress maths ---------- */
function qBest(tid,df){var r=(S.quiz[tid]||{})[df];return r?r.best:0;}
function qTotal(tid,df){return D.quiz[tid][df].length;}
function labReady(tid){return qBest(tid,'Easy')===qTotal(tid,'Easy')&&qBest(tid,'Hard')===qTotal(tid,'Hard');}
function labDone(tid){return !!(S.labs[tid]&&S.labs[tid].done);}
function topicStatus(tid){if(labDone(tid))return 'done';var any=DIFFS.some(function(df){return (S.quiz[tid]||{})[df];})||Object.keys((S.labs[tid]||{}).steps||{}).length>0;return any?'part':'none';}
function credits(){var c=0;T.forEach(function(t){DIFFS.forEach(function(df){c+=qBest(t.id,df);});if(labDone(t.id))c++;});return c;}
function qPassed(tid,df){var r=(S.quiz[tid]||{})[df];return !!r&&r.best>=Math.ceil(qTotal(tid,df)*0.8);}
function stats(sub){var L=SUBJ[sub].list,n=L.length||1,les=L.filter(function(t){return S.read[t.id];}).length,labs=L.filter(function(t){return labDone(t.id);}).length,qz=0;L.forEach(function(t){DIFFS.forEach(function(df){if(qPassed(t.id,df))qz++;});});var qt=n*3;return {les:les,labs:labs,qz:qz,n:n,qt:qt,pl:Math.round(les/n*100),pb:Math.round(labs/n*100),pq:Math.round(qz/qt*100),pct:Math.round((les/n+labs/n+qz/qt)/3*100)};}
function curSubject(){var r=V.route||'home';if(r==='ccna'||r==='excel')return r;if(r.indexOf('t-')===0&&TB[r.slice(2)])return subjOfTopic(TB[r.slice(2)]);return S.subject||'ccna';}
function doneCount(stage){return T.filter(function(t){return (!stage||t.stage===stage)&&labDone(t.id);}).length;}

      Promise.all([user.isOwner(),user.id(),user.canEdit()]).then(function(v){
        A.isOwner=!!v[0];A.id=v[1];A.canEdit=!!v[2];A.isAdmin=A.isOwner||A.canEdit;
        ['email','name','displayName'].reduce(function(pr,k){return pr.then(function(x){if(x)return x;try{return typeof user[k]==='function'?Promise.resolve(user[k]()).catch(function(){return '';}):'';}catch(e){return '';}});},Promise.resolve('')).then(function(x){if(x&&typeof x==='string'&&!A.email){A.email=x;if(A.mode==='ok'){var tb=$('.topbar');if(tb)tb.outerHTML=topbarHtml(V.route==='home'||V.route==='account');}}});
        if(!A.id){A.mode='signin';render();return;}
        function watchApproved(){db.collection('approved').onSnapshot(function(s){A.approved=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(V.route==='admin'&&A.mode==='ok')render();},function(){});}
        function watchOwnerData(){
          db.collection('requests').onSnapshot(function(s){A.requests=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(A.mode==='ok'){var rb=$('.topbar');if(rb)rb.outerHTML=topbarHtml(V.route==='home'||V.route==='account');if(V.route==='admin')render();}},function(){});
          db.collection('alerts').onSnapshot(function(s){A.alerts=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(V.route==='admin'&&A.mode==='ok')render();},function(){});
        }
        watchedAdmin=watchApproved;
        if(A.isAdmin){watchApproved();watchOwnerData();}
        if(A.isOwner){evalAccess();return;}
        db.doc('approved/'+A.id).onSnapshot(function(s){A.appDoc=s;evalAccess();},function(){A.mode='signin';render();});
        db.doc('requests/'+A.id).onSnapshot(function(s){A.reqDoc=s;evalAccess();},function(){});
      });
    }).catch(function(){A.mode='signin';render();});
  }
  go();
}
setInterval(function(){if(A.mode==='ok'&&!A.isOwner&&A.appDoc&&A.appDoc.exists){var d=A.appDoc.data()||{};if(d.expiresAt&&new Date(d.expiresAt).getTime()<Date.now()){evalAccess();}}},60000);
applyLook();render();initAccess();
})();

</script></body></html>
