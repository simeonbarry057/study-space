rrect. Do not infer success solely from entered commands.", "Compare root IDs, port roles/costs and event logs against the baseline; correlate physical status rather than guessing.", "The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover.", "No. Link detection, protocol compatibility, roles and topology influence convergence."], "c": 3, "h": "RSTP convergence is mechanism/topology dependent, not a universal fixed time."}, {"id": "stp/Very Hard/2", "q": "Does matching only the MST region name prove one region?", "o": ["No. Revision and VLAN mappings must also match; verify the digest/configuration.", "The trigger is a BPDU; ordinary host traffic does not exercise that behavior.", "No. Link detection, protocol compatibility, roles and topology influence convergence.", "8192 wins among these priorities. With equal priority/system-ID extension, the lowest MAC decides. Check the actual VLAN instance rather than assuming one root for all VLANs."], "c": 0, "h": "Matching region configuration defines membership."}, {"id": "stp/Very Hard/3", "q": "What evidence distinguishes root change from a link fault?", "o": ["Inspect spanning-tree output for the relevant VLAN/instance and root ID on multiple switches.", "Compare root IDs, port roles/costs and event logs against the baseline; correlate physical status rather than guessing.", "The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover.", "No. Link detection, protocol compatibility, roles and topology influence convergence."], "c": 1, "h": "An election change can move forwarding paths without a cable failure."}, {"id": "stp/Very Hard/4", "q": "Write a lab failover verification plan.", "o": ["The remaining topology should regain connectivity if a val es a default according to its configured origination policy.\nWhich explanation is supported by these facts?", "o": ["Advertising reachability does not prove real upstream service.", "Election uses eligible priority then router ID; it is not routinely preemptive.", "Peers on the shared link need matching areas.", "A configured process is not proof of an adjacency."], "c": 0, "h": "Advertising reachability does not prove real upstream service."}]}, "services": {"Easy": [{"id": "services/lesson-check/Easy/0", "q": "Why do a working cable and route not prove the client experience?", "o": ["Settings and application services still need checks.", "A route starts every application automatically.", "A cable supplies all DHCP, DNS and NAT configuration."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "services/lesson-check/Easy/1", "q": "Which pairing describes DHCP and DNS?", "o": ["Both perform the same address-translation function.", "DNS supplies leases; DHCP resolves names.", "DHCP supplies settings; DNS resolves names."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "services/lesson-check/Easy/2", "q": "When is DHCP relay useful?", "o": ["NAT must resolve a website name.", "The server is across a router from client broadcasts.", "The client already shares a working subnet with the server."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "services/lesson-check/Easy/3", "q": "Which checks separate service faults?", "o": ["A lease alone proves DNS and all applications.", "A NAT entry alone proves DNS settings.", "Lease settings, name lookup and web access separately."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "services ty/answer, server route/policy, application response and return path.", "Separate translated source-port/session entries identify their flows; state and return handling must work.", "No. It identifies an IPv4 address; route, policy and application must still work."], "c": 1, "h": "Port translation distinguishes sessions."}, {"id": "services/Hard/3", "q": "What should be recorded when verifying a DNS address change?", "o": ["Authoritative and client answers, TTL/cache behavior, intended address and actual service result.", "First correct the DNS record; then restore HTTP. Record that address assignment worked throughout. Final checks should show a correct lease, the intended DNS answer, and a working web page by IP and name.", "The client receives a .10.x lease with the .10.1 gateway. The relay identifies the client network to the server. Correct server return routing, enabled services, and policy are also required."], "c": 0, "h": "An authoritative update does not instantly replace every cached answer."}, {"id": "services/Hard/4", "q": "Why compare collector receipt with local logs?", "o": ["The client receives a .10.x lease with the .10.1 gateway. The relay identifies the client network to the server. Correct server return routing, enabled services, and policy are also required.", "Relay/helper configuration, routes, server scope, available addresses and DHCP policy in both directions.", "Forwarding/filtering or reachability may omit events; verify timestamps and collection rather than assuming completeness."], "c": 2, "h": "Logging requires suitable source, transport, time and retention."}, {"id": "services/Hard/5", "q": "Client LAN is 192.168.10.0/24; DHCP Server is 192.168.20.20/24 behind a router.\nWhich explanation is supported by these facts?", "o": ["Port translation distinguishes sessions.", "The client broadcast stays local unless a relay forwards it.", "Logging requires suitable source, transport, time and retention."], "c": 1, "h": "Do not put the helper nse. The web service and its connection need their own test."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "services/Hard/11", "q": "You are explaining this topic to a colleague. Which service normally supplies a client’s IP address and gateway settings automatically?", "o": ["DHCP", "NTP", "DNS"], "c": 0, "h": "Correct. DHCP can provide addressing, gateway and DNS-server settings."}], "Very Hard": [{"id": "services/Very Hard/0", "q": "In the lab, add a wrong DNS A record and disable HTTP; repair both with evidence.", "o": ["Authoritative and client answers, TTL/cache behavior, intended address and actual service result.", "No. It identifies an IPv4 address; route, policy and application must still work.", "The client receives a .10.x lease with the .10.1 gateway. The relay identifies the client network to the server. Correct server return routing, enabled services, and policy are also required.", "First correct the DNS record; then restore HTTP. Record that address assignment worked throughout. Final checks should show a correct lease, the intended DNS answer, and a working web page by IP and name."], "c": 3, "h": "Use a lab-only name such as study.example and keep it consistent."}, {"id": "services/Very Hard/1", "q": "How distinguish exhaustion from a total LAN outage?", "o": ["Verify assigned fields, gateway, DNS reachability/answer, server route/policy, application response and return path.", "Inspect scope usage and DHCP messages, compare existing clients with new clients, and verify local link/gateway independently.", "DHCP ACK; renewal and exceptional exchanges can differ.", "Relay/helper configuration, routes, server scope, available addresses and DHCP policy in both directions."], "c": 1, "h": "Clients may fail to obtain new leases while existing leases still work."}, {"id": "services/Very Hard/2", "q": "One VLAN browses, another does not. Give NAT-related checks.", "o": ["Inspect translation selection, i ported by these facts?", "o": ["A correct lease rules out some DHCP errors.", "Transport success can coexist with application security failure.", "A functioning rule for one subnet does not translate every subnet.", "The client broadcast stays local unless a relay forwards it."], "c": 0, "h": "Use a lab-only name such as study.example and keep it consistent."}, {"id": "services/Very Hard/6", "q": "A DHCP pool has no available addresses.\nWhich explanation is supported by these facts?", "o": ["Transport success can coexist with application security failure.", "A correct lease rules out some DHCP errors.", "A relay forwards DHCP information across the routed boundary.", "Clients may fail to obtain new leases while existing leases still work."], "c": 3, "h": "Clients may fail to obtain new leases while existing leases still work."}, {"id": "services/Very Hard/7", "q": "An ACL selects the wrong source subnet for translation.\nWhich explanation is supported by these facts?", "o": ["The address/mask determines the local subnet.", "Clients may fail to obtain new leases while existing leases still work.", "An authoritative update does not instantly replace every cached answer.", "A functioning rule for one subnet does not translate every subnet."], "c": 3, "h": "A functioning rule for one subnet does not translate every subnet."}, {"id": "services/Very Hard/8", "q": "A correct route reaches TLS but an invalid clock causes certificate rejection.\nWhich explanation is supported by these facts?", "o": ["Transport success can coexist with application security failure.", "Logging requires suitable source, transport, time and retention.", "The address/mask determines the local subnet.", "A functioning rule for one subnet does not translate every subnet."], "c": 0, "h": "Transport success can coexist with application security failure."}, {"id": "services/Very Hard/9", "q": "DHCP gives a DNS address that cannot be reached.\nWhich explanation is supported by these facts?", "o": ["De dressing and onward connectivity still matter.", "Yes; seeing an SSID automatically installs an internet route."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "wireless/lesson-check/Easy/5", "q": "How do Wi-Fi and admin passwords differ?", "o": ["One permits joining; the other controls management.", "Both grant the same management rights.", "The admin password determines radio frequency."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "wireless/Hard/0", "q": "Compare a wrong passphrase and disabled DHCP in a saved wireless lab.", "o": ["A password failure prevents a valid join. A DHCP failure affects settings after joining, though an existing lease can mask it. Restoring both should give the intended subnet and local connectivity.", "The Wi-Fi passphrase joins clients; the administrator password controls settings. Joining does not establish a working DHCP lease or internet path.", "Yes. Radio/network advertisement can continue without external connectivity."], "c": 0, "h": "An old lease can persist, so inspect/renew rather than assuming a blank address."}, {"id": "wireless/Hard/1", "q": "Why inspect channel use instead of just increasing transmit power?", "o": ["More power can increase interference and does not remove contention; survey channel/coverage conditions.", "The Wi-Fi passphrase joins clients; the administrator password controls settings. Joining does not establish a working DHCP lease or internet path.", "A password failure prevents a valid join. A DHCP failure affects settings after joining, though an existing lease can mask it. Restoring both should give the intended subnet and local connectivity."], "c": 0, "h": "RF design depends on band, channel width and regulatory constraints."}, {"id": "wireless/Hard/2", "q": "What should precede disabling guest isolation?", "o": ["No. Client behavior, RF and authentication mechanisms influence performance; measure actual application continuity.", "Yes. Radio/network advertisement can continue without external connectivity.", "Confirm intended access requirements and actual guest policy; test approved services without exposing staff networks blindly."], "c": 2, "h": "That may be the intended VLAN/isolation policy."}, {"id": "wireless/Hard/3", "q": "Does the controller alone guarantee every roam has zero interruption?", "o": ["No. Join/authentication, IP configuration and onward connectivity remain separate.", "No. Client behavior, RF and authentication mechanisms influence performance; measure actual application continuity.", "AP association, signal/SNR, retry rate, movement path and comparative application performance over time."], "c": 1, "h": "Client decisions and authentication design affect interruption."}, {"id": "wireless/Hard/4", "q": "What would you inspect when authentication succeeds but gateway access fails?", "o": ["Confirm intended access requirements and actual guest policy; test approved services without exposing staff networks blindly.", "Association/authentication and wireless security settings.", "Client lease/mask/gateway, WLAN-to-VLAN mapping, DHCP path and isolation/policy."], "c": 2, "h": "Wireless link success does not establish IP configuration."}, {"id": "wireless/Hard/5", "q": "Wrong passphrase prevents authentication; a disabled DHCP service can leave an authenticated client without a valid lease.\nWhich explanation is supported by these facts?", "o": ["These failures happen at different stages.", "Joining and administration are different permissions.", "Client decisions and authentication design affect interruption."], "c": 0, "h": "An old lease can persist, so inspect/renew rather than assuming a blank address."}, {"id": "wireless/Hard/6", "q": "Nearby APs overlap on a crowded channel.\nWhich explanation is supported by these facts?", "o": ["RF design depends olleague. Does a strong Wi-Fi signal guarantee a working internet connection?", "o": ["Yes; signal strength proves every service works.", "No; local wireless and upstream connectivity are separate checks.", "Yes; Wi-Fi and the internet are the same thing."], "c": 1, "h": "Correct. A device can have a good local radio link while its gateway, ISP or requested service has a problem."}], "Very Hard": [{"id": "wireless/Very Hard/0", "q": "Remove one remote lab route and build a troubleshooting note.", "o": ["If both clients share the remote failure while local service works, a common upstream fault is plausible. Restore the missing route in the lab and retest both directions. The working local tests do not prove every radio metric is ideal, only the tested connectivity.", "AP association, signal/SNR, retry rate, movement path and comparative application performance over time.", "No. Join/authentication, IP configuration and onward connectivity remain separate.", "More power can increase interference and does not remove contention; survey channel/coverage conditions."], "c": 0, "h": "Use a simulated remote server; Packet Tracer does not provide actual internet service."}, {"id": "wireless/Very Hard/1", "q": "Which observations support a roaming/coverage diagnosis?", "o": ["AP association, signal/SNR, retry rate, movement path and comparative application performance over time.", "More power can increase interference and does not remove contention; survey channel/coverage conditions.", "No. Client behavior, RF and authentication mechanisms influence performance; measure actual application continuity.", "Compare signal and retries at fixed locations under quiet/busy conditions, wired baseline, channel use and application latency/loss."], "c": 0, "h": "Association choice may be client-driven despite a nearer AP."}, {"id": "wireless/Very Hard/2", "q": "Design tests to distinguish coverage from load-related airtime shortage.", "o": ["Temporarily disable cellular data during an uplicate resources; use the documented operation and supported idempotency mechanism.", "Read resulting config/state, test required forwarding and intended blocks, record per-target results and rollback if necessary."], "c": 0, "h": "Compute a scoped proposed change before applying it."}, {"id": "automation/Hard/3", "q": "How should a script treat HTTP 401?", "o": ["Authentication failed or is required; stop dependent changes, handle credentials safely and report the failure.", "Target identity, current/intended values, exact proposed operation and validation/rollback plan.", "GET current record; validate target/schema; PATCH enabled=true; check response; GET state and verify link behavior. Roll back enabled to its recorded value if needed. Never send this fictional endpoint to a live device."], "c": 0, "h": "Authorization failed; repeating without addressing permission is not a fix."}, {"id": "automation/Hard/4", "q": "Does every POST become idempotent automatically?", "o": ["Use conditional/version-aware operations where supported; refresh and reconcile if state changed before applying.", "No. Read status does not indicate a configuration change.", "No. Repetition may create duplicate resources; use the documented operation and supported idempotency mechanism."], "c": 2, "h": "Idempotence depends on operation/API behavior, not the script language."}, {"id": "automation/Hard/5", "q": "A fictional API allows PATCH /interfaces/Gi0-1 with {\"enabled\":true}.\nWhich explanation is supported by these facts?", "o": ["Idempotence depends on operation/API behavior, not the script language.", "Read current state with GET first.", "name is a string, enabled a boolean, and mtu a number."], "c": 1, "h": "The URL and schema here are illustrative, not a real router endpoint."}, {"id": "automation/Hard/6", "q": "An API returns interfaces as an array.\nWhich explanation is supported by these facts?", "o": ["Compute a scoped proposed change before applying it.", "Read current state al success."}, {"id": "automation/Very Hard/5", "q": "An AI-produced inventory includes a duplicate interface and enabled values mixing strings with booleans.\nWhich explanation is supported by these facts?", "o": ["A fleet operation can have mixed outcomes.", "The previous snapshot may be stale.", "A parser can accept syntactically valid JSON that violates the intended schema.", "Blindly retrying a non-idempotent write can duplicate it."], "c": 2, "h": "Do not silently convert or overwrite the conflicting record."}, {"id": "automation/Very Hard/6", "q": "Three devices update and a fourth rejects the change.\nWhich explanation is supported by these facts?", "o": ["Acceptance does not establish operational success.", "A fleet operation can have mixed outcomes.", "A parser can accept syntactically valid JSON that violates the intended schema.", "Compute a scoped proposed change before applying it."], "c": 1, "h": "A fleet operation can have mixed outcomes."}, {"id": "automation/Very Hard/7", "q": "Another operator changes state after the dry run.\nWhich explanation is supported by these facts?", "o": ["JSON has explicit types; true differs from the string \"true\".", "Blindly retrying a non-idempotent write can duplicate it.", "Acceptance does not establish operational success.", "The previous snapshot may be stale."], "c": 3, "h": "The previous snapshot may be stale."}, {"id": "automation/Very Hard/8", "q": "A timeout leaves write completion uncertain.\nWhich explanation is supported by these facts?", "o": ["Exact semantics come from the API contract.", "Blindly retrying a non-idempotent write can duplicate it.", "name is a string, enabled a boolean, and mtu a number.", "A parser can accept syntactically valid JSON that violates the intended schema."], "c": 1, "h": "Blindly retrying a non-idempotent write can duplicate it."}, {"id": "automation/Very Hard/9", "q": "An API accepts a change but forwarding fails.\nWhich explanation is supported by these facts?", "o": ["A e which cause and repair mattered."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "capstone/lesson-check/Easy/5", "q": "What does planner completion establish?", "o": ["Proof all simulator commands executed successfully.", "Mastery of every exam objective.", "A study record; readiness needs practice and gap review."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "capstone/Hard/0", "q": "Introduce a bad gateway, then a missing trunk VLAN, one at a time in separate saved copies.", "o": ["The saved baseline should have expected connectivity with documented settings. State any intentional blocked tests, so a denied ping is not later mistaken for a new fault.", "Wrong gateway mainly affects remote paths; a missing trunk VLAN breaks that VLAN across the trunk. Repairs should address the wrong setting, preserve unrelated settings, and restore the recorded baseline tests.", "Before/after routes/roles, timed loss, required service tests in both directions and restored baseline."], "c": 1, "h": "Return to a known good baseline between experiments."}, {"id": "capstone/Hard/1", "q": "Which checks isolate inter-VLAN failure?", "o": ["192.168.20.1, if assigned to the intended operational VLAN 20 router interface.", "Host gateways/masks, VLAN/trunk transport, SVI/subinterface state, routing and policy.", "Devices, interfaces/links, VLANs, subnets, gateways, services and intended access."], "c": 1, "h": "Local success narrows but does not identify the routed fault."}, {"id": "capstone/Hard/2", "q": "How should a capstone prove named HTTPS access?", "o": ["Devices, interfaces/links, VLANs, subnets, gateways, services and intended access.", "Verify DNS answer, TCP/TLS/application response and required return path, not just ping.", "Before/after routes/roles, timed loss, required service tests in bo ross devices.\nWhich explanation is supported by these facts?", "o": ["Gateway redundancy and upstream route resilience are separate.", "A command template must match capabilities.", "Design starts with measurable service needs."], "c": 1, "h": "A command template must match capabilities."}, {"id": "enterprise/Hard/10", "q": "During a lab handover, someone asks: Does adding a spare link alone prove the design is resilient? Which explanation should you give?", "o": ["If losing that one link stops an essential path or service and no usable alternative exists.", "No. Test the failure and verify that routing or switching uses a working alternative correctly.", "No. Inspect the DNS setting and test name resolution separately."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "enterprise/Hard/11", "q": "You are explaining this topic to a colleague. Why use redundancy in an enterprise network?", "o": ["To reduce dependence on one component or path.", "To avoid testing failover.", "To guarantee that no outage can ever occur."], "c": 0, "h": "Correct. Identify single points of failure and verify that alternate paths work."}], "Very Hard": [{"id": "enterprise/Very Hard/0", "q": "Add a separate transit link and test one link failure in the isolated lab.", "o": ["Remote branches should learn .30.0/24; the new branch should learn existing LANs. Test each direction and inspect missing-prefix cases rather than assuming adjacency is sufficient.", "Current topology/config inventory, baselines, monitoring, ownership, incident/change procedures, tested recovery and known limits.", "Trace device/power/provider/cable dependencies, state transitions and return paths; test actual failures.", "If the remaining topology stays connected and advertises the LANs, OSPF can use the alternate path. Record actual convergence and route changes; acknowledge that a router or LAN failure is a different scenario."], "c": 3, "h": "Expect convergence and possible transient loss, not uninterrupted delivery by assumption."}, {"id": "enterprise/Very Hard/1", "q": "Audit a proposed resilient branch path.", "o": ["Application timing, utilization, queues, loss/jitter, endpoints and path differences under comparable loads.", "No. Inspect upstream links/routes and shared failures independently.", "Trace device/power/provider/cable dependencies, state transitions and return paths; test actual failures.", "State synchronization/firewall placement, NAT, route policy and application behavior in both directions."], "c": 2, "h": "Both can fail together despite separate cables."}, {"id": "enterprise/Very Hard/2", "q": "What should be reviewed before intentional asymmetric routing?", "o": ["State synchronization/firewall placement, NAT, route policy and application behavior in both directions.", "Trace device/power/provider/cable dependencies, state transitions and return paths; test actual failures.", "One valid choice is gateway .30.1 and PC .30.10/24. A new 10.0.0.4/30 transit uses .5 and .6 if that block is free. Supply reciprocal routing or consistent dynamic routing.", "Remote branches should learn .30.0/24; the new branch should learn existing LANs. Test each direction and inspect missing-prefix cases rather than assuming adjacency is sufficient."], "c": 0, "h": "Routing may work while stateful policy fails."}, {"id": "enterprise/Very Hard/3", "q": "What should a performance investigation compare?", "o": ["Trace device/power/provider/cable dependencies, state transitions and return paths; test actual failures.", "Application timing, utilization, queues, loss/jitter, endpoints and path differences under comparable loads.", "State synchronization/firewall placement, NAT, route policy and application behavior in both directions.", "The previous path description becomes misleading; record actual ports, link roles and dependencies."], "c": 1, "h": "Reachability is not a complete performance metric."}, {"id": "enterprise/Very Hard/4", "q": "What makes an enterprise handover useful?", "o": ["State synchronization/firewall placement, NAT, route policy and application behavior in both directions.", "Current topology/config inventory, baselines, monitoring, ownership, incident/change procedures, tested recovery and known limits.", "If the remaining topology stays connected and advertises the LANs, OSPF can use the alternate path. Record actual convergence and route changes; acknowledge that a router or LAN failure is a different scenario.", "Application timing, utilization, queues, loss/jitter, endpoints and path differences under comparable loads."], "c": 1, "h": "Operators need reproducible tests and recovery steps."}, {"id": "enterprise/Very Hard/5", "q": "Three routers form a triangle so a branch can survive one transit-link failure.\nWhich explanation is supported by these facts?", "o": ["Branch LANs must not overlap.", "A physically separate path only helps when routing can use it.", "Duplicates help only when failover and dependencies are understood.", "Reachability is not a complete performance metric."], "c": 1, "h": "Expect convergence and possible transient loss, not uninterrupted delivery by assumption."}, {"id": "enterprise/Very Hard/6", "q": "Two uplinks terminate at one powered device.\nWhich explanation is supported by these facts?", "o": ["Both can fail together despite separate cables.", "Operators need reproducible tests and recovery steps.", "Routing may work while stateful policy fails.", "Gateway redundancy and upstream route resilience are separate."], "c": 0, "h": "Both can fail together despite separate cables."}, {"id": "enterprise/Very Hard/7", "q": "Request and reply traverse different gateways.\nWhich explanation is supported by these facts?", "o": ["Routing may work while stateful policy fails.", "Duplicates help only when failover and dependencies are understood.", "Branch LANs must not overlap.", "Both can fail together despite separate cables."], "c": 0, "h": "Routing may work while stateful policy fails."}, {"id": "enterprise/Very Hard/8", "q": "Pings pass while peak-hour application response degrades.\nWhich explanation is supported by these facts?", "o": ["Reachability is not a complete performance metric.", "Routing may work while stateful policy fails.", "Design starts with measurable service needs.", "Operators need reproducible tests and recovery steps."], "c": 0, "h": "Reachability is not a complete performance metric."}, {"id": "enterprise/Very Hard/9", "q": "A design is given to support staff.\nWhich explanation is supported by these facts?", "o": ["Design starts with measurable service needs.", "Operators need reproducible tests and recovery steps.", "Branch LANs must not overlap.", "Duplicates help only when failover and dependencies are understood."], "c": 1, "h": "Operators need reproducible tests and recovery steps."}]}, "security-path": {"Easy": [{"id": "security-path/lesson-check/Easy/0", "q": "Where does defensive policy planning start?", "o": ["Permit all groups and assume logs block threats.", "What each device group needs to access.", "Deny everything without identifying essential services."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "security-path/lesson-check/Easy/1", "q": "Which details make a flow rule testable?", "o": ["Only an allowed address without service context.", "Only department name and vendor.", "Sender, destination, protocol, port and action."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "security-path/lesson-check/Easy/2", "q": "How do least privilege and logging differ?", "o": ["Both require full management rights for all clients.", "Logs deny traffic; permissions merely label records.", "Permissions limit access; logs provide evidence."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "security-path/lesson-check/Easy/3", "q": "What should a policy walkthrough test?", "o": ["Only outward requests, assuming replies are always permitted.", "Allowed flow, denied flow and replies.", "Only denied traffic because access needs no evidence."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "security-path/lesson-check/Easy/4", "q": "What does least privilege mean?", "o": ["Allow access required for the task.", "Give every client management rights for convenience.", "Grant broad access and review later."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "security-path/lesson-check/Easy/5", "q": "Which practice supports defensive administration?", "o": ["Unrestricted management without audit records.", "Treat every log as proof an attack was prevented.", "Secure management and evidence-based checks."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "security-path/Hard/0", "q": "Create a written policy with staff, server, and management networks.", "o": ["Host/network/authentication logs, affected users/services, observed actions and time boundaries.", "Validate root cause/other persistence, appropriate credential/control remediation, service restoration and monitoring.", "Document staff→server TCP 443 and management→devices TCP 22, plus required DNS/DHCP as appropriate. Deny unrelated new connections. Tests include permitted staff HTTPS, permitted admin SSH, and denied ordinary-client SSH."], "c": 2, "h": "Do not assume a stateless ACL handles return sessions like a stateful firewall."}, {"id": "security-path/Hard/1", "q": "What would help determine an incident scope?", "o": ["Host/network/authentication logs, affected users/services, observed actions and time boundaries.", "It can destroy evidence and disrupt services; choose proportional authorized steps and preserve records.", "Validate root cause/other persistence, appropriate credential/control remediation, service restoration and monitoring."], "c": 0, "h": "Check related assets and identities before claiming containment."}, {"id": "security-path/Hard/2", "q": "Why avoid immediately wiping every suspect device?", "o": ["It can destroy evidence and disrupt services; choose proportional authorized steps and preserve records.", "No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "Timestamp, timezone/source clock and any known drift, alongside event evidence."], "c": 0, "h": "Containment should limit harm and preserve needed evidence."}, {"id": "security-path/Hard/3", "q": "What should follow removing an identified malicious artifact?", "o": ["For example: source 192.168.10.0/24, destination 192.168.20.20, TCP 443, allow. Other requirements need their own documented justification.", "Specific owner/action, evidence-linked cause, priority, validation measure and follow-up rather than vague improve security.", "Validate root cause/other persistence, appropriate credential/control remediation, service restoration and monitoring."], "c": 2, "h": "Recovery includes verifying service and security state."}, {"id": "security-path/Hard/4", "q": "What should an analyst record about linked events?", "o": ["Exact evidence, identifiers/time uncertainty, alternative explanations and what additional test distinguishes them.", "No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "Record repeated blocked attempts, affected targets/times, and unknown success/impact. Check authentication/session and device-change logs, confirm policy behavior, preserve records, and escalate to the responsible security team if indicated. Any containment change should target the supported risk."], "c": 0, "h": "Correlation supports a hypothesis, not automatic causation."}, {"id": "security-path/Hard/5", "q": "Management may SSH to devices; ordinary clients may not.\nWhich explanation is supported by these facts?", "o": ["Correlation supports a hypothesis, not automatic causation.", "Management access requires its own source scope.", "Check related assets and identities before claiming containment."], "c": 1, "h": "Do not assume a stateless ACL handles return sessions like a stateful firewall."}, {"id": "security-path/Hard/6", "q": "One endpoint shows suspicious behavior.\nWhich explanation is supported by these facts?", "o": ["Management access requires its own source scope.", "Check related assets and identities before claiming containment.", "Containment should limit harm and preserve needed evidence."], "c": 1, "h": "Check related assets and identities before claiming containment."}, {"id": "security-path/Hard/7", "q": "An authorized plan isolates an affected lab endpoint.\nWhich explanation is supported by these facts?", "o": ["Original evidence and analyst interpretation should be distinguishable.", "Containment should limit harm and preserve needed evidence.", "Denied attempts are evidence of attempts, not proof of a successful compromise."], "c": 1, "h": "Containment should limit harm and preserve needed evidence."}, {"id": "security-path/Hard/8", "q": "A corrected endpoint is restored and monitored.\nWhich explanation is supported by these facts?", "o": ["Recovery includes verifying service and security state.", "Containment should limit harm and preserve needed evidence.", "The service requirement is narrower than all IP traffic."], "c": 0, "h": "Recovery includes verifying service and security state."}, {"id": "security-path/Hard/9", "q": "A login and network event share a source and time.\nWhich explanation is supported by these facts?", "o": ["The service requirement is narrower than all IP traffic.", "Management access requires its own source scope.", "Correlation supports a hypothesis, not automatic causation."], "c": 2, "h": "Correlation supports a hypothesis, not automatic causation."}, {"id": "security-path/Hard/10", "q": "During a lab handover, someone asks: What does least privilege mean for these traffic rules? Which explanation should you give?", "o": ["To prove the script reports a known mistake, rather than only demonstrating that valid input works.", "Allow the access needed for the task, rather than granting broad access without a reason.", "The test, its result and what that result tells you. Then choose the next test from that evidence."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "security-path/Hard/11", "q": "You are explaining this topic to a colleague. Why collect logs when investigating a security event?", "o": ["Logs prevent every attack automatically.", "Logs replace access controls.", "Logs provide evidence about activity and timing."], "c": 2, "h": "Correct. Compare evidence carefully; a single log entry is not always the complete story."}], "Very Hard": [{"id": "security-path/Very Hard/0", "q": "Write a short incident note using only those observations.", "o": ["Specific owner/action, evidence-linked cause, priority, validation measure and follow-up rather than vague improve security.", "Record repeated blocked attempts, affected targets/times, and unknown success/impact. Check authentication/session and device-change logs, confirm policy behavior, preserve records, and escalate to the responsible security team if indicated. Any containment change should target the supported risk.", "It can destroy evidence and disrupt services; choose proportional authorized steps and preserve records.", "No. Validate context, expected behavior and corroborating evidence."], "c": 1, "h": "Avoid reporting a confirmed breach from deny logs alone."}, {"id": "security-path/Very Hard/1", "q": "Does it prove no other connection succeeded?", "o": ["Timestamp, timezone/source clock and any known drift, alongside event evidence.", "No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "No. Give only the necessary scoped read permissions.", "No. Validate context, expected behavior and corroborating evidence."], "c": 1, "h": "That block has limited scope."}, {"id": "security-path/Very Hard/2", "q": "What accompanies a useful evidence export?", "o": ["No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "Timestamp, timezone/source clock and any known drift, alongside event evidence.", "Availability; confidentiality concerns secrecy and integrity concerns unauthorized alteration.", "Source, collection time/method, scope, integrity/provenance and authorized access handling."], "c": 3, "h": "Original evidence and analyst interpretation should be distinguishable."}, {"id": "security-path/Very Hard/3", "q": "How report conflicting logs responsibly?", "o": ["Source, collection time/method, scope, integrity/provenance and authorized access handling.", "State both observations and limitations, compare fields/timestamps, seek corroboration and avoid an unsupported definitive claim.", "No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "Specific owner/action, evidence-linked cause, priority, validation measure and follow-up rather than vague improve security."], "c": 1, "h": "Investigate semantics and time/identity alignment before reconciling."}, {"id": "security-path/Very Hard/4", "q": "What makes a post-incident recommendation actionable?", "o": ["No. Review other paths/events and endpoint evidence; report only the confirmed denial.", "It can destroy evidence and disrupt services; choose proportional authorized steps and preserve records.", "Specific owner/action, evidence-linked cause, priority, validation measure and follow-up rather than vague improve security.", "No. Validate context, expected behavior and corroborating evidence."], "c": 2, "h": "Improvement should address causes and be testable."}, {"id": "security-path/Very Hard/5", "q": "Logs show many blocked management-port attempts; no successful management session is demonstrated.\nWhich explanation is supported by these facts?", "o": ["Original evidence and analyst interpretation should be distinguishable.", "Improvement should address causes and be testable.", "Investigate semantics and time/identity alignment before reconciling.", "Denied attempts are evidence of attempts, not proof of a successful compromise."], "c": 3, "h": "Avoid reporting a confirmed breach from deny logs alone."}, {"id": "security-path/Very Hard/6", "q": "A firewall denies one suspicious connection.\nWhich explanation is supported by these facts?", "o": ["Improvement should address causes and be testable.", "That block has limited scope.", "The service requirement is narrower than all IP traffic.", "Management access requires its own source scope."], "c": 1, "h": "That block has limited scope."}, {"id": "security-path/Very Hard/7", "q": "An export is preserved with provenance and integrity records.\nWhich explanation is supported by these facts?", "o": ["An alert is evidence to investigate, not a complete conclusion.", "Denied attempts are evidence of attempts, not proof of a successful compromise.", "Original evidence and analyst interpretation should be distinguishable.", "Clock accuracy/timezone affects interpretation."], "c": 2, "h": "Original evidence and analyst interpretation should be distinguishable."}, {"id": "security-path/Very Hard/8", "q": "One alert says success; application logs say rejection.\nWhich explanation is supported by these facts?", "o": ["Investigate semantics and time/identity alignment before reconciling.", "The service requirement is narrower than all IP traffic.", "An alert is evidence to investigate, not a complete conclusion.", "Check related assets and identities before claiming containment."], "c": 0, "h": "Investigate semantics and time/identity alignment before reconciling."}, {"id": "security-path/Very Hard/9", "q": "A verified incident exposes a control gap.\nWhich explanation is supported by these facts?", "o": ["Original evidence and analyst interpretation should be distinguishable.", "Improvement should address causes and be testable.", "Integrity and availability are separate goals.", "The service requirement is narrower than all IP traffic."], "c": 1, "h": "Improvement should address causes and be testable."}]}, "cloud-path": {"Easy": [{"id": "cloud-path/lesson-check/Easy/0", "q": "Which foundation applies to cloud and ISP support?", "o": ["Provider hosting removes network-design needs.", "Addressing, routes, boundaries and service checks.", "Every cloud service shares the customer LAN."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "cloud-path/lesson-check/Easy/1", "q": "What should a cloud request-path drawing identify?", "o": ["Virtual network, subnets, routes and access controls.", "Only an internet-gateway route, ignoring addresses/policy.", "Only the provider name as reachability proof."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "cloud-path/lesson-check/Easy/2", "q": "Why mark customer and provider responsibilities?", "o": ["Assume providers configure every local device.", "Assume customers can alter every provider component.", "Know what you can inspect and when another team is needed."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "cloud-path/lesson-check/Easy/3", "q": "What is the next-skill exercise asking you to choose?", "o": ["Every platform and certificate before any lab.", "One practical skill and a demonstration project.", "A paid deployment before a learning goal."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "cloud-path/lesson-check/Easy/4", "q": "Which questions still apply to cloud connectivity?", "o": ["Only whether the workload appears in the console.", "Addresses, both route directions and traffic permission.", "Only whether an internet gateway is offered."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "cloud-path/lesson-check/Easy/5", "q": "Does an internet-gateway route prove public reachability?", "o": ["Yes; return routes and service availability do not matter.", "Yes; the route makes every workload public.", "No; addresses and access controls still matter."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "cloud-path/Hard/0", "q": "Draw a provider-neutral virtual network without creating resources.", "o": ["Customer checks can establish local Wi-Fi/IP/service symptoms. Provider staff may need to verify access-link alarms, provisioning, and upstream paths. A clear escalation includes scope, timing, and local test results.", "Document the public tier’s addressing, internet route, and policy together. Keep the private tier’s inbound access restricted and show any intended outbound NAT/proxy path. Verify current provider behavior before provisioning; this diagram does not certify a deployed configuration.", "Verify client DNS, selected routes, policy permits/denies, listener/backend health, return paths and planned failure behavior."], "c": 1, "h": "Public IP assignment and security behavior differ by platform."}, {"id": "cloud-path/Hard/1", "q": "Why read cloud policy documentation rather than reuse a physical ACL assumption?", "o": ["Verify client DNS, selected routes, policy permits/denies, listener/backend health, return paths and planned failure behavior.", "Statefulness, direction, ordering and return handling differ; verify the specific service behavior.", "No. Check routed prefixes, policy, DNS, MTU and actual service paths in both directions."], "c": 1, "h": "Security group and subnet ACL semantics differ by provider."}, {"id": "cloud-path/Hard/2", "q": "Why might a private endpoint exist while clients still use a public path?", "o": ["Listener/rules, target health, backend service binding, policy and route/return dependencies.", "No. Check routed prefixes, policy, DNS, MTU and actual service paths in both directions.", "DNS may return the public address or client routing/policy may select another path; inspect actual resolution and route."], "c": 2, "h": "Endpoint configuration and DNS must agree."}, {"id": "cloud-path/Hard/3", "q": "What should be checked when a public listener returns backend errors?", "o": ["Statefulness, direction, ordering and return handling differ; verify the specific service behavior.", "Listener/rules, target health, backend service binding, policy and route/return dependencies.", "Workload/subnet and actual destination route, alongside policy and service state."], "c": 1, "h": "Front-end reachability and backend health are separate."}, {"id": "cloud-path/Hard/4", "q": "Does establishing a VPN tunnel alone prove application reachability?", "o": ["DNS may return the public address or client routing/policy may select another path; inspect actual resolution and route.", "No. Check routed prefixes, policy, DNS, MTU and actual service paths in both directions.", "Document the public tier’s addressing, internet route, and policy together. Keep the private tier’s inbound access restricted and show any intended outbound NAT/proxy path. Verify current provider behavior before provisioning; this diagram does not certify a deployed configuration."], "c": 1, "h": "Both sides need unambiguous prefixes and return routes."}, {"id": "cloud-path/Hard/5", "q": "A diagram uses .10.0/24 for a public-facing tier and .20.0/24 for a private tier.\nWhich explanation is supported by these facts?", "o": ["Non-overlapping subnets require intentional routes and policies.", "Simple routing cannot distinguish overlapping destinations by location.", "Endpoint configuration and DNS must agree."], "c": 0, "h": "Public IP assignment and security behavior differ by platform."}, {"id": "cloud-path/Hard/6", "q": "A supported platform tracks permitted connection state.\nWhich explanation is supported by these facts?", "o": ["Security group and subnet ACL semantics differ by provider.", "Non-overlapping subnets require intentional routes and policies.", "Front-end reachability and backend health are separate."], "c": 0, "h": "Security group and subnet ACL semantics differ by provider."}, {"id": "cloud-path/Hard/7", "q": "A service can use a provider-supported private path.\nWhich explanation is supported by these facts?", "o": ["Security group and subnet ACL semantics differ by provider.", "Non-overlapping subnets require intentional routes and policies.", "Endpoint configuration and DNS must agree."], "c": 2, "h": "Endpoint configuration and DNS must agree."}, {"id": "cloud-path/Hard/8", "q": "A load balancer fronts a private backend.\nWhich explanation is supported by these facts?", "o": ["Endpoint configuration and DNS must agree.", "The phone/AP/router segment is local.", "Front-end reachability and backend health are separate."], "c": 2, "h": "Front-end reachability and backend health are separate."}, {"id": "cloud-path/Hard/9", "q": "A VPN links on-premises and cloud prefixes.\nWhich explanation is supported by these facts?", "o": ["Non-overlapping subnets require intentional routes and policies.", "Both sides need unambiguous prefixes and return routes.", "Selected routes determine the next path."], "c": 1, "h": "Both sides need unambiguous prefixes and return routes."}, {"id": "cloud-path/Hard/10", "q": "During a lab handover, someone asks: What familiar questions still apply to a cloud connection? Which explanation should you give?", "o": ["No. A service rule can limit the protocol and port, rather than allow every connection.", "To verify both sides of the policy: the required service works and the traffic you intended to block is actually blocked.", "Are the addresses correct, is there a route in both directions, and do the access rules allow the required service?"], "c": 2, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "cloud-path/Hard/11", "q": "You are explaining this topic to a colleague. Who is responsible for security in a cloud environment?", "o": ["Only the cloud provider, in every case.", "Responsibilities are shared; the exact split depends on the service.", "Nobody, because cloud systems are automatically safe."], "c": 1, "h": "Correct. Understand which infrastructure, configuration, identity and data tasks belong to each party."}], "Very Hard": [{"id": "cloud-path/Very Hard/0", "q": "Write an escalation contrasting that case with one failing Wi-Fi client in a working household.", "o": ["Document the public tier’s addressing, internet route, and policy together. Keep the private tier’s inbound access restricted and show any intended outbound NAT/proxy path. Verify current provider behavior before provisioning; this diagram does not certify a deployed configuration.", "Verify client DNS, selected routes, policy permits/denies, listener/backend health, return paths and planned failure behavior.", "Plan supported renumbering/translation or redesign; validate provider peering constraints and intended paths.", "Area-wide case: escalate shared access/upstream investigation with time, scope, alarm reference, and local results. Single-client case: inspect that client’s join/IP and compare wired/other wireless clients first. A useful next project could be a documented fault-isolation lab or a simulated monitoring dashboard with invented data."], "c": 3, "h": "State what is unknown rather than inventing optical measurements."}, {"id": "cloud-path/Very Hard/1", "q": "What should precede peering two overlapping networks?", "o": ["No. Check routed prefixes, policy, DNS, MTU and actual service paths in both directions.", "Plan supported renumbering/translation or redesign; validate provider peering constraints and intended paths.", "Area-wide case: escalate shared access/upstream investigation with time, scope, alarm reference, and local results. Single-client case: inspect that client’s join/IP and compare wired/other wireless clients first. A useful next project could be a documented fault-isolation lab or a simulated monitoring dashboard with invented data.", "Not merely because of egress NAT; inbound access needs an explicitly supported design."], "c": 1, "h": "Simple routing cannot distinguish overlapping destinations by location."}, {"id": "cloud-path/Very Hard/2", "q": "How audit a multi-zone service for shared network faults?", "o": ["Statefulness, direction, ordering and return handling differ; verify the specific service behavior.", "Trace routes/gateways, DNS, load balancers and policy dependencies; test permitted zone/component failures.", "Workload/subnet and actual destination route, alongside policy and service state.", "Usually the customer within the service contract; managed service boundaries must be read explicitly."], "c": 1, "h": "Placement diversity does not eliminate every common failure."}, {"id": "cloud-path/Very Hard/3", "q": "How practise cloud routing before provisioning paid resources?", "o": ["Not merely because of egress NAT; inbound access needs an explicitly supported design.", "DNS may return the public address or client routing/policy may select another path; inspect actual resolution and route.", "Use a paper topology/route-policy matrix, sample outputs and documented semantics; provision only explicitly authorized resources.", "No. Read route tables, addressing and security rules."], "c": 2, "h": "An offline design exercise can validate reasoning without purchasing infrastructure."}, {"id": "cloud-path/Very Hard/4", "q": "Give cloud network acceptance tests.", "o": ["Listener/rules, target health, backend service binding, policy and route/return dependencies.", "Customer checks can establish local Wi-Fi/IP/service symptoms. Provider staff may need to verify access-link alarms, provisioning, and upstream paths. A clear escalation includes scope, timing, and local test results.", "Statefulness, direction, ordering and return handling differ; verify the specific service behavior.", "Verify client DNS, selected routes, policy permits/denies, listener/backend health, return paths and planned failure behavior."], "c": 3, "h": "Provisioning status is not application acceptance."}, {"id": "cloud-path/Very Hard/5", "q": "All customers in one area lose remote service while local LAN tests still work; an access alarm is reported.\nWhich explanation is supported by these facts?", "o": ["The broader scope supports a shared access/upstream hypothesis.", "The subnet is a routing/policy context, not automatic internet access.", "An offline design exercise can validate reasoning without purchasing infrastructure.", "The phone/AP/router segment is local."], "c": 0, "h": "State what is unknown rather than inventing optical measurements."}, {"id": "cloud-path/Very Hard/6", "q": "A cloud network repeats an on-premises prefix.\nWhich explanation is supported by these facts?", "o": ["The phone/AP/router segment is local.", "Non-overlapping subnets require intentional routes and policies.", "Provisioning status is not application acceptance.", "Simple routing cannot distinguish overlapping destinations by location."], "c": 3, "h": "Simple routing cannot distinguish overlapping destinations by location."}, {"id": "cloud-path/Very Hard/7", "q": "Resources in two zones still share one egress dependency.\nWhich explanation is supported by these facts?", "o": ["Outbound translation does not publish arbitrary inbound services.", "The phone/AP/router segment is local.", "The broader scope supports a shared access/upstream hypothesis.", "Placement diversity does not eliminate every common failure."], "c": 3, "h": "Placement diversity does not eliminate every common failure."}, {"id": "cloud-path/Very Hard/8", "q": "A load test may create billable traffic/resources.\nWhich explanation is supported by these facts?", "o": ["An offline design exercise can validate reasoning without purchasing infrastructure.", "The subnet is a routing/policy context, not automatic internet access.", "The broader scope supports a shared access/upstream hypothesis.", "Selected routes determine the next path."], "c": 0, "h": "An offline design exercise can validate reasoning without purchasing infrastructure."}, {"id": "cloud-path/Very Hard/9", "q": "A cloud deployment succeeds but a named service is unreachable.\nWhich explanation is supported by these facts?", "o": ["The exact division depends on service type.", "Provisioning status is not application acceptance.", "Placement diversity does not eliminate every common failure.", "The subnet is a routing/policy context, not automatic internet access."], "c": 1, "h": "Provisioning status is not application acceptance."}]}}, "domains": [{"id": "fund", "name": "Network Fundamentals", "w": 20}, {"id": "access", "name": "Network Access", "w": 20}, {"id": "ipconn", "name": "IP Connectivity", "w": 25}, {"id": "ipsvc", "name": "IP Services", "w": 10}, {"id": "sec", "name": "Security Fundamentals", "w": 15}, {"id": "auto", "name": "Automation and Programmability", "w": 10}], "excel": {"topics": [{"id": "x-workbook-basics", "subject": "excel", "title": "Your first workbook", "subtitle": "Start here · Week 1", "goal": "Create, navigate and save a useful workbook without getting lost.", "learn": ["Explain a workbook, worksheet, row, column, cell and range.", "Use cell addresses and select a range.", "Enter and edit a small labelled dataset.", "Rename a sheet and save an .xlsx copy.", "Distinguish a workbook from a CSV file.", "Reopen your file and verify the saved content."], "sections": [{"title": "What is Excel?", "text": "Imagine recording stationery purchases for a small office. Excel is a spreadsheet application: its grid helps you organise information, calculate results and explore patterns. A workbook is the file you open and save. Inside it, worksheets are separate grids, shown as tabs.", "example": "Office Supplies.xlsx is one workbook. Purchases and Summary can be two worksheets inside that same file.", "tryIt": "Open Excel, choose Blank workbook, and find the sheet tab at the bottom.", "answer": "You should see a new workbook containing a worksheet. Your workbook name may be temporary until you save it."}, {"title": "Find your way around the grid", "text": "Columns run down the sheet and have letter labels, such as A and B. Rows run across and have number labels. Their intersection is a cell. B3 means column B, row 3; it is not the third column. The Name Box normally shows the active cell address. The formula bar shows or edits its content.", "example": "Click B3. You are at column B, row 3. A1:C4 describes a rectangular range from A1 through C4, including both ends.", "tryIt": "Select B3, then select A1:C4 using the Name Box or dragging.", "answer": "B3 is one cell. A1:C4 contains 3 columns × 4 rows = 12 cells."}, {"title": "Enter a small, labelled list", "text": "Give each column a clear header and put one record on each row. Click A1, type Item, and press Tab to move right. Enter Quantity in B1 and Unit cost in C1. Enter the sample rows beneath them. Consistent headings make the data understandable before any formula is added.", "example": "A2 is Notebook, B2 is 3, and C2 is 250. The item name, quantity and cost all describe the same purchase row.", "tryIt": "Paste the sample data below into A1, or type each value into its stated cell.", "answer": "Headers occupy row 1. The three purchases occupy rows 2, 3 and 4. Do not put all three values into one cell."}, {"title": "Edit the cell you intend to change", "text": "Clicking a cell selects it. Typing a new value normally replaces that cell’s content. Double-click a cell, or use the formula bar, to edit part of its content. Use Undo immediately if you replace the wrong value. Before typing, check the active cell so that you do not overwrite a neighbouring record.", "example": "If Notebook in A2 becomes Notebok, edit A2 to correct the spelling; the quantity in B2 should remain 3.", "tryIt": "Correct an intentional spelling error in A2. Then undo and redo that one edit.", "answer": "Only the selected cell should change. Recheck B2 and C2 to confirm the rest of the record remains intact."}, {"title": "Name the sheet and save the workbook", "text": "Rename the worksheet Purchases using its tab. Save the workbook with a meaningful filename such as Office Supplies.xlsx in a folder you can find again. Excel’s .xlsx format can store multiple worksheets, formulas and formatting. A CSV is a plain-text data exchange file; it does not preserve a whole multi-sheet workbook’s features.", "example": "Use .xlsx for your working workbook. Export a separate CSV only when another system needs a plain data table.", "tryIt": "Save Office Supplies.xlsx, add a worksheet called Notes, and save again.", "answer": "One workbook now contains Purchases and Notes. Saving it as .xlsx retains both worksheets."}, {"title": "Verify before you trust the saved copy", "text": "Saving is only useful when you can find and reopen the right file. Close the workbook normally and reopen the saved .xlsx file. Check the filename, the two sheet tabs and several values. AutoSave availability depends on the file location and settings; do not assume an unsaved local workbook is protected.", "example": "A second file called Office Supplies (1).xlsx might be a different copy. Verify the full file you opened rather than trusting a similar name.", "tryIt": "Reopen your file and read Purchases!B2 and Purchases!C4.", "answer": "With the supplied sample, B2 should be 3 and C4 should be 1800. Both sheets should still be present."}], "headers": ["Item", "Quantity", "Unit cost"], "rows": [["Notebook", "3", "250"], ["Pen", "10", "100"], ["Paper pack", "2", "1800"]], "lab": {"title": "Lab: Your first workbook", "tools": "Microsoft Excel (desktop or web), or any spreadsheet app", "steps": ["Create a blank workbook and rename its first sheet Purchases.", "Enter or paste the sample into A1:C4.", "Select B3, then A1:C4, and explain the difference.", "Add a Notes worksheet and write one sentence describing the list.", "Save as Office Supplies.xlsx, close and reopen it, and verify both sheets and three values."], "check": "You can find a named cell, explain the grid and reopen a correctly saved multi-sheet workbook."}, "sources": [{"label": "Microsoft: Basic tasks in Excel", "url": "https://support.microsoft.com/en-us/office/basic-tasks-in-excel-dc775dd1-fa52-430f-9c3c-d998d1735fca"}]}, {"id": "x-data-and-formatting", "subject": "excel", "title": "Clean data and readable sheets", "subtitle": "Build confidence · Week 2", "goal": "Keep values accurate while making a work sheet easy to read.", "learn": ["Keep one record per row and consistent column headers.", "Distinguish numeric values from identifier text.", "Preserve leading zeros before entering codes.", "Explain stored values versus number formats.", "Display percentages and dates intentionally.", "Use readable headings, widths and wrapping without hiding data."], "sections": [{"title": "Give every value a clear job", "text": "Use a small staff-expense register. Each row describes one expense, while each column answers one question: who, which item, how many or how much? Keep headings in the first row and avoid merging cells inside the list. A decorative merged title can make later selection and analysis harder.", "example": "An expense row should not mix a staff name, cost and date inside one cell. Put them in separate columns with descriptive headers.", "tryIt": "Look at the sample list. Explain what one row represents and what Quantity means.", "answer": "One row is one purchase record. Quantity is the number of units bought, not the amount paid."}, {"title": "Numbers and text are different", "text": "A quantity or cost is usually a number because you may calculate with it. A staff code such as 0017 is an identifier, even though it contains digits. Format an identifier column as Text before entering or pasting codes. Formatting it after Excel has already removed zeros cannot reliably recover the original code.", "example": "0017 and 17 can represent different codes. Protect the original text rather than guessing how many zeros were lost.", "tryIt": "Create a Staff code column, format its empty cells as Text, and enter 0017.", "answer": "The code should retain both leading zeros. Text is appropriate for an identifier you do not intend to add or multiply."}, {"title": "Formatting changes the display", "text": "A number format normally changes how a value appears, not the value used in a calculation. You can display 12.345 as 12.35 with two decimal places, but calculations still use 12.345. If a business rule requires actual rounding, that requires a rounding calculation, which we cover in a later topic.", "example": "Displaying 250 as $250.00 does not multiply it or convert its currency. A currency symbol is a label, not an exchange-rate calculation.", "tryIt": "Enter 12.345 in an empty numeric cell and display two decimal places. Check the formula bar.", "answer": "The cell can show 12.35 while the formula bar still shows 12.345."}, {"title": "Percentages need the right underlying value", "text": "Percentage formatting displays a value multiplied by 100 followed by %. To represent fifteen percent, enter 15% directly or enter 0.15 and apply Percentage. If you enter 15 first and then apply Percentage, Excel displays 1500%. That display is consistent with the underlying value; it is not a software fault.", "example": "A discount rate of 0.15 represents 15%. Changing the number of displayed decimal places does not fix an incorrectly entered rate of 15.", "tryIt": "Enter 0.15 in one cell and 15 in another. Format both as Percentage.", "answer": "The cells show 15% and 1500%, respectively. Correct the entered value when the intended rate is fifteen percent."}, {"title": "Dates and readability", "text": "Excel can interpret typed dates according to regional settings. A value such as 03/04/2026 is ambiguous across regions. Enter a date deliberately, then apply a clear date format with the month written out, and verify the result. Widen columns, use Wrap Text for long headings and keep the original values visible.", "example": "03 Apr 2026 makes the intended day and month clearer than 03/04/2026. A column displaying hashes can need more width; inspect the actual value rather than deleting it.", "tryIt": "Widen a narrow date column and apply a format that shows a month name.", "answer": "Confirm the displayed date is the intended date. Width changes presentation, not the underlying date."}, {"title": "Check the data before polishing it", "text": "Before choosing colours, verify records, codes and units. Then use a bold header, consistent numeric formats and enough column width. Keep a clean original copy when experimenting. Good formatting helps a reader understand correct data; it cannot repair missing records, incorrect codes or misleading headings.", "example": "A neat total in a currency colour scheme is still wrong if the quantity was entered into the Unit cost column.", "tryIt": "Compare every sample row with its source, then improve the heading and number formats.", "answer": "The values and record relationships should remain unchanged after formatting. Your identifiers should still retain their zeros."}], "headers": ["Staff code", "Item", "Quantity", "Unit cost"], "rows": [["0017", "Notebook", "3", "250"], ["0024", "Pen", "10", "100"], ["0031", "Paper pack", "2", "1800"]], "lab": {"title": "Lab: Clean data and readable sheets", "tools": "Microsoft Excel (desktop or web), or any spreadsheet app", "steps": ["Start a new sheet and format A2:A4 as Text before pasting the sample into A1:D4.", "Apply bold headings, readable widths and a two-decimal numeric or currency format to Unit cost.", "In F2 enter 12.345 and display two decimals; explain why the formula bar differs.", "In F3 enter 0.15 and apply Percentage; verify 15%.", "Add a clearly displayed date, then save an .xlsx copy and verify codes, dates and values after reopening."], "check": "You can explain why a value and its display can differ, and protect identifiers before entering them."}, "sources": [{"label": "Microsoft: Available number formats", "url": "https://support.microsoft.com/en-us/excel/get-started/available-number-formats-in-excel"}, {"label": "Microsoft: Keep leading zeros", "url": "https://support.microsoft.com/en-us/excel/keeping-leading-zeros-and-large-numbers"}]}, {"id": "x-formulas-and-references", "subject": "excel", "title": "Formulas that survive copying", "subtitle": "Make it calculate · Week 3", "goal": "Build a reliable purchase total and understand why copied formulas change.", "learn": ["Start a formula with = and use cell references.", "Calculate a line total with multiplication.", "Add a contiguous range with SUM.", "Distinguish relative, absolute and mixed references.", "Copy a formula while keeping a shared rate fixed.", "Verify a formula by changing a source value."], "sections": [{"title": "Let the workbook do the calculation", "text": "We will calculate purchase costs from the first lesson’s sample. A formula begins with =. Instead of typing the answer yourself, refer to cells containing the inputs. This lets Excel recalculate when those inputs change, provided calculation settings permit it.", "example": "In D2 enter =B2*C2. With quantity 3 and unit cost 250, the result is 750.", "tryIt": "Enter the formula in D2, then read the formula bar.", "answer": "The cell displays 750; the formula bar shows =B2*C2. The formula and the displayed result are different things."}, {"title": "Copying relative references", "text": "Ordinary references such as B2 and C2 are relative. Copying the formula down one row changes them to B3 and C3. This is useful: each row should use its own quantity and price. Copy or fill D2 down to D4, then inspect each resulting formula.", "example": "D3 becomes =B3*C3 and returns 1000. D4 becomes =B4*C4 and returns 3600.", "tryIt": "Fill the formula down, then click D4 and check its references.", "answer": "D4 must use B4 and C4. If every row uses B2 and C2, you have fixed references that should have moved."}, {"title": "Add the line totals", "text": "SUM adds values in a range. In D5 enter =SUM(D2:D4). The colon means the range includes both endpoints. A grand total should include every intended line once and should not include its own result cell.", "example": "750 + 1000 + 3600 = 5350. =SUM(D2:D4) returns that amount for the starting data.", "tryIt": "Calculate D5, then explain why =SUM(D2:D3) would be incomplete.", "answer": "D2:D3 omits the paper pack. Including D5 in its own total can create a circular reference."}, {"title": "Keep a shared rate fixed", "text": "Put a practice surcharge rate of 10% in H2. This is an invented training rate, not a tax rate or financial recommendation. In E2 enter =D2*$H$2 to calculate that row’s surcharge. The dollar signs fix both the column H and row 2 when the formula is copied.", "example": "Copy E2 down: E3 becomes =D3*$H$2. The row total moves, while the shared rate remains H2.", "tryIt": "Fill E2 down to E4 and inspect E4.", "answer": "E4 should use =D4*$H$2. The surcharges are 75, 100 and 360 for the starting data."}, {"title": "Read the dollar signs precisely", "text": "$H$2 fixes both parts of the reference. H$2 fixes row 2 but lets the column change when copied sideways. $H2 fixes column H but lets the row change when copied downward. H2 fixes neither. The dollar signs control copying; they do not lock a cell against someone editing it.", "example": "Moving =B2*$H$2 one row down gives =B3*$H$2. Moving it one column right gives =C2*$H$2.", "tryIt": "Explain which part stays fixed in H$2 and $H2.", "answer": "H$2 keeps row 2 fixed. $H2 keeps column H fixed. $H$2 keeps both fixed."}, {"title": "Test the result instead of trusting the appearance", "text": "Change Notebook quantity in B2 from 3 to 4. D2 should become 1000 and the grand total should become 5600. Restore the original 3 afterward. Inspect formulas if results fail to update: check references, whether the entry is a formula rather than text, and the calculation setting.", "example": "Typing 750 as a fixed answer in D2 would not respond when B2 changes. A formula linked to the correct inputs should respond.", "tryIt": "Perform the change-and-restore check, then save your workbook.", "answer": "The starting total is 5350, the changed total is 5600, and restoring B2 to 3 restores 5350."}], "headers": ["Item", "Quantity", "Unit cost", "Line total", "Practice surcharge"], "rows": [["Notebook", "3", "250", "", ""], ["Pen", "10", "100", "", ""], ["Paper pack", "2", "1800", "", ""]], "lab": {"title": "Lab: Formulas that survive copying", "tools": "Microsoft Excel (desktop or web), or any spreadsheet app", "steps": ["Paste the sample into A1:E4 and put Practice surcharge rate in H1 and 10% in H2.", "Enter =B2*C2 in D2 and fill down to D4.", "Enter =SUM(D2:D4) in D5. Expect 5350.", "Enter =D2*$H$2 in E2 and fill down to E4. Expect 75,100,360.", "Change B2 to4: expect D2=1000 and D5=5600. Restore3, verify5350, save and reopen."], "check": "Every copied row uses its own inputs, the shared rate stays fixed, and a changed quantity changes the total correctly."}, "sources": [{"label": "Microsoft: Formula overview", "url": "https://support.microsoft.com/en-us/excel/get-started/overview-of-formulas-in-excel"}, {"label": "Microsoft: Relative, absolute and mixed references", "url": "https://support.microsoft.com/en-us/excel/switch-between-relative-absolute-and-mixed-references"}]}], "quiz": {"x-workbook-basics": {"Easy": [{"id": "x-workbook-basics/Easy/0", "q": "What is a workbook?", "o": ["A single printed page", "Only the ribbon toolbar", "One selected cell", "The spreadsheet file containing one or more worksheets"], "c": 3, "h": "A workbook is the saved file; its worksheets are the grids inside it."}, {"id": "x-workbook-basics/Easy/1", "q": "Which address means column B, row 3?", "o": ["3B", "B:C", "B3", "C2"], "c": 2, "h": "Letters identify columns and numbers identify rows."}, {"id": "x-workbook-basics/Easy/2", "q": "What does A1:C4 select?", "o": ["Only cells A1 and C4", "Three worksheet tabs", "A rectangular range of 12 cells", "Four cells in column A"], "c": 2, "h": "Three columns multiplied by four rows gives twelve cells, including both endpoints."}, {"id": "x-workbook-basics/Easy/3", "q": "Which structure is clearest for the purchases list?", "o": ["A separate workbook for every cell", "One purchase record per row with a header for each column", "Every purchase in one long sentence", "Different meanings in the same column"], "c": 1, "h": "Consistent rows and headers preserve the relationship between values."}, {"id": "x-workbook-basics/Easy/4", "q": "Which format preserves a workbook with Purchases and Notes sheets?", "o": [".txt", ".csv", ".xlsx", ".jpg"], "c": 2, "h": "A CSV holds plain data and does not retain the multi-sheet working workbook."}, {"id": "x-workbook-basics/Easy/5", "q": "What verifies that your work was saved correctly?", "o": ["Check only whether the Excel app is open", "Rename the desktop shortcut", "Reopen the intended file and check its sheets and values", "Trust the temporary workbook title"], "c": 2, "h": "Reopening checks both the saved location and the content actually retained."}], "Hard": [{"id": "x-workbook-basics/Hard/0", "q": "An office sends one file containing Purchases, Notes and Summary. How should you describe it?", "o": ["One workbook containing three worksheets", "One CSV containing three independent sheet tabs", "Three cells sharing a filename", "Three workbooks inside one worksheet"], "c": 0, "h": "The file is the workbook; the named tabs are worksheets."}, {"id": "x-workbook-basics/Hard/1", "q": "You must correct the pen quantity without changing its item name. The pen is on row 3 and Quantity is column B. Select:", "o": ["B2", "C3", "B3", "A3"], "c": 2, "h": "Use the row for Pen and the column for Quantity."}, {"id": "x-workbook-basics/Hard/2", "q": "A colleague says A1:C4 has 7 cells because 1+3+4=8 then subtracts 1. What is the correct method?", "o": ["Add the row labels 2,3 and 4", "Count 3 columns and 4 rows, then multiply to get 12", "Count A,B,C and ignore all rows", "Count only the two corner cells"], "c": 1, "h": "A rectangular range is measured by its included rows and columns."}, {"id": "x-workbook-basics/Hard/3", "q": "After typing a correction, the price changed instead of the item name. What should you do first?", "o": ["Delete the entire worksheet", "Change the workbook filename to the item name", "Save immediately to confirm the change", "Undo the wrong edit, then select the intended name cell"], "c": 3, "h": "Undo reverses the accidental edit; selecting the correct cell prevents another overwrite."}, {"id": "x-workbook-basics/Hard/4", "q": "You need a sheet explaining assumptions beside Purchases. Best action?", "o": ["Add and rename a worksheet in the same workbook", "Type every assumption into Quantity cells", "Replace the existing headers with the assumptions", "Export Purchases as a picture"], "c": 0, "h": "A separate worksheet keeps notes together while preserving the data table."}, {"id": "x-workbook-basics/Hard/5", "q": "Your app displays Book 1 and no saved location is known. What next?", "o": ["Search for a CSV named Notes automatically", "Assume Book 1 is already a permanent saved copy", "Close Excel and discard the save prompt", "Save it with a meaningful filename and verify the location"], "c": 3, "h": "A temporary name is not proof that the desired file has been saved."}, {"id": "x-workbook-basics/Hard/6", "q": "A supplier needs plain data, but you need to keep formulas and two sheets. What is safest?", "o": ["Merge both sheets into a worksheet tab name", "Keep the .xlsx master and export a separate CSV for the supplier", "Rename .xlsx to .csv without exporting", "Replace the only master with CSV"], "c": 1, "h": "Separate working and exchange files protect workbook features."}, {"id": "x-workbook-basics/Hard/7", "q": "Your list has headers in row 1 and three data rows. Which range covers the entire 3-column list?", "o": ["A1:B4", "A1:C3", "A2:C4", "A1:C4"], "c": 3, "h": "The header plus three records occupies four rows, across columns A through C."}, {"id": "x-workbook-basics/Hard/8", "q": "The Name Box shows C4. In the sample purchases, what should be there?", "o": ["The Pen label", "The notebook quantity 3", "The paper pack unit cost 1800", "The Purchases sheet name"], "c": 2, "h": "The third column is Unit cost and row 4 is Paper pack."}, {"id": "x-workbook-basics/Hard/9", "q": "A co-worker types all of Notebook,3,250 into A2. What should change?", "o": ["Place the item in A2, quantity in B2 and unit cost in C2", "Add more spaces insideA2", "Store the quantity in the file extension", "Rename column A to All information"], "c": 0, "h": "Separating fields makes each value identifiable and useful."}, {"id": "x-workbook-basics/Hard/10", "q": "Two similar filenames appear in your folder. How do you choose the correct working copy?", "o": ["Open the intended file and verify its sheets and current values", "Choose the shortest name without checking", "Delete both and start from memory", "Assume every similarly named file is synchronised"], "c": 0, "h": "A filename alone does not establish which copy holds the inte
