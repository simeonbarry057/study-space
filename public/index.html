<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Kalam:wght@700&family=Patrick+Hand&display=swap">
<style>
/* Layout concept: a study desk. Sticky top bar, topic rail on the left, one lesson at a time on ruled notebook paper (Notebook) or plain cards (Workspace). */
:root{
  --bg:#e9ecf6; --surface:#ffffff; --surface-2:#f3f5fb; --fg:#1a2140; --muted:#586187; --line:#d3d8ea;
  --accent:#2a3f94; --accent-fg:#ffffff; --accent-soft:#e1e6fb; --ok:#13784a; --ok-soft:#dcf3e6; --bad:#b3261e; --bad-soft:#fbe3e1; --warn:#8a5a00; --warn-soft:#fbefd2;
  --paper:#c8c9d6; --paper-rule:#b8bbcb; --paper-margin:#b29cc0; --ink:#233985; --ink-soft:#3d52a0;
  --font-ui:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif; --font-hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive; --font-title:'Kalam','Segoe Print',cursive; --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px #1a21401a,0 6px 20px #1a214012;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1327; --surface:#161c36; --surface-2:#1d2443; --fg:#e6eafc; --muted:#a0a9d2; --line:#2b3459;
  --accent:#9bb0ff; --accent-fg:#0e1327; --accent-soft:#252f5c; --ok:#6fdca2; --ok-soft:#173a2a; --bad:#ff9a92; --bad-soft:#442022; --warn:#f0c46a; --warn-soft:#3d2f10;
  --shadow:0 1px 2px #0006,0 8px 24px #0005; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1327; --surface:#161c36; --surface-2:#1d2443; --fg:#e6eafc; --muted:#a0a9d2; --line:#2b3459;
  --accent:#9bb0ff; --accent-fg:#0e1327; --accent-soft:#252f5c; --ok:#6fdca2; --ok-soft:#173a2a; --bad:#ff9a92; --bad-soft:#442022; --warn:#f0c46a; --warn-soft:#3d2f10;
  --shadow:0 1px 2px #0006,0 8px 24px #0005; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-ui);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1280px;margin:0 auto}
/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;border:0;background:none;padding:0;text-align:left}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--font-mono);font-size:.78rem;font-weight:700;letter-spacing:-.04em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.74rem;line-height:1.1}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;min-height:36px}
.chip strong{font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:.88rem;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.good{background:var(--ok);color:var(--accent-fg);border-color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.menu-btn{display:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:.72rem;padding:0 6px;font-weight:700}
/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding-block:20px 56px;align-items:start}
.rail{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 84px);overflow:auto;padding-right:6px}
.rail-search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.stage{margin-bottom:16px}
.stage h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;padding:0 4px 6px}
.stage h2 em{font-style:normal;font-variant-numeric:tabular-nums}
.topic-btn{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;min-height:38px}
.topic-btn:hover{background:var(--surface)}
.topic-btn[aria-current="page"]{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.topic-btn .ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.topic-btn .ring.part{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.topic-btn .ring.done{border-color:var(--ok);background:var(--ok);color:var(--accent-fg)}
.topic-btn span.t{font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
/* generic */
.main{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.kicker{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.page-head{display:grid;gap:6px;margin-bottom:16px}
.page-head h1{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.page-head p{color:var(--muted);max-width:68ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{border:0;background:none;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.grid{display:grid;gap:14px}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.86rem}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.steps{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.steps label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer}
.steps input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.steps input:checked+span{color:var(--muted);text-decoration:line-through}
pre.cmd{font:.86rem/1.5 var(--font-mono);background:#0f1530;color:#dfe6ff;border-radius:12px;padding:12px 14px;overflow:auto;margin:6px 0;white-space:pre}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:8px;font-weight:600;font-size:.9rem}
.flow i{color:var(--muted);font-style:normal}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
details.reveal{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2);margin:10px 0}
details.reveal summary{cursor:pointer;font-weight:700}
details.reveal[open] summary{margin-bottom:6px}
/* quiz */
.qwrap{display:grid;gap:14px}
.q-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.q-text{font-size:1.08rem;font-weight:600;white-space:pre-line}
.opts{display:grid;gap:8px;margin:12px 0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:48px}
.opt b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-size:.82rem}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:10px 14px;margin-top:8px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.fb p{color:var(--fg)}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.diff{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);text-align:left}
.diff:hover{border-color:var(--accent)}
.diff b{display:block;font-size:1.05rem}
.review-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--surface-2)}
/* gate + dialogs */
.gate{max-width:560px;margin:8vh auto;text-align:left}
.gate h1{font-size:1.8rem;margin-bottom:8px}
.gate input[type=text]{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;margin:10px 0}
.admin-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2);margin-top:8px}
.admin-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;box-shadow:var(--shadow)}
textarea.notes{width:100%;min-height:260px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);resize:vertical;line-height:1.6}
/* ---------- Notebook layout ---------- */
html[data-layout="notebook"] .sheet{background-color:var(--paper);color:var(--ink);border:0;border-radius:2px;box-shadow:0 6px 18px #26324c33;padding:26px 28px 28px 9%;position:relative;
  background-image:linear-gradient(to right,transparent 0 7.2%,var(--paper-margin) 7.2% 7.35%,transparent 7.35%),repeating-linear-gradient(to bottom,transparent 0 33px,var(--paper-rule) 33px 34px);background-position:0 0,0 16px;font:400 1.22rem/34px var(--font-hand);letter-spacing:.012em;overflow:hidden}
html[data-layout="notebook"] .sheet :is(p,li,span,label,summary,td,th,small,strong,em,b,div,h2,h3,h4){color:var(--ink)}
html[data-layout="notebook"] .sheet :is(h2,h3,h4){font-family:var(--font-hand);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
html[data-layout="notebook"] .sheet h2{display:table;font-size:1.3em;border:2px solid var(--ink);border-radius:38% 8% 31% 12% / 30% 48% 30% 42%;padding:0 14px 2px;margin:20px 0 10px;max-width:100%}
html[data-layout="notebook"] .sheet ul.steps{padding-left:0}
html[data-layout="notebook"] .sheet h3{font-size:1.15em;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;margin:12px 0 4px}
html[data-layout="notebook"] .sheet ul,html[data-layout="notebook"] .sheet ol{margin:6px 0 10px;padding-left:26px}
html[data-layout="notebook"] .sheet li{line-height:1.35;margin:6px 0}
html[data-layout="notebook"] .sheet li::marker{color:var(--ink)}
html[data-layout="notebook"] .sheet .muted{color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .steps label,html[data-layout="notebook"] .sheet details.reveal,html[data-layout="notebook"] .sheet .tbl,html[data-layout="notebook"] .sheet .review-item{background:#ffffff2e;border-color:var(--ink-soft);border-radius:10px;line-height:1.35}
html[data-layout="notebook"] .sheet .tbl th{background:#ffffff40;font-family:var(--font-ui);font-size:.72rem}
html[data-layout="notebook"] .sheet .tbl td,html[data-layout="notebook"] .sheet .tbl th{border-color:var(--paper-rule);font-size:1rem}
html[data-layout="notebook"] .sheet .opt{background:#ffffff40;border-color:var(--ink-soft);line-height:1.3}
html[data-layout="notebook"] .sheet .opt b{background:#ffffff59;font-family:var(--font-ui)}
html[data-layout="notebook"] .sheet .opt[aria-pressed="true"]{background:#ffffff8c;border-color:var(--ink)}
html[data-layout="notebook"] .sheet .opt.right{background:#c6efd6;border-color:#0f6b3f}
html[data-layout="notebook"] .sheet .opt.wrong{background:#f6cfcb;border-color:#a3231b}
html[data-layout="notebook"] .sheet .fb.ok{background:#c6efd6} html[data-layout="notebook"] .sheet .fb.no{background:#f6cfcb}
html[data-layout="notebook"] .sheet .fb.ok *,html[data-layout="notebook"] .sheet .fb.no *{color:#1b2240}
html[data-layout="notebook"] .sheet .pill{background:#ffffff59;color:var(--ink);font-family:var(--font-ui)}
html[data-layout="notebook"] .sheet .btn{background:#ffffff59;border-color:var(--ink);color:var(--ink);font-family:var(--font-ui)}
html[data-layout="notebook"] .sheet .btn.primary{background:var(--ink);color:#fff}
html[data-layout="notebook"] .sheet .btn.good{background:#0f6b3f;color:#fff}
html[data-layout="notebook"] .sheet .flow span{background:#ffffff59;color:var(--ink)}
html[data-layout="notebook"] .sheet pre.cmd{line-height:1.5;font-size:.82rem}
html[data-layout="notebook"] .sheet pre.cmd{color:#dfe6ff}
html[data-layout="notebook"] .sheet textarea.notes{background:#ffffff40;border-color:var(--ink-soft);font:inherit;font-size:1.15rem;line-height:34px;color:var(--ink)}
html[data-layout="notebook"] .sheet .bar{background:#ffffff40;border-color:var(--ink-soft)} html[data-layout="notebook"] .sheet .bar i{background:var(--ink)}
html[data-layout="notebook"] .sheet .page-head p{color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .page-head h1{font:700 clamp(1.9rem,4.2vw,2.8rem)/1.25 var(--font-title);text-decoration:underline double;text-decoration-thickness:2px;text-underline-offset:7px;color:#193388}
html[data-layout="notebook"] .sheet .kicker{font-family:var(--font-ui);color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .tabs{border-color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .tab{font-family:var(--font-ui);color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .tab[aria-selected="true"]{background:#ffffff66;color:var(--ink)}
html[data-layout="notebook"] .sheet .diff{background:#ffffff40;border-color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .card{background:transparent;border:0;box-shadow:none;padding:0}
html[data-layout="notebook"] .sheet .stat{background:#ffffff40;border-color:var(--ink-soft)}
html[data-layout="notebook"] .sheet .stat b{font-family:var(--font-title)}
html[data-layout="notebook"] .sheet .admin-row{background:#ffffff38;border-color:var(--ink-soft)}
html[data-layout="workspace"] .sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
html[data-layout="workspace"] .sheet .card{border:0;box-shadow:none;padding:0}
html[data-layout="workspace"] .sheet h2{margin:28px 0 8px;font-size:1.3rem}
html[data-layout="workspace"] .sheet h3{margin:20px 0 6px;font-size:1.08rem}
html[data-layout="workspace"] .sheet p+p{margin-top:10px}
html[data-layout="workspace"] .sheet p+.tbl,html[data-layout="workspace"] .sheet p+.flow{margin-top:8px}
html[data-layout="workspace"] .sheet ul,html[data-layout="workspace"] .sheet ol{margin:8px 0 10px}
html[data-layout="workspace"] .sheet .steps{margin:10px 0}
/* story scenes: ink line art like the notebook pictures */
.story-scene{margin:14px 0;padding:10px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);fill:none}
.story-scene>svg{display:block;width:100%;max-width:760px;height:auto;margin:auto;overflow:visible}
.story-scene text{stroke:none}
.story-scene :is(.story-label,.story-action,.story-group,.story-unknown){fill:var(--ink);font-family:var(--font-hand);font-weight:400}
.story-label{font-size:21px}.story-action{font-size:19px}.story-group{font-size:23px}.story-unknown{font-size:44px}
.story-scene .sketch-device,.story-scene .sketch-device *{fill:none;stroke:var(--ink);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.story-scene .sketch-device circle[r="3"],.story-scene .sketch-device circle[r="3.5"],.story-scene .sketch-device circle[r="4"]{fill:var(--ink)}
.story-link{fill:none;stroke:var(--ink);stroke-width:3px;stroke-linecap:round;vector-effect:non-scaling-stroke}
.story-link.dash{stroke-dasharray:7 7}
.story-arrowhead{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.story-lan-boundary{fill:none;stroke:var(--ink);stroke-width:2.2px;stroke-dasharray:8 7;vector-effect:non-scaling-stroke}
.story-scene figcaption{color:var(--ink);font:1.08rem/1.3 var(--font-hand);text-align:center;margin-top:6px}
.scene-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;margin:12px 0}
.scene-grid .story-scene{margin:0}
@media(max-width:600px){.story-label{font-size:27px}.story-action{font-size:23px}.story-group{font-size:25px}.story-scene{padding:6px}}
/* replica pages (topic 1) */
.replica-book{container-type:inline-size;display:grid;gap:28px;margin:0 0 28px}
.replica-sheet{color:var(--ink);position:relative;background-color:var(--paper);box-shadow:0 6px 18px #26324c33;padding:32px 36px 32px 9%;font:400 clamp(18px,2.8cqw,29px)/1.45 var(--font-hand);letter-spacing:.015em;min-width:0;overflow:hidden;
  background-image:linear-gradient(to right,transparent 0 7.2%,var(--paper-margin) 7.2% 7.35%,transparent 7.35%),repeating-linear-gradient(to bottom,transparent 0 34px,var(--paper-rule) 34px 35px);background-position:0 0,0 17px}
.replica-sheet :is(p,li,h3,h4,span){color:var(--ink)}
.replica-sheet :is(h3,h4){margin:0;font-weight:400;line-height:1.3}
.replica-title{margin:0 0 28px;text-align:center;padding:0 7% 8px 0}
.replica-title h3{display:inline-block;font:700 clamp(27px,5.75cqw,59px)/1.35 var(--font-title)!important;letter-spacing:-.04em;text-decoration:underline double;text-decoration-thickness:2px;text-underline-offset:7px;color:#193388}
.replica-sheet h4{display:table;font-size:1.13em;border:2px solid #2d438f;border-radius:38% 8% 31% 12% / 30% 48% 30% 42%;padding:0 12px 2px;max-width:100%}
.replica-sheet ul{list-style:disc;padding-left:26px;margin:8px 0 12px}
.replica-sheet li{margin:3px 0}
.replica-definition{margin:0 0 18px;max-width:92%}
.replica-purpose{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:center;margin:12px 0 22px}
.replica-art{margin:0;min-width:0;align-self:center;line-height:0}
.replica-art img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.replica-type-summary ol{padding:0;margin:14px 0 20px;list-style:none;display:grid;gap:10px}
.replica-type-summary li{display:grid;grid-template-columns:1.7em minmax(0,1.1fr) 22px minmax(0,1fr);gap:7px;align-items:baseline;font-size:.96em;margin:0}

  --bg-blobs:radial-gradient(820px 480px at 6% -6%,#bfe6fb 0,transparent 62%),radial-gradient(760px 520px at 100% 8%,#e2d3fb 0,transparent 58%),radial-gradient(900px 560px at 45% 112%,#c8f0e0 0,transparent 58%)}

  --bg-blobs:radial-gradient(ellipse at top,#172741 0,transparent 60%),radial-gradient(700px 480px at 100% 20%,#2a1f4d 0,transparent 60%),radial-gradient(800px 520px at 20% 110%,#10352f 0,transparent 60%)}

  --bg-blobs:radial-gradient(ellipse at top,#172741 0,transparent 60%),radial-gradient(700px 480px at 100% 20%,#2a1f4d 0,transparent 60%),radial-gradient(800px 520px at 20% 110%,#10352f 0,transparent 60%)}}

/* bubbles: translucent circles pop up inside controls and cards */
:is(.cta,.pill-btn,.subj-tab,.pcard,.lcard,.how>div,.stat,.diff,.opt,.topic-btn,.btn,.acct-menu a){position:relative;isolation:isolate;overflow:hidden;transition:transform 180ms ease,box-shadow 180ms ease}
:is(.cta,.pill-btn,.subj-tab,.pcard,.lcard,.how>div,.stat,.diff,.opt,.topic-btn,.btn,.acct-menu a)::before,:is(.cta,.pill-btn,.subj-tab,.pcard,.lcard,.how>div,.stat,.diff,.opt,.topic-btn,.btn,.acct-menu a)::after{content:'';position:absolute;pointer-events:none;z-index:-1;border-radius:50%;opacity:0;transform:scale(.65);transition:opacity 220ms ease,transform 400ms ease;background:radial-gradient(circle at 30% 25%,#ffffffb0,transparent 40%),radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--bub) 32%,transparent),transparent 72%);border:1px solid color-mix(in srgb,var(--bub) 35%,transparent)}

tay at home.","Correct. Devices on the same LAN can exchange data locally, even without an internet connection.","Wi-Fi is a local connection method. It does not require local files to travel through the ISP."]}},"guides":{},"sources":[{"title":"Cisco DHCP relay configuration","url":"https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dhcp/configuration/15-s/dhcp-15-s-book/dhcp-relay-agent.html"},{"title":"Cisco IPv4 ACL examples","url":"https://www.cisco.com/c/en/us/support/docs/ip/access-lists/26448-ACLsamples.html"},{"title":"Cisco SSH configuration","url":"https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"},{"title":"Cisco CCNA v1.1 exam topics","url":"https://learningcontent.cisco.com/documents/marketing/exam-topics/200-301-CCNA-v1.1.pdf"},{"title":"Cisco route selection and administrative distance","url":"https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/15986-admin-distance.html"},{"title":"Cisco IPv6 static routing","url":"https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ip6-route-static-xe.html"},{"title":"Cisco OSPF configuration","url":"https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iro-cfg-0.html"},{"title":"Cisco NAT configuration","url":"https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13772-12.html"},{"title":"Cisco policing and shaping","url":"https://www.cisco.com/c/en/us/support/docs/quality-of-service-qos/qos-policing/19645-policevsshape.html"}],"labs":{"network-basics":{"introduction":"A network is a group of connected devices exchanging information. Your home LAN joins your devices; the router connects that LAN to other networks through your internet service provider (ISP). Wi-Fi is the local connection to an access point, not the internet itself. Bandwidth is capacity, throughput is the rate achieved, latency is delay, and loss means missing packets.","levels":[{"difficulty":"Easy","title":"Follow a phone to a website","scenario":"A phone uses home Wi-Fi to open a website through ENet.","reasoning":["The phone joins an access point. That Wi-Fi link is part of the home LAN.","The router forwards the request toward the ONT and ISP. An ONT connects the fiber access link; it may share a box with other functions.","The ISP connects onward to other networks until the website server is reached. Its reply returns to the phone."],"task":"Draw a laptop opening a website through your home connection.","steps":["Draw laptop, access point, router, access device, ISP, and website server; combine boxes if roles share a device.","Label the local connections LAN and the provider-facing connection WAN.","Explain what each box does in one sentence."],"hint":"Name functions even when one physical box performs several of them.","answer":"Laptop \u2192 access point \u2192 router \u2192 modem/ONT \u2192 ISP \u2192 internet networks \u2192 website server. The access point joins Wi-Fi clients to the LAN; the router connects IP networks; the ISP provides onward connectivity.","check":"You can name your ISP and explain why connecting to Wi-Fi alone does not prove internet access."},{"difficulty":"Hard","title":"Separate local and upstream faults","scenario":"A wireless laptop cannot reach a local printer, but a wired PC can print and open websites.","reasoning":["The wired PC proves the printer works and at least one path to the internet works.","The wireless laptop has a local problem to investigate: association, addressing, isolation, or radio quality.","An ISP outage alone does not explain failure to reach a reachable printer on the same LAN."],"task":"A phone sees its SSID but cannot browse; a wired PC browses normally. Plan three useful checks.","steps":["Check whether the phone actually joined and authenticated.","Inspect its address and gateway and test an available local service.","Compare another Wi-Fi client and note whether isolation or a guest network applies."],"hint":"Separate seeing an SSID from successfully joining it.","answer":"Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.","check":"Your conclusion follows the evidence and names a next test instead of assuming an ISP outage."},{"difficulty":"Very Hard","title":"Capacity is not delay","scenario":"A 300 Mbps customer reports broken video calls. Downloads are fast, but calls show jitter and loss, especially on Wi-Fi.","reasoning":["Mbps describes capacity, not guaranteed delay or delivery.","Calls are sensitive to delay variation and loss; a fast download can coexist with poor calls.","Compare wired and wireless tests, quiet and busy periods, and local versus remote reachability to narrow the fault."],"task":"Design a comparison for two PCs: wired is stable; Wi-Fi calls fail mainly during large uploads.","steps":["Record the symptoms and repeat the same call or test on both connections.","Compare a quiet period with an upload-heavy period; record delay and loss observations.","State two possible causes and the next measurement that distinguishes them."],"hint":"Shared radio airtime and a congested upstream queue can both affect calls.","answer":"Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path.","check":"You distinguish a hypothesis from a confirmed fault and explain why a speed test alone is insufficient."}]}},"quiz":{"network-basics":{"Easy":[{"id":"network-basics/lesson-check/Easy/0","q":"Your phone joins home Wi-Fi. Which network has it joined?","o":["The provider\u2019s entire network.","The website server\u2019s LAN.","The home LAN."],"c":2,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."},{"id":"network-basics/lesson-check/Easy/1","q":"Which device provides a way from your LAN to other networks?","o":["The web server that returns page content.","The DNS server that resolves the site\u2019s name.","The local router."],"c":2,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."},{"id":"network-basics/lesson-check/Easy/2","q":"What is an ISP?","o":["The wireless access device inside your home.","The company providing your internet connection.","The server supplying the requested website."],"c":1,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."},{"id":"network-basics/lesson-check/Easy/3","q":"How can traffic reach a distant website after the ISP?","o":["Connected networks carry it toward the destination.","The destination server joins the home LAN for that request.","The provider carries it without any connection to the destination network."],"c":0,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."},{"id":"network-basics/lesson-check/Easy/4","q":"What follows the server processing a page request?","o":["It forwards the original request as the completed response.","It asks the home router to create the requested page.","It sends information back to the requesting device."],"c":2,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."},{"id":"network-basics/lesson-check/Easy/5","q":"Which description matches the internet?","o":["Many separate networks connected together.","One local network shared by every home and server.","Only all the devices attached to one provider."],"c":0,"h":"Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}],"Hard":[{"id":"network-basics/Hard/0","q":"A phone sees its SSID but cannot browse; a wired PC browses normally. Plan three useful checks.","o":["Compare that PC\u2019s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains.","Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.","Temporarily disable cellular data for the test, verify the Wi-Fi join/IP settings and a page, then restore the prior cellular setting. Record the actual path and result."],"c":1,"h":"Separate seeing an SSID from successfully joining it."},{"id":"network-basics/Hard/1","q":"Draw two homes connected through an ISP and label the local versus inter-network parts.","o":["Yes, if their local addressing, sharing service, and policy work. The ISP is not required for that local path.","Each home has its own LAN; routers connect them to the provider WAN. The internet is interconnected networks, not one household LAN.","Compare that PC\u2019s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains."],"c":1,"h":"Review the worked example: Each local site has a LAN; the inter-site connection is a WAN function."},{"id":"network-basics/Hard/2","q":"List three useful checks when only printing fails.","o":["Check printer power/address, same-LAN or routed reachability and isolation, then print service/queue. Do not infer a total ISP outage from one failed local service.","Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.","The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time."],"c":0,"h":"Review the worked example: Working browsing does not establish that the printer service or local printer path works."},{"id":"network-basics/Hard/3","q":"Why might a wired test be faster than a simultaneous crowded Wi-Fi test?","o":["Temporarily disable cellular data for the test, verify the Wi-Fi join/IP settings and a page, then restore the prior cellular setting. Record the actual path and result.","Compare local wired transfer, local wireless transfer, and an external download. Inspect endpoint/storage limits and link negotiation. An ISP upgrade is not evidence of a faster LAN.","The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time."],"c":2,"h":"Review the worked example: Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client."},{"id":"network-basics/Hard/4","q":"Which measurements would you compare for a poor call: delay, jitter, loss, or only download Mbps?","o":["Compare delay, jitter, and loss along with available capacity. Mbps alone cannot explain delivery timing or missing voice packets.","Compare that PC\u2019s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains.","Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path."],"c":0,"h":"Review the worked example: A call is sensitive to timely delivery; reliable file transfer can recover lost data over time."},{"id":"network-basics/Hard/5","q":"A wireless laptop cannot reach a local printer, but a wired PC can print and open websites.\nWhich explanation is supported by these facts?","o":["Local LAN communication can work without an internet connection.","A working page does not prove the Wi-Fi path delivered it.","The wired PC proves the printer works and at least one path to the internet works."],"c":2,"h":"Separate seeing an SSID from successfully joining it."},{"id":"network-basics/Hard/6","q":"An office LAN connects through a provider to a branch LAN.\nWhich explanation is supported by these facts?","o":["The local copy may be limited by LAN links, storage, or endpoints rather than the ISP.","The wired PC proves the printer works and at least one path to the internet works.","Each local site has a LAN; the inter-site connection is a WAN function."],"c":2,"h":"Review the worked example: Each local site has a LAN; the inter-site connection is a WAN function."},{"id":"network-basics/Hard/7","q":"A laptop browses websites but cannot print to a local printer.\nWhich explanation is supported by these facts?","o":["Working browsing does not establish that the printer service or local printer path works.","Local LAN communication can work without an internet connection.","Restoring the ISP cannot repair the PC-specific address error."],"c":0,"h":"Review the worked example: Working browsing does not establish that the printer service or local printer path works."},{"id":"network-basics/Hard/8","q":"Several Wi-Fi clients stream at once and each slows down.\nWhich explanation is supported by these facts?","o":["Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client.","Mbps describes capacity, not guaranteed delay or delivery.","100 Mbps is nominal capacity; 70 Mbps is achieved throughput for that test."],"c":0,"h":"Review the worked example: Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client."},{"id":"network-basics/Hard/9","q":"A voice call sounds choppy although a file eventually downloads correctly.\nWhich explanation is supported by these facts?","o":["The wired PC proves the printer works and at least one path to the internet works.","A call is sensitive to timely delivery; reliable file transfer can recover lost data over time.","The phone joins an access point. That Wi-Fi link is part of the home LAN."],"c":1,"h":"Review the worked example: A call is sensitive to timely delivery; reliable file transfer can recover lost data over time."},{"id":"network-basics/Hard/10","q":"During a lab handover, someone asks: If two devices communicate inside your home, are they necessarily using the ISP? Which explanation should you give?","o":["No. Devices on the same LAN can communicate locally. They use a router and the ISP connection when reaching services beyond that local network.","No. A service rule can limit the protocol and port, rather than allow every connection.","No. It carries VLAN traffic. A routing function is needed to communicate between their networks."],"c":0,"h":"Separate the roles described in the lesson before drawing a conclusion."},{"id":"network-basics/Hard/11","q":"You are explaining this topic to a colleague. Two laptops share files on the same home LAN. Must the files travel through the ISP?","o":["No, they can communicate inside the LAN.","Only if both laptops use Wi-Fi.","Yes, all network traffic uses the ISP."],"c":0,"h":"Correct. Devices on the same LAN can exchange data locally, even without an internet connection."}],"Very Hard":[{"id":"network-basics/Very Hard/0","q":"Design a comparison for two PCs: wired is stable; Wi-Fi calls fail mainly during large uploads.","o":["The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time.","Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.","Check printer tent."],"sections":[{"title":"What is Excel?","text":"Imagine recording stationery purchases for a small office. Excel is a spreadsheet application: its grid helps you organise information, calculate results and explore patterns. A workbook is the file you open and save. Inside it, worksheets are separate grids, shown as tabs.","example":"Office Supplies.xlsx is one workbook. Purchases and Summary can be two worksheets inside that same file.","tryIt":"Open Excel, choose Blank workbook, and find the sheet tab at the bottom.","answer":"You should see a new workbook containing a worksheet. Your workbook name may be temporary until you save it."},{"title":"Find your way around the grid","text":"Columns run down the sheet and have letter labels, such as A and B. Rows run across and have number labels. Their intersection is a cell. B3 means column B, row 3; it is not the third column. The Name Box normally shows the active cell address. The formula bar shows or edits its content.","example":"Click B3. You are at column B, row 3. A1:C4 describes a rectangular range from A1 through C4, including both ends.","tryIt":"Select B3, then select A1:C4 using the Name Box or dragging.","answer":"B3 is one cell. A1:C4 contains 3 columns \u00d7 4 rows = 12 cells."},{"title":"Enter a small, labelled list","text":"Give each column a clear header and put one record on each row. Click A1, type Item, and press Tab to move right. Enter Quantity in B1 and Unit cost in C1. Enter the sample rows beneath them. Consistent headings make the data understandable before any formula is added.","example":"A2 is Notebook, B2 is 3, and C2 is 250. The item name, quantity and cost all describe the same purchase row.","tryIt":"Paste the sample data below into A1, or type each value into its stated cell.","answer":"Headers occupy row 1. The three purchases occupy rows 2, 3 and 4. Do not put all three values into one cell."},{"title":"Edit the cell you intend to change","text":"Clicking a cell selects it. Typing a new value normally replaces that cell\u2019s content. Double-click a cell, or use the formula bar, to edit part of its content. Use Undo immediately if you replace the wrong value. Before typing, check the active cell so that you do not overwrite a neighbouring record.","example":"If Notebook in A2 becomes Notebok, edit A2 to correct the spelling; the quantity in B2 should remain 3.","tryIt":"Correct an intentional spelling error in A2. Then undo and redo that one edit.","answer":"Only the selected cell should change. Recheck B2 and C2 to confirm the rest of the record remains intact."},{"title":"Name the sheet and save the workbook","text":"Rename the worksheet Purchases using its tab. Save the workbook with a meaningful filename such as Office Supplies.xlsx in a folder you can find again. Excel\u2019s .xlsx format can store multiple worksheets, formulas and formatting. A CSV is a plain-text data exchange file; it does not preserve a whole multi-sheet workbook\u2019s features.","example":"Use .xlsx for your working workbook. Export a separate CSV only when another system needs a plain data table.","tryIt":"Save Office Supplies.xlsx, add a worksheet called Notes, and save again.","answer":"One workbook now contains Purchases and Notes. Saving it as .xlsx retains both worksheets."},{"title":"Verify before you trust the saved copy","text":"Saving is only useful when you can find and reopen the right file. Close the workbook normally and reopen the saved .xlsx file. Check the filename, the two sheet tabs and several values. AutoSave availability depends on the file location and settings; do not assume an unsaved local workbook is protected.","example":"A second file called Office Supplies (1).xlsx might be a different copy. Verify the full file you opened rather than trusting a similar name.","tryIt":"Reopen your file and read Purchases!B2 and Purchases!C4.","answer":"With the supplied sample, B2 should be 3 and C4 should be 1800. Both sheets should still be present."}],"headers":["Item","Quantity","Unit cost"],"rows":[["Notebook","3","250"],["Pen","10","100"],["Paper pack","2","1800"]],"lab":{"title":"Lab: Your first workbook","tools":"Microsoft Excel (desktop or web), or any spreadsheet app","steps":["Create a blank workbook and rename its first sheet Purchases.","Enter or paste the sample into A1:C4.","Select B3, then A1:C4, and explain the difference.","Add a Notes worksheet and write one sentence describing the list.","Save as Office Supplies.xlsx, close and reopen it, and verify both sheets and three values."],"check":"You can find a named cell, explain the grid and reopen a correctly saved multi-sheet workbook."},"sources":[{"label":"Microsoft: Basic tasks in Excel","url":"https://support.microsoft.com/en-us/office/basic-tasks-in-excel-dc775dd1-fa52-430f-9c3c-d998d1735fca"}]},{"id":"x-data-and-formatting","subject":"excel","title":"Clean data and readable sheets","subtitle":"Build confidence \u00b7 Week 2","goal":"Keep values accurate while making a work sheet easy to read.","learn":[],"sections":[],"headers":[],"rows":[],"lab":{"title":"","tools":"","steps":[],"check":""},"sources":[]},{"id":"x-formulas-and-references","subject":"excel","title":"Formulas that survive copying","subtitle":"Make it calculate \u00b7 Week 3","goal":"Build a reliable purchase total and understand why copied formulas change.","learn":[],"sections":[],"headers":[],"rows":[],"lab":{"title":"","tools":"","steps":[],"check":""},"sources":[]}],"quiz":{"x-workbook-basics":{"Easy":[{"id":"x-workbook-basics/Easy/0","q":"What is a workbook?","o":["A single printed page","Only the ribbon toolbar","One selected cell","The spreadsheet file containing one or more worksheets"],"c":3,"h":"A workbook is the saved file; its worksheets are the grids inside it."},{"id":"x-workbook-basics/Easy/1","q":"Which address means column B, row 3?","o":["3B","B:C","B3","C2"],"c":2,"h":"Letters identify columns and numbers identify rows."},{"id":"x-workbook-basics/Easy/2","q":"What does A1:C4 select?","o":["Only cells A1 and C4","Three worksheet tabs","A rectangular range of 12 cells","Four cells in column A"],"c":2,"h":"Three columns multiplied by four rows gives twelve cells, including both endpoints."},{"id":"x-workbook-basics/Easy/3","q":"Which structure is clearest for the purchases list?","o":["A separate workbook for every cell","One purchase record per row with a header for each column","Every purchase in one long sentence","Different meanings in the same column"],"c":1,"h":"Consistent rows and headers preserve the relationship between values."},{"id":"x-workbook-basics/Easy/4","q":"Which format preserves a workbook with Purchases and Notes sheets?","o":[".txt",".csv",".xlsx",".jpg"],"c":2,"h":"A CSV holds plain data and does not retain the multi-sheet working workbook."},{"id":"x-workbook-basics/Easy/5","q":"What verifies that your work was saved correctly?","o":["Check only whether the Excel app is open","Rename the desktop shortcut","Reopen the intended file and check its sheets and values","Trust the temporary workbook title"],"c":2,"h":"Reopening checks both the saved location and the content actually retained."}],"Hard":[{"id":"x-workbook-basics/Hard/0","q":"An office sends one file containing Purchases, Notes and Summary. How should you describe it?","o":["One workbook containing three worksheets","One CSV containing three independent sheet tabs","Three cells sharing a filename","Three workbooks inside one worksheet"],"c":0,"h":"The file is the workbook; the named tabs are worksheets."},{"id":"x-workbook-basics/Hard/1","q":"You must correct the pen quantity without changing its item name. The pen is on row 3 and Quantity is column B. Select:","o":["B2","C3","B3","A3"],"c":2,"h":"Use the row for Pen and the column for Quantity."},{"id":"x-workbook-basics/Hard/2","q":"A colleague says A1:C4 has 7 cells because 1+3+4=8 then subtracts 1. What is the correct method?","o":["Add the row labels 2,3 and 4","Count 3 columns and 4 rows, then multiply to get 12","Count A,B,C and ignore all rows","Count only the two corner cells"],"c":1,"h":"A rectangular range is measured by its included rows and columns."},{"id":"x-workbook-basics/Hard/3","q":"After typing a correction, the price changed instead of the item name. What should you do first?","o":["Delete the entire worksheet","Change the workbook filename to the item name","Save immediately to confirm the change","Undo the wrong edit, then select the intended name cell"],"c":3,"h":"Undo reverses the accidental edit; selecting the correct cell prevents another overwrite."},{"id":"x-workbook-basics/Hard/4","q":"You need a sheet explaining assumptions beside Purchases. Best action?","o":["Add and rename a worksheet in the same workbook","Type every assumption into Quantity cells","Replace the existing headers with the assumptions","Export Purchases as a picture"],"c":0,"h":"A separate worksheet keeps notes together while preserving the data table."},{"id":"x-workbook-basics/Hard/5","q":"Your app displays Book 1 and no saved location is known. What next?","o":["Search for a CSV named Notes automatically","Assume Book 1 is already a permanent saved copy","Close Excel and discard the save prompt","Save it with a meaningful filename and verify the location"],"c":3,"h":"A temporary name is not proof that the desired file has been saved."},{"id":"x-workbook-basics/Hard/6","q":"A supplier needs plain data, but you need to keep formulas and two sheets. What is safest?","o":["Merge both sheets into a worksheet tab name","Keep the .xlsx master and export a separate CSV for the supplier","Rename .xlsx to .csv without exporting","Replace the only master with CSV"],"c":1,"h":"Separate working and exchange files protect workbook features."},{"id":"x-workbook-basics/Hard/7","q":"Your list has headers in row 1 and three data rows. Which range covers the entire 3-column list?","o":["A1:B4","A1:C3","A2:C4","A1:C4"],"c":3,"h":"The header plus three records occupies four rows, across columns A through C."},{"id":"x-workbook-basics/Hard/8","q":"The Name Box shows C4. In the sample purchases, what should be there?","o":["The Pen label","The notebook quantity 3","The paper pack unit cost 1800","The Purchases sheet name"],"c":2,"h":"The third column is Unit cost and row 4 is Paper pack."},{"id":"x-workbook-basics/Hard/9","q":"A co-worker types all of Notebook,3,250 into A2. What should change?","o":["Place the item in A2, quantity in B2 and unit cost in C2","Add more spaces insideA2","Store the quantity in the file extension","Rename column A to All information"],"c":0,"h":"Separating fields makes each value identifiable and useful."},{"id":"x-workbook-basics/Hard/10","q":"Two similar filenames appear in your folder. How do you choose the correct working copy?","o":["Open the intended file and verify its sheets and current values","Choose the shortest name without checking","Delete both and start from memory","Assume every similarly named file is synchronised"],"c":0,"h":"A filename alone does not establish which copy holds the intended data."},{"id":"x-workbook-basics/Hard/11","q":"You want to move to the next field while entering the header row. Which taught action fits?","o":["Press Save to move one column","Rename the worksheet after each word","Press Tab to move right","Close and reopen after each cell"],"c":2,"h":"Tab moves the active selection to the right during ordinary cell entry."}],"Very Hard":[{"id":"x-workbook-basics/Very Hard/0","q":"A file opens with only one sheet after someone exported a CSV. What can you conclude?","o":["Changing the extension back always restores everything","The CSV does not preserve the original multi-sheet workbook; locate the .xlsx master","Excel has deleted every original backup","The missing sheets are definitely hidden inside the CSV"],"c":1,"h":"CSV cannot retain the workbook structure; do not invent a recovery guarantee."},{"id":"x-workbook-basics/Very Hard/1","q":"A review asks you to prove the file is usable tomorrow. Which evidence is strongest?","o":["The Excel application icon on the taskbar","Reopen the named .xlsx from its saved location and verify the two tabs and sample cells","A renamed folder with no checked workbook","A screenshot of an unsaved Book 1 window"],"c":1,"h":"Reopening the actual saved artifact verifies the deliverable rather than its appearance."},{"id":"x-workbook-basics/Very Hard/2","q":"You select A2:C4 for a check. What is included and what is excluded?","o":["Twelve cells including row 1","Three records plus the Notes worksheet","All three sample records, but not the header row","Only the header row and one record"],"c":2,"h":"A2:C4 contains nine cells in rows 2 through 4; row 1 is outside the range."},{"id":"x-workbook-basics/Very Hard/3","q":"A new purchase occupies row 5. What updates the range covering headers and every record?","o":["Change the workbook name to A5","Select A5 only and assume prior rows are included","Select C1:C5 and ignore Item and Quantity","Extend A1:C4 to A1:C5"],"c":3,"h":"The additional row must be included while keeping all fields."},{"id":"x-workbook-basics/Very Hard/4","q":"A worksheet is renamed from Sheet 1 to Purchases. What has actually changed?","o":["The number of records in the list","The worksheet tab name, not necessarily the workbook filename","The saved file extension","Every value in column A"],"c":1,"h":"Worksheet names and workbook filenames refer to different objects."},{"id":"x-workbook-basics/Very Hard/5","q":"You edited the wrong cell, then made several intentional changes. Why be careful with repeated Undo?","o":["Undo always affects only misspellings","Undo saves an automatic second workbook","Undo can never change numeric data","Each Undo can also reverse later intentional edits"],"c":3,"h":"Undo reverses editing history; inspect what each reversal will affect."},{"id":"x-workbook-basics/Very Hard/6","q":"A colleague wants the total number of cells in B2:D6. Your reasoning is:","o":["B plus D gives 6 cells regardless of rows","Three columns and five rows give 15 cells","Only B2 and D6 exist in that range","Two columns and four rows give 8 cells"],"c":1,"h":"Count B,C,D and rows 2,3,4,5,6, including endpoints."},{"id":"x-workbook-basics/Very Hard/7","q":"A team says a saved filename proves the list is correct. What is still missing?","o":["A more decorative filename","A fourth worksheet named Correct","A screenshot of the operating system clock","Checking the actual records and their cell locations against the intended data"],"c":3,"h":"Saving preserves content but does not establish that the content was entered accurately."},{"id":"x-workbook-basics/Very Hard/8","q":"You need to hand over a reusable purchasing workbook. Which design supports that purpose?","o":["Mixed fields in unlabelled cells","An image of the grid as the only working copy","A CSV master expected to contain multiple worksheet tabs","Clearly named worksheets and consistent field columns with a verified .xlsx file"],"c":3,"h":"A usable workbook needs both a clear structure and a verified saved artifact."},{"id":"x-workbook-basics/Very Hard/9","q":"A laptop has AutoSave disabled for a local file. Which habit still protects this lab?","o":["Save explicitly and reopen the saved file to verify it","Assume the account-saved quiz also saves desktop workbooks","Change the course theme before closing Excel","Keep the website open instead of saving the workbook"],"c":0,"h":"Course progress and desktop workbook storage are separate; explicit saving remains necessary."}]},"x-data-and-formatting":{"Easy":[{"id":"~x-data-and-formatting~Easy~0"},{"id":"~x-data-and-formatting~Easy~1"},{"id":"~x-data-and-formatting~Easy~2"},{"id":"~x-data-and-formatting~Easy~3"},{"id":"~x-data-and-formatting~Easy~4"},{"id":"~x-data-and-formatting~Easy~5"}],"Hard":[{"id":"~x-data-and-formatting~Hard~0"},{"id":"~x-data-and-formatting~Hard~1"},{"id":"~x-data-and-formatting~Hard~2"},{"id":"~x-data-and-formatting~Hard~3"},{"id":"~x-data-and-formatting~Hard~4"},{"id":"~x-data-and-formatting~Hard~5"},{"id":"~x-data-and-formatting~Hard~6"},{"id":"~x-data-and-formatting~Hard~7"},{"id":"~x-data-and-formatting~Hard~8"},{"id":"~x-data-and-formatting~Hard~9"},{"id":"~x-data-and-formatting~Hard~10"},{"id":"~x-data-and-formatting~Hard~11"}],"Very Hard":[{"id":"~x-data-and-formatting~Very Hard~0"},{"id":"~x-data-and-formatting~Very Hard~1"},{"id":"~x-data-and-formatting~Very Hard~2"},{"id":"~x-data-and-formatting~Very Hard~3"},{"id":"~x-data-and-formatting~Very Hard~4"},{"id":"~x-data-and-formatting~Very Hard~5"},{"id":"~x-data-and-formatting~Very Hard~6"},{"id":"~x-data-and-formatting~Very Hard~7"},{"id":"~x-data-and-formatting~Very Hard~8"},{"id":"~x-data-and-formatting~Very Hard~9"}]},"x-formulas-and-references":{"Easy":[{"id":"~x-formulas-and-references~Easy~0"},{"id":"~x-formulas-and-references~Easy~1"},{"id":"~x-formulas-and-references~Easy~2"},{"id":"~x-formulas-and-references~Easy~3"},{"id":"~x-formulas-and-references~Easy~4"},{"id":"~x-formulas-and-references~Easy~5"}],"Hard":[{"id":"~x-formulas-and-references~Hard~0"},{"id":"~x-formulas-and-references~Hard~1"},{"id":"~x-formulas-and-references~Hard~2"},{"id":"~x-formulas-and-references~Hard~3"},{"id":"~x-formulas-and-references~Hard~4"},{"id":"~x-formulas-and-references~Hard~5"},{"id":"~x-formulas-and-references~Hard~6"},{"id":"~x-formulas-and-references~Hard~7"},{"id":"~x-formulas-and-references~Hard~8"},{"id":"~x-formulas-and-references~Hard~9"},{"id":"~x-formulas-and-references~Hard~10"},{"id":"~x-formulas-and-references~Hard~11"}],"Very Hard":[{"id":"~x-formulas-and-references~Very Hard~0"},{"id":"~x-formulas-and-references~Very Hard~1"},{"id":"~x-formulas-and-references~Very Hard~2"},{"id":"~x-formulas-and-references~Very Hard~3"},{"id":"~x-formulas-and-references~Very Hard~4"},{"id":"~x-formulas-and-references~Very Hard~5"},{"id":"~x-formulas-and-references~Very Hard~6"},{"id":"~x-formulas-and-references~Very Hard~7"},{"id":"~x-formulas-and-references~Very Hard~8"},{"id":"~x-formulas-and-references~Very Hard~9"}]}},"practice":{"x-workbook-basics":{"Easy":[{"task":"Select the cell in column C,row 2.","answer":"C2","reason":"Read the column letter first, then the row number."},{"task":"Select A1:B3 and count its cells.","answer":"6 cells","reason":"There are 2 columns and 3 rows."},{"task":"Put a Quantity heading in the second column of row 1.","answer":"Enter Quantity in B1.","reason":"The second column isB."},{"task":"Create a sheet for notes without replacing Purchases.","answer":"Add a worksheet and rename it Notes.","reason":"A workbook can contain multiple worksheets."},{"task":"Save a working copy with two sheets.","answer":"Save as .xlsx and reopen it.","reason":"Verify both tabs rather than trusting the name alone."}],"Hard":[{"task":"Your supplier list has headers plus 5 records across 4 columns. Select it.","answer":"A1:D6","reason":"Include the header row and every record."},{"task":"The wrong price was overwritten during a spelling correction. Recover safely.","answer":"Undo the wrong edit and select the item-name cell before correcting it.","reason":"Check the active cell and verify neighbouring data."},{"task":"Share plain data but keep your multi-sheet master.","answer":"Retain the .xlsx and export a separate CSV.","reason":"The exchange copy and working file serve different purposes."},{"task":"Create a weekly purchase record using the sample structure.","answer":"Use Item, Quantity and Unit cost as headers, with one purchase per row.","reason":"Keep each field consistent."},{"task":"Two workbook copies have similar names. Choose the handover copy.","answer":"Open the intended copy and compare its sheets and values with the source.","reason":"A similar name does not prove current content."}],"Very Hard":[{"task":"Explain why a screenshot is insufficient as the only reusable workbook.","answer":"It does not retain the editable workbook structure and cell contents as a workbook.","reason":"A picture is evidence of appearance, not a working spreadsheet file."},{"task":"An extra record is on row 7 under headers inrow 1 acrossA:C. Select the complete list.","answer":"A1:C7","reason":"The inclusive rectangle must reach the final row."},{"task":"A colleague says renaming a sheet also renames the saved file. Test the claim.","answer":"Check the tab name and workbook filename separately; they identify different objects.","reason":"Distinguish container from content."},{"task":"Design a handover check for a two-sheet purchase workbook.","answer":"Reopen the named .xlsx, verify both tabs and compare representative cell values.","reason":"Check a real saved artifact."},{"task":"An accidental edit occurred before three correct edits. Explain the risk of repeated Undo.","answer":"It may reverse the three later correct edits before reaching the mistake.","reason":"Undo follows editing history; inspect each reversal."}]}},"roadmap":["Workbook basics","Clean data and formatting","Formulas and references","Functions: SUM, AVERAGE, MIN, MAX and counting","Excel Tables, sorting and filtering","Logical decisions with IF and error handling","Lookups: XLOOKUP and compatible alternatives","Charts and clear reporting","PivotTables and summaries","Data validation and conditional formatting","Power Query and repeatable cleaning","A complete work project and review"]}}</script>

<script>
(function(){
 var ME={id:null};
 var RT=null;try{RT=new URLSearchParams(location.search).get('reset');}catch(e){}
 var ready=fetch('/api/me',{credentials:'same-origin'}).then(function(r){return r.json();}).catch(function(){return {id:null};}).then(function(m){ME=m||{id:null};if(RT)ME={id:null};});
 window.__boot=ready.then(function(){window.__content={};if(!ME.id||ME.mustChange)return;return fetch('/api/content',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(c){window.__content=c||{};}).catch(function(){});});
 function call(o){return fetch('/api/db',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-ss':'1'},body:JSON.stringify(o)}).then(function(r){return r.json().then(function(j){return {status:r.status,j:j};},function(){return {status:r.status,j:{}};});});}
 function snapDoc(p,r){return {id:p.split('/').pop(),exists:!!r.exists,data:function(){return r.data;}};}
 function fail(r){var e=new Error(r.j&&r.j.err||'error');e.code=(r.j&&r.j.err)||'error';return e;}
 function poll(fn,ms){var stop=false,t;function tick(){if(stop)return;if(document.visibilityState==='hidden'){t=setTimeout(tick,ms);return;}fn().then(function(){t=setTimeout(tick,ms);});}tick();return function(){stop=true;clearTimeout(t);};}
 function doc(p){return {
  get:function(){return call({t:'get',p:p}).then(function(r){if(r.status!==200)throw fail(r);return snapDoc(p,r.j);});},
  set:function(d){return call({t:'set',p:p,d:d}).then(function(r){if(r.status!==200)throw fail(r);});},
  update:function(d){return call({t:'update',p:p,d:d}).then(function(r){if(r.status!==200)throw fail(r);});},
  delete:function(){return call({t:'delete',p:p}).then(function(r){if(r.status!==200)throw fail(r);});},
  onSnapshot:function(next,err){var last=null;return poll(function(){return call({t:'get',p:p}).then(function(r){if(r.status!==200){if(err&&last!=='E'){last='E';err(fail(r));}return;}var s=JSON.stringify(r.j);if(s!==last){last=s;next(snapDoc(p,r.j));}});},3000);}};}
 function collection(p){return {onSnapshot:function(next,err){var last=null;return poll(function(){return call({t:'list',p:p}).then(function(r){if(r.status!==200){if(err&&last!=='E'){last='E';err(fail(r));}return;}var s=JSON.stringify(r.j);if(s!==last){last=s;next({docs:r.j.docs.map(function(d){return {id:d.id,data:function(){return d.data;}};})});}});},4000);}};}
 var db={doc:doc,collection:collection};
 var user={isOwner:function(){return Promise.resolve(!!ME.isOwner);},canEdit:function(){return Promise.resolve(!!ME.canEdit);},id:function(){return Promise.resolve(ME.id||null);},email:function(){return Promise.resolve(ME.email||'');},name:function(){return Promise.resolve(ME.name||'');},me:function(){return Promise.resolve(ME);}};
 window.claude={use:function(n){return ready.then(function(){if(!ME.id||ME.mustChange)return null;return n==='db'?db:n==='user'?user:null;});}};
 window.__webLogout=function(){try{localStorage.removeItem('ccna-out');}catch(e){}fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:{'x-ss':'1','Content-Type':'application/json'},body:'{}'}).then(function(){location.href=location.pathname;},function(){location.href=location.pathname;});};

 function api(path,body){return fetch('/api/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-ss':'1'},body:JSON.stringify(body||{})}).then(function(r){return r.json().then(function(j){j.__ok=r.ok;return j;},function(){return {__ok:false};});});}
 window.__api=api;
 window.__authBox=function(){
  var f=function(id,label,type,extra){return '<label for="'+id+'">'+label+'</label><input type="'+(type||'text')+'" id="'+id+'" name="'+id.split('-')[1]+'" '+(extra||'')+'>';};
  if(RT)return '<h2>Choose a new password</h2><form data-web-form="reset" novalidate>'+f('rs-password','New password (8+ characters)','password','autocomplete="new-password" required')+f('rs-confirm','Type it again','password','autocomplete="new-password" required')+'<button type="submit" class="cta">Save password <span aria-hidden="true">›</span></button></form><p id="web-err" class="auth-err" role="alert"></p>';
  if(ME&&ME.id&&ME.mustChange)return '<h2>Choose your own password</h2><p>You signed in with a one-time password. Pick a new password to continue.</p><form data-web-form="chg" novalidate>'+f('ch-password','New password (8+ characters)','password','autocomplete="new-password" required')+f('ch-confirm','Type it again','password','autocomplete="new-password" required')+'<button type="submit" class="cta">Save password <span aria-hidden="true">›</span></button></form><p id="web-err" class="auth-err" role="alert"></p>';
  return '<h2>Sign up or sign in</h2><div class="authtabs" role="group" aria-label="Sign up or sign in"><button type="button" class="pill-btn" data-web="tab" data-t="up" aria-pressed="true">Sign up</button><button type="button" class="pill-btn" data-web="tab" data-t="in" aria-pressed="false">Sign in</button></div>'

  if(A.free){var fa=root.firstChild,tb0=fa.querySelector('.topbar');if(tb0)tb0.insertAdjacentHTML('afterend','<div class="free-note" role="note">Free account: your first lesson is open. Other lessons need a payment, and the owner approves you once it is confirmed.</div>');}
  var fab=adminFab();if(fab)root.firstChild.insertAdjacentHTML('beforeend',fab);
  wireReplica();
  var sb=$('#rail-search');if(sb&&V.filterFocus){sb.focus();sb.setSelectionRange(sb.value.length,sb.value.length);}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  $$('details.acct[open]').forEach(function(d){if(!d.contains(e.target))d.open=false;});
  var a=e.target.closest('[data-link]');if(a){e.preventDefault();var dd=a.closest('details');if(dd)dd.open=false;location.hash=a.getAttribute('href');return;}
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),tid=el.getAttribute('data-tid');
  if(act==='step'||act==='notes')return;
  if(act==='go'){V.quiz=null;V.rail=false;var r=el.getAttribute('data-r');if(location.hash.slice(1)===r){route();}else location.hash=r;return;}
  if(act==='rail'){V.rail=!V.rail;render();return;}
  if(act==='layout'){S.layout=el.getAttribute('data-v');applyLook();save();render();return;}
  if(act==='signout'){doSignOut();return;}
  if(act==='signin-again'){A.out=false;try{localStorage.removeItem('ccna-out');}catch(x){}progressLoaded=false;if(A.mode==='ok'){loadProgress().then(function(){location.hash='home';route();});}else render();return;}
  if(act==='dark'){S.theme=effDark()?'light':'dark';applyLook();save();render();return;}
  if(act==='rainbow'){S.rainbow=!S.rainbow;applyLook();save();render();return;}
  if(act==='read'){if(S.read[tid])delete S.read[tid];else S.read[tid]=1;save();render();return;}
  if(act==='theme'){S.theme=el.getAttribute('data-v');applyLook();save();render();return;}
  if(act==='tab'){V.tab=el.getAttribute('data-tab');V.quiz=null;render();window.scrollTo({top:0});return;}
  if(act==='cp'){S.cp[tid]=+el.getAttribute('data-i');save();render();return;}
  if(act==='cp-reset'){delete S.cp[tid];save();render();return;}
  if(act==='reset-replica'){S.ed={};save();render();return;}
  if(act==='lab-done'){if(!labReady(tid))return;(S.labs[tid]||(S.labs[tid]={steps:{}})).done=true;save();render();toast('Lab marked complete');return;}
  if(act==='lab-undo'){S.labs[tid].done=false;save();render();return;}
  if(act==='start'){var df=el.getAttribute('data-diff');startQuiz(D.quiz[tid][df],{tid:tid,diff:df,mode:df==='Easy'?'easy':'test',label:TB[tid].title+' · '+df});return;}
  if(act==='pick'){V.quiz.ans[V.quiz.i]=+el.getAttribute('data-i');render();return;}
  if(act==='next'){var z=V.quiz;if(z.i>=z.list.length-1)finishQuiz();else{z.i++;render();}window.scrollTo({top:0});return;}
  if(act==='again'){var m=V.quiz.meta;if(m.tid)startQuiz(D.quiz[m.tid][m.diff],m);else V.quiz=null,render();return;}
  if(act==='quit'){V.quiz=null;render();return;}
  if(act==='practise'){var ids=Object.keys(S.mistakes).filter(function(id){return QIDX[id];}).slice(0,10);startQuiz(ids.map(function(id){return QIDX[id].q;}),{mode:'easy',label:'Mistake review'});return;}
  if(act==='clear-miss'){delete S.mistakes[el.getAttribute('data-id')];save();render();return;}
  if(act==='request'){doRequest();return;}
  if(A.isOwner){var id=el.getAttribute('data-id');
    if(act==='approve'){var sel=$('#dur-'+id),days=sel?+sel.value:30,r=A.requests.filter(function(x){return x.id===id;})[0]||{name:''};adminSet('approved/'+id,{name:r.name||'',at:new Date().toISOString(),role:($('#role-'+id)&&$('#role-'+id).value==='admin')?'admin':'learner',expiresAt:days?new Date(Date.now()+days*864e5).toISOString():null}).then(function(){return A.db.doc('requests/'+id).delete();}).then(function(){toast('Approved');}).catch(function(){toast('Could not approve. Try again.');});return;}
    if(act==='role'){A.db.doc('approved/'+id).update({role:el.getAttribute('data-role')==='admin'?'admin':'learner'}).then(function(){toast('Role changed');}).catch(function(){toast('Could not change role.');});return;}
    if(act==='clear-alert'){A.db.doc('alerts/'+id).delete().catch(function(){toast('Could not clear.');});return;}
    if(act==='reset-link'&&window.__api){window.__api('admin_reset_link',{id:id}).then(function(r){if(r.url){A.secret={title:'Reset link for '+r.name,text:r.url,note:'Works once and lasts 2 hours. Send it to them yourself.'};render();}else toast(r.error||'Could not make a link.');});return;}
    if(act==='otp'&&window.__api){window.__api('admin_otp',{id:id}).then(function(r){if(r.password){A.secret={title:'One-time password for '+r.name,text:r.password,note:'Shown only now. Lasts 48 hours. They must choose a new password when they sign in. Their old password stops working now.'};A.usersAt=0;render();}else toast(r.error||'Could not make a password.');});return;}
    if(act==='copy-secret'&&A.secret){try{navigator.clipboard.writeText(A.secret.text).then(function(){toast('Copied');},function(){toast('Select the text and copy it.');});}catch(x){toast('Select the text and copy it.');}return;}
    if(act==='clear-secret'){A.secret=null;render();return;}
    if(act==='deny'){A.db.doc('requests/'+id).update({status:'denied'}).catch(function(){toast('Could not save.');});return;}
    if(act==='revoke'){A.db.doc('approved/'+id).delete().then(function(){toast('Access revoked');}).catch(function(){toast('Could not revoke.');});return;}
    if(act==='remove-req'){A.db.doc('requests/'+id).delete();return;}
  }
});
document.addEventListener('change',function(e){var el=e.target;if(el.getAttribute&&el.getAttribute('data-act')==='step'){var tid=el.getAttribute('data-tid'),k=el.getAttribute('data-key');var L=(S.labs[tid]||(S.labs[tid]={steps:{}}));if(!L.steps)L.steps={};if(el.checked)L.steps[k]=1;else delete L.steps[k];save();var rail=$('.rail');if(rail)rail.innerHTML=railHtml();}});
document.addEventListener('input',function(e){var el=e.target;if(el.getAttribute&&el.getAttribute('data-act')==='notes'){S.notes[el.getAttribute('data-tid')]=el.value;save();}if(el.id==='rail-search'){V.filter=el.value;V.filterFocus=true;var rail=$('.rail');rail.innerHTML=railHtml();var sb=$('#rail-search');sb.focus();sb.setSelectionRange(sb.value.length,sb.value.length);}});
document.addEventListener('focusout',function(e){if(e.target.id==='rail-search')V.filterFocus=false;});
function doSignOut(){
  var done=function(){S=freshS();norm();A.out=true;progressLoaded=false;try{localStorage.removeItem('ccna-site-v1');localStorage.setItem('ccna-out','1');}catch(x){}if(window.__webLogout){window.__webLogout();return;}V.quiz=null;V.route='home';location.hash='';applyLook();render();window.scrollTo({top:0});};
  clearTimeout(dbTimer);
  if(A.db&&A.id&&progressLoaded){try{A.db.doc('data/users/'+A.id+'/progress').set({json:JSON.stringify(S),at:new Date().toISOString()}).then(done,done);return;}catch(e){}}
  done();
}
function adminSet(path,data){return A.db.doc(path).set(data);}
function route(){var h=location.hash.slice(1)||'home';V.route=h;V.quiz=null;V.rail=false;V.tab='lesson';if(h.indexOf('t-')===0&&TB[h.slice(2)]){var tt=TB[h.slice(2)],sb=subjOfTopic(tt);S.last=tt.id;S.subject=sb;S.lastBy[sb]=tt.id;save();}else if(h==='ccna'||h==='excel'){S.subject=h;save();}render();window.scrollTo({top:0});}
window.addEventListener('hashchange',route);

/* ---------- access ---------- */
function doRequest(){
  var name=($('#req-name').value||'').trim();if(!name){toast('Enter your name first.');return;}
  A.db.doc('requests/'+A.id).set({name:name,status:'pending',at:new Date().toISOString(),notifiedAt:null}).then(function(){A.name=name;}).catch(function(){toast('Could not send the request. Try again.');});
}
var watchedAdmin=function(){};
function evalAccess(){
  var prev=A.mode,wasFree=A.free;A.free=false;
  if(A.isOwner)A.mode='ok';
  else if(A.appDoc&&A.appDoc.exists){var d=A.appDoc.data()||{};A.mode=(d.expiresAt&&new Date(d.expiresAt).getTime()<Date.now())?'expired':'ok';var wasA=A.isAdmin;A.isAdmin=A.isOwner||A.canEdit||(A.mode==='ok'&&d.role==='admin');if(A.isAdmin&&!wasA)watchedAdmin();}
  else if(A.reqDoc&&A.reqDoc.exists){var s=(A.reqDoc.data()||{}).status;if(s==='denied'){A.mode='denied';}else{A.mode='ok';A.free=true;}}
  else A.mode='request';
  if(wasFree&&!A.free&&A.mode==='ok'&&window.__webLogout){location.reload();return;}
  if(A.mode==='ok'&&prev!=='ok'){loadProgress().then(function(){route();});}
  else if(prev!==A.mode||A.mode==='ok'){var ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'&&A.mode!=='ok'))render();}
}
function loadProgress(){
  if(!A.db||!A.id){progressLoaded=true;return Promise.resolve();}
  return A.db.doc('data/users/'+A.id+'/progress').get().then(function(s){if(s.exists){try{var d=JSON.parse(s.data().json);var lt=JSON.parse(LS.get('ccna-site-v1')||'{}');
      // merge: keep whichever has more quiz credits
      var mine=credits();var tmp=S;S=Object.assign({},S,d);var theirs=credits();if(theirs<mine){S=tmp;}}catch(e){}}
    norm();progressLoaded=true;applyLook();save();}).catch(function(){progressLoaded=true;});
}
function initAccess(){
  var tries=0;
  function go(){
    if(!window.claude||!window.claude.use){A.mode='ok';progressLoaded=true;route();return;} // preview or no runtime: open
    Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
      var user=r[0],db=r[1];
      if(!user||!db){A.mode='signin';render();return;}
      A.db=db;
      Promise.all([user.isOwner(),user.id(),user.canEdit()]).then(function(v){
        A.isOwner=!!v[0];A.id=v[1];A.canEdit=!!v[2];A.isAdmin=A.isOwner||A.canEdit;
        ['email','name','displayName'].reduce(function(pr,k){return pr.then(function(x){if(x)return x;try{return typeof user[k]==='function'?Promise.resolve(user[k]()).catch(function(){return '';}):'';}catch(e){return '';}});},Promise.resolve('')).then(function(x){if(x&&typeof x==='string'&&!A.email){A.email=x;if(A.mode==='ok'){var tb=$('.topbar');if(tb)tb.outerHTML=topbarHtml(V.route==='home'||V.route==='account');}}});
        if(!A.id){A.mode='signin';render();return;}
        function watchApproved(){db.collection('approved').onSnapshot(function(s){A.approved=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(V.route==='admin'&&A.mode==='ok')render();},function(){});}
        function watchOwnerData(){
          db.collection('requests').onSnapshot(function(s){A.requests=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(A.mode==='ok'){var rb=$('.topbar');if(rb)rb.outerHTML=topbarHtml(V.route==='home'||V.route==='account');if(V.route==='admin')render();}},function(){});
          db.collection('alerts').onSnapshot(function(s){A.alerts=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x;});if(V.route==='admin'&&A.mode==='ok')render();},function(){});
        }
        watchedAdmin=watchApproved;
        if(A.isAdmin){watchApproved();watchOwnerData();}
        if(A.isOwner){evalAccess();return;}
        db.doc('approved/'+A.id).onSnapshot(function(s){A.appDoc=s;evalAccess();},function(){A.mode='signin';render();});
        db.doc('requests/'+A.id).onSnapshot(function(s){A.reqDoc=s;evalAccess();},function(){});
      });
    }).catch(function(){A.mode='signin';render();});
  }
  go();
}
setInterval(function(){if(A.mode==='ok'&&!A.isOwner&&A.appDoc&&A.appDoc.exists){var d=A.appDoc.data()||{};if(d.expiresAt&&new Date(d.expiresAt).getTime()<Date.now()){evalAccess();}}},60000);
applyLook();render();initAccess();
};
window.__boot.then(function(){window.__startApp();});
