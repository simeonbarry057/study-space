 [".5.25 is local; .6.25 is remote and needs the default gateway. A gateway is not needed solely for communication inside the same subnet.", "Check host gateway, router routes/next hop, translation match/state, interface policy, upstream reachability, and the return path. Do not treat a NAT rule as proof of routing.", "Compare PC mask/subnet and default gateway with the actual LAN router configuration. Then check routing and policy based on results."], "c": 2, "h": "Review the worked example: Remote traffic goes to the wrong next hop while local peers may still work."}, {"id": "routers/Hard/4", "q": "Can a router connect two private LANs while its WAN cable is unplugged?", "o": ["Yes, if those LAN interfaces and routes work. Reaching the public internet additionally requires the provider/upstream path and supporting settings.", "Yes, it is in 192.168.8.0/24; it must actually be assigned to the intended router and reachable.", "Compare PC mask/subnet and default gateway with the actual LAN router configuration. Then check routing and policy based on results."], "c": 0, "h": "Review the worked example: Routing means forwarding between networks; it is not synonymous with internet service."}, {"id": "routers/Hard/5", "q": "ipconfig shows gateway 192.168.1.1; tracert shows it first, then an asterisk on a later hop while browsing succeeds.\nWhich explanation is supported by these facts?", "o": ["The /24 mask puts both local devices in 192.168.1.0/24.", "The router may use a different source address and bypass a host-facing policy.", "The first responding hop often identifies the local router."], "c": 2, "h": "Routers are not required to answer every diagnostic probe."}, {"id": "routers/Hard/6", "q": "A router LAN interface is down and its connected route is absent.\nWhich explanation is supported by these facts?", "o": ["A’s default route alone cannot give B a missing route.", "The first responding hop often identifies the local router.", "Connected routes depend on operational interface state and addressing."], "c": 2, "h": "Review the worked example: Connected routes depend on operational interface state and addressing."}, {"id": "routers/Hard/7", "q": "A → B → server requires B to know the server LAN.\nWhich explanation is supported by these facts?", "o": ["A’s default route alone cannot give B a missing route.", "Remote traffic goes to the wrong next hop while local peers may still work.", "The host delivers locally rather than asking the gateway to route the packet."], "c": 0, "h": "Review the worked example: A’s default route alone cannot give B a missing route."}, {"id": "routers/Hard/8", "q": "A PC’s configured gateway differs from the local router interface.\nWhich explanation is supported by these facts?", "o": ["Remote traffic goes to the wrong next hop while local peers may still work.", "The /24 mask puts both local devices in 192.168.1.0/24.", "The gateway is another reachable host address on its local subnet."], "c": 0, "h": "Review the worked example: Remote traffic goes to the wrong next hop while local peers may still work."}, {"id": "routers/Hard/9", "q": "Two lab LANs route successfully with no ISP connection.\nWhich explanation is supported by these facts?", "o": ["Diagnostic responses and forwarding behavior are separate observations.", "Routing means forwarding between networks; it is not synonymous with internet service.", "The default route handles destinations without a more specific match."], "c": 1, "h": "Review the worked example: Routing means forwarding between networks; it is not synonymous with internet service."}, {"id": "routers/Hard/10", "q": "During a lab handover, someone asks: Does a default gateway have to be the website’s address? Which explanation should you give?", "o": ["No. It is the local router address your device uses to reach other networks.", "No. Test the failure and verify that routing or switching uses a working alternative correctly.", "No. Two uses would make it ambiguous where the omitted zero groups belong."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "routers/Hard/11", "q": "You are explaining this topic to a colleague. Your destination is outside your subnet. Where does your device normally send the packet first?", "o": ["Directly to the destination using its remote MAC address.", "To a DNS server for forwarding.", "To its default gateway."], "c": 2, "h": "Correct. The local gateway is the next hop for destinations outside the subnet when a suitable more-specific route is absent."}], "Very Hard": [{"id": "routers/Very Hard/0", "q": "On paper, use LAN A 192.168.10.0/24, LAN B 192.168.20.0/24, transit A 10.0.0.1/30 and B 10.0.0.2/30. Supply reciprocal routes.", "o": ["The router cannot forward through a known route to that destination and normally drops the packet, potentially generating an unreachable message.", "Check every router on the request path and the reply path, not only the source gateway; validate next-hop reachability too.", "Yes, it is in 192.168.8.0/24; it must actually be assigned to the intended router and reachable.", "A: ip route 192.168.20.0 255.255.255.0 10.0.0.2. B: ip route 192.168.10.0 255.255.255.0 10.0.0.1. PCs use their own LAN router addresses as gateways. Interfaces and local routes must also be working."], "c": 3, "h": "Each next hop is the other router on the transit link."}, {"id": "routers/Very Hard/1", "q": "Audit a /30 transit .1/.2 where a remote route points to .6.", "o": ["A timeout does not by itself prove a broken route. If browsing works, some traffic reaches the service; record the missing probe response separately from application success.", "The router cannot forward through a known route to that destination and normally drops the packet, potentially generating an unreachable message.", "Check the correct LAN interface, address/mask, and up/up state. Repair the interface fault rather than adding a redundant route blindly.", "For a directly connected 10.0.0.0/30 transit, .6 is not the peer .2. Use the actual adjacent next hop unless another valid recursive route deliberately reaches .6."], "c": 3, "h": "Review the worked example: The router must resolve/reach its next hop through valid routing and link information."}, {"id": "routers/Very Hard/2", "q": "List the independent checks for a translated outbound connection.", "o": ["Source addressing, NAT, return routes, and interface ACLs can differ. Test from the actual PC and inspect both source-specific paths.", "Compare PC mask/subnet and default gateway with the actual LAN router configuration. Then check routing and policy based on results.", "Yes, if those LAN interfaces and routes work. Reaching the public internet additionally requires the provider/upstream path and supporting settings.", "Check host gateway, router routes/next hop, translation match/state, interface policy, upstream reachability, and the return path. Do not treat a NAT rule as proof of routing."], "c": 3, "h": "Review the worked example: Translation and routing solve different jobs; translation cannot supply a missing path."}, {"id": "routers/Very Hard/3", "q": "Why is router ping not a complete validation of a PC path?", "o": ["Yes, it is in 192.168.8.0/24; it must actually be assigned to the intended router and reachable.", "Compare PC mask/subnet and default gateway with the actual LAN router configuration. Then check routing and policy based on results.", "Source addressing, NAT, return routes, and interface ACLs can differ. Test from the actual PC and inspect both source-specific paths.", "Repeated failure of the intended application with known-good DNS/service, missing or incorrect routes, unreachable next hops, or interface evidence supports investigation. Asterisks alone do not establish the fault."], "c": 2, "h": "Review the worked example: The router may use a different source address and bypass a host-facing policy."}, {"id": "routers/Very Hard/4", "q": "What additional evidence supports a real routing fault rather than probe filtering?", "o": ["A physical access conversion role does not establish routing between IP networks. Integrated equipment can do both, but the roles remain distinct.", "Source addressing, NAT, return routes, and interface ACLs can differ. Test from the actual PC and inspect both source-specific paths.", "Repeated failure of the intended application with known-good DNS/service, missing or incorrect routes, unreachable next hops, or interface evidence supports investigation. Asterisks alone do not establish the fault.", "The router cannot forward through a known route to that destination and normally drops the packet, potentially generating an unreachable message."], "c": 2, "h": "Review the worked example: Diagnostic responses and forwarding behavior are separate observations."}, {"id": "routers/Very Hard/5", "q": "Router A reaches LAN B, but PC replies fail because Router B has no route to LAN A.\nWhich explanation is supported by these facts?", "o": ["The outward packet and return packet each require routing decisions.", "A’s default route alone cannot give B a missing route.", "The router must resolve/reach its next hop through valid routing and link information.", "The first responding hop often identifies the local router."], "c": 0, "h": "Each next hop is the other router on the transit link."}, {"id": "routers/Very Hard/6", "q": "A static route points at a neighbor address outside the connected transit subnet.\nWhich explanation is supported by these facts?", "o": ["A’s default route alone cannot give B a missing route.", "The router must resolve/reach its next hop through valid routing and link information.", "The gateway is another reachable host address on its local subnet.", "The outward packet and return packet each require routing decisions."], "c": 1, "h": "Review the worked example: The router must resolve/reach its next hop through valid routing and link information."}, {"id": "routers/Very Hard/7", "q": "Private hosts fail remotely despite a translation rule.\nWhich explanation is supported by these facts?", "o": ["The ONT handles the optical access link; routing is a separate function.", "Translation and routing solve different jobs; translation cannot supply a missing path.", "Diagnostic responses and forwarding behavior are separate observations.", "Routing means forwarding between networks; it is not synonymous with internet service."], "c": 1, "h": "Review the worked example: Translation and routing solve different jobs; translation cannot supply a missing path."}, {"id": "routers/Very Hard/8", "q": "A router-originated ping works, but traffic from its LAN host fails.\nWhich explanation is supported by these facts?", "o": ["The first responding hop often identifies the local router.", "The router may use a different source address and bypass a host-facing policy.", "The router must resolve/reach its next hop through valid routing and link information.", "The outward packet and return packet each require routing decisions."], "c": 1, "h": "Review the worked example: The router may use a different source address and bypass a host-facing policy."}, {"id": "routers/Very Hard/9", "q": "Several hops do not answer probes, but a service works.\nWhich explanation is supported by these facts?", "o": ["The ONT handles the optical access link; routing is a separate function.", "Translation and routing solve different jobs; translation cannot supply a missing path.", "The /24 mask puts both local devices in 192.168.1.0/24.", "Diagnostic responses and forwarding behavior are separate observations."], "c": 3, "h": "Review the worked example: Diagnostic responses and forwarding behavior are separate observations."}]}, "switches": {"Easy": [{"id": "switches/lesson-check/Easy/0", "q": "What does a switch primarily do?", "o": ["Forward Ethernet frames within a local network.", "Select IP routes between distant networks.", "Resolve service names to addresses."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "switches/lesson-check/Easy/1", "q": "What does a switch learn from an arriving frame?", "o": ["Source IP address and subnet mask.", "Source MAC address and arrival port.", "Destination MAC address and arrival port."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "switches/lesson-check/Easy/2", "q": "What happens to an unknown unicast in its VLAN?", "o": ["It is flooded through ports in every VLAN.", "Copies leave other appropriate forwarding ports.", "It is dropped until the destination sends ARP."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "switches/lesson-check/Easy/3", "q": "What observation demonstrates MAC learning?", "o": ["Sending traffic creates source-MAC-to-port entries.", "Assigning a PC address creates entries before traffic.", "Each destination MAC becomes an IP route."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "switches/lesson-check/Easy/4", "q": "Does the learned MAC come from sender or destination?", "o": ["The destination and the incoming port.", "The sender and the outgoing port.", "The sender and the incoming port."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "switches/lesson-check/Easy/5", "q": "Which statement respects switching boundaries?", "o": ["Known unicasts always flood every switch port.", "Known unicasts use a learned port within the VLAN.", "Unknown unicasts cross VLANs without routing."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "switches/Hard/0", "q": "Build the original two-PC Packet Tracer lab and inspect ARP/ICMP in Simulation mode.", "o": ["ARP discovers the destination’s local MAC. The switch learns each transmitting MAC on its incoming port, then forwards known unicast frames to that port. Initial ping attempts may wait for address resolution.", "To the learned eligible port 7, rather than flooding every VLAN port.", "After it sends, its MAC is learned on port 8 in that VLAN. A stale entry can exist briefly before new learning."], "c": 0, "h": "The host maps IP to MAC; the switch maps MAC to port."}, {"id": "switches/Hard/1", "q": "Predict forwarding when A sends to a silent unknown C in the same VLAN.", "o": ["Check VLAN existence, access membership, trunk state/allowed VLANs, STP state, and learned MACs on both sides. Same-subnet hosts do not require a gateway for this local VLAN test.", "To the learned eligible port 7, rather than flooding every VLAN port.", "Unknown unicast is flooded to eligible other ports in that VLAN. The switch learns A as source; C is learned when C transmits."], "c": 2, "h": "Review the worked example: B’s destination entry can still be unknown even though A is learned."}, {"id": "switches/Hard/2", "q": "Does an empty MAC entry alone prove the cable is broken?", "o": ["Check VLAN existence, access membership, trunk state/allowed VLANs, STP state, and learned MACs on both sides. Same-subnet hosts do not require a gateway for this local VLAN test.", "Check actual access VLAN membership and physical link state as well as IP/mask. Matching IP subnet alone is insufficient.", "No. Aging, inactivity, VLAN context, or table state can explain it; correlate with link state and traffic."], "c": 2, "h": "Review the worked example: The next frame to that destination may be flooded until it is relearned."}, {"id": "switches/Hard/3", "q": "Two /24 PCs cannot ping on one switch. Which port setting should you compare?", "o": ["No. Aging, inactivity, VLAN context, or table state can explain it; correlate with link state and traffic.", "Check actual access VLAN membership and physical link state as well as IP/mask. Matching IP subnet alone is insufficient.", "Destination MAC plus the switch’s learned mapping in the relevant VLAN."], "c": 1, "h": "Review the worked example: Same-looking IP addresses do not bridge distinct VLANs."}, {"id": "switches/Hard/4", "q": "What table change should you expect after moving a lab PC to port 8?", "o": ["After it sends, its MAC is learned on port 8 in that VLAN. A stale entry can exist briefly before new learning.", "Check physical topology, STP roles, and whether a loop is forwarding. In an isolated saved lab, remove one suspected redundant link and compare stability; do not make that change on a live network. Stable relearning after a deliberate recable is different from continuing flapping.", "No. Aging, inactivity, VLAN context, or table state can explain it; correlate with link state and traffic."], "c": 0, "h": "Review the worked example: The source learning process updates the MAC location."}, {"id": "switches/Hard/5", "q": "PCs .10 and .11 in 192.168.10.0/24 share a switch. Before pinging, a PC needs its peer’s MAC address.\nWhich explanation is supported by these facts?", "o": ["A single move can be normal: the switch relearns a source on a new port.", "ARP requests use a broadcast on the local VLAN.", "The switch forwards that known unicast through port 4 within the VLAN."], "c": 1, "h": "The host maps IP to MAC; the switch maps MAC to port."}, {"id": "switches/Hard/6", "q": "A learns on port 1; B has not sent any frame yet.\nWhich explanation is supported by these facts?", "o": ["The next frame to that destination may be flooded until it is relearned.", "A single move can be normal: the switch relearns a source on a new port.", "B’s destination entry can still be unknown even though A is learned."], "c": 2, "h": "Review the worked example: B’s destination entry can still be unknown even though A is learned."}, {"id": "switches/Hard/7", "q": "A MAC entry ages out after inactivity.\nWhich explanation is supported by these facts?", "o": ["B’s destination entry can still be unknown even though A is learned.", "The next frame to that destination may be flooded until it is relearned.", "It is flooded to other eligible VLAN 10 ports, not automatically VLAN 20."], "c": 1, "h": "Review the worked example: The next frame to that destination may be flooded until it is relearned."}, {"id": "switches/Hard/8", "q": "PC A is in VLAN 10 and PC B is in VLAN 20 despite similar IP addresses.\nWhich explanation is supported by these facts?", "o": ["It is flooded to other eligible VLAN 10 ports, not automatically VLAN 20.", "Its basic forwarding decision uses MAC addresses, not a remote IP route.", "Same-looking IP addresses do not bridge distinct VLANs."], "c": 2, "h": "Review the worked example: Same-looking IP addresses do not bridge distinct VLANs."}, {"id": "switches/Hard/9", "q": "A PC moves from port 2 to port 5 and transmits.\nWhich explanation is supported by these facts?", "o": ["The switch learns A’s source MAC on port 1.", "The source learning process updates the MAC location.", "A loop can cause repeated frame copies and unstable learning."], "c": 1, "h": "Review the worked example: The source learning process updates the MAC location."}, {"id": "switches/Hard/10", "q": "During a lab handover, someone asks: Does a switch learn a MAC address from the sender or the destination of an arriving frame? Which explanation should you give?", "o": ["From the sender: the source MAC address and the port where the frame arrived.", "No. Two uses would make it ambiguous where the omitted zero groups belong.", "The /24. Its longer prefix identifies a smaller destination range."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "switches/Hard/11", "q": "You are explaining this topic to a colleague. Which address does a switch use to learn an arriving frame’s location?", "o": ["Source MAC address.", "Destination IP address.", "Destination MAC address."], "c": 0, "h": "Correct. The switch associates the source MAC with the incoming port and VLAN."}], "Very Hard": [{"id": "switches/Very Hard/0", "q": "Write an investigation for repeated MAC movement on a two-switch lab.", "o": ["Unknown unicast is flooded to eligible other ports in that VLAN. The switch learns A as source; C is learned when C transmits.", "Check actual access VLAN membership and physical link state as well as IP/mask. Matching IP subnet alone is insufficient.", "ARP discovers the destination’s local MAC. The switch learns each transmitting MAC on its incoming port, then forwards known unicast frames to that port. Initial ping attempts may wait for address resolution.", "Check physical topology, STP roles, and whether a loop is forwarding. In an isolated saved lab, remove one suspected redundant link and compare stability; do not make that change on a live network. Stable relearning after a deliberate recable is different from continuing flapping."], "c": 3, "h": "Look for repeated learning through multiple paths."}, {"id": "switches/Very Hard/1", "q": "Which two observations help distinguish a loop from one normal MAC move?", "o": ["Repeated MAC flapping across paths plus topology/STP evidence supports a loop investigation. A single recable-and-relearn event can be normal.", "Record VLAN, MAC, affected ports, timestamps/frequency, recabling events, and STP/topology. One deliberate move can be normal; rapid alternating learning may indicate a loop or other topology issue.", "Destination MAC plus the switch’s learned mapping in the relevant VLAN.", "The IP routing table chooses a routed next hop; the link-layer table supports local frame delivery."], "c": 0, "h": "Review the worked example: A loop can cause repeated frame copies and unstable learning."}, {"id": "switches/Very Hard/2", "q": "List switch evidence to inspect before changing host gateways.", "o": ["Unknown unicast is flooded to eligible other ports in that VLAN. The switch learns A as source; C is learned when C transmits.", "Check VLAN existence, access membership, trunk state/allowed VLANs, STP state, and learned MACs on both sides. Same-subnet hosts do not require a gateway for this local VLAN test.", "No. The VLANs are distinct broadcast domains; inter-VLAN routing is a different operation.", "Destination MAC plus the switch’s learned mapping in the relevant VLAN."], "c": 1, "h": "Review the worked example: The inter-switch VLAN path is suspect while local access is demonstrated."}, {"id": "switches/Very Hard/3", "q": "Why does flooding not let a VLAN 30 host automatically reach a VLAN 40 server?", "o": ["To the learned eligible port 7, rather than flooding every VLAN port.", "Check VLAN existence, access membership, trunk state/allowed VLANs, STP state, and learned MACs on both sides. Same-subnet hosts do not require a gateway for this local VLAN test.", "The server is across a Layer 3 boundary. A working router/gateway path and policy are required; VLAN-local flooding does not cross it.", "No. Aging, inactivity, VLAN context, or table state can explain it; correlate with link state and traffic."], "c": 2, "h": "Review the worked example: Flooding stays within the eligible VLAN topology and does not discover remote IP routes."}, {"id": "switches/Very Hard/4", "q": "Write a note that preserves normal movement and loop hypotheses.", "o": ["Record VLAN, MAC, affected ports, timestamps/frequency, recabling events, and STP/topology. One deliberate move can be normal; rapid alternating learning may indicate a loop or other topology issue.", "After it sends, its MAC is learned on port 8 in that VLAN. A stale entry can exist briefly before new learning.", "Repeated MAC flapping across paths plus topology/STP evidence supports a loop investigation. A single recable-and-relearn event can be normal.", "Destination MAC plus the switch’s learned mapping in the relevant VLAN."], "c": 0, "h": "Review the worked example: The observation needs timing and topology context before a diagnosis."}, {"id": "switches/Very Hard/5", "q": "A MAC moves once after a PC is recabled. Another MAC rapidly alternates ports while the LAN is unstable.\nWhich explanation is supported by these facts?", "o": ["A single move can be normal: the switch relearns a source on a new port.", "The switch forwards that known unicast through port 4 within the VLAN.", "The inter-switch VLAN path is suspect while local access is demonstrated.", "The switch learns A’s source MAC on port 1."], "c": 0, "h": "Look for repeated learning through multiple paths."}, {"id": "switches/Very Hard/6", "q": "Unknown frames circulate on redundant unprotected links.\nWhich explanation is supported by these facts?", "o": ["A loop can cause repeated frame copies and unstable learning.", "A single move can be normal: the switch relearns a source on a new port.", "Flooding stays within the eligible VLAN topology and does not discover remote IP routes.", "B’s destination entry can still be unknown even though A is learned."], "c": 0, "h": "Review the worked example: A loop can cause repeated frame copies and unstable learning."}, {"id": "switches/Very Hard/7", "q": "Local VLAN 10 hosts work, remote-switch VLAN 10 hosts fail.\nWhich explanation is supported by these facts?", "o": ["Its basic forwarding decision uses MAC addresses, not a remote IP route.", "ARP requests use a broadcast on the local VLAN.", "The inter-switch VLAN path is suspect while local access is demonstrated.", "Flooding stays within the eligible VLAN topology and does not discover remote IP routes."], "c": 2, "h": "Review the worked example: The inter-switch VLAN path is suspect while local access is demonstrated."}, {"id": "switches/Very Hard/8", "q": "An unknown frame is flooded inside VLAN 30.\nWhich explanation is supported by these facts?", "o": ["ARP requests use a broadcast on the local VLAN.", "Flooding stays within the eligible VLAN topology and does not discover remote IP routes.", "A loop can cause repeated frame copies and unstable learning.", "Its basic forwarding decision uses MAC addresses, not a remote IP route."], "c": 1, "h": "Review the worked example: Flooding stays within the eligible VLAN topology and does not discover remote IP routes."}, {"id": "switches/Very Hard/9", "q": "The same MAC appears on several ports over time.\nWhich explanation is supported by these facts?", "o": ["The inter-switch VLAN path is suspect while local access is demonstrated.", "Same-looking IP addresses do not bridge distinct VLANs.", "It is flooded to other eligible VLAN 10 ports, not automatically VLAN 20.", "The observation needs timing and topology context before a diagnosis."], "c": 3, "h": "Review the worked example: The observation needs timing and topology context before a diagnosis."}]}, "clients-servers": {"Easy": [{"id": "clients-servers/lesson-check/Easy/0", "q": "What makes software a client?", "o": ["It requests a service.", "It assigns network leases to all devices.", "It responds to other devices’ service requests."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "clients-servers/lesson-check/Easy/1", "q": "Which service pairing is correct?", "o": ["Web software supplies gateways; DHCP serves pages.", "DHCP supplies settings; DNS resolves names.", "DNS supplies leases; DHCP resolves names."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "clients-servers/lesson-check/Easy/2", "q": "What does a transport port help identify?", "o": ["An application service on the device.", "A physical switch socket at every hop.", "The device’s subnet boundary."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "clients-servers/lesson-check/Easy/3", "q": "The web service stops but ping works. What follows?", "o": ["HTTP works because ICMP responded.", "The host responds while its web service is unavailable.", "The host has lost its IP despite the ping reply."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "clients-servers/lesson-check/Easy/4", "q": "Does ping prove a website works?", "o": ["Yes; ping directly tests HTTP.", "Yes; an IP address guarantees all services are running.", "No; test the web service separately."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "clients-servers/lesson-check/Easy/5", "q": "Can one computer be client and server?", "o": ["Yes; software can request and provide services.", "Only if all services use one port.", "No; hardware fixes just one role permanently."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "clients-servers/Hard/0", "q": "Build PC .10 and Server .20 on 192.168.20.0/24; compare HTTP on and off.", "o": ["Confirm the intended DNS answer, verify server reachability, test the actual HTTP service, and retest by name. Record any remaining service fault separately.", "With HTTP enabled the page should load. With it disabled, ping can still succeed while browsing fails. The network and application results must be recorded separately.", "The server may have only HTTP enabled. HTTPS requires its own service/TLS configuration and permitted path."], "c": 1, "h": "Test the service you actually need."}, {"id": "clients-servers/Hard/1", "q": "Why can http://192.168.20.20 work while https://192.168.20.20 fails?", "o": ["The browser is the client, 192.168.20.20 hosts the web service, and HTTP commonly uses TCP 80. Client and server are roles, not fixed categories of hardware.", "The server may have only HTTP enabled. HTTPS requires its own service/TLS configuration and permitted path.", "With HTTP enabled the page should load. With it disabled, ping can still succeed while browsing fails. The network and application results must be recorded separately."], "c": 1, "h": "Review the worked example: An https URL requests a different service than the configured http service."}, {"id": "clients-servers/Hard/2", "q": "Which two values should you compare after a successful lookup?", "o": ["The server may have only HTTP enabled. HTTPS requires its own service/TLS configuration and permitted path.", "Verify gateway/routing to DNS, the name’s record, routing/policy to the returned server, and the web service. DHCP success is only one step.", "Compare the returned address with the intended current server address. A successful query alone does not prove the record is correct."], "c": 2, "h": "Review the worked example: DNS can respond successfully yet return an inappropriate address."}, {"id": "clients-servers/Hard/3", "q": "Name a repair and a retest for a disabled Packet Tracer HTTP service.", "o": ["DNS, using the configured resolver and relevant records; HTTP/HTTPS then requests the page.", "Verify gateway/routing to DNS, the name’s record, routing/policy to the returned server, and the web service. DHCP success is only one step.", "Enable HTTP in the lab Server Services, then request the actual page. Retain separate ping and browser observations."], "c": 2, "h": "Review the worked example: IP reachability and service availability are separate checks."}, {"id": "clients-servers/Hard/4", "q": "All other clients open the page. What should you compare on the failing client?", "o": ["Check exact URL/protocol, name resolution, proxy/browser errors, and local network settings before changing the server.", "Enable HTTP in the lab Server Services, then request the actual page. Retain separate ping and browser observations.", "Verify gateway/routing to DNS, the name’s record, routing/policy to the returned server, and the web service. DHCP success is only one step."], "c": 0, "h": "Review the worked example: A client-specific error can mimic a server outage."}, {"id": "clients-servers/Hard/5", "q": "A Packet Tracer server answers ping, but its HTTP service is disabled.\nWhich explanation is supported by these facts?", "o": ["Ping tests ICMP reachability, not the HTTP application.", "Chrome is the client, the page-hosting service is the server.", "A client-specific error can mimic a server outage."], "c": 0, "h": "Test the service you actually need."}, {"id": "clients-servers/Hard/6", "q": "A lab server runs HTTP but no HTTPS service.\nWhich explanation is supported by these facts?", "o": ["A destination port helps identify the requested service.", "Chrome is the client, the page-hosting service is the server.", "An https URL requests a different service than the configured http service."], "c": 2, "h": "Review the worked example: An https URL requests a different service than the configured http service."}, {"id": "clients-servers/Hard/7", "q": "A name resolves to an old lab server address.\nWhich explanation is supported by these facts?", "o": ["A client-specific error can mimic a server outage.", "DNS can respond successfully yet return an inappropriate address.", "Chrome is the client, the page-hosting service is the server."], "c": 1, "h": "Review the worked example: DNS can respond successfully yet return an inappropriate address."}, {"id": "clients-servers/Hard/8", "q": "The server is reachable but its web listener is disabled.\nWhich explanation is supported by these facts?", "o": ["A destination port helps identify the requested service.", "IP reachability and service availability are separate checks.", "Ping tests ICMP reachability, not the HTTP application."], "c": 1, "h": "Review the worked example: IP reachability and service availability are separate checks."}, {"id": "clients-servers/Hard/9", "q": "Only one browser points to an incorrect lab URL.\nWhich explanation is supported by these facts?", "o": ["A client-specific error can mimic a server outage.", "An https URL requests a different service than the configured http service.", "Ping tests ICMP reachability, not the HTTP application."], "c": 0, "h": "Review the worked example: A client-specific error can mimic a server outage."}, {"id": "clients-servers/Hard/10", "q": "During a lab handover, someone asks: If a server answers a ping, does that prove its website works? Which explanation should you give?", "o": ["No. Ping tests an ICMP response. The web service and its connection need their own test.", "No. A service rule can limit the protocol and port, rather than allow every connection.", "To prove the script reports a known mistake, rather than only demonstrating that valid input works."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "clients-servers/Hard/11", "q": "You are explaining this topic to a colleague. A server answers ping. What does that prove about its website?", "o": ["DNS is definitely configured correctly.", "An ICMP response works; the web service still needs testing.", "The website must work."], "c": 1, "h": "Correct. Test the actual web service as well as basic reachability."}], "Very Hard": [{"id": "clients-servers/Very Hard/0", "q": "Write a test sequence for a named lab website, showing two different failure cases.", "o": ["Case one: investigate a missing/wrong DNS record or client DNS setting. Case two: investigate service state, path, or policy even when DNS answers correctly. Neither result alone identifies the exact fault.", "Confirm the intended DNS answer, verify server reachability, test the actual HTTP service, and retest by name. Record any remaining service fault separately.", "Inspect listener/service state, a service-specific test, and relevant rule counters/logs. Keep DNS and routing evidence alongside them.", "The browser is the client, 192.168.20.20 hosts the web service, and HTTP commonly uses TCP 80. Client and server are roles, not fixed categories of hardware."], "c": 0, "h": "Keep name resolution and application connectivity as separate tests."}, {"id": "clients-servers/Very Hard/1", "q": "Trace the checks for a named page after the client gets a valid lease.", "o": ["Case one: investigate a missing/wrong DNS record or client DNS setting. Case two: investigate service state, path, or policy even when DNS answers correctly. Neither result alone identifies the exact fault.", "Compare the returned address with the intended current server address. A successful query alone does not prove the record is correct.", "The browser is the client, 192.168.20.20 hosts the web service, and HTTP commonly uses TCP 80. Client and server are roles, not fixed categories of hardware.", "Verify gateway/routing to DNS, the name’s record, routing/policy to the returned server, and the web service. DHCP success is only one step."], "c": 3, "h": "Review the worked example: Address assignment succeeded, but a downstream dependency fails."}, {"id": "clients-servers/Very Hard/2", "q": "What evidence distinguishes a web-service failure from a policy block?", "o": ["No. DHCP configures client network settings; a web service responds to browser requests.", "SSH and HTTP/HTTPS are separate services. Verify the intended web listener and its protocol rather than inferring it from another open port.", "Yes. The roles describe the particular service interaction, not a permanent hardware identity.", "Inspect listener/service state, a service-specific test, and relevant rule counters/logs. Keep DNS and routing evidence alongside them."], "c": 3, "h": "Review the worked example: ICMP reachability cannot prove a permitted HTTPS session."}, {"id": "clients-servers/Very Hard/3", "q": "Why does an open SSH port not establish that a website can be opened?", "o": ["Confirm the intended DNS answer, verify server reachability, test the actual HTTP service, and retest by name. Record any remaining service fault separately.", "Enable HTTP in the lab Server Services, then request the actual page. Retain separate ping and browser observations.", "SSH and HTTP/HTTPS are separate services. Verify the intended web listener and its protocol rather than inferring it from another open port.", "DNS, using the configured resolver and relevant records; HTTP/HTTPS then requests the page."], "c": 2, "h": "Review the worked example: An address alone does not tell which services are available."}, {"id": "clients-servers/Very Hard/4", "q": "Write a verification sequence after repairing a name record.", "o": ["Confirm the intended DNS answer, verify server reachability, test the actual HTTP service, and retest by name. Record any remaining service fault separately.", "The browser is the client, 192.168.20.20 hosts the web service, and HTTP commonly uses TCP 80. Client and server are roles, not fixed categories of hardware.", "Enable HTTP in the lab Server Services, then request the actual page. Retain separate ping and browser observations.", "Case one: investigate a missing/wrong DNS record or client DNS setting. Case two: investigate service state, path, or policy even when DNS answers correctly. Neither result alone identifies the exact fault."], "c": 0, "h": "Review the worked example: Fixing one dependency does not automatically fix another."}, {"id": "clients-servers/Very Hard/5", "q": "A lab page opens by IP but not by name. Later, the name resolves correctly but the page still fails.\nWhich explanation is supported by these facts?", "o": ["IP success with name failure suggests investigating DNS first.", "ICMP reachability cannot prove a permitted HTTPS session.", "Fixing one dependency does not automatically fix another.", "DHCP can supply address, mask, gateway, and DNS settings."], "c": 0, "h": "Keep name resolution and application connectivity as separate tests."}, {"id": "clients-servers/Very Hard/6", "q": "A correct DHCP lease supplies an unreachable DNS server.\nWhich explanation is supported by these facts?", "o": ["DNS can respond successfully yet return an inappropriate address.", "A client-specific error can mimic a server outage.", "An address alone does not tell which services are available.", "Address assignment succeeded, but a downstream dependency fails."], "c": 3, "h": "Review the worked example: Address assignment succeeded, but a downstream dependency fails."}, {"id": "clients-servers/Very Hard/7", "q": "Ping passes but an ACL blocks TCP 443.\nWhich explanation is supported by these facts?", "o": ["ICMP reachability cannot prove a permitted HTTPS session.", "Ping tests ICMP reachability, not the HTTP application.", "Fixing one dependency does not automatically fix another.", "An https URL requests a different service than the configured http service."], "c": 0, "h": "Review the worked example: ICMP reachability cannot prove a permitted HTTPS session."}, {"id": "clients-servers/Very Hard/8", "q": "A host on port 22 is mistaken for a web server.\nWhich explanation is supported by these facts?", "o": ["A device can act as a client in one conversation and a server in another.", "A destination port helps identify the requested service.", "DHCP can supply address, mask, gateway, and DNS settings.", "An address alone does not tell which services are available."], "c": 3, "h": "Review the worked example: An address alone does not tell which services are available."}, {"id": "clients-servers/Very Hard/9", "q": "DNS is repaired but HTTP remains off.\nWhich explanation is supported by these facts?", "o": ["A device can act as a client in one conversation and a server in another.", "IP success with name failure suggests investigating DNS first.", "Fixing one dependency does not automatically fix another.", "An address alone does not tell which services are available."], "c": 2, "h": "Review the worked example: Fixing one dependency does not automatically fix another."}]}, "layers": {"Easy": [{"id": "layers/lesson-check/Easy/0", "q": "What is encapsulation?", "o": ["Removing all headers before transmission.", "Replacing application data with an address.", "Adding delivery information around application data."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "layers/lesson-check/Easy/1", "q": "How do IP and MAC roles differ?", "o": ["MAC identifies every routed destination; IP identifies the cable.", "Both perform the same job at every hop.", "IP reaches network destinations; MAC delivers on the current link."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "layers/lesson-check/Easy/2", "q": "Which transport/physical pairing is correct?", "o": ["The physical layer supplies ports; TCP supplies MAC addresses.", "TCP/UDP generates cable signals; physical links choose services.", "TCP/UDP carries application data; physical links carry signals."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "layers/lesson-check/Easy/3", "q": "How should you investigate the simulated request?", "o": ["Check only the cable because headers cannot cause faults.", "Application success alone proves every network setting.", "Check connection, addresses and application separately."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "layers/lesson-check/Easy/4", "q": "What carries an IP packet on Ethernet?", "o": ["A TCP segment containing an Ethernet frame.", "An Ethernet frame with local-link MAC addresses.", "A DNS record containing the whole packet."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "layers/lesson-check/Easy/5", "q": "What changes across a router’s Ethernet links?", "o": ["The router always replaces the server IP with its own IP.", "The outgoing link gets a new frame.", "The original MAC addresses persist through every routed hop."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "layers/Hard/0", "q": "Sketch PC, router, and remote server; label the first and second frames.", "o": ["First repair the lab link. Then verify address/gateway and IP reachability. If ping succeeds but the HTTP service is off, enable the service in the lab and retest; the second fault is application-related.", "First frame: PC MAC to gateway MAC. Outgoing frame: router outgoing MAC to the next local receiver MAC. The packet still targets the server IP, assuming no NAT.", "Ethernet frame → IP packet → TCP segment → HTTP message. Link delivery, routed addressing, transport, and application each serve a distinct job."], "c": 1, "h": "MAC addresses are for the current Ethernet link."}, {"id": "layers/Hard/1", "q": "Trace what happens to MAC addresses across two routers.", "o": ["No. It needs the local next-hop MAC; IP addresses identify network endpoints.", "Yes. UDP does not supply them, but the application can detect timeouts and retry.", "Each Ethernet hop uses its own sender/next-hop MAC pair. They are not end-to-end identifiers."], "c": 2, "h": "It removes the incoming link header and creates a header for the outgoing link."}, {"id": "layers/Hard/2", "q": "Can a UDP application implement its own retries?", "o": ["Check TCP/service reachability, policy, DNS when used, and the application response. ICMP is a different test.", "Yes. UDP does not supply them, but the application can detect timeouts and retry.", "The application layer; its messages use transport and lower layers for delivery."], "c": 1, "h": "UDP has no TCP-style connection handshake or transport retransmission."}, {"id": "layers/Hard/3", "q": "Why does seeing only repeated SYNs not prove a working web session?", "o": ["Yes. UDP does not supply them, but the application can detect timeouts and retry.", "No successful handshake is evidenced; routing, filtering, listener or return-path faults may prevent a reply.", "Ethernet frame → IP packet → TCP segment → HTTP message. Link delivery, routed addressing, transport, and application each serve a distinct job."], "c": 1, "h": "This establishes TCP state before ordinary application exchange."}, {"id": "layers/Hard/4", "q": "A gateway ping succeeds but HTTPS fails. Which checks remain?", "o": ["The application layer; its messages use transport and lower layers for delivery.", "Yes. UDP does not supply them, but the application can detect timeouts and retry.", "Check TCP/service reachability, policy, DNS when used, and the application response. ICMP is a different test."], "c": 2, "h": "Physical success does not establish network-layer correctness."}, {"id": "layers/Hard/5", "q": "A PC sends to a server in another subnet through its gateway.\nWhich explanation is supported by these facts?", "o": ["This establishes TCP state before ordinary application exchange.", "The first Ethernet destination is the gateway’s MAC, not the remote server’s MAC.", "Physical success does not establish network-layer correctness."], "c": 1, "h": "MAC addresses are for the current Ethernet link."}, {"id": "layers/Hard/6", "q": "R1 receives an Ethernet frame and forwards over another Ethernet link.\nWhich explanation is supported by these facts?", "o": ["It removes the incoming link header and creates a header for the outgoing link.", "Ethernet uses frames; IP uses packets.", "This establishes TCP state before ordinary application exchange."], "c": 0, "h": "It removes the incoming link header and creates a header for the outgoing link."}, {"id": "layers/Hard/7", "q": "DNS commonly sends a small UDP query.\nWhich explanation is supported by these facts?", "o": ["A reduced path MTU is a hypothesis, not proof from small packets.", "UDP has no TCP-style connection handshake or transport retransmission.", "The first Ethernet destination is the gateway’s MAC, not the remote server’s MAC."], "c": 1, "h": "UDP has no TCP-style connection handshake or transport retransmission."}, {"id": "layers/Hard/8", "q": "A client sends SYN, receives SYN-ACK, then sends ACK.\nWhich explanation is supported by these facts?", "o": ["This establishes TCP state before ordinary application exchange.", "It removes the incoming link header and creates a header for the outgoing link.", "UDP has no TCP-style connection handshake or transport retransmission."], "c": 0, "h": "This establishes TCP state before ordinary application exchange."}, {"id": "layers/Hard/9", "q": "A link is up but the IP gateway is wrong.\nWhich explanation is supported by these facts?", "o": ["TLS does not hide every outer network address or guarantee endpoint safety.", "It removes the incoming link header and creates a header for the outgoing link.", "Physical success does not establish network-layer correctness."], "c": 2, "h": "Physical success does not establish network-layer correctness."}, {"id": "layers/Hard/10", "q": "During a lab handover, someone asks: On an Ethernet link, what carries the IP packet? Which explanation should you give?", "o": ["An Ethernet frame. Its MAC addresses help deliver it across that local link.", "No. It carries VLAN traffic. A routing function is needed to communicate between their networks.", "From the sender: the source MAC address and the port where the frame arrived."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "layers/Hard/11", "q": "You are explaining this topic to a colleague. On an Ethernet link, what carries an IP packet?", "o": ["A DNS name.", "A subnet mask.", "An Ethernet frame."], "c": 2, "h": "Correct. Ethernet wraps the packet in a frame for that local link."}], "Very Hard": [{"id": "layers/Very Hard/0", "q": "Create a layered investigation for a page failure with link down, then link up but HTTP disabled.", "o": ["First frame: PC MAC to gateway MAC. Outgoing frame: router outgoing MAC to the next local receiver MAC. The packet still targets the server IP, assuming no NAT.", "First repair the lab link. Then verify address/gateway and IP reachability. If ping succeeds but the HTTP service is off, enable the service in the lab and retest; the second fault is application-related.", "The application layer; its messages use transport and lower layers for delivery.", "Check TCP/service reachability, policy, DNS when used, and the application response. ICMP is a different test."], "c": 1, "h": "A successful repair at one layer does not prove all layers work."}, {"id": "layers/Very Hard/1", "q": "Does HTTPS stop an observer seeing the destination IP?", "o": ["First repair the lab link. Then verify address/gateway and IP reachability. If ping succeeds but the HTTP service is off, enable the service in the lab and retest; the second fault is application-related.", "The failing function is above a working physical/link path; inspect TLS negotiation, certificates, time and application settings using evidence.", "Normally no: outer IP headers still route the traffic. Encryption scope and metadata visibility differ.", "First frame: PC MAC to gateway MAC. Outgoing frame: router outgoing MAC to the next local receiver MAC. The packet still targets the server IP, assuming no NAT."], "c": 2, "h": "TLS does not hide every outer network address or guarantee endpoint safety."}, {"id": "layers/Very Hard/2", "q": "Audit the claim that source IP never changes between hosts.", "o": ["The failing function is above a working physical/link path; inspect TLS negotiation, certificates, time and application settings using evidence.", "It is too absolute. NAT can rewrite addresses and ports; ordinary forwarding also decrements TTL.", "No. It needs the local next-hop MAC; IP addresses identify network endpoints.", "Names resolve and small packets pass; size-dependent failures and relevant ICMP messages or controlled MTU tests support the hypothesis."], "c": 1, "h": "IP endpoints can change under NAT even though ordinary routing keeps them."}, {"id": "layers/Very Hard/3", "q": "What evidence would support a path-MTU issue rather than DNS failure?", "o": ["The failing function is above a working physical/link path; inspect TLS negotiation, certificates, time and application settings using evidence.", "First repair the lab link. Then verify address/gateway and IP reachability. If ping succeeds but the HTTP service is off, enable the service in the lab and retest; the second fault is application-related.", "Names resolve and small packets pass; size-dependent failures and relevant ICMP messages or controlled MTU tests support the hypothesis.", "Check TCP/service reachability, policy, DNS when used, and the application response. ICMP is a different test."], "c": 2, "h": "A reduced path MTU is a hypothesis, not proof from small packets."}, {"id": "layers/Very Hard/4", "q": "Explain why a TLS problem cannot be fixed merely by replacing an Ethernet cable that passes tests.", "o": ["The failing function is above a working physical/link path; inspect TLS negotiation, certificates, time and application settings using evidence.", "An IP packet carries the segment, and an Ethernet frame carries that packet.", "The application layer; its messages use transport and lower layers for delivery.", "No successful handshake is evidenced; routing, filtering, listener or return-path faults may prevent a reply."], "c": 0, "h": "Layer names are conceptual mappings, not identical seven-stage hardware."}, {"id": "layers/Very Hard/5", "q": "A lab cable is unplugged; DNS and HTTP tests both fail.\nWhich explanation is supported by these facts?", "o": ["HTTP is application content.", "Layer 1 loss prevents the dependent higher layers from communicating.", "Physical success does not establish network-layer correctness.", "TLS does not hide every outer network address or guarantee endpoint safety."], "c": 1, "h": "A successful repair at one layer does not prove all layers work."}, {"id": "layers/Very Hard/6", "q": "HTTPS protects HTTP data with TLS.\nWhich explanation is supported by these facts?", "o": ["Layer 1 loss prevents the dependent higher layers from communicating.", "TLS does not hide every outer network address or guarantee endpoint safety.", "A reduced path MTU is a hypothesis, not proof from small packets.", "HTTP is application content."], "c": 1, "h": "TLS does not hide every outer network address or guarantee endpoint safety."}, {"id": "layers/Very Hard/7", "q": "A gateway translates a private source IP.\nWhich explanation is supported by these facts?", "o": ["IP endpoints can change under NAT even though ordinary routing keeps them.", "A reduced path MTU is a hypothesis, not proof from small packets.", "Layer 1 loss prevents the dependent higher layers from communicating.", "This establishes TCP state before ordinary application exchange."], "c": 0, "h": "IP endpoints can change under NAT even though ordinary routing keeps them."}, {"id": "layers/Very Hard/8", "q": "Small pings pass; large transfers stall on a tunnel.\nWhich explanation is supported by these facts?", "o": ["Ethernet uses frames; IP uses packets.", "TLS does not hide every outer network address or guarantee endpoint safety.", "A reduced path MTU is a hypothesis, not proof from small packets.", "HTTP describes application messages, not cable signalling."], "c": 2, "h": "A reduced path MTU is a hypothesis, not proof from small packets."}, {"id": "layers/Very Hard/9", "q": "OSI separates session/presentation/application; TCP/IP commonly groups them.\nWhich explanation is supported by these facts?", "o": ["IP endpoints can change under NAT even though ordinary routing keeps them.", "Layer names are conceptual mappings, not identical seven-stage hardware.", "HTTP is application content.", "Physical success does not establish network-layer correctness."], "c": 1, "h": "Layer names are conceptual mappings, not identical seven-stage hardware."}]}, "addressing-basics": {"Easy": [{"id": "addressing-basics/lesson-check/Easy/0", "q": "Which settings identify the host and subnet boundary?", "o": ["IP address and mask or prefix.", "Gateway and application port.", "IP address and DNS name."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "addressing-basics/lesson-check/Easy/1", "q": "Which are ordinary hosts in 192.168.10.0/24?", "o": ["192.168.10.2 through 192.168.10.255.", "192.168.10.0 through 192.168.10.253.", "192.168.10.1 through 192.168.10.254."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "addressing-basics/lesson-check/Easy/2", "q": "How do gateway and DNS differ?", "o": ["Both provide identical next-hop information for local traffic.", "DNS forwards remote packets; gateway resolves names.", "Gateway reaches other networks; DNS resolves names."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "addressing-basics/lesson-check/Easy/3", "q": "Why move a lab PC to a different subnet?", "o": ["Prove any two addresses communicate directly on one cable.", "Automatically change the other PC’s mask.", "Observe the change in subnet membership and required path."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "addressing-basics/lesson-check/Easy/4", "q": "Does IP alone define the subnet boundary?", "o": ["No; a mask or prefix is needed.", "Yes; every IPv4 network is /24.", "Yes; the last octet is always the network identifier."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "addressing-basics/lesson-check/Easy/5", "q": "How does a host handle local and remote destinations?", "o": ["Use the gateway for every same-subnet destination.", "Local delivery or a reachable gateway for another subnet.", "Use DNS rather than the mask to decide locality."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "addressing-basics/Hard/0", "q": "Decide whether 192.168.10.60/26 and .70/26 are local peers.", "o": ["Its selected on-link next hop, usually the gateway, not the remote destination across routers.", ".60 is in .0/26; .70 is in .64/26. They are in different subnets and need routing despite sharing the first three octets.", ".150/27 is in .128/27, hosts .129–.158, broadcast .159. Gateway .129 and peer .158 are valid members; no correction is required. The task tests whether you can verify a good configuration rather than invent a fault."], "c": 1, "h": "The blocks start at 0, 64, 128, and 192."}, {"id": "addressing-basics/Hard/1", "q": "Can 192.168.3.1 normally be the directly reachable gateway for .2.50/24?", "o": ["Network 192.168.7.0, broadcast 192.168.7.255, hosts .1–.254; .1 is a possible gateway if actually configured on the router.", ".150/27 is in .128/27, hosts .129–.158, broadcast .159. Gateway .129 and peer .158 are valid members; no correction is required. The task tests whether you can verify a good configuration rather than invent a fault.", "No. It is outside the local subnet unless an unusual explicit on-link mechanism is deliberately configured."], "c": 2, "h": "That gateway is locally addressed and must be the actual router."}, {"id": "addressing-basics/Hard/2", "q": "For a remote destination, which address does a normal host ARP for?", "o": ["A considers B local. B belongs to .9.128/25 and considers A remote; B needs an appropriate gateway path.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers.", "The DNS server, returned record, intended server address and exact service/hostname request."], "c": 1, "h": "ARP resolves an on-link IPv4 address to a MAC."}, {"id": "addressing-basics/Hard/3", "q": "How would you investigate a reported duplicate .8.30?", "o": ["Compare assigned addresses, DHCP/static allocation and ARP/MAC evidence; correct one assignment in the lab and retest.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers.", "No. It is outside the local subnet unless an unusual explicit on-link mechanism is deliberately configured."], "c": 0, "h": "Conflicting ownership can make delivery intermittent."}, {"id": "addressing-basics/Hard/4", "q": "What should you compare before changing a working gateway?", "o": ["A considers B local. B belongs to .9.128/25 and considers A remote; B needs an appropriate gateway path.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers.", "The DNS server, returned record, intended server address and exact service/hostname request."], "c": 2, "h": "Name resolution or name-dependent application configuration is suspect."}, {"id": "addressing-basics/Hard/5", "q": "192.168.10.70/26 belongs to the block .64–.127.\nWhich explanation is supported by these facts?", "o": ["ARP resolves an on-link IPv4 address to a MAC.", "The network is .0 and broadcast is .255.", "A /26 has 64 total addresses."], "c": 2, "h": "The blocks start at 0, 64, 128, and 192."}, {"id": "addressing-basics/Hard/6", "q": "192.168.2.50/24 uses .2.1.\nWhich explanation is supported by these facts?", "o": ["The first 24 bits identify 192.168.4.0/24.", "A /26 has 64 total addresses.", "That gateway is locally addressed and must be the actual router."], "c": 2, "h": "That gateway is locally addressed and must be the actual router."}, {"id": "addressing-basics/Hard/7", "q": "A host sends ARP for its gateway IPv4 address.\nWhich explanation is supported by these facts?", "o": ["A simple routed link cannot distinguish identical destination prefixes by site intent.", "ARP resolves an on-link IPv4 address to a MAC.", "A /26 has 64 total addresses."], "c": 1, "h": "ARP resolves an on-link IPv4 address to a MAC."}, {"id": "addressing-basics/Hard/8", "q": "Two lab clients both use .8.20/24.\nWhich explanation is supported by these facts?", "o": ["The network is .0 and broadcast is .255.", "ARP resolves an on-link IPv4 address to a MAC.", "Conflicting ownership can make delivery intermittent."], "c": 2, "h": "Conflicting ownership can make delivery intermittent."}, {"id": "addressing-basics/Hard/9", "q": "A server IP works while its name fails.\nWhich explanation is supported by these facts?", "o": ["ARP resolves an on-link IPv4 address to a MAC.", "A /26 has 64 total addresses.", "Name resolution or name-dependent application configuration is suspect."], "c": 2, "h": "Name resolution or name-dependent application configuration is suspect."}, {"id": "addressing-basics/Hard/10", "q": "During a lab handover, someone asks: Does knowing a device’s IP address alone tell you its subnet boundary? Which explanation should you give?", "o": ["From the sender: the source MAC address and the port where the frame arrived.", "No. You also need its subnet mask or prefix length.", "Verify device state with the appropriate show command and a connection test. Typing the command alone is not proof."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "addressing-basics/Hard/11", "q": "You are explaining this topic to a colleague. Your device is 192.168.10.10/24. Which destination is in its own subnet?", "o": ["192.168.20.10", "192.168.10.20", "192.168.11.20"], "c": 1, "h": "Correct. Both are in 192.168.10.0/24."}], "Very Hard": [{"id": "addressing-basics/Very Hard/0", "q": "Audit host .150/27, gateway .129, and peer .158/27.", "o": ["255.255.0.0, leaving 16 host bits.", "Compare mask/gateway with the actual LAN, test on-link gateway reachability and inspect routes before blaming DNS.", "No. Confidentiality needs suitable encryption and security controls; private address selection alone does not provide it.", ".150/27 is in .128/27, hosts .129–.158, broadcast .159. Gateway .129 and peer .158 are valid members; no correction is required. The task tests whether you can verify a good configuration rather than invent a fault."], "c": 3, "h": "Determine the block before making changes."}, {"id": "addressing-basics/Very Hard/1", "q": "A is .9.10/24, B is .9.150/25. Explain their decisions.", "o": ["A considers B local. B belongs to .9.128/25 and considers A remote; B needs an appropriate gateway path.", "No. Their /24 network prefixes differ; a routed path is needed.", "Compare mask/gateway with the actual LAN, test on-link gateway reachability and inspect routes before blaming DNS.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers."], "c": 0, "h": "Different masks can produce asymmetric delivery decisions."}, {"id": "addressing-basics/Very Hard/2", "q": "Does 10.0.0.0/8 addressing make packet contents confidential?", "o": ["No. Confidentiality needs suitable encryption and security controls; private address selection alone does not provide it.", "Network 192.168.7.0, broadcast 192.168.7.255, hosts .1–.254; .1 is a possible gateway if actually configured on the router.", "Addresses are ambiguous across the combined network. Renumbering or a carefully designed translation/segmentation solution may be required.", "The DNS server, returned record, intended server address and exact service/hostname request."], "c": 0, "h": "An addressing range supplies no encryption or authentication."}, {"id": "addressing-basics/Very Hard/3", "q": "A client resolves names but cannot reach their IPs. Choose address-related checks.", "o": ["Compare assigned addresses, DHCP/static allocation and ARP/MAC evidence; correct one assignment in the lab and retest.", "Network 192.168.7.0, broadcast 192.168.7.255, hosts .1–.254; .1 is a possible gateway if actually configured on the router.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers.", "Compare mask/gateway with the actual LAN, test on-link gateway reachability and inspect routes before blaming DNS."], "c": 3, "h": "One correct field does not repair another dependency."}, {"id": "addressing-basics/Very Hard/4", "q": "Why should connecting overlapping home LANs be planned before routing?", "o": [".60 is in .0/26; .70 is in .64/26. They are in different subnets and need routing despite sharing the first three octets.", "Its selected on-link next hop, usually the gateway, not the remote destination across routers.", "Addresses are ambiguous across the combined network. Renumbering or a carefully designed translation/segmentation solution may be required.", "Compare assigned addresses, DHCP/static allocation and ARP/MAC evidence; correct one assignment in the lab and retest."], "c": 2, "h": "A simple routed link cannot distinguish identical destination prefixes by site intent."}, {"id": "addressing-basics/Very Hard/5", "q": "A host is 192.168.10.100/27 with gateway .65.\nWhich explanation is supported by these facts?", "o": ["A simple routed link cannot distinguish identical destination prefixes by site intent.", "/27 blocks contain 32 addresses.", "One correct field does not repair another dependency.", "Different masks can produce asymmetric delivery decisions."], "c": 1, "h": "Determine the block before making changes."}, {"id": "addressing-basics/Very Hard/6", "q": "Host A /24 believes B is local, while B /25 sees A remotely.\nWhich explanation is supported by these facts?", "o": ["An addressing range supplies no encryption or authentication.", "One correct field does not repair another dependency.", "The first 24 bits identify 192.168.4.0/24.", "Different masks can produce asymmetric delivery decisions."], "c": 3, "h": "Different masks can produce asymmetric delivery decisions."}, {"id": "addressing-basics/Very Hard/7", "q": "Private addresses appear on an internal LAN.\nWhich explanation is supported by these facts?", "o": ["A lease supplies configuration; it does not prove every service works.", "Private addressing is not globally unique on the public internet.", "An addressing range supplies no encryption or authentication.", "A simple routed link cannot distinguish identical destination prefixes by site intent."], "c": 2, "h": "An addressing range supplies no encryption or authentication."}, {"id": "addressing-basics/Very Hard/8", "q": "A lease provides a wrong gateway but valid DNS.\nWhich explanation is supported by these facts?", "o": ["A simple routed link cannot distinguish identical destination prefixes by site intent.", "One correct field does not repair another dependency.", "The network is .0 and broadcast is .255.", "An addressing range supplies no encryption or authentication."], "c": 1, "h": "One correct field does not repair another dependency."}, {"id": "addressing-basics/Very Hard/9", "q": "Two branches both use 192.168.1.0/24.\nWhich explanation is supported by these facts?", "o": ["A simple routed link cannot distinguish identical destination prefixes by site intent.", "The first 24 bits identify 192.168.4.0/24.", "Different masks can produce asymmetric delivery decisions.", "/27 blocks contain 32 addresses."], "c": 0, "h": "A simple routed link cannot distinguish identical destination prefixes by site intent."}]}, "firewalls-basics": {"Easy": [{"id": "firewalls-basics/lesson-check/Easy/0", "q": "What does a firewall do?", "o": ["Check traffic against permission rules.", "Select IP routes without checking permission.", "Assign leases to permitted connections."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "firewalls-basics/lesson-check/Easy/1", "q": "What details help interpret a rule?", "o": ["Source, destination, service, action and direction.", "Only server name and physical location.", "Only how many devices are connected."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "firewalls-basics/lesson-check/Easy/2", "q": "What makes a firewall stateful?", "o": ["It stores only destination networks and next hops.", "It tracks connections and can recognize replies.", "It translates every private address."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "firewalls-basics/lesson-check/Easy/3", "q": "What is the practice rule’s appropriate scope?", "o": ["Change live rules before recording the original settings.", "Allow every live service before documenting requirements.", "Inspect live settings; experiment with a specific service in the lab."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "firewalls-basics/lesson-check/Easy/4", "q": "Does a web-service permit allow all traffic to that server?", "o": ["Yes; direction matters only for denied traffic.", "Yes; any permit opens all server ports.", "No; protocol and port can limit it."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "firewalls-basics/lesson-check/Easy/5", "q": "How do routing and permission differ?", "o": ["A valid route permits every application.", "NAT alone supplies a complete traffic policy.", "Routing chooses a path; filtering decides permission."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "firewalls-basics/Hard/0", "q": "Compare an established HTTPS reply with a new inbound connection from an unknown host.", "o": ["The established reply can be permitted by state tracking. A new unsolicited session needs its own policy permission; it is not automatically accepted because outbound HTTPS is allowed.", "A reply can match existing permitted state; a new connection is evaluated as a new initiation.", "Verify the return route and where connection state is tracked, plus source/destination/service identity."], "c": 0, "h": "Being inbound does not mean every packet is a new inbound session."}, {"id": "firewalls-basics/Hard/1", "q": "How can a broad earlier permit defeat a later narrow deny?", "o": ["The established reply can be permitted by state tracking. A new unsolicited session needs its own policy permission; it is not automatically accepted because outbound HTTPS is allowed.", "The earlier permit may match first. Evaluate the specific platform rule order and counters.", "A reply can match existing permitted state; a new connection is evaluated as a new initiation."], "c": 1, "h": "Many ordered ACLs use the first matching rule."}, {"id": "firewalls-basics/Hard/2", "q": "What should accompany a firewall-log check for one-way traffic?", "o": ["Test authorized client/service pairs, denied sources/services, return behavior and relevant counters; document rollback.", "Verify the return route and where connection state is tracked, plus source/destination/service identity.", "Allow staff → web server TCP 443; allow management → administered devices TCP 22; deny other new traffic by default. Established replies follow state policy. Verify HTTPS works, management SSH works, and staff SSH is denied; document any required supporting services separately."], "c": 1, "h": "Routing and state placement can affect return traffic."}, {"id": "firewalls-basics/Hard/3", "q": "Does adding NAT guarantee a blocked application will work?", "o": ["No. Routes, policy and the service must also work; inspect pre/post-translation rule semantics.", "No. SSH and HTTPS use different destination ports; inspect the actual policy.", "The earlier permit may match first. Evaluate the specific platform rule order and counters."], "c": 0, "h": "Translation does not automatically authorize traffic."}, {"id": "firewalls-basics/Hard/4", "q": "Plan a test for denied SSH without opening every port.", "o": ["Test authorized client/service pairs, denied sources/services, return behavior and relevant counters; document rollback.", "Allow staff → web server TCP 443; allow management → administered devices TCP 22; deny other new traffic by default. Established replies follow state policy. Verify HTTPS works, management SSH works, and staff SSH is denied; document any required supporting services separately.", "Verify intended addresses and TCP 22 rule/counters, apply only the required lab permit, retest SSH and an intended denied service."], "c": 2, "h": "A focused change gives clearer evidence than disabling every control."}, {"id": "firewalls-basics/Hard/5", "q": "A stateful firewall permits an outbound HTTPS session and its established return traffic.\nWhich explanation is supported by these facts?", "o": ["It can allow matching return traffic through connection state.", "The initiating rule allows the intended session.", "Success must include intended denies as well as intended permits."], "c": 1, "h": "Being inbound does not mean every packet is a new inbound session."}, {"id": "firewalls-basics/Hard/6", "q": "A deny precedes a permit for the same packet.\nWhich explanation is supported by these facts?", "o": ["Translation does not automatically authorize traffic.", "The initiating rule allows the intended session.", "Many ordered ACLs use the first matching rule."], "c": 2, "h": "Many ordered ACLs use the first matching rule."}, {"id": "firewalls-basics/Hard/7", "q": "A server receives SYN but the reply uses another path.\nWhich explanation is supported by these facts?", "o": ["A rule applies to a defined direction and traffic selector.", "Translation does not automatically authorize traffic.", "Routing and state placement can affect return traffic."], "c": 2, "h": "Routing and state placement can affect return traffic."}, {"id": "firewalls-basics/Hard/8", "q": "A source is translated but a security rule denies it.\nWhich explanation is supported by these facts?", "o": ["Translation does not automatically authorize traffic.", "The initiating rule allows the intended session.", "443 is the server’s destination service port for common HTTPS traffic."], "c": 0, "h": "Translation does not automatically authorize traffic."}, {"id": "firewalls-basics/Hard/9", "q": "A lab rule is changed for one client/service.\nWhich explanation is supported by these facts?", "o": ["Many ordered ACLs use the first matching rule.", "The initiating rule allows the intended session.", "A focused change gives clearer evidence than disabling every control."], "c": 2, "h": "A focused change gives clearer evidence than disabling every control."}, {"id": "firewalls-basics/Hard/10", "q": "During a lab handover, someone asks: Is allowing one web service the same as allowing all traffic to a server? Which explanation should you give?", "o": ["Allow the access needed for the task, rather than granting broad access without a reason.", "No. A service rule can limit the protocol and port, rather than allow every connection.", "To verify both sides of the policy: the required service works and the traffic you intended to block is actually blocked."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "firewalls-basics/Hard/11", "q": "You are explaining this topic to a colleague. A firewall permits HTTPS but blocks ping. What might happen?", "o": ["Ping proves HTTPS works.", "Neither can work.", "A website can work even though ping fails."], "c": 2, "h": "Correct. Test the protocol you actually need; different traffic can have different rules."}], "Very Hard": [{"id": "firewalls-basics/Very Hard/0", "q": "Build a written policy table for staff, web server, and management networks.", "o": ["Test authorized client/service pairs, denied sources/services, return behavior and relevant counters; document rollback.", "Allow staff → web server TCP 443; allow management → administered devices TCP 22; deny other new traffic by default. Established replies follow state policy. Verify HTTPS works, management SSH works, and staff SSH is denied; document any required supporting services separately.", "The established reply can be permitted by state tracking. A new unsolicited session needs its own policy permission; it is not automatically accepted because outbound HTTPS is allowed.", "Path asymmetry or missing state synchronization can affect sessions. Correlate both directions, devices and session logs."], "c": 1, "h": "Do not treat address translation as your deny rule."}, {"id": "firewalls-basics/Very Hard/1", "q": "Why might equal IP reachability coexist with intermittent stateful application failure?", "o": ["The established reply can be permitted by state tracking. A new unsolicited session needs its own policy permission; it is not automatically accepted because outbound HTTPS is allowed.", "Path asymmetry or missing state synchronization can affect sessions. Correlate both directions, devices and session logs.", "A reply can match existing permitted state; a new connection is evaluated as a new initiation.", "That observed traffic matched a denial. Investigate other activity before asserting no compromise or no successful access."], "c": 1, "h": "B may reject replies whose state it does not know."}, {"id": "firewalls-basics/Very Hard/2", "q": "Does allowing port 443 prove only safe browsing occurs?", "o": ["No. Other applications can use that port; endpoint and application controls may be needed.", "No. SSH and HTTPS use different destination ports; inspect the actual policy.", "Allow the client source to the web-server d
