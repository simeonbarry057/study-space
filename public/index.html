ct the IP on the actual connected interface and enable it.", "Verify gateway ping and running/startup configuration after saving."], "hint": "An up interface can still have incorrect addressing.", "answer": "Restore 192.168.3.1/24, no shutdown, and correct the PC gateway to .3.1 if needed. Confirm up/up and ping; copy running-config startup-config. Both the shutdown state and wrong subnet explain distinct parts of the failure.", "check": "You document both faults and prove the saved configuration matches the repair."}]}, "subnetting": {"introduction": "A prefix leaves host bits: /26 leaves six, so it has 64 total addresses and normally 62 usable hosts. Subnet blocks must start on valid boundaries. VLSM uses different block sizes for different needs; allocate the largest requirement first. Count required router interfaces as hosts too. The ordinary minus-two rule has /31 and /32 exceptions.", "levels": [{"difficulty": "Easy", "title": "Calculate a /26", "scenario": "192.168.50.0/26 contains .0–.63.", "reasoning": ["32−26 = 6 host bits; 2^6 = 64 total addresses.", "Reserve network .0 and broadcast .63, leaving .1–.62."], "task": "Calculate network, broadcast, and hosts for 192.168.50.64/26.", "steps": ["Use block size 64.", "Add 63 to the network to find broadcast.", "Remove the first and last addresses from the host range."], "hint": "The next block begins at .128.", "answer": "Network .64, broadcast .127, hosts .65–.126, 62 usable.", "check": "All boundaries and host counts agree."}, {"difficulty": "Hard", "title": "Fit three departments", "scenario": "A /24 must hold total requirements of 60, 30, and 12 usable addresses.", "reasoning": ["60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable).", "Allocate the largest block first, then place smaller blocks on valid boundaries."], "task": "Plan those three blocks inside 192.168.50.0/24 and choose gateways.", "steps": ["Allocate /26, /27, then /28.", "List network, host range, and broadcast for each.", "Choose gateway addresses from the usable ranges; state whether gateways are included in the requirements."], "hint": "A requirement of 30 PCs plus one gateway needs more than 30 usable addresses.", "answer": ".0/26: hosts .1–.62, broadcast .63; .64/27: hosts .65–.94, broadcast .95; .96/28: hosts .97–.110, broadcast .111. Gateways can be .1, .65, and .97. This plan assumes the given counts include all required interfaces.", "check": "You detect overlap and explicitly account for gateway consumption."}, {"difficulty": "Very Hard", "title": "Detect an impossible budget", "scenario": "A /24 must support 100, 60, 30, and 14 end devices, each group also needing a gateway.", "reasoning": ["Host needs become 101, 61, 31, and 15.", "They need blocks of 128, 64, 64, and 32 addresses respectively.", "288 total addresses exceed a /24’s 256; a clever ordering cannot make it fit."], "task": "Explain why the request cannot fit and propose a valid larger allocation on paper.", "steps": ["Choose the smallest prefix per group.", "Add the block sizes.", "Allocate inside 192.168.50.0/23 and check boundaries."], "hint": "Do not subtract gateway needs from the device counts.", "answer": "Use .50.0/25 (126 usable), .50.128/26 (62), .50.192/26 (62), and .51.0/27 (30) inside 192.168.50.0/23. Their broadcasts are .50.127, .50.191, .50.255, and .51.31. They do not overlap. A /23 gives room for all four.", "check": "You reject an impossible /24 and justify a valid replacement."}]}, "ipv6": {"introduction": "IPv6 uses 128-bit addresses written as eight hexadecimal groups. Remove leading zeros within a group and use :: once for a consecutive run of zero groups. Neighbor Discovery uses ICMPv6 instead of IPv4 ARP; there is no IPv6 broadcast. Use 2001:db8::/32 documentation addresses in examples and a /64 for these lab LANs.", "levels": [{"difficulty": "Easy", "title": "Compress an address", "scenario": "2001:0db8:0001:0000:0000:0000:0000:0010 becomes 2001:db8:1::10.", "reasoning": ["Leading zeros inside a group can be removed.", "The four consecutive all-zero groups are represented by one ::."], "task": "Compress 2001:0db8:0002:0000:0000:0000:0000:0011.", "steps": ["Remove leading zeros.", "Replace the zero run once.", "Count back to eight groups to verify."], "hint": "You cannot use two :: sequences in one address.", "answer": "2001:db8:2::11. Expansion restores eight groups.", "check": "You can expand your compressed result unambiguously."}, {"difficulty": "Hard", "title": "Build the IPv6 LAN", "scenario": "Router ::1 and PCs ::10 and ::11 use 2001:db8:1::/64.", "reasoning": ["They share a /64 and can communicate locally.", "The router must have an IPv6 address on its connected interface; routing between LANs also requires IPv6 routing."], "task": "Add IPv6 to a working Packet Tracer IPv4 LAN.", "steps": ["On the router enable ipv6 unicast-routing and set ipv6 address 2001:db8:1::1/64 on the connected interface.", "Set PC IPv6 addresses 2001:db8:1::10/64 and ::11/64; use the lab router as gateway as the simulator supports.", "Ping locally and inspect show ipv6 interface brief and show ipv6 neighbors."], "hint": "Neighbor Discovery supplies link-layer neighbor information; it is not ARP.", "answer": "With links up and correct settings, local pings work. The neighbor table can show discovered link-layer peers. A /64 prefix is shared, but each endpoint has its own address.", "check": "You verify addressing and neighbor discovery rather than assuming IPv4 settings carry over."}, {"difficulty": "Very Hard", "title": "Diagnose mismatched prefixes", "scenario": "PC A is 2001:db8:1::10/64; PC B was accidentally set to 2001:db8:2::11/64 on the same isolated LAN.", "reasoning": ["The physical link does not make different IP prefixes the same subnet.", "With no routing to the second prefix, end-to-end traffic fails.", "Link-local connectivity can differ from global-prefix connectivity."], "task": "Repair the saved dual-stack lab and describe what IPv4 success proves.", "steps": ["Compare the IPv6 /64 prefixes on both PCs and router.", "Restore B to 2001:db8:1::11/64 and retest.", "Explain why working IPv4 did not validate IPv6 addressing."], "hint": "Treat the two protocol configurations separately.", "answer": "IPv4 success supports working link and IPv4 configuration; it does not prove IPv6 is correct. Restoring B’s intended /64 resolves this prefix error when other settings and policy are correct.", "check": "You identify the IPv6-specific fault without reconfiguring working IPv4."}]}, "vlans": {"introduction": "A VLAN is a separate Layer 2 broadcast domain. An access port serves one ordinary data VLAN; a trunk carries multiple VLANs with 802.1Q tagging. Same-VLAN hosts across switches need that VLAN on both switches and the trunk. Different VLAN subnets need routing and correct gateways. A VLAN is not itself an access-control policy.", "levels": [{"difficulty": "Easy", "title": "Place two teams", "scenario": "Sales uses VLAN 10, support uses VLAN 20.", "reasoning": ["Put each PC access port in the intended VLAN.", "Broadcasts in VLAN 10 are not simply forwarded into VLAN 20."], "task": "On a Packet Tracer switch, put two PCs in VLAN 10 and a third in VLAN 20.", "steps": ["Create vlan 10 and vlan 20 in global configuration.", "On each connected PC port enter switchport mode access and switchport access vlan \u003c10-or-20>.", "Use show vlan brief to match ports and VLANs."], "hint": "Replace the placeholder with 10 or 20; match the actual interface.", "answer": "The two team-10 PC ports belong to VLAN 10; the third belongs to VLAN 20. Same-subnet addressing is needed for same-VLAN IP tests; inter-VLAN delivery needs a router.", "check": "The port assignments match the topology."}, {"difficulty": "Hard", "title": "Carry both VLANs between switches", "scenario": "Each of two switches has a VLAN 10 PC; a trunk connects the switches.", "reasoning": ["Both switches need VLAN 10 present.", "The trunk must carry VLAN 10 for same-VLAN traffic across the link."], "task": "Extend the lab to two switches with VLANs 10 and 20.", "steps": ["Create both VLANs on both switches and set PC access ports.", "On both ends of the inter-switch link set switchport mode trunk and switchport trunk allowed vlan 10,20.", "Run show interfaces trunk; test same-VLAN PCs on different switches using matching subnets."], "hint": "A PC access port and an inter-switch trunk have different jobs.", "answer": "VLAN 10 peers should communicate across the trunk, as should VLAN 20 peers, with correct addressing and links. Different VLANs still need routing; trunking alone does not route.", "check": "You verify each VLAN independently and do not expect a trunk to replace a router."}, {"difficulty": "Very Hard", "title": "Repair a selective outage", "scenario": "VLAN 10 works across switches; VLAN 20 works locally but fails across the trunk because it was omitted from an allowed list.", "reasoning": ["Local VLAN 20 success narrows attention to its inter-switch path.", "Compare allowed and active trunk VLANs on both ends.", "Restore VLAN 20 while retaining VLAN 10."], "task": "Remove VLAN 20 from one lab trunk, diagnose it, and restore it.", "steps": ["Save a working baseline and introduce the omission.", "Collect show vlan brief and show interfaces trunk evidence.", "Restore switchport trunk allowed vlan 10,20 and retest both VLANs."], "hint": "Use the full intended allowed list; do not accidentally replace VLAN 10.", "answer": "The omitted VLAN cannot cross that trunk even though its local access ports work. Restoring both intended VLANs repairs the selective trunk fault. For inter-VLAN traffic also verify router subinterfaces, dot1Q tags, and gateways.", "check": "You repair the specific VLAN and confirm no regression in the other."}]}, "stp": {"introduction": "Redundant Layer 2 links can create loops. Spanning Tree chooses a loop-free active topology and leaves an alternate path available. The lowest bridge ID wins root election. EtherChannel groups compatible physical links into one logical link; LACP negotiates membership. Use show spanning-tree and show etherchannel summary to verify actual behavior.", "levels": [{"difficulty": "Easy", "title": "Predict the root", "scenario": "Three switches have different bridge priorities: 4096, 8192, and 32768 for VLAN 10.", "reasoning": ["Lower priority contributes to a lower bridge ID.", "With these distinct priorities, the 4096 switch wins for VLAN 10."], "task": "Choose the root from priorities 8192, 16384, and 32768.", "steps": ["Rank the priorities.", "Explain the tie-breaker if priorities match.", "Verify the lab result with show spanning-tree vlan 10."], "hint": "MAC address breaks a bridge-ID tie when the other components match.", "answer": "8192 wins among these priorities. With equal priority/system-ID extension, the lowest MAC decides. Check the actual VLAN instance rather than assuming one root for all VLANs.", "check": "You justify the election and read the reported root."}, {"difficulty": "Hard", "title": "Observe a failover", "scenario": "A triangle of switches has an alternate blocked/discarding path.", "reasoning": ["STP keeps redundant paths from all forwarding simultaneously.", "When an active link fails, topology can reconverge through an alternate path."], "task": "Build a three-switch triangle in Packet Tracer with consistent VLANs/trunks.", "steps": ["Inspect show spanning-tree on each switch.", "Record root and port roles/states before failure.", "Remove one active lab link, wait for convergence, and compare pings and roles."], "hint": "Expect convergence behavior, not guaranteed zero packet loss.", "answer": "The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover.", "check": "Your before/after diagram matches the observed forwarding paths."}, {"difficulty": "Very Hard", "title": "Diagnose a channel mismatch", "scenario": "One switch uses LACP active; its peer uses passive. Another pair uses passive on both sides.", "reasoning": ["Active initiates LACP and can pair with passive.", "Two passive ends do not initiate negotiation, so a channel is not negotiated.", "VLAN, speed, and other member settings must also be compatible."], "task": "On a separate lab pair, compare active/passive with passive/passive.", "steps": ["Configure matching trunk settings on two member ports at both ends.", "Use channel-group 1 mode active on one end and passive on the other; inspect show etherchannel summary.", "Change the active end to passive and compare; restore active/passive."], "hint": "An unformed channel is not automatically a loop; STP still governs independent links.", "answer": "Active/passive can negotiate; passive/passive does not initiate. Verify that ports are actually bundled and that the logical port-channel is correct. Do not infer success solely from entered commands.", "check": "You explain the negotiation difference and confirm bundle state."}]}, "routing": {"introduction": "A routing table lists reachable prefixes and next hops. Forwarding uses the longest matching prefix. For competing sources advertising the same prefix, administrative distance helps choose the source. A default route is /0. A floating static route has a higher distance than the primary route and only helps when that primary route is withdrawn or tracked appropriately.", "levels": [{"difficulty": "Easy", "title": "Pick the specific route", "scenario": "A table has 0.0.0.0/0 via A and 192.168.20.0/24 via B.", "reasoning": ["192.168.20.10 matches both.", "The /24 is more specific than /0, so B is selected."], "task": "Choose next hops for 192.168.20.25 and 192.168.30.25.", "steps": ["Compare both destinations with the /24.", "Use the default for the one with no specific match."], "hint": "Longest prefix wins among installed matching routes.", "answer": ".20.25 uses B; .30.25 uses A, assuming those are the only installed matches and their next hops are usable.", "check": "You apply prefix specificity before other comparisons."}, {"difficulty": "Hard", "title": "Configure reciprocal static routes", "scenario": "Two routers join LANs .10.0/24 and .20.0/24 through 10.0.0.0/30.", "reasoning": ["Transit addresses .1 and .2 are direct next hops.", "Each router needs a route to the other LAN, and each PC needs its local gateway."], "task": "Build the two-branch Packet Tracer topology from the original lab.", "steps": ["Set router A transit 10.0.0.1/30 and B 10.0.0.2/30 and enable links.", "A: ip route 192.168.20.0 255.255.255.0 10.0.0.2; B: ip route 192.168.10.0 255.255.255.0 10.0.0.1.", "Inspect show ip route and ping between PCs using their respective LAN gateways."], "hint": "The destination prefix is the remote LAN; the next hop is the neighboring router.", "answer": "Both remote LAN routes should be installed with reachable next hops. End-to-end success requires working LAN interfaces, host settings, and both directions.", "check": "You trace request and reply using both tables."}, {"difficulty": "Very Hard", "title": "Combine specificity and backup routes", "scenario": "The table contains .20.0/24 and .20.128/25; the /25 points to a path that is not delivering traffic.", "reasoning": ["A destination .20.150 uses /25 even if /24 has a lower distance.", "The router does not automatically try the less-specific /24 because an application fails.", "Route withdrawal or tracking must change the installed forwarding choice."], "task": "Explain next-hop choices for .20.100 and .20.150, and a safe lab recovery plan.", "steps": ["List which prefixes match each host.", "Choose the longest match.", "Inspect the /25 next hop and route availability; repair or remove the faulty lab-specific route, then retest."], "hint": "Distance does not override different prefix lengths during forwarding.", "answer": ".100 uses /24; .150 uses /25. Repair the /25 path or withdraw the faulty specific route in the lab so an appropriate remaining route can match. A higher-distance same-prefix backup helps only under the route’s actual withdrawal/tracking conditions.", "check": "You avoid claiming a more general route automatically rescues a failing more specific route."}]}, "ospf": {"introduction": "OSPF dynamically exchanges routes between neighboring routers. Adjacent links need compatible area, subnet, and protocol settings. The process number is locally significant; it need not match between routers. Verify neighbors and learned routes separately. For a simple lab use a point-to-point link in area 0; gateway redundancy is a separate function.", "levels": [{"difficulty": "Easy", "title": "Read an OSPF route", "scenario": "show ip route includes an O-prefixed remote LAN route.", "reasoning": ["O indicates a route learned through OSPF.", "The route’s next hop is a neighboring router, not the final PC."], "task": "Explain an O route to 192.168.20.0/24 via 10.0.0.2.", "steps": ["Name the source protocol.", "Name destination prefix and next hop.", "State what host settings still matter."], "hint": "A learned route does not set a PC gateway.", "answer": "OSPF learned .20.0/24 through neighbor 10.0.0.2. PCs still need valid addresses, masks, and local gateways; return routing and policy must work.", "check": "You read the entry without confusing next hop and endpoint."}, {"difficulty": "Hard", "title": "Form a two-router adjacency", "scenario": "Routers A and B use transit .1 and .2 in 10.0.0.0/30, area 0.", "reasoning": ["Enable OSPF on the transit and LAN interfaces.", "Verify adjacency, then verify the remote LAN route.", "A process number identifies a local process."], "task": "Replace the static routes in the saved two-branch lab with OSPF.", "steps": ["Remove only the two lab static routes; configure router ospf 1 on each router.", "A: network 10.0.0.0 0.0.0.3 area 0 and network 192.168.10.0 0.0.0.255 area 0; B uses the same transit and its .20.0 LAN.", "Run show ip ospf neighbor and show ip route, then test between PCs."], "hint": "Network statements select local interfaces; they are not static next-hop routes.", "answer": "With compatible link settings, neighbors form and remote LAN routes appear as OSPF routes. A local process-ID mismatch alone is not the cause of an adjacency failure.", "check": "You verify neighbors, routing entries, and host traffic as three separate checks."}, {"difficulty": "Very Hard", "title": "Repair an area mismatch", "scenario": "One transit interface is in area 0 and the peer is in area 1; adjacency does not form.", "reasoning": ["Peers on the shared link need matching areas.", "Confirm interfaces, addresses, areas, timers, and passive settings with evidence.", "Correct the intended area rather than changing every setting."], "task": "Introduce the area mismatch in your saved lab, then diagnose it.", "steps": ["Inspect show ip ospf interface on the transit interfaces.", "Remove the incorrect network statement and add the area 0 statement.", "Wait for convergence; verify neighbor state, learned LAN routes, and PC pings."], "hint": "Fix the shared link area; the process ID need not match.", "answer": "Restore the peer transit interface to area 0 using the intended statement/interface configuration. Retest all three checks. Other mismatches can also block neighbors, so an area match is necessary but not universal proof of success.", "check": "Your evidence identifies the area fault and confirms recovery."}]}, "services": {"introduction": "DHCP gives clients addresses, masks, gateways, and DNS settings. DNS maps names to records. A DHCP relay forwards client requests across a router because broadcasts do not normally cross it. NAT translates addresses; PAT also uses transport ports to share an address. Test address assignment, DNS resolution, and the application separately.", "levels": [{"difficulty": "Easy", "title": "Read a lease", "scenario": "DHCP supplies 192.168.10.25/24, gateway .1, and DNS 192.168.20.20.", "reasoning": ["The address/mask determines the local subnet.", "The gateway reaches other networks and the DNS server resolves names."], "task": "Label the job of each field in that lease.", "steps": ["Write the local subnet.", "Explain why the DNS server can be on a different routed subnet.", "State what a wrong gateway would affect."], "hint": "DNS and gateway are separate settings.", "answer": "Local subnet .10.0/24; gateway .10.1 routes remote traffic; DNS .20.20 resolves names if reachable through routing/policy. A wrong gateway can break remote DNS and other remote services while local peers still work.", "check": "You identify each field’s role."}, {"difficulty": "Hard", "title": "Relay a remote DHCP request", "scenario": "Client LAN is 192.168.10.0/24; DHCP Server is 192.168.20.20/24 behind a router.", "reasoning": ["The client broadcast stays local unless a relay forwards it.", "Set the helper on the client-facing interface.", "The server pool must match the client subnet and supply its gateway."], "task": "Build the two-LAN service lab with router addresses .10.1 and .20.1.", "steps": ["Set server .20.20/24 with gateway .20.1.", "Create a server DHCP pool for .10.0/24, gateway .10.1, DNS .20.20, and a free client address range.", "On router’s client interface use ip helper-address 192.168.20.20; select DHCP on the client and inspect its lease."], "hint": "Do not put the helper only on the server-facing interface.", "answer": "The client receives a .10.x lease with the .10.1 gateway. The relay identifies the client network to the server. Correct server return routing, enabled services, and policy are also required.", "check": "The lease belongs to the client subnet, not the server LAN."}, {"difficulty": "Very Hard", "title": "Separate three service faults", "scenario": "A client gets a correct lease; its named page fails because DNS points to the wrong server. After correction, HTTP is still disabled.", "reasoning": ["A correct lease rules out some DHCP errors.", "Compare the resolved address with the intended web server.", "Then test the actual web service; DNS success is not application success."], "task": "In the lab, add a wrong DNS A record and disable HTTP; repair both with evidence.", "steps": ["Record the lease and query the intended DNS server.", "Correct the record to the lab web server address.", "Enable HTTP and compare name lookup, IP-based browsing, and named browsing."], "hint": "Use a lab-only name such as study.example and keep it consistent.", "answer": "First correct the DNS record; then restore HTTP. Record that address assignment worked throughout. Final checks should show a correct lease, the intended DNS answer, and a working web page by IP and name.", "check": "You report distinct faults instead of saying “DHCP/DNS/NAT is broken.”"}]}, "wireless": {"introduction": "Wireless access proceeds through association, authentication, IP configuration, and onward connectivity. An SSID is the Wi-Fi name. A passphrase permits joining; an administrator password controls router settings. Use WPA2-Personal where supported in Packet Tracer; real devices may also support WPA3. GHz frequency and cellular 5G are different concepts.", "levels": [{"difficulty": "Easy", "title": "Separate the passwords", "scenario": "A laptop joins StudyWiFi with a Wi-Fi passphrase; the router uses a different admin password.", "reasoning": ["Joining and administration are different permissions.", "Correct SSID and security settings are needed to authenticate."], "task": "Create a lab SSID and identify the two credentials without using real passwords.", "steps": ["Set StudyWiFi with WPA2-Personal in Packet Tracer.", "Use an invented lab passphrase and join the laptop.", "Explain which credential controls configuration."], "hint": "Never reuse a real password in a shared lab file.", "answer": "The Wi-Fi passphrase joins clients; the administrator password controls settings. Joining does not establish a working DHCP lease or internet path.", "check": "You distinguish joining from administration and browsing."}, {"difficulty": "Hard", "title": "Compare authentication and DHCP faults", "scenario": "Wrong passphrase prevents authentication; a disabled DHCP service can leave an authenticated client without a valid lease.", "reasoning": ["These failures happen at different stages.", "Inspect association/authentication before interpreting IP settings."], "task": "Compare a wrong passphrase and disabled DHCP in a saved wireless lab.", "steps": ["With DHCP enabled, try a wrong passphrase and record the join result.", "Restore the passphrase, then disable lab DHCP and renew/reconnect the client.", "Restore DHCP and verify the address/gateway and a local service."], "hint": "An old lease can persist, so inspect/renew rather than assuming a blank address.", "answer": "A password failure prevents a valid join. A DHCP failure affects settings after joining, though an existing lease can mask it. Restoring both should give the intended subnet and local connectivity.", "check": "You identify the failing stage from observed evidence."}, {"difficulty": "Very Hard", "title": "Wi-Fi works, upstream fails", "scenario": "A laptop reaches the lab router and a local server, but cannot reach a remote server after a route is removed.", "reasoning": ["Local wireless and IP delivery work for the tested services.", "Investigate routing/policy beyond the local network instead of changing the passphrase.", "Compare a wired client to the same remote service."], "task": "Remove one remote lab route and build a troubleshooting note.", "steps": ["Test local gateway and service from wireless and wired clients.", "Inspect the router’s remote and return routes.", "Restore the intended route and verify remote service access on both clients."], "hint": "Use a simulated remote server; Packet Tracer does not provide actual internet service.", "answer": "If both clients share the remote failure while local service works, a common upstream fault is plausible. Restore the missing route in the lab and retest both directions. The working local tests do not prove every radio metric is ideal, only the tested connectivity.", "check": "Your investigation follows the failing path rather than resetting Wi-Fi."}]}, "security": {"introduction": "An access control list (ACL) evaluates traffic in order; the first matching entry decides. An implicit deny catches unmatched traffic. Extended IPv4 ACLs can match source, destination, protocol, and ports. Direction is relative to the router interface. A normal IOS interface ACL is not automatically a stateful firewall. Test allowed and denied flows in a saved isolated lab.", "levels": [{"difficulty": "Easy", "title": "Apply the first match", "scenario": "An ACL permits TCP to server 192.168.20.20 port 80, then denies other IP traffic.", "reasoning": ["A matching HTTP request is permitted.", "ICMP ping does not match the TCP permit and is denied."], "task": "Predict HTTP, HTTPS, and ping results under this two-rule policy.", "steps": ["Identify each protocol/port.", "Walk through rules top to bottom.", "Name the first match for each flow."], "hint": "HTTPS 443 is different from HTTP 80.", "answer": "HTTP to the specified server is permitted; HTTPS and ping are denied. Unspecified flows do not inherit the HTTP permission.", "check": "You explain every result through a rule match."}, {"difficulty": "Hard", "title": "Permit a lab web service", "scenario": "Client LAN .10.0/24 needs HTTP to server .20.20 across a router.", "reasoning": ["An inbound client-facing ACL evaluates requests as they enter the router.", "Create all intended entries before applying it.", "This exercise deliberately denies other traffic, including ping."], "task": "Build a named ACL in Packet Tracer after confirming the baseline page works.", "steps": ["In global configuration: ip access-list extended STUDY; permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.20 eq 80; deny ip any any; exit.", "On the actual client-facing interface apply ip access-group STUDY in, then end.", "Open http://192.168.20.20, try ping, and inspect show access-lists."], "hint": "Use the server IP so this HTTP-only test does not depend on a DNS permit.", "answer": "HTTP should pass and ping should be denied under this policy, assuming working routes and HTTP. Response traffic enters the server-facing interface; evaluate any other ACLs there separately. A normal ACL is not state tracking.", "check": "You verify a permitted and denied test with counters and correct interface direction."}, {"difficulty": "Very Hard", "title": "Repair a shadowed permit", "scenario": "deny ip any any appears above the intended HTTP permit.", "reasoning": ["Every IP packet matches the broad deny first.", "The later permit cannot be reached for that traffic.", "Removing the broad deny altogether can conceal missing policy; restore intended order."], "task": "In a saved lab, put the deny first, then diagnose and repair the rule order.", "steps": ["Use show access-lists and compare hit counters after a browser test.", "Detach the lab ACL from the interface while rebuilding it in the correct order using console access.", "Apply the completed ACL again; confirm HTTP allowed and ping denied."], "hint": "Keep the specific permit ahead of the catch-all deny.", "answer": "Rebuild STUDY with the TCP 80 permit first and the deny second, then reapply inbound on the client interface. Confirm routes/service remain intact. No return-session allowance is implied by a standard stateless ACL.", "check": "Your repair preserves the restriction rather than permitting all traffic."}]}, "architecture": {"introduction": "A network design connects roles and failure boundaries. Access switches connect endpoints, routers connect subnets, and firewalls enforce policies. The data plane forwards traffic, control plane determines forwarding information, and management plane supports administration. Virtual machines and containers host workloads; a controller helps coordinate configuration but is not necessarily in the data path.", "levels": [{"difficulty": "Easy", "title": "Label a small office", "scenario": "PCs use a switch, phones use an AP, and a router/firewall reaches the ISP.", "reasoning": ["The access devices connect local endpoints.", "The router connects networks and the firewall controls traffic."], "task": "Draw that office and label each role.", "steps": ["Include PCs, switch, AP, gateway, access device, and ISP.", "Mark Ethernet and Wi-Fi links.", "Identify where IP routing and policy decisions occur."], "hint": "Multiple roles can share one physical device.", "answer": "The switch/AP provide local access; gateway routes remote packets; firewall applies policy; modem/ONT handles the provider access link. Combined equipment should retain role labels.", "check": "Your drawing distinguishes functions rather than just listing boxes."}, {"difficulty": "Hard", "title": "Separate two teams", "scenario": "Staff and guests use separate VLANs and subnets; guests should reach only the intended external services.", "reasoning": ["Routing makes inter-subnet connectivity possible.", "A policy restriction must deliberately limit guest access.", "DHCP, DNS, and management placement need explicit consideration."], "task": "Draw a two-VLAN office and a local staff server.", "steps": ["Assign two non-overlapping /24s and gateways.", "Label trunks, access ports, DHCP/DNS, and the server.", "Write staff-to-server and guest-to-server expected outcomes."], "hint": "VLAN separation alone does not enforce every routed restriction.", "answer": "One possible design: staff .10.0/24 gateway .10.1; guests .20.0/24 gateway .20.1. Staff can reach the service by policy; guests are denied that local server. Document allowed DHCP/DNS and external paths so the guest network is usable.", "check": "Both topology and traffic policy support the stated design."}, {"difficulty": "Very Hard", "title": "Choose justified redundancy", "scenario": "An office has one switch, one gateway, and one ISP circuit. A second AP fixes none of those three failures.", "reasoning": ["Match each improvement to a failure it actually protects against.", "Redundant gateways still require a valid downstream and upstream design.", "Two circuits through one failed gateway can still be unavailable."], "task": "Choose two failure scenarios and design a remedy plus a failover test for each.", "steps": ["Mark the single points of failure.", "Specify which devices/links survive each failure.", "Describe what may still interrupt service and how to verify recovery in a lab or on paper."], "hint": "Redundancy is about independent working paths, not the number of boxes.", "answer": "Examples: redundant gateway pair with first-hop redundancy addresses one gateway failure when paths remain; separate access switches and suitable connections address a switch failure for connected clients. A second ISP helps circuit failure only when routing/failover and gateway availability also support it.", "check": "Each remedy maps to a specific failure and includes a verifiable test."}]}, "automation": {"introduction": "Automation describes desired changes through structured data and repeatable actions. JSON has objects, arrays, strings, numbers, booleans, and null. HTTP GET typically reads; PATCH requests a partial change as the API defines. Authentication, schema validation, scope, a before/after check, and rollback matter. AI suggestions require verification against actual device state.", "levels": [{"difficulty": "Easy", "title": "Read JSON types", "scenario": "An interface record is {\"name\":\"Gi0/0\",\"enabled\":true,\"mtu\":1500}.", "reasoning": ["name is a string, enabled a boolean, and mtu a number.", "The string \"true\" is not the same JSON type as true."], "task": "Write a JSON object for Gi0/1, disabled, MTU 1500.", "steps": ["Use double-quoted property names and string values.", "Use false without quotes.", "Check commas and braces in a JSON-aware editor."], "hint": "JSON does not allow trailing commas or comments.", "answer": "{\"name\":\"Gi0/1\",\"enabled\":false,\"mtu\":1500}. Correct syntax and types are distinct from whether a device API accepts these field names.", "check": "Your JSON parses and you explain each value type."}, {"difficulty": "Hard", "title": "Plan a partial change", "scenario": "A fictional API allows PATCH /interfaces/Gi0-1 with {\"enabled\":true}.", "reasoning": ["Read current state with GET first.", "PATCH changes one field according to this fictional API contract.", "Read again and verify actual state instead of treating a successful request as the only check."], "task": "Write a no-credentials, paper workflow to enable one lab interface.", "steps": ["Record the target and current state.", "Write the intended PATCH body and expected response check.", "Describe the follow-up GET and rollback to the recorded state."], "hint": "The URL and schema here are illustrative, not a real router endpoint.", "answer": "GET current record; validate target/schema; PATCH enabled=true; check response; GET state and verify link behavior. Roll back enabled to its recorded value if needed. Never send this fictional endpoint to a live device.", "check": "Your workflow limits the change to one intended target and verifies it."}, {"difficulty": "Very Hard", "title": "Reject unsafe bulk changes", "scenario": "An AI-produced inventory includes a duplicate interface and enabled values mixing strings with booleans.", "reasoning": ["A parser can accept syntactically valid JSON that violates the intended schema.", "Validate types, duplicates, target allowlist, and allowed fields before making changes.", "Use a dry run and a small verified batch; do not blindly apply the proposal."], "task": "Design validation for [{\"name\":\"Gi0/0\",\"enabled\":true},{\"name\":\"Gi0/0\",\"enabled\":\"false\"}].", "steps": ["Identify duplicate target and wrong type.", "Write rejection messages for both.", "Describe a corrected preview and before/after verification plan."], "hint": "Do not silently convert or overwrite the conflicting record.", "answer": "Reject the duplicate Gi0/0 and string \"false\"; require one unambiguous record with a boolean. Review the intended target, back up state, preview changes, apply only in a lab, and verify before increasing scope.", "check": "Invalid data stops the change instead of producing a partial hidden result."}]}, "capstone": {"introduction": "A capstone combines the earlier skills into one network. Establish a working baseline, define allowed/denied traffic, then introduce faults one at a time before attempting mixed faults. Use evidence to decide whether the cause is addressing, VLAN/trunk, routing, service, or policy. Planner completion is a study record; compare your understanding with current official exam objectives.", "levels": [{"difficulty": "Easy", "title": "Prove the baseline", "scenario": "Two branches exchange pings and a client opens a lab HTTP server.", "reasoning": ["List the expected path before introducing faults.", "Verify local gateway, remote host, and application separately."], "task": "Save a two-branch baseline from your earlier labs.", "steps": ["Record host addresses, gateways, VLANs, and routes.", "Test local and remote reachability and HTTP.", "Save the Packet Tracer file and a short results table."], "hint": "A baseline needs observed results, not only a topology drawing.", "answer": "The saved baseline should have expected connectivity with documented settings. State any intentional blocked tests, so a denied ping is not later mistaken for a new fault.", "check": "You can reproduce the working state and identify expected restrictions."}, {"difficulty": "Hard", "title": "Repair one known fault at a time", "scenario": "A PC’s wrong gateway breaks remote access while same-subnet traffic remains possible.", "reasoning": ["Local and remote tests distinguish the scope.", "Compare the host gateway with the configured local router.", "Restore one setting and verify the expected change."], "task": "Introduce a bad gateway, then a missing trunk VLAN, one at a time in separate saved copies.", "steps": ["Predict affected flows before each change.", "Collect host and switch evidence relevant to the fault.", "Repair and verify all baseline tests before the next fault."], "hint": "Return to a known good baseline between experiments.", "answer": "Wrong gateway mainly affects remote paths; a missing trunk VLAN breaks that VLAN across the trunk. Repairs should address the wrong setting, preserve unrelated settings, and restore the recorded baseline tests.", "check": "Your notes connect symptom, evidence, specific repair, and retest."}, {"difficulty": "Very Hard", "title": "Resolve multiple faults without guessing", "scenario": "A remote page fails because one VLAN is missing from a trunk and an ACL denies its HTTP request.", "reasoning": ["The first repair can expose a second fault.", "Verify each segment and then the actual application/policy.", "Stop when allowed and denied tests match the design, not when one ping succeeds."], "task": "In a saved isolated capstone, introduce a trunk omission, a wrong gateway, and a shadowed HTTP permit.", "steps": ["Build a test matrix by source, destination, and service.", "Diagnose and repair each fault using show commands and host tests; record each observed change.", "Retest required traffic and prohibited traffic, then rebuild the main configuration without notes."], "hint": "Use the prior VLAN, addressing, and ACL worked examples as reference when needed.", "answer": "Restore the intended trunk VLAN list, each host’s local gateway, and ACL order with the HTTP permit before the deny. Confirm correct routing/services too. Keep a three-part note for each fault and demonstrate that forbidden flows remain blocked.", "check": "You diagnose all faults, justify the order, and verify policy as well as reachability."}]}, "linux": {"introduction": "Linux support starts with observing addresses, listening services, and logs. ip addr shows addresses; ss -lnt shows listening TCP sockets. Wireshark lets you inspect traffic you own. A service bound to 127.0.0.1 accepts local connections only. Use an isolated VM for these exercises; operating-system menus and commands can vary.", "levels": [{"difficulty": "Easy", "title": "Identify a listening service", "scenario": "ss -lnt lists 127.0.0.1:8000 as LISTEN.", "reasoning": ["The service listens on TCP 8000.", "127.0.0.1 is loopback, so the service is local to that host."], "task": "In an isolated Linux VM with Python 3, start a local page service.", "steps": ["Run python3 -m http.server 8000 --bind 127.0.0.1 from a folder containing only lab files.", "In another terminal run ss -lnt and open http://127.0.0.1:8000 in the VM browser.", "Stop the service with Ctrl+C when finished."], "hint": "Do not serve a folder containing personal files.", "answer": "A listening entry appears for loopback port 8000 and a local browser can connect. Stopping the process removes that listener. This does not prove remote accessibility.", "check": "You match the process, listener, and local request."}, {"difficulty": "Hard", "title": "Distinguish a stopped service", "scenario": "A local request works before the server stops and fails afterward; the VM address is unchanged.", "reasoning": ["The network configuration did not need to change.", "The missing listener supports an application/service fault."], "task": "Compare listener and browser results before and after stopping your lab HTTP process.", "steps": ["Record ss -lnt while serving.", "Stop the process and repeat the command and browser request.", "Write a note naming the evidence for the service failure."], "hint": "A browser error alone gives less evidence than a browser result plus socket state.", "answer": "Before: loopback TCP 8000 listens and the page opens. After: no listener and the request fails. Restarting the lab service should restore both observations without changing IP settings.", "check": "You identify a service-state fault rather than changing the gateway."}, {"difficulty": "Very Hard", "title": "Capture the local conversation", "scenario": "A VM’s local HTTP request uses loopback; capturing only its Ethernet adapter misses that conversation.", "reasoning": ["Choose the interface carrying the test traffic.", "Plain HTTP permits inspecting the lab request; HTTPS would encrypt its content.", "Correlate packets with listening state and the browser result."], "task": "Capture your own loopback HTTP request in Wireshark inside the isolated VM.", "steps": ["Use the loopback interface and filter tcp.port == 8000.", "Request the page with the service running and inspect connection setup and HTTP.", "Stop it, retry, and compare with ss -lnt; stop the capture when done."], "hint": "Packet visibility depends on selecting the right capture interface and permissions.", "answer": "The working capture normally shows TCP setup and an HTTP exchange. A stopped local service can yield a reset rather than a successful connection; record the actual behavior. No packets on the wrong adapter is not proof that the request never occurred.", "check": "You correlate process state, traffic, and application evidence."}]}, "python": {"introduction": "Python can validate repeatable inventory data. The standard-library ipaddress module parses addresses; invalid input raises ValueError. A set can identify repeated normalized addresses. Git records source versions, but should not contain credentials or private device inventories. Work with invented lab data and document how to run the script.", "levels": [{"difficulty": "Easy", "title": "Validate one IPv4 address", "scenario": "ipaddress.ip_address(\"192.168.10.25\") succeeds; \"192.168.10.999\" raises ValueError.", "reasoning": ["An IPv4 octet must fit its allowed numeric range.", "Parsing is more reliable than checking only for dots."], "task": "Try both inputs in a local Python 3 session.", "steps": ["Run import ipaddress.", "Run ipaddress.ip_address(\"192.168.10.25\").", "Run the invalid input and explain the ValueError."], "hint": "A valid address is not proof that a device owns it or is reachable.", "answer": "The first input parses as an IPv4Address. The second is invalid. The parser validates address form; reachability requires a separate network test.", "check": "You separate input validation from network availability."}, {"difficulty": "Hard", "title": "Report duplicates and invalid rows", "scenario": "An inventory has two hosts with .10.25 and a third with .10.999.", "reasoning": ["Catch ValueError per row so one invalid address does not stop the whole report.", "Store each successfully parsed address in a set to identify reuse."], "task": "Write a script over three invented hostname/address pairs using that data.", "steps": ["Parse each address with ipaddress.IPv4Address in a try/except ValueError block.", "For valid entries check membership in a seen set before adding.", "Print a useful message naming invalid and duplicate rows."], "hint": "Normalize addresses by parsing before comparing; do not overwrite an earlier record silently.", "answer": "The script should report one repeated valid address and one invalid row while processing all three. A repeated address is a conflict candidate; document whether duplicates are allowed by the intended inventory model.", "check": "The report names the problem rows and continues after invalid input."}, {"difficulty": "Very Hard", "title": "Validate subnet membership too", "scenario": "For a /26 LAN .64–.127, .64 and .127 are reserved, .70 is usable, and .130 belongs elsewhere.", "reasoning": ["Syntax validation alone accepts all four as IPv4 addresses.", "Check network membership and reserved endpoints for this ordinary LAN.", "Produce separate reasons so a rejected row is understandable."], "task": "Extend the inventory validator for 192.168.10.64/26 and those four entries.", "steps": ["Parse the network with ipaddress.ip_network and each row with IPv4Address.", "Check membership, then network_address and broadcast_address, then duplicates.", "Record sample expected results and save the script/README in a local Git project without secrets."], "hint": "These reserved-host rules apply to this /26 exercise; /31 and /32 require different treatment.", "answer": ".70 is usable; .64 is the network; .127 is broadcast; .130 is outside the subnet. Distinguish these failures from malformed input and duplicate usage. Include a run command and example output in the README.", "check": "Your validation explains four distinct categories and can be rerun reproducibly."}]}, "enterprise": {"introduction": "Enterprise networking builds on reliable subnetting, switching, routing, and troubleshooting. Deeper routing and resiliency are useful next skills once the core labs are comfortable. Here the progression is a practical branch-network design, not a claim that these exercises alone cover a professional certification.", "levels": [{"difficulty": "Easy", "title": "Add a third subnet", "scenario": "Two branches use .10.0/24 and .20.0/24; a third can use .30.0/24.", "reasoning": ["Branch LANs must not overlap.", "Give the new branch a gateway and a path to the other branches."], "task": "Draw a third branch using 192.168.30.0/24.", "steps": ["Choose a router LAN address and one PC address.", "Add a non-overlapping transit subnet to the existing design.", "Trace traffic to branch one and the reply."], "hint": "Every transit link also consumes an address block.", "answer": "One valid choice is gateway .30.1 and PC .30.10/24. A new 10.0.0.4/30 transit uses .5 and .6 if that block is free. Supply reciprocal routing or consistent dynamic routing.", "check": "You account for both LAN and transit address space."}, {"difficulty": "Hard", "title": "Learn routes to the new branch", "scenario": "The third branch joins an area-0 OSPF lab and advertises its LAN.", "reasoning": ["Adjacency requires compatible shared-link settings.", "All branches need the new route and a return path."], "task": "Extend the capstone to a third router with a free /30 link.", "steps": ["Configure its LAN/transit and hosts.", "Enable OSPF on intended links in the existing area-0 lab.", "Verify neighbors and learned prefixes, then test each branch pair."], "hint": "Seeing one neighbor does not prove every LAN is advertised.", "answer": "Remote branches should learn .30.0/24; the new branch should learn existing LANs. Test each direction and inspect missing-prefix cases rather than assuming adjacency is sufficient.", "check": "All intended branch pairs work and routes explain the observed path."}, {"difficulty": "Very Hard", "title": "Design and prove an alternate path", "scenario": "Three routers form a triangle so a branch can survive one transit-link failure.", "reasoning": ["A physically separate path only helps when routing can use it.", "Compare the routing table and application behavior before and after a link loss.", "A second path does not protect the failed router itself."], "task": "Add a separate transit link and test one link failure in the isolated lab.", "steps": ["Allocate a free transit subnet and enable compatible OSPF.", "Record the selected routes and successful branch tests.", "Shut one transit interface in the lab, observe convergence, and verify recovery; restore it afterward."], "hint": "Expect convergence and possible transient loss, not uninterrupted delivery by assumption.", "answer": "If the remaining topology stays connected and advertises the LANs, OSPF can use the alternate path. Record actual convergence and route changes; acknowledge that a router or LAN failure is a different scenario.", "check": "Your resilience claim is limited to the failure you actually tested."}]}, "security-path": {"introduction": "Defensive security applies least privilege, secure administration, logging, and evidence-based incident triage. Start by documenting required flows between client, server, and management networks. Default deny requires explicit supporting services and an understanding of return traffic. These written policy exercises do not require purchasing a certification or changing a live firewall.", "levels": [{"difficulty": "Easy", "title": "Write one least-privilege rule", "scenario": "Staff need HTTPS to an internal server, not every service on it.", "reasoning": ["The service requirement is narrower than all IP traffic.", "Record source, destination, protocol, port, and action."], "task": "Write a table row for staff HTTPS access to 192.168.20.20.", "steps": ["Choose an invented staff subnet.", "Specify TCP destination port 443.", "State why an unrestricted permit is unnecessary."], "hint": "Least privilege permits the stated task and no more than required.", "answer": "For example: source 192.168.10.0/24, destination 192.168.20.20, TCP 443, allow. Other requirements need their own documented justification.", "check": "Your permit matches a concrete service need."}, {"difficulty": "Hard", "title": "Separate administration", "scenario": "Management may SSH to devices; ordinary clients may not.", "reasoning": ["Management access requires its own source scope.", "A positive SSH test and a negative client SSH test validate different policy requirements."], "task": "Create a written policy with staff, server, and management networks.", "steps": ["Add staff HTTPS and management SSH rows.", "Describe default deny, logging, and stateful return handling if applicable.", "List allowed and denied test flows."], "hint": "Do not assume a stateless ACL handles return sessions like a stateful firewall.", "answer": "Document staff→server TCP 443 and management→devices TCP 22, plus required DNS/DHCP as appropriate. Deny unrelated new connections. Tests include permitted staff HTTPS, permitted admin SSH, and denied ordinary-client SSH.", "check": "The table includes both functional access and restrictions."}, {"difficulty": "Very Hard", "title": "Triage a suspicious blocked attempt", "scenario": "Logs show many blocked management-port attempts; no successful management session is demonstrated.", "reasoning": ["Denied attempts are evidence of attempts, not proof of a successful compromise.", "Correlate source, time, target, authentication events, and actual session state.", "Preserve evidence and escalate according to the defined scope."], "task": "Write a short incident note using only those observations.", "steps": ["Separate observed facts from hypotheses.", "Name two additional logs/checks needed to assess success or impact.", "Describe containment review without disabling all business access."], "hint": "Avoid reporting a confirmed breach from deny logs alone.", "answer": "Record repeated blocked attempts, affected targets/times, and unknown success/impact. Check authentication/session and device-change logs, confirm policy behavior, preserve records, and escalate to the responsible security team if indicated. Any containment change should target the supported risk.", "check": "Your note neither minimizes the attempts nor invents a confirmed compromise."}]}, "cloud-path": {"introduction": "Cloud networks also use subnets, route tables, and traffic policies. A route toward an internet gateway is one requirement, not proof that a workload is publicly reachable. Address assignment and provider-specific security controls also matter. ISP/NOC support similarly separates customer LAN, access circuit, provider path, and service symptoms. These exercises are diagrams, not paid cloud provisioning.", "levels": [{"difficulty": "Easy", "title": "Map the support boundary", "scenario": "A customer phone reaches the router over Wi-Fi; the router reaches the provider through an ONT.", "reasoning": ["The phone/AP/router segment is local.", "The access circuit and provider network form a different troubleshooting scope."], "task": "Draw that path and mark what a customer can observe versus what may require ISP checks.", "steps": ["Label each device/function.", "List local join/address/gateway observations.", "List circuit/provider evidence to request when escalating."], "hint": "Do not claim access to provider equipment from the customer LAN.", "answer": "Customer checks can establish local Wi-Fi/IP/service symptoms. Provider staff may need to verify access-link alarms, provisioning, and upstream paths. A clear escalation includes scope, timing, and local test results.", "check": "You identify responsibility boundaries without guessing a provider fault."}, {"difficulty": "Hard", "title": "Design public and private cloud subnets", "scenario": "A diagram uses .10.0/24 for a public-facing tier and .20.0/24 for a private tier.", "reasoning": ["Non-overlapping subnets require intentional routes and policies.", "A route to an internet gateway alone does not establish public reachability.", "A private workload may use a controlled outbound mechanism without accepting unsolicited inbound access."], "task": "Draw a provider-neutral virtual network without creating resources.", "steps": ["Mark subnets, route-table association, and service roles.", "Show intended inbound/outbound paths and access rules.", "List provider-specific details you would verify before implementation."], "hint": "Public IP assignment and security behavior differ by platform.", "answer": "Document the public tier’s addressing, internet route, and policy together. Keep the private tier’s inbound access restricted and show any intended outbound NAT/proxy path. Verify current provider behavior before provisioning; this diagram does not certify a deployed configuration.", "check": "Your design treats route, address, and policy as separate requirements."}, {"difficulty": "Very Hard", "title": "Choose an evidence-based NOC escalation", "scenario": "All customers in one area lose remote service while local LAN tests still work; an access alarm is reported.", "reasoning": ["The broader scope supports a shared access/upstream hypothesis.", "Local success does not identify the exact provider device that failed.", "Combine timing, affected area, alarm, and comparative tests in the handoff."], "task": "Write an escalation contrasting that case with one failing Wi-Fi client in a working household.", "steps": ["State facts and likely investigation scope for each.", "List evidence needed from customer and provider sides.", "Choose one skill/project to deepen based on the case you want to handle."], "hint": "State what is unknown rather than inventing optical measurements.", "answer": "Area-wide case: escalate shared access/upstream investigation with time, scope, alarm reference, and local results. Single-client case: inspect that client’s join/IP and compare wired/other wireless clients first. A useful next project could be a documented fault-isolation lab or a simulated monitoring dashboard with invented data.", "check": "You choose different next actions for different scopes and support them with evidence."}]}}, "quiz": {"network-basics": {"Easy": [{"id": "network-basics/lesson-check/Easy/0", "q": "Your phone joins home Wi-Fi. Which network has it joined?", "o": ["The provider’s entire network.", "The website server’s LAN.", "The home LAN."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "network-basics/lesson-check/Easy/1", "q": "Which device provides a way from your LAN to other networks?", "o": ["The web server that returns page content.", "The DNS server that resolves the site’s name.", "The local router."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "network-basics/lesson-check/Easy/2", "q": "What is an ISP?", "o": ["The wireless access device inside your home.", "The company providing your internet connection.", "The server supplying the requested website."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "network-basics/lesson-check/Easy/3", "q": "How can traffic reach a distant website after the ISP?", "o": ["Connected networks carry it toward the destination.", "The destination server joins the home LAN for that request.", "The provider carries it without any connection to the destination network."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "network-basics/lesson-check/Easy/4", "q": "What follows the server processing a page request?", "o": ["It forwards the original request as the completed response.", "It asks the home router to create the requested page.", "It sends information back to the requesting device."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "network-basics/lesson-check/Easy/5", "q": "Which description matches the internet?", "o": ["Many separate networks connected together.", "One local network shared by every home and server.", "Only all the devices attached to one provider."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "network-basics/Hard/0", "q": "A phone sees its SSID but cannot browse; a wired PC browses normally. Plan three useful checks.", "o": ["Compare that PC’s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "Temporarily disable cellular data for the test, verify the Wi-Fi join/IP settings and a page, then restore the prior cellular setting. Record the actual path and result."], "c": 1, "h": "Separate seeing an SSID from successfully joining it."}, {"id": "network-basics/Hard/1", "q": "Draw two homes connected through an ISP and label the local versus inter-network parts.", "o": ["Yes, if their local addressing, sharing service, and policy work. The ISP is not required for that local path.", "Each home has its own LAN; routers connect them to the provider WAN. The internet is interconnected networks, not one household LAN.", "Compare that PC’s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains."], "c": 1, "h": "Review the worked example: Each local site has a LAN; the inter-site connection is a WAN function."}, {"id": "network-basics/Hard/2", "q": "List three useful checks when only printing fails.", "o": ["Check printer power/address, same-LAN or routed reachability and isolation, then print service/queue. Do not infer a total ISP outage from one failed local service.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time."], "c": 0, "h": "Review the worked example: Working browsing does not establish that the printer service or local printer path works."}, {"id": "network-basics/Hard/3", "q": "Why might a wired test be faster than a simultaneous crowded Wi-Fi test?", "o": ["Temporarily disable cellular data for the test, verify the Wi-Fi join/IP settings and a page, then restore the prior cellular setting. Record the actual path and result.", "Compare local wired transfer, local wireless transfer, and an external download. Inspect endpoint/storage limits and link negotiation. An ISP upgrade is not evidence of a faster LAN.", "The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time."], "c": 2, "h": "Review the worked example: Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client."}, {"id": "network-basics/Hard/4", "q": "Which measurements would you compare for a poor call: delay, jitter, loss, or only download Mbps?", "o": ["Compare delay, jitter, and loss along with available capacity. Mbps alone cannot explain delivery timing or missing voice packets.", "Compare that PC’s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains.", "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path."], "c": 0, "h": "Review the worked example: A call is sensitive to timely delivery; reliable file transfer can recover lost data over time."}, {"id": "network-basics/Hard/5", "q": "A wireless laptop cannot reach a local printer, but a wired PC can print and open websites.\nWhich explanation is supported by these facts?", "o": ["Local LAN communication can work without an internet connection.", "A working page does not prove the Wi-Fi path delivered it.", "The wired PC proves the printer works and at least one path to the internet works."], "c": 2, "h": "Separate seeing an SSID from successfully joining it."}, {"id": "network-basics/Hard/6", "q": "An office LAN connects through a provider to a branch LAN.\nWhich explanation is supported by these facts?", "o": ["The local copy may be limited by LAN links, storage, or endpoints rather than the ISP.", "The wired PC proves the printer works and at least one path to the internet works.", "Each local site has a LAN; the inter-site connection is a WAN function."], "c": 2, "h": "Review the worked example: Each local site has a LAN; the inter-site connection is a WAN function."}, {"id": "network-basics/Hard/7", "q": "A laptop browses websites but cannot print to a local printer.\nWhich explanation is supported by these facts?", "o": ["Working browsing does not establish that the printer service or local printer path works.", "Local LAN communication can work without an internet connection.", "Restoring the ISP cannot repair the PC-specific address error."], "c": 0, "h": "Review the worked example: Working browsing does not establish that the printer service or local printer path works."}, {"id": "network-basics/Hard/8", "q": "Several Wi-Fi clients stream at once and each slows down.\nWhich explanation is supported by these facts?", "o": ["Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client.", "Mbps describes capacity, not guaranteed delay or delivery.", "100 Mbps is nominal capacity; 70 Mbps is achieved throughput for that test."], "c": 0, "h": "Review the worked example: Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client."}, {"id": "network-basics/Hard/9", "q": "A voice call sounds choppy although a file eventually downloads correctly.\nWhich explanation is supported by these facts?", "o": ["The wired PC proves the printer works and at least one path to the internet works.", "A call is sensitive to timely delivery; reliable file transfer can recover lost data over time.", "The phone joins an access point. That Wi-Fi link is part of the home LAN."], "c": 1, "h": "Review the worked example: A call is sensitive to timely delivery; reliable file transfer can recover lost data over time."}, {"id": "network-basics/Hard/10", "q": "During a lab handover, someone asks: If two devices communicate inside your home, are they necessarily using the ISP? Which explanation should you give?", "o": ["No. Devices on the same LAN can communicate locally. They use a router and the ISP connection when reaching services beyond that local network.", "No. A service rule can limit the protocol and port, rather than allow every connection.", "No. It carries VLAN traffic. A routing function is needed to communicate between their networks."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "network-basics/Hard/11", "q": "You are explaining this topic to a colleague. Two laptops share files on the same home LAN. Must the files travel through the ISP?", "o": ["No, they can communicate inside the LAN.", "Only if both laptops use Wi-Fi.", "Yes, all network traffic uses the ISP."], "c": 0, "h": "Correct. Devices on the same LAN can exchange data locally, even without an internet connection."}], "Very Hard": [{"id": "network-basics/Very Hard/0", "q": "Design a comparison for two PCs: wired is stable; Wi-Fi calls fail mainly during large uploads.", "o": ["The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "Check printer power/address, same-LAN or routed reachability and isolation, then print service/queue. Do not infer a total ISP outage from one failed local service.", "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path."], "c": 3, "h": "Shared radio airtime and a congested upstream queue can both affect calls."}, {"id": "network-basics/Very Hard/1", "q": "All devices regain browsing except one after an outage. Choose a next test and explain why.", "o": ["Include times, affected locations/services, wired/Wi-Fi comparisons, local gateway results, and access-link observations if available. Ask the provider to investigate the shared path; do not declare an unobserved equipment failure.", "Compare that PC’s link, address, mask, gateway, and DNS with a working client. The shared outage may be fixed while a local fault remains.", "Compare local wired transfer, local wireless transfer, and an external download. Inspect endpoint/storage limits and link negotiation. An ISP upgrade is not evidence of a faster LAN.", "Check printer power/address, same-LAN or routed reachability and isolation, then print service/queue. Do not infer a total ISP outage from one failed local service."], "c": 1, "h": "Review the worked example: Restoring the ISP cannot repair the PC-specific address error."}, {"id": "network-basics/Very Hard/2", "q": "Design a Wi-Fi-only observation that avoids mistaking cellular success for LAN success.", "o": ["Temporarily disable cellular data for the test, verify the Wi-Fi join/IP settings and a page, then restore the prior cellular setting. Record the actual path and result.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path.", "The wired link avoids that radio contention. Wireless signal, interference, device capability, and test path can also differ; compare the same service and time."], "c": 0, "h": "Review the worked example: A working page does not prove the Wi-Fi path delivered it."}, {"id": "network-basics/Very Hard/3", "q": "Choose tests to distinguish an ISP bottleneck from a local file-transfer bottleneck.", "o": ["Compare local wired transfer, local wireless transfer, and an external download. Inspect endpoint/storage limits and link negotiation. An ISP upgrade is not evidence of a faster LAN.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path.", "Yes, if their local addressing, sharing service, and policy work. The ISP is not required for that local path."], "c": 0, "h": "Review the worked example: The local copy may be limited by LAN links, storage, or endpoints rather than the ISP."}, {"id": "network-basics/Very Hard/4", "q": "Write the evidence needed to escalate an area-wide issue without inventing the cause.", "o": ["Include times, affected locations/services, wired/Wi-Fi comparisons, local gateway results, and access-link observations if available. Ask the provider to investigate the shared path; do not declare an unobserved equipment failure.", "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path.", "Yes, if their local addressing, sharing service, and policy work. The ISP is not required for that local path."], "c": 0, "h": "Review the worked example: A shared provider/access issue is plausible but the exact failed component is unconfirmed."}, {"id": "network-basics/Very Hard/5", "q": "A 300 Mbps customer reports broken video calls. Downloads are fast, but calls show jitter and loss, especially on Wi-Fi.\nWhich explanation is supported by these facts?", "o": ["100 Mbps is nominal capacity; 70 Mbps is achieved throughput for that test.", "A shared provider/access issue is plausible but the exact failed component is unconfirmed.", "Mbps describes capacity, not guaranteed delay or delivery.", "Wireless clients compete for radio airtime; advertised internet capacity is not dedicated capacity per client."], "c": 2, "h": "Shared radio airtime and a congested upstream queue can both affect calls."}, {"id": "network-basics/Very Hard/6", "q": "The ISP link fails and one PC also has a bad local IP address.\nWhich explanation is supported by these facts?", "o": ["Mbps describes capacity, not guaranteed delay or delivery.", "The phone joins an access point. That Wi-Fi link is part of the home LAN.", "Restoring the ISP cannot repair the PC-specific address error.", "A working page does not prove the Wi-Fi path delivered it."], "c": 2, "h": "Review the worked example: Restoring the ISP cannot repair the PC-specific address error."}, {"id": "network-basics/Very Hard/7", "q": "A phone shows Wi-Fi but pages actually use cellular fallback.\nWhich explanation is supported by these facts?", "o": ["The local copy may be limited by LAN links, storage, or endpoints rather than the ISP.", "A working page does not prove the Wi-Fi path delivered it.", "A shared provider/access issue is plausible but the exact failed component is unconfirmed.", "The phone joins an access point. That Wi-Fi link is part of the home LAN."], "c": 1, "h": "Review the worked example: A working page does not prove the Wi-Fi path delivered it."}, {"id": "network-basics/Very Hard/8", "q": "A faster ISP plan leaves a slow local file copy unchanged.\nWhich explanation is supported by these facts?", "o": ["Each local site has a LAN; the inter-site connection is a WAN function.", "Mbps describes capacity, not guaranteed delay or delivery.", "The local copy may be limited by LAN links, storage, or endpoints rather than the ISP.", "Restoring the ISP cannot repair the PC-specific address error."], "c": 2, "h": "Review the worked example: The local copy may be limited by LAN links, storage, or endpoints rather than the ISP."}, {"id": "network-basics/Very Hard/9", "q": "Three homes on one street report failure; each can reach its own router.\nWhich explanation is supported by these facts?", "o": ["The phone joins an access point. That Wi-Fi link is part of the home LAN.", "A shared provider/access issue is plausible but the exact failed component is unconfirmed.", "The local copy may be limited by LAN links, storage, or endpoints rather than the ISP.", "Restoring the ISP cannot repair the PC-specific address error."], "c": 1, "h": "Review the worked example: A shared provider/access issue is plausible but the exact failed component is unconfirmed."}]}, "routers": {"Easy": [{"id": "routers/lesson-check/Easy/0", "q": "What is the main job of a router?", "o": ["Connect different IP networks and forward packets.", "Forward frames within one LAN using a MAC table.", "Resolve website names to IP addresses."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "routers/lesson-check/Easy/1", "q": "Why is data broken into packets?", "o": ["One message reserves the connection until all its data finishes.", "Different devices can take turns using the connection.", "Every message gets its own physical connection."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "routers/lesson-check/Easy/2", "q": "Where does a router read the destination IP address?", "o": ["In the packet header added by the sender.", "In the arriving frame’s source MAC field.", "In its own interface address instead of the packet."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "routers/lesson-check/Easy/3", "q": "Several installed routes match. Which wins?", "o": ["The most specific matching address group.", "The least specific matching address group.", "The default route even when a more specific route matches."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "routers/lesson-check/Easy/4", "q": "Who chooses the next connection at each routed hop?", "o": ["The first router chooses every later router’s output port.", "Each router checks its own routing table.", "The packet chooses a path without consulting a router."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "routers/lesson-check/Easy/5", "q": "What follows the server processing the request?", "o": ["The home router creates the requested webpage.", "The request is forwarded unchanged instead of producing a response.", "Response packets return for the laptop to process."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "routers/Hard/0", "q": "Inspect ipconfig and tracert example.com on your own Windows PC without changing settings.", "o": ["A timeout does not by itself prove a broken route. If browsing works, some traffic reaches the service; record the missing probe response separately from application success.", "Check the correct LAN interface, address/mask, and up/up state. Repair the interface fault rather than adding a redundant route blindly.", "Source addressing, NAT, return routes, and interface ACLs can differ. Test from the actual PC and inspect both source-specific paths."], "c": 0, "h": "Routers are not required to answer every diagnostic probe."}, {"id": "routers/Hard/1", "q": "Before adding a static route to a directly attached LAN, what should you inspect?", "o": ["Repeated failure of the intended application with known-good DNS/service, missing or incorrect routes, unreachable next hops, or interface evidence supports investigation. Asterisks alone do not establish the fault.", "Check the correct LAN interface, address/mask, and up/up state. Repair the interface fault rather than adding a redundant route blindly.", "A: ip route 192.168.20.0 255.255.255.0 10.0.0.2. B: ip route 192.168.10.0 255.255.255.0 10.0.0.1. PCs use their own LAN router addresses as gateways. Interfaces and local routes must also be working."], "c": 1, "h": "Review the worked example: Connected routes depend on operational interface state and addressing."}, {"id": "routers/Hard/2", "q": "Which routing tables must be checked in a three-router path?", "o": ["Yes, it is in 192.168.8.0/24; it must actually be assigned to the intended router and reachable.", "Compare PC mask/subnet and default gateway with the actual LAN router configuration. Then check routing and policy based on results.", "Check every router on the request path and the reply path, not only the source gateway; validate next-hop reachability too."], "c": 2, "h": "Review the worked example: A’s default route alone cannot give B a missing route."}, {"id": "routers/Hard/3", "q": "A PC reaches its neighbor but no remote subnet. Compare two settings first.", "o":
