 "255.255.255.252", "4", "2"]]}}, {"title": "Find the network containing a given host", "body": ["Take 192.168.50.77/26. The relevant blocks are 0–63, 64–127, 128–191 and 192–255. .77 belongs to 64–127.", "Therefore network = 192.168.50.64, broadcast = .127, usable range = .65–.126. .77 is a usable host. A gateway could be .65; .64 and .127 are not ordinary host choices."], "steps": ["Determine the block size from the mask/prefix.", "Find the block containing the address.", "Use its first address as the network and last as broadcast.", "Exclude those two addresses for the ordinary usable range.", "Check that the assigned gateway and all hosts fall within the planned usable range."]}, {"title": "Allocate VLSM: largest group first", "body": ["You own 192.168.50.0/24 and need 60, 30 and 12 usable addresses. These requirements must include router gateway addresses and any other interfaces that need addresses.", "Allocate a /26 for 60, /27 for 30 and /28 for 12. Place each at a valid prefix boundary after the preceding allocated block. You do not have to give every network the same mask."], "table": {"headers": ["Requirement", "Network", "Usable range", "Broadcast"], "rows": [["60", "192.168.50.0/26", ".1–.62", ".63"], ["30", "192.168.50.64/27", ".65–.94", ".95"], ["12", "192.168.50.96/28", ".97–.110", ".111"]]}, "check": {"question": "Would 192.168.50.80/27 be a valid new /27 network after .64/27?", "answer": "No. /27 boundaries advance by 32; .80 lies inside .64–.95. It would overlap rather than create a separate subnet."}}, {"title": "Configure the plan and verify boundaries", "body": ["In Packet Tracer, give each LAN its own router interface, switch and PC. Use the first usable address as gateway for this exercise and the next as the PC. Substitute available interface names on your lab router."], "commands": [{"label": "Example first LAN interface", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/0\n ip address 192.168.50.1 255.255.255.192\n no shutdown\nend\nshow ip interface brief\nshow ip route", "expected": "Interface should be up/up when its cable/peer are working; the connected route is 192.168.50.0/26. Configure other LAN interfaces with .65/27 and .97/28, then verify their distinct connected routes."}], "steps": ["Set each PC address, mask and correct LAN gateway.", "Ping local gateway first, then hosts on the other LANs.", "Give one PC the wrong mask and predict its local/remote decision before retesting.", "Repair the mask and compare both forward and return paths."]}, {"title": "Recognize the special cases", "body": ["The subtract-two rule applies to ordinary multiaccess IPv4 subnets. A /31 can use both addresses on a supported point-to-point link; it does not behave like an ordinary LAN network/broadcast pair.", "A /32 names one IPv4 address and is useful as a host route or a loopback address. It is not an ordinary LAN pool. Practice recognizing these cases rather than applying the ordinary host-count rule everywhere."]}], "mastery": ["Calculate network, broadcast, mask, range and host capacity.", "Allocate aligned, non-overlapping VLSM networks.", "Configure the plan and explain failures caused by an incorrect mask."]}, "ipv6": {"title": "Read and build a dual-stack routed network", "objectives": "CCNA 1.8–1.9, 3.3 · IPv6 addresses, discovery and static routes", "intro": "IPv6 has 128-bit addresses. It still uses networks, routes and next hops, but its address notation and local discovery are different from IPv4. Dual stack means using IPv4 and IPv6 together, not converting one address into the other.", "sections": [{"title": "Read the address without losing its meaning", "body": ["An IPv6 address has eight groups of hexadecimal digits. Leading zeros within a group can be omitted. One continuous run of all-zero groups can be shortened to ::, but :: may appear only once in an address.", "2001:0db8:0001:0000:0000:0000:0000:0010 becomes 2001:db8:1::10. Expanding it restores eight groups. The /64 prefix used in this LAN exercise leaves 64 bits for the interface identifier."], "table": {"headers": ["Type", "Recognize", "Scope or purpose"], "rows": [["Global unicast", "Typically 2000::/3", "Globally unique/routable addresses; 2001:db8::/32 is reserved for documentation"], ["Unique local", "fc00::/7; common locally assigned form fd…", "Private/local organizational use"], ["Link-local", "fe80::/10", "Only the local link; used for neighbor/router communication"], ["Multicast", "ff00::/8", "Deliver to a group; IPv6 has no broadcast"], ["Anycast", "An address assigned to multiple interfaces", "Routing delivers to one member, usually the nearest by routing cost"], ["Loopback", "::1", "The local host"]]}}, {"title": "Discover neighbors and obtain settings", "body": ["IPv6 Neighbor Discovery uses ICMPv6 instead of ARP. Neighbor Solicitation and Advertisement support finding the next hop's link address. Router Advertisements identify routers and can announce prefixes and configuration information.", "SLAAC lets a host form an address using advertised information. DHCPv6 can provide addresses or other settings depending on the design; the normal IPv6 default-router information comes from Router Advertisements, not a DHCPv6 default-gateway option.", "One interface may have a global address and link-local address at the same time. Link-local addresses can repeat on different links, so using one as a static-route next hop requires an outgoing interface to identify the link.", "Modified EUI-64 can form an interface identifier from a 48-bit MAC: split it, insert FFFE in the middle and invert the U/L bit in the first byte. It is one method, not a rule that every modern host uses; stable/privacy identifiers are common."], "check": {"question": "Can a router forward a packet addressed to a remote network's link-local address?", "answer": "No. Link-local scope ends at the local link. Use an appropriate routable destination and a route to its prefix."}}, {"title": "Address both routers and LANs", "body": ["Use R1 and R2 with one LAN each and a transit link. R1 LAN = 2001:db8:10::/64, R2 LAN = 2001:db8:20::/64, transit = 2001:db8:12::/64. Give R1 transit ::1 and R2 transit ::2. PCs use ::10 in their respective LANs and gateway ::1 for this manual exercise."], "commands": [{"label": "R1 — fresh two-interface lab router", "text": "enable\nconfigure terminal\nipv6 unicast-routing\ninterface GigabitEthernet0/0\n ipv6 address 2001:db8:10::1/64\n no shutdown\ninterface GigabitEthernet0/1\n ipv6 address 2001:db8:12::1/64\n no shutdown\nend", "expected": "Enable IPv6 forwarding and both interfaces. R2 uses 2001:db8:20::1/64 on G0/0 and 2001:db8:12::2/64 on G0/1 with the same forwarding/no-shutdown settings."}, {"label": "Reciprocal IPv6 routes — R1 then R2", "text": "! R1: global configuration mode\nipv6 route 2001:db8:20::/64 2001:db8:12::2\n! R2: global configuration mode\nipv6 route 2001:db8:10::/64 2001:db8:12::1", "expected": "Each router needs a usable next hop and a route back to the other LAN. These lines belong on different routers, not both on one router."}, {"label": "Verify in privileged EXEC mode", "text": "show ipv6 interface brief\nshow ipv6 route\nshow ipv6 neighbors\nping 2001:db8:20::10", "expected": "On R1, a static route should cover the remote /64. Neighbor entries describe local-link neighbors, not an inventory of every remote endpoint. Allow discovery to complete, then test both directions."}]}, {"title": "Break and repair one IPv6 dependency", "body": ["In your saved lab, remove R2's route back to 2001:db8:10::/64. R1 may still list an outward route, but the PC-to-PC reply cannot reach the first LAN through this isolated topology."], "steps": ["Check local gateway reachability on both PCs.", "Inspect both routing tables and compare the destination prefixes.", "Restore the missing reciprocal route and retest.", "Then test a next hop written as a link-local address: supply the correct outgoing interface rather than assuming the address identifies a global location."]}], "mastery": ["Expand/compress addresses and recognize types/scopes.", "Explain NDP, SLAAC, DHCPv6 and EUI-64 without confusing their roles.", "Build and verify IPv6 LAN/transit interfaces and reciprocal routes."]}, "routing": {"title": "Read a routing table, choose a path and configure the routes", "objectives": "CCNA 3.1–3.3 · Routing table, forwarding decisions, IPv4/IPv6 static routes", "intro": "A route describes a destination network and how to reach it. Read the entry correctly, distinguish route installation from packet forwarding, and then prove that traffic can travel in both directions.", "sections": [{"title": "Read an actual-looking route entry", "body": ["This is an illustrative IOS route line, not output collected from your network. Different IOS releases arrange some details differently. Read every field rather than treating the whole line as one address."], "commands": [{"label": "Example route entry", "text": "O 192.168.20.0/24 [110/2] via 10.0.0.2, 00:00:12, GigabitEthernet0/1", "expected": "O identifies OSPF. The destination is the complete /24 network; 10.0.0.2 is the next router, not the final server."}], "table": {"headers": ["Field", "Example", "Meaning"], "rows": [["Source code", "O", "OSPF learned this route; C = connected, L = local interface, S = static"], ["Network/prefix", "192.168.20.0/24", "Destination range; mask = 255.255.255.0"], ["Administrative distance", "110", "Local preference for this route source"], ["Metric", "2", "OSPF path cost here, not milliseconds or universal hop count"], ["Next hop", "10.0.0.2", "Neighbor toward the destination"], ["Age", "00:00:12", "Time information shown for this learned entry"], ["Outgoing interface", "GigabitEthernet0/1", "Local connection used to forward"]]}, "check": {"question": "Does the L /32 route for the router's own interface mean every connected host is reached through that /32?", "answer": "No. L identifies the router's own address. The C connected prefix covers the subnet's other addresses."}}, {"title": "Two decisions: install routes, then forward packets", "body": ["A routing protocol selects its candidate paths using its own metric. If different sources offer the same network and prefix length, administrative distance helps select the source for installation. Typical Cisco defaults include connected 0, static 1 and OSPF 110; lower is preferred.", "Once routes are installed, the forwarding lookup uses the longest matching prefix. A more specific installed /25 beats an overlapping /24 for matching destinations even if the /24 has a lower administrative distance.", "OSPF cost can compare OSPF paths; it is not directly interchangeable with another protocol's metric. Equal-cost paths can both be installed when the routing process/platform supports them. An unusable next hop can keep a static route out of the table."], "table": {"headers": ["Installed prefix", "Next hop", "Destination .20.150 matches?"], "rows": [["0.0.0.0/0", "10.0.0.2", "Yes"], ["192.168.20.0/24", "10.0.0.2", "Yes"], ["192.168.20.128/25", "10.0.1.2", "Yes — chosen"], ["192.168.20.150/32", "10.0.2.2", "Yes — chosen instead if installed"]]}, "steps": ["For .20.100, choose the /24 because it is outside the /25 range .128–.255.", "For .20.150, choose /25 when the /32 is absent; choose /32 when that host route is installed.", "For an unrelated destination, use /0 if it is installed and usable.", "If no installed route matches, the router cannot forward that packet. A default route is not automatically created by having a cable."]}, {"title": "Build the two-branch topology", "body": ["Create a fresh Packet Tracer file with R1, R2, two switches and two PCs. Use routers with G0/0 and G0/1, or adapt names after show ip interface brief. PCs: A = 192.168.10.10/24 gateway .10.1; B = 192.168.20.10/24 gateway .20.1.", "LAN A attaches to R1 G0/0; LAN B to R2 G0/0. Join G0/1 interfaces with 10.0.0.0/30: R1 .1, R2 .2. Both directions are needed."], "flow": ["PC A · .10.10/24", "R1 · LAN .10.1 / transit 10.0.0.1", "R2 · transit 10.0.0.2 / LAN .20.1", "PC B · .20.10/24"], "commands": [{"label": "R1 — configure interfaces and remote network route", "text": "enable\nconfigure terminal\nhostname R1\ninterface GigabitEthernet0/0\n ip address 192.168.10.1 255.255.255.0\n no shutdown\ninterface GigabitEthernet0/1\n ip address 10.0.0.1 255.255.255.252\n no shutdown\nexit\nip route 192.168.20.0 255.255.255.0 10.0.0.2\nend", "expected": "R1 has two connected prefixes and one static route to R2's LAN."}, {"label": "R2 — configure the reciprocal path", "text": "enable\nconfigure terminal\nhostname R2\ninterface GigabitEthernet0/0\n ip address 192.168.20.1 255.255.255.0\n no shutdown\ninterface GigabitEthernet0/1\n ip address 10.0.0.2 255.255.255.252\n no shutdown\nexit\nip route 192.168.10.0 255.255.255.0 10.0.0.1\nend", "expected": "R2 has the return route. Set both PC gateways before the end-to-end ping."}], "steps": ["Ping each PC's local gateway.", "Ping the transit neighbor from each router.", "Use show ip route; identify C, L and S entries.", "Ping between the two PCs in both directions; an initial ARP-related timeout can occur, so inspect and repeat.", "Remove only R2's return route in the lab, predict the failure, then restore it. Save the working configuration with copy running-config startup-config."]}, {"title": "Default, network, host and floating routes", "body": ["A network route reaches a range; a host route names one destination; a default route is the least-specific fallback. A floating route has a higher administrative distance than the preferred source for the same prefix.", "For a real backup lab, add a second R1–R2 transit link: G0/2 addresses 10.0.1.1/30 and 10.0.1.2/30, with no shutdown. A higher distance does not monitor every remote failure. The primary must actually be withdrawn or tracked appropriately before the backup can replace it."], "commands": [{"label": "R1 route forms — independent examples, global configuration mode", "text": "! Network route already in the base lab\nip route 192.168.20.0 255.255.255.0 10.0.0.2\n! Host-route exercise: one server only\nip route 192.168.20.20 255.255.255.255 10.0.0.2\n! Separate default-route exercise\nip route 0.0.0.0 0.0.0.0 10.0.0.2\n! Backup /24, after second-link interfaces exist\nip route 192.168.20.0 255.255.255.0 10.0.1.2 200", "expected": "A default entry is usually S* and may establish the gateway of last resort. The /24 primary uses default AD 1; the same-prefix backup uses 200."}, {"label": "R2 reciprocal backup; then verification on both", "text": "! R2: global configuration mode\nip route 192.168.10.0 255.255.255.0 10.0.1.1 200\n! Privileged EXEC on each router\nshow ip route\nshow running-config\nshow ip interface brief", "expected": "Shut the primary transit interface in the lab. Its next hop becomes unavailable; the usable backup /24 should be installed. Verify both directions, then no shutdown to restore the primary."}], "check": {"question": "A /25 remains installed but the application behind it fails. Will the router automatically try its /24?", "answer": "No. Longest-prefix forwarding still selects the installed /25. Diagnose its path; route withdrawal/tracking, not application failure alone, changes the lookup."}}, {"title": "IPv6 uses the same routing logic with different syntax", "body": ["First build the IPv6 interfaces from the IPv6 walkthrough. R1's transit neighbor is 2001:db8:12::2; the remote LAN is 2001:db8:20::/64. Add a second transit 2001:db8:13::/64 for the backup exercise.", "The following are route forms, not a command bundle to apply blindly. Test one form at a time, keeping the remote router's return route. A link-local next hop also needs an outgoing interface."], "commands": [{"label": "R1 — IPv6 route forms in global configuration mode", "text": "ipv6 route 2001:db8:20::/64 2001:db8:12::2\nipv6 route 2001:db8:20::20/128 2001:db8:12::2\nipv6 route ::/0 2001:db8:12::2\n! After second transit is addressed and up\nipv6 route 2001:db8:20::/64 2001:db8:13::2 200\n! Alternative link-local next-hop form; use actual neighbor\n! ipv6 route 2001:db8:20::/64 GigabitEthernet0/1 fe80::2", "expected": "Use show ipv6 route and show ipv6 neighbors. Configure R2's reciprocal primary/backup routes for 2001:db8:10::/64 via the corresponding ::1 transit neighbors, then test both PCs."}]}, {"title": "Troubleshoot using evidence", "body": ["Start with addresses, masks and interface state. Then confirm next-hop reachability, matching route, return route and filtering. A visible command in running-config is not proof the route is installed; an installed route is not proof a server application works."], "steps": ["Use show ip interface brief / show ipv6 interface brief.", "Use show ip route / show ipv6 route to locate the selected prefix.", "Ping the local next hop and destination, with source selection appropriate to the problem.", "Use traceroute in IOS or tracert on Windows to observe responding hops; filtering can hide a working hop.", "Inspect policy and the service itself after basic routing is verified."]}], "mastery": ["Interpret every major route-entry field.", "Explain longest prefix versus AD versus protocol metric.", "Configure and verify IPv4/IPv6 network, host, default and floating routes with return paths."]}, "ospf": {"title": "Learn routes with OSPF and keep the gateway role available", "objectives": "CCNA 3.4–3.5 · Single-area OSPFv2 and first-hop redundancy concepts", "intro": "Static routes are instructions you enter. OSPFv2 lets IPv4 routers exchange link-state information and calculate routes. Gateway redundancy is a different problem: keeping a usable first hop available to hosts when one router fails.", "sections": [{"title": "Understand the roles before enabling OSPF", "body": ["Neighbors exchange Hello messages. Compatible routers can form an adjacency and synchronize link-state information. Each router calculates paths through the topology using OSPF costs; OSPF is not simply a request to copy every neighbor's routing table.", "The router ID is a unique 32-bit identifier written like an IPv4 address; it need not be the address of the link carrying traffic. Set it deliberately before forming adjacencies in this fresh lab. The process number is local: process 1 on R1 can communicate with process 7 on R2.", "This exercise places all participating links in area 0. Read area, network type, timers and subnet settings when troubleshooting neighbors. Cost is normally based on configured/reference bandwidth; cost is not a measurement of current delay."], "flow": ["Discover neighbor", "Form appropriate adjacency", "Exchange link-state information", "Calculate paths", "Install usable OSPF routes"]}, {"title": "Replace the two-branch static routes with OSPF", "body": ["Reuse the saved IPv4 two-branch lab from Routing. Use only the primary transit, remove the reciprocal /24 static routes, and remove any additional host/default/backup route exercises that would hide the OSPF behavior. Do this in the simulator.", "The transit Ethernet link has exactly two routers, so set its OSPF network type to point-to-point on both. LAN interfaces are passive: their prefixes are advertised while Hellos are suppressed toward PCs."], "commands": [{"label": "R1 — global/interface configuration", "text": "enable\nconfigure terminal\nno ip route 192.168.20.0 255.255.255.0 10.0.0.2\nrouter ospf 1\n router-id 1.1.1.1\n passive-interface GigabitEthernet0/0\n network 192.168.10.0 0.0.0.255 area 0\n network 10.0.0.0 0.0.0.3 area 0\nexit\ninterface GigabitEthernet0/1\n ip ospf network point-to-point\nend", "expected": "The network commands match local interface addresses and enable OSPF in the specified area; they are not remote-destination static routes."}, {"label": "R2 — reciprocal OSPF configuration", "text": "enable\nconfigure terminal\nno ip route 192.168.10.0 255.255.255.0 10.0.0.1\nrouter ospf 1\n router-id 2.2.2.2\n passive-interface GigabitEthernet0/0\n network 192.168.20.0 0.0.0.255 area 0\n network 10.0.0.0 0.0.0.3 area 0\nexit\ninterface GigabitEthernet0/1\n ip ospf network point-to-point\nend", "expected": "Both transit interfaces participate in area 0. Distinct router IDs identify the routers."}, {"label": "Verify on both routers", "text": "show ip ospf neighbor\nshow ip ospf interface\nshow ip protocols\nshow ip route ospf\nping 192.168.20.10", "expected": "R1 should show the R2 neighbor FULL on the point-to-point link and an O route to 192.168.20.0/24. R2 should learn the reciprocal LAN. Exact costs/ages vary; test from both PCs too."}]}, {"title": "Broadcast segments, DR and BDR", "body": ["In a separate exercise, connect three routers through a switch on one shared Ethernet subnet, such as 10.0.2.0/24. Keep the default broadcast OSPF network type and enable area 0 on that segment.", "A Designated Router (DR) and Backup Designated Router (BDR) organize adjacency and link-state exchange on the segment. They are not automatically the host's default gateway, the best internet exit or a router for every packet.", "Eligible interface priority is considered first, then router ID; priority 0 makes a router ineligible. The ordinary election is non-preemptive: a later router with higher priority does not instantly replace a functioning DR.", "DROTHER routers normally form FULL adjacencies with the DR/BDR. Two DROTHER routers can legitimately remain 2-WAY with each other. A point-to-point OSPF link has no DR/BDR election."], "steps": ["Record show ip ospf neighbor and show ip ospf interface for every router.", "Identify DR, BDR and DROTHER roles from actual output.", "Shut the DR's OSPF link in the separate lab; observe the role change and recovery.", "Restore the link and explain why the original DR is not guaranteed to reclaim the role immediately."]}, {"title": "Break an adjacency and repair the cause", "body": ["Change R2's transit network statement from area 0 to area 1 in the simulator, leaving R1 in area 0. The expected adjacency no longer forms on that link. A device can have a working Ethernet link but no working OSPF relationship."], "steps": ["Confirm interfaces are up and transit IPv4 addresses are in the same subnet.", "Compare OSPF area, network type and hello/dead intervals on both sides.", "Check that the transit interface is not accidentally passive.", "Check unique router IDs and matching authentication if configured.", "Restore area 0, verify FULL, then verify the learned remote prefix and PC-to-PC traffic."], "check": {"question": "Does a FULL neighbor prove every remote application works?", "answer": "No. Verify the learned destination route, return path, host settings, policy and service. Adjacency proves a narrower condition."}}, {"title": "Understand gateway redundancy separately", "body": ["A PC normally has one default-gateway address. With two gateway routers on the same LAN, a first-hop redundancy protocol provides a shared virtual gateway IP and virtual MAC. The host uses that stable gateway while routers coordinate which one forwards.", "For an HSRP example, R1 real address = 192.168.10.2, R2 = .3 and virtual gateway = .1. Hosts use .1. HSRP has active and standby roles; VRRP uses master/backup terminology. Protocol timers and conditions affect takeover, so failover is not necessarily lossless.", "Both routers need usable routes toward the destination and a valid return path. Two gateways behind one failed switch or one failed upstream circuit do not solve that common failure. Tracking can reduce a router's priority when an upstream condition fails; changing priority/preemption affects which device takes the role.", "For CCNA v1.1, this objective asks you to describe purpose, functions and concepts. The OSPF objective also requires configuration and verification; do not treat merely knowing either name as mastery."], "flow": ["PC gateway = virtual .1", "Active gateway forwards", "Standby observes health", "Failure detected", "Standby takes virtual role"], "steps": ["Draw one LAN with two gateways and a remote destination. Label real IPs and the shared virtual IP.", "Explain which address belongs in the PC's default-gateway field.", "Predict the effect of losing the active router versus losing their shared switch.", "Describe the checks needed to prove traffic works after takeover, including routes, NAT/firewall state where applicable and both directions."], "check": {"question": "Is the OSPF DR the same thing as an HSRP active gateway?", "answer": "No. DR organizes OSPF adjacency on a broadcast segment. HSRP supplies a resilient first-hop gateway to hosts."}}], "mastery": ["Configure and verify area-0 OSPFv2 on a two-router link.", "Interpret IDs, costs, network types, DR/BDR roles and normal neighbor states.", "Explain virtual gateways, failover and remaining shared failure points."]}, "services": {"title": "Make the routed connection useful: addresses, translation and traffic handling", "objectives": "CCNA 4.1–4.9 · NAT, DHCP/DNS, QoS and network operations", "intro": "Routing moves packets, but successful applications also depend on addresses, name resolution, permitted traffic and useful monitoring. Learn each service's job, configure the exam-required functions, and test them separately.", "sections": [{"title": "DHCP supplies settings; DNS resolves names", "body": ["A DHCPv4 exchange is commonly remembered as Discover, Offer, Request, Acknowledge. A lease supplies a client address and settings such as mask, gateway and DNS. A lease is time-limited; renewal and a correct pool matter.", "DNS answers questions about names, including address records. A DHCP server can tell a client which DNS server to use, but DHCP does not itself resolve the website name. A DNS response is not proof that routing or the webpage service works."], "flow": ["Obtain lease", "Reach gateway", "Reach DNS", "Resolve name", "Reach server's service"], "check": {"question": "The client has a correct lease but the website name resolves to the wrong server. Which dependency should you fix?", "answer": "The DNS record/settings. Preserve the working DHCP configuration and prove name resolution separately."}}, {"title": "Configure a local DHCP pool", "body": ["Fresh simulator topology: router G0/0 = 192.168.10.1/24, one switch, client PC set to DHCP, and optional DNS Server = .20/24 gateway .1. Configure the server's DNS service and a lab record before expecting name lookup to work.", "Reserve .1–.20 so fixed router/server addresses are outside the lease range. One pool must match the subnet in which the client is obtaining its lease."], "commands": [{"label": "Router — configure LAN and DHCP service", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/0\n ip address 192.168.10.1 255.255.255.0\n no shutdown\nexit\nip dhcp excluded-address 192.168.10.1 192.168.10.20\nip dhcp pool HOME-LAB\n network 192.168.10.0 255.255.255.0\n default-router 192.168.10.1\n dns-server 192.168.10.20\nend\nshow ip dhcp pool\nshow ip dhcp binding", "expected": "A DHCP client should receive a unique usable .10.x address outside the reserved range, correct /24 mask, gateway .1 and DNS .20."}, {"label": "Client verification", "text": "ipconfig /all\nping 192.168.10.1\nnslookup study.example", "expected": "Use the client tools available in your simulator. Lease fields prove DHCP settings; the name lookup needs an enabled DNS service and matching record."}], "steps": ["Release/renew the lease or select DHCP again on the simulated PC.", "Compare the actual lease with the intended network, gateway and DNS.", "Inspect the router's bindings and pool availability.", "Change the pool's default-router to a wrong subnet in the lab; observe why a valid-looking lease does not prove remote access. Restore it and renew."]}, {"title": "Relay DHCP across a router; configure a DHCP client", "body": ["In a separate saved lab, put the client in 192.168.10.0/24 and the Server in 192.168.20.0/24. Router interfaces are .10.1 and .20.1; Server is .20.20/24 gateway .20.1. In Server Services, create a DHCP pool for the client LAN: gateway .10.1, mask /24, free range beginning .10.21 and an appropriate DNS server.", "A client broadcast is local. The relay on the client-facing router interface carries requests to the remote server and identifies the client network. The server must have the correct pool and a return path. Use either the local-router pool exercise or this remote-server exercise, not both active on the same test LAN."], "commands": [{"label": "Relay router — client-facing interface", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/0\n ip address 192.168.10.1 255.255.255.0\n ip helper-address 192.168.20.20\n no shutdown\ninterface GigabitEthernet0/1\n ip address 192.168.20.1 255.255.255.0\n no shutdown\nend", "expected": "Renew the PC lease; it must belong to .10.0/24, not the server's .20.0/24. Verify both router interfaces and the server's gateway."}, {"label": "Separate DHCP-client exercise — interface connected to a lab DHCP provider", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/1\n ip address dhcp\n no shutdown\nend\nshow ip interface brief\nshow ip route", "expected": "Use a fresh router/topology for this exercise; this replaces that interface's static address. Confirm the learned address and inspect any supplied/default route rather than assuming one exists."}], "steps": ["Remove the helper in the relay lab and renew the client; predict no remote offer.", "Restore the helper on the client-facing interface.", "If a lease still fails, inspect server service/pool, interface state, return route and filtering."]}, {"title": "NAT: name the addresses before changing them", "body": ["NAT translates addresses; PAT also uses transport identifiers such as ports to let many sessions share an address. Translation does not create a missing route and does not replace a firewall.", "Inside local is the inside host's address before translation. Inside global is the address representing that host to the outside. For this lab, .10.20 can appear outside as 203.0.113.10.", "Build a new NAT lab: PC .10.10 and inside Server .10.20 connect through a switch to EDGE G0/0 .10.1/24. EDGE G0/1 = 203.0.113.1/24 connects to PROVIDER G0/0 = 203.0.113.2/24. PROVIDER G0/1 = 198.51.100.1/24 connects to outside Server .100.10 and PC .100.20, both gateway .100.1. These are documentation addresses for a simulated internet, not real internet access."], "flow": ["Inside PC · 192.168.10.10", "EDGE · inside / outside", "PROVIDER · 203.0.113.2", "Outside server · 198.51.100.10"], "commands": [{"label": "EDGE — base NAT topology setup", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/0\n ip address 192.168.10.1 255.255.255.0\n ip nat inside\n no shutdown\ninterface GigabitEthernet0/1\n ip address 203.0.113.1 255.255.255.0\n ip nat outside\n no shutdown\nexit\nip route 0.0.0.0 0.0.0.0 203.0.113.2\nend", "expected": "Configure PROVIDER's two interfaces with the stated addresses and no shutdown. Configure endpoint masks/gateways and enable HTTP on the servers. Save a clean base file to clone for the next three alternatives."}]}, {"title": "Configure static NAT, a dynamic pool and PAT", "body": ["Use separate copies of the clean base NAT file for each alternative. Global addresses .10, .100 and .101 must be unused. They are on the provider-facing subnet in this simulator example; other designs require upstream routing toward the translation block.", "Static NAT is a fixed one-to-one mapping. Dynamic NAT allocates an available global address from a pool; without overload, the pool can run out of simultaneous address mappings. PAT allows multiple inside sessions to share the outside interface address using session identifiers."], "commands": [{"label": "Alternative A — static mapping, EDGE global configuration", "text": "ip nat inside source static 192.168.10.20 203.0.113.10", "expected": "From outside PC 198.51.100.20, request http://203.0.113.10 with HTTP enabled on the inside server. Inspect translations and both paths; whether access is permitted also depends on any configured policy."}, {"label": "Alternative B — dynamic NAT pool, EDGE global configuration", "text": "access-list 1 permit 192.168.10.0 0.0.0.255\nip nat pool LAB-PUBLIC 203.0.113.100 203.0.113.101 netmask 255.255.255.0\nip nat inside source list 1 pool LAB-PUBLIC", "expected": "Generate traffic from inside endpoints toward the outside server. The NAT ACL identifies sources eligible for translation; it is not an interface security ACL. Inspect allocated mappings; two globals do not provide an unlimited pool."}, {"label": "Alternative C — PAT, EDGE global configuration", "text": "access-list 1 permit 192.168.10.0 0.0.0.255\nip nat inside source list 1 interface GigabitEthernet0/1 overload", "expected": "Two inside clients can generate traffic using 203.0.113.1 with distinct session identifiers. Test from endpoints, not only with a ping originating on the EDGE router."}, {"label": "Verification — privileged EXEC mode", "text": "show ip nat translations\nshow ip nat statistics\nshow ip route\nshow access-lists", "expected": "Translations generally appear after matching traffic, except configured static entries. An empty dynamic table before a test is not automatically a fault. Correlate inside/outside interface roles, ACL matches, route and service results."}], "steps": ["In a clone, reverse an interface's inside/outside role and record the failure.", "Restore the correct role and retest a fresh client session.", "For a pool test, distinguish pool exhaustion from an incorrect default route.", "Explain why a working NAT mapping cannot override an ACL that blocks the application."]}, {"title": "QoS: walk a packet through a busy connection", "body": ["Imagine a voice call and a large file transfer sharing a 10 Mbps exit. When demand exceeds the exit rate, packets queue or are dropped. QoS changes treatment of selected traffic; it does not manufacture bandwidth or eliminate all delay.", "Classify packets into groups using agreed criteria, such as source/service. Mark them with a label such as DSCP. A marking is information for policy; downstream devices must actually apply/trust that policy for useful treatment.", "Queue packets when they cannot be transmitted immediately. Scheduling chooses which queue is served next. A bounded priority queue can protect time-sensitive voice while other queues still need service. Congestion can overflow queues; congestion-avoidance policies can drop selected traffic before a queue is completely full.", "Policing measures traffic against a rate/burst policy and applies configured actions, often dropping or remarking excess traffic. Shaping buffers/delays traffic to smooth it to a configured average rate; full buffers can still cause drops. Shaping introduces delay and is generally used on output.", "For CCNA v1.1, describe classification, marking, queuing, congestion, policing and shaping and their per-hop effects. Platform-specific QoS configuration is beyond what this particular objective's verb requires."], "flow": ["Classify / mark", "Police where configured", "Queue / shape where configured", "Schedule output"], "table": {"headers": ["Scenario", "Reasoning"], "rows": [["Voice sounds choppy during backups", "Examine congestion, loss, latency and jitter; priority treatment may help"], ["ISP polices above 10 Mbps", "Excess can be dropped/remarked by its policy"], ["Your router shapes to 10 Mbps", "Packets are buffered/delayed to smooth output"], ["All traffic marked high priority", "Labels do not distinguish the traffic needing preferential treatment"], ["Quiet link, application still slow", "Look at endpoints, remote path and application too"]]}, "check": {"question": "Which normally delays excess traffic rather than immediately dropping it: shaping or policing?", "answer": "Shaping buffers/delays to regulate output. Policing takes the configured conform/exceed/violate actions, commonly dropping or remarking excess traffic."}}, {"title": "Verify the supporting operations services", "body": ["Use time, logs and counters to explain events, not only to collect command output. NTP synchronizes clocks; syslog records events; SNMP supports management queries/notifications. A monitoring service does not automatically prevent faults.", "In the NAT or service lab, add an NTP-enabled Server at a reachable address such as 192.168.10.20. Confirm its service is enabled before pointing the router at it."], "commands": [{"label": "Example NTP client — router global configuration then EXEC", "text": "enable\nconfigure terminal\nntp server 192.168.10.20\nend\nshow ntp associations\nshow ntp status", "expected": "A reachable, compatible server and time to synchronize are needed. To practice server mode on a separate supported lab router, configure ntp master 3 and point the client at that router; an unsynchronized lab master is not a trusted real-world time source."}], "table": {"headers": ["Service", "What to understand", "Useful verification"], "rows": [["NTP", "Clients synchronize to servers; stratum describes distance from a reference", "Associations, synchronization status, time"], ["Syslog", "Facility identifies message category; severity 0–7 runs most urgent to debugging", "Timestamps, message severity, destination/configuration"], ["SNMP", "Manager queries agents/MIB objects; notifications report events", "Manager/agent reachability and supported permissions/version"], ["TFTP", "Simple UDP file transfer, normally port 69 for initial request; no built-in authentication", "Reachability, correct filename, transfer result"], ["FTP", "TCP file transfer with login and separate control/data behavior; traditional FTP is unencrypted", "Credentials, permissions, control/data reachability"]]}, "steps": ["Correlate an interface-down event with timestamps and severity in logs.", "Distinguish 'server reachable' from 'service configured and responding'.", "For file transfers, verify the result rather than assuming a command's acceptance proves success."]}], "mastery": ["Configure and verify DHCP client/relay, plus explain DNS.", "Configure and test static NAT and dynamic pools; distinguish PAT.", "Describe the six QoS behaviors in a real congestion scenario.", "Understand and verify supporting operations services at their exam-required depth."]}, "security": {"title": "Apply access rules, predict the result and verify the evidence", "objectives": "CCNA 5.3, 5.6 · Device access and IPv4 ACL configuration/verification", "intro": "Routing decides where a packet could go. Access rules decide whether the packet is permitted at a policy point. Write the intended rule in plain language before turning it into commands.", "sections": [{"title": "Understand match, order, direction and default", "body": ["A standard IPv4 ACL matches source IPv4 address. An extended ACL can also match destination, protocol and ports. Rules are checked in order and stop at the first match. An implicit deny follows the listed entries.", "Inbound/outbound describes the router interface's viewpoint, not a universal direction toward the internet. Inbound on the client-facing interface checks packets arriving from clients before routing them onward.", "A wildcard mask identifies address bits that may vary: 0.0.0.255 with 192.168.10.0 covers that /24. A host keyword matches one address. An ACL is normally stateless; it does not automatically learn every session like a stateful firewall."], "table": {"headers": ["Policy phrase", "Example match"], "rows": [["Source LAN", "192.168.10.0 0.0.0.255"], ["One server", "host 192.168.20.20"], ["Web traffic in this HTTP lab", "tcp … eq 80"], ["Anything not explicitly permitted", "Implicit deny"]]}}, {"title": "Build and prove the unfiltered lab first", "body": ["Fresh topology: one router with G0/0 = 192.168.10.1/24 and G0/1 = 192.168.20.1/24, each connected through a switch. Client = .10.10/24 gateway .10.1. Server = .20.20/24 gateway .20.1; enable HTTP.", "With both interfaces up, the router has both LANs directly connected. It needs no static route between these two directly connected networks. Verify ping and http://192.168.20.20 before applying an ACL; otherwise you cannot know whether the rule caused the failure."], "steps": ["Check addresses/masks/gateways and interface state.", "Test client → server ping and HTTP.", "Write the intended policy: permit client-LAN HTTP to this server; deny other arriving client-LAN traffic.", "Predict ping will fail after the rule while the permitted HTTP request should still work."]}, {"title": "Configure and verify an extended ACL", "body": ["Apply the rule only on the client-facing interface inbound for this exercise. The HTTP request matches the permit. Ping matches the explicit deny. The return server traffic arrives on the other interface and is not checked by this particular inbound ACL."], "commands": [{"label": "Router — named extended ACL and attachment", "text": "enable\nconfigure terminal\nip access-list extended LAB-WEB-ONLY\n permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.20 eq 80\n deny ip any any\nexit\ninterface GigabitEthernet0/0\n ip access-group LAB-WEB-ONLY in\nend\nshow access-lists\nshow ip interface GigabitEthernet0/0", "expected": "After tests, the HTTP permit and ping deny counters should provide evidence. Existing cache/sessions can confuse tests; create a fresh request and inspect counts."}, {"label": "Remove the attachment for a controlled comparison", "text": "enable\nconfigure terminal\ninterface GigabitEthernet0/0\n no ip access-group LAB-WEB-ONLY in\nend", "expected": "The ACL definition still exists, but this interface no longer applies it. Retest and compare. Reattach to restore the intended lab policy."}], "check": {"question": "If deny ip any any appears before the HTTP permit, does the later permit rescue HTTP?", "answer": "No. The first matching deny ends evaluation. Fix the rule order and verify with new traffic/counters."}}, {"title": "Practice standard ACLs and diagnose placement", "body": ["Clone the unfiltered lab. A standard ACL can distinguish source networks but cannot permit only HTTP to one server. Place it with the intended reachability scope in mind; a broad source-only block near the sender can unintentionally affect many destinations."], "commands": [{"label": "Standard ACL example — permit this source LAN on server-facing exit", "text": "enable\nconfigure terminal\naccess-list 10 permit 192.168.10.0 0.0.0.255\ninterface GigabitEthernet0/1\n ip access-group 10 out\nend\nshow access-lists 10", "expected": "This permits traffic from the client LAN out this interface and implicitly denies other sources. It does not select a service port. Do not combine it with the extended exercise unless you deliberately want both checks."}], "steps": ["Before blaming an ACL, verify routes and server service.", "Inspect rule order, source/destination, protocol/port, wildcard and interface direction.", "Look for counter increases on the rule you expected to match.", "Inspect the return direction and any other policy points.", "Repair one rule/attachment at a time; record the evidence before and after."]}, {"title": "Secure the device and distinguish security functions", "body": ["A local login authenticates the administrator; AAA separates authentication (who), authorization (allowed actions) and accounting (activity records). RADIUS/TACACS+ support centralized AAA; they are not routing protocols.", "Use SSH for encrypted remote administration. Telnet and traditional HTTP lack that protection. HTTPS protects browser management when supported. Apply management restrictions without losing the intended administrator's access in the lab.", "NAT changes addresses, a router forwards between networks, an ACL applies stateless packet rules, and a stateful firewall tracks sessions. An IPS inspects/prevents selected suspicious traffic. They solve different problems even when bundled in one box.", "The broader security topic also covers threats, policy, VPN purpose, wireless authentication and Layer 2 protection. This added walkthrough deepens the requested routing/access-rule area; it does not replace those existing sections."], "steps": ["Use the IOS walkthrough to configure a lab-only local account and SSH.", "Test authorized remote access and the effect of a wrong password.", "Explain which policy controls management access versus traffic merely passing through the router.", "Describe why allowing one service differs from allowing every connection to the server."]}], "mastery": ["Predict standard/extended ACL matching and rule order.", "Configure, attach and verify ACLs with actual lab traffic/counters.", "Explain direction, implicit deny, return traffic and device-management security."]}, "ios": {"title": "From the console prompt to a verified router interface", "objectives": "CCNA 2.8, 4.8, 5.3 · Management access, SSH and local device access", "intro": "A successful command changes configuration, but it does not prove a working connection. Learn the IOS modes, build a small interface lab, verify it and save only after checking the result.", "sections": [{"title": "Know where each command belongs", "body": ["User EXEC usually ends in >. enable enters privileged EXEC (#), where show and copy commands are normally available. configure terminal enters global configuration (config)#. interface enters the selected interface's configuration mode.", "exit returns one level; end returns to privileged EXEC. ? shows available choices. Interface names vary by router—inspect show ip interface brief before substituting examples.", "running-config is the current configuration. startup-config is loaded at boot. copy running-config startup-config saves the current result. A saved wrong setting remains wrong, so verification comes first."], "table": {"headers": ["Task", "Mode/example"], "rows": [["Inspect interface state", "Privileged EXEC: show ip interface brief"], ["Enter configuration", "Privileged EXEC: configure terminal"], ["Choose a port", "Global config: interface GigabitEthernet0/0"], ["Assign its IPv4 address", "Interface config: ip address …"], ["Return to inspection", "end"], ["Save working configuration", "copy running-config startup-config"]]}}, {"title": "Bring up a LAN and interpret the state", "body": ["Fresh Packet Tracer router–switch–PC lab: router LAN .10.1/24; PC .10.10/24 gateway .10.1. Use a supported Ethernet interface and connect a working cable."], "commands": [{"label": "Router console", "text": "enable\nconfigure terminal\nhostname LAB-R1\ninterface GigabitEthernet0/0\n description Lab-client-LAN\n ip address 192.168.10.1 255.255.255.0\n no shutdown\nend\nshow ip interface brief\nshow running-config\nshow ip route", "expected": "up/up indicates the physical/link protocol state is working for this exercise; C/L entries identify the connected network/local interface address. Administratively down means shutdown; down/down can indicate cable/peer/interface problems."}], "steps": ["Ping the router from the PC.", "Set shutdown deliberately in the simulator and record the changed state.", "Use no shutdown to restore it, then compare ping and route output.", "Save the verified running configuration; reload only your saved simulator file/device if you want to test persistence."]}, {"title": "Configure a lab-only account and SSH", "body": ["Use a simulator router supporting SSH/RSA. Substitute your own lab-only password for the placeholder before entering commands. The router needs a hostname, domain name, local account, keys and VTY login settings. Existing account/security settings in a real device need a separate plan; this is a fresh lab."], "commands": [{"label": "Router — SSH management setup", "text": "enable\nconfigure terminal\nip domain-name study.example\nusername learner privilege 1 secret \u003cchoose-a-lab-only-password>\ncrypto key generate rsa\n! Choose 2048 bits if the simulator supports it\nip ssh version 2\nline vty 0 4\n login local\n transport input ssh\nend\nshow ip ssh", "expected": "Key generation is interactive on some simulator models. If the simulated image supports only a smaller key size, that is a simulator limitation, not a real-world security recommendation."}], "steps": ["On the lab client, use its SSH client to connect as learner to 192.168.10.1.", "Confirm a correct password permits login and a wrong one does not.", "Explain why this privilege-1 account cannot automatically perform every privileged operation; authorization matters.", "Compare console recovery/initial access with remote access dependencies: working IP path, permitted management port and login settings.", "Save the working configuration after verification."]}, {"title": "Match management methods to the situation", "body": ["Console is useful for initial configuration or recovery without a working IP management path. SSH encrypts command-line remote sessions. HTTPS encrypts supported browser management; plain HTTP and Telnet expose data without that protection.", "Cloud management uses a service/control connection and its authentication/policy. TACACS+ and RADIUS can support centralized AAA rather than a locally configured account. Neither replaces the need for a reachable and permitted management path."], "check": {"question": "The PC can ping the router but SSH fails. What comes next?", "answer": "Check SSH support/keys, VTY transport and login settings, username/password, TCP 22 policy and the client's SSH settings. Ping success alone does not prove an SSH service is available."}}], "mastery": ["Choose IOS modes and inspect running/startup configuration.", "Configure and verify a LAN interface, then save.", "Configure/test SSH in a supported lab and explain management/AAA roles."]}}, "sources": [{"title": "Cisco DHCP relay configuration", "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dhcp/configuration/15-s/dhcp-15-s-book/dhcp-relay-agent.html"}, {"title": "Cisco IPv4 ACL examples", "url": "https://www.cisco.com/c/en/us/support/docs/ip/access-lists/26448-ACLsamples.html"}, {"title": "Cisco SSH configuration", "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"}, {"title": "Cisco CCNA v1.1 exam topics", "url": "https://learningcontent.cisco.com/documents/marketing/exam-topics/200-301-CCNA-v1.1.pdf"}, {"title": "Cisco route selection and administrative distance", "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/15986-admin-distance.html"}, {"title": "Cisco IPv6 static routing", "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ip6-route-static-xe.html"}, {"title": "Cisco OSPF configuration", "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iro-cfg-0.html"}, {"title": "Cisco NAT configuration", "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13772-12.html"}, {"title": "Cisco policing and shaping", "url": "https://www.cisco.com/c/en/us/support/docs/quality-of-service-qos/qos-policing/19645-policevsshape.html"}], "labs": {"network-basics": {"introduction": "A network is a group of connected devices exchanging information. Your home LAN joins your devices; the router connects that LAN to other networks through your internet service provider (ISP). Wi-Fi is the local connection to an access point, not the internet itself. Bandwidth is capacity, throughput is the rate achieved, latency is delay, and loss means missing packets.", "levels": [{"difficulty": "Easy", "title": "Follow a phone to a website", "scenario": "A phone uses home Wi-Fi to open a website through ENet.", "reasoning": ["The phone joins an access point. That Wi-Fi link is part of the home LAN.", "The router forwards the request toward the ONT and ISP. An ONT connects the fiber access link; it may share a box with other functions.", "The ISP connects onward to other networks until the website server is reached. Its reply returns to the phone."], "task": "Draw a laptop opening a website through your home connection.", "steps": ["Draw laptop, access point, router, access device, ISP, and website server; combine boxes if roles share a device.", "Label the local connections LAN and the provider-facing connection WAN.", "Explain what each box does in one sentence."], "hint": "Name functions even when one physical box performs several of them.", "answer": "Laptop → access point → router → modem/ONT → ISP → internet networks → website server. The access point joins Wi-Fi clients to the LAN; the router connects IP networks; the ISP provides onward connectivity.", "check": "You can name your ISP and explain why connecting to Wi-Fi alone does not prove internet access."}, {"difficulty": "Hard", "title": "Separate local and upstream faults", "scenario": "A wireless laptop cannot reach a local printer, but a wired PC can print and open websites.", "reasoning": ["The wired PC proves the printer works and at least one path to the internet works.", "The wireless laptop has a local problem to investigate: association, addressing, isolation, or radio quality.", "An ISP outage alone does not explain failure to reach a reachable printer on the same LAN."], "task": "A phone sees its SSID but cannot browse; a wired PC browses normally. Plan three useful checks.", "steps": ["Check whether the phone actually joined and authenticated.", "Inspect its address and gateway and test an available local service.", "Compare another Wi-Fi client and note whether isolation or a guest network applies."], "hint": "Separate seeing an SSID from successfully joining it.", "answer": "Start with join/authentication, then IP settings and local reachability, then other wireless clients. Working wired browsing makes a general ISP outage less likely, but does not identify one exact phone fault.", "check": "Your conclusion follows the evidence and names a next test instead of assuming an ISP outage."}, {"difficulty": "Very Hard", "title": "Capacity is not delay", "scenario": "A 300 Mbps customer reports broken video calls. Downloads are fast, but calls show jitter and loss, especially on Wi-Fi.", "reasoning": ["Mbps describes capacity, not guaranteed delay or delivery.", "Calls are sensitive to delay variation and loss; a fast download can coexist with poor calls.", "Compare wired and wireless tests, quiet and busy periods, and local versus remote reachability to narrow the fault."], "task": "Design a comparison for two PCs: wired is stable; Wi-Fi calls fail mainly during large uploads.", "steps": ["Record the symptoms and repeat the same call or test on both connections.", "Compare a quiet period with an upload-heavy period; record delay and loss observations.", "State two possible causes and the next measurement that distinguishes them."], "hint": "Shared radio airtime and a congested upstream queue can both affect calls.", "answer": "Wi-Fi interference/airtime contention and upload congestion are hypotheses. Compare local gateway performance against remote performance on wired and Wi-Fi connections during the same periods. Local Wi-Fi-only degradation points toward the wireless segment; remote degradation on both connections points toward a shared upstream path.", "check": "You distinguish a hypothesis from a confirmed fault and explain why a speed test alone is insufficient."}]}, "routers": {"introduction": "A router joins IP networks. Your default gateway is the local router address a host uses for destinations outside its subnet. A routing table chooses a next hop or exit interface; a default route is used when no more specific route matches. Forward delivery and a return path are both needed.", "levels": [{"difficulty": "Easy", "title": "Choose local delivery or the gateway", "scenario": "PC 192.168.1.10/24 talks to printer 192.168.1.20 and a website outside that subnet.", "reasoning": ["The /24 mask puts both local devices in 192.168.1.0/24.", "The printer is reached locally; the remote website is sent through gateway 192.168.1.1."], "task": "For PC 192.168.5.10/24, classify destinations 192.168.5.25 and 192.168.6.25.", "steps": ["Write the PC subnet.", "Compare each destination with it.", "State when gateway 192.168.5.1 is used."], "hint": "With /24, compare the first three octets.", "answer": ".5.25 is local; .6.25 is remote and needs the default gateway. A gateway is not needed solely for communication inside the same subnet.", "check": "You choose a gateway based on the destination subnet."}, {"difficulty": "Hard", "title": "Read the first hop", "scenario": "ipconfig shows gateway 192.168.1.1; tracert shows it first, then an asterisk on a later hop while browsing succeeds.", "reasoning": ["The first responding hop often identifies the local router.", "An asterisk means a probe response was not received; filtering or rate limiting can cause this.", "Successful browsing is evidence that the application path still works."], "task": "Inspect ipconfig and tracert example.com on your own Windows PC without changing settings.", "steps": ["Record address, mask, and gateway.", "Compare the first responding hop with the gateway.", "Write what a timeout does and does not prove."], "hint": "Routers are not required to answer every diagnostic probe.", "answer": "A timeout does not by itself prove a broken route. If browsing works, some traffic reaches the service; record the missing probe response separately from application success.", "check": "Your note avoids treating every asterisk as an outage."}, {"difficulty": "Very Hard", "title": "Find the missing return path", "scenario": "Router A reaches LAN B, but PC replies fail because Router B has no route to LAN A.", "reasoning": ["The outward packet and return packet each require routing decisions.", "A successful one-direction path does not create a reverse route automatically.", "Inspect both routing tables and host gateways before changing anything."], "task": "On paper, use LAN A 192.168.10.0/24, LAN B 192.168.20.0/24, transit A 10.0.0.1/30 and B 10.0.0.2/30. Supply reciprocal routes.", "steps": ["Write A’s route to LAN B.", "Write B’s route to LAN A.", "Trace a request and reply, including both PC gateways."], "hint": "Each next hop is the other router on the transit link.", "answer": "A: ip route 192.168.20.0 255.255.255.0 10.0.0.2. B: ip route 192.168.10.0 255.255.255.0 10.0.0.1. PCs use their own LAN router addresses as gateways. Interfaces and local routes must also be working.", "check": "You can explain both directions rather than checking only one router."}]}, "switches": {"introduction": "An Ethernet switch forwards frames within a VLAN. It learns a source MAC address on the receiving port. A known destination goes to its learned port; an unknown destination or broadcast is flooded to other eligible ports in the same VLAN. This is separate from a router selecting an IP route.", "levels": [{"difficulty": "Easy", "title": "Learn the source", "scenario": "PC A on port 1 sends a frame to PC B on port 2; the switch table is empty.", "reasoning": ["The switch learns A’s source MAC on port 1.", "B is unknown, so the frame is flooded within the VLAN except back to port 1.", "B’s reply teaches the switch B’s MAC on port 2."], "task": "Predict the table after two PCs exchange frames.", "steps": ["Draw a switch with two connected PCs.", "Write the learned source and port for each transmission.", "Predict the port used for the next frame to B."], "hint": "Learning uses the source; forwarding uses the destination.", "answer": "After both transmit, A maps to port 1 and B to port 2. The next known unicast frame to B uses port 2.", "check": "You distinguish learning from forwarding."}, {"difficulty": "Hard", "title": "Observe ARP then ping", "scenario": "PCs .10 and .11 in 192.168.10.0/24 share a switch. Before pinging, a PC needs its peer’s MAC address.", "reasoning": ["ARP requests use a broadcast on the local VLAN.", "The peer replies with its MAC, enabling unicast delivery.", "The switch’s MAC table and the host’s ARP table answer different questions."], "task": "Build the original two-PC Packet Tracer lab and inspect ARP/ICMP in Simulation mode.", "steps": ["Set .10/24 and .11/24, connect both to the same VLAN, and ping.", "Inspect the ARP request and reply.", "Run show mac address-table and match entries to the actual cables."], "hint": "The host maps IP to MAC; the switch maps MAC to port.", "answer": "ARP discovers the destination’s local MAC. The switch learns each transmitting MAC on its incoming port, then forwards known unicast frames to that port. Initial ping attempts may wait for address resolution.", "check": "You explain the broadcast, reply, and subsequent unicast delivery."}, {"difficulty": "Very Hard", "title": "Separate MAC movement from a loop", "scenario": "A MAC moves once after a PC is recabled. Another MAC rapidly alternates ports while the LAN is unstable.", "reasoning": ["A single move can be normal: the switch relearns a source on a new port.", "Repeated flapping can indicate a loop or another topology issue; the table alone is not a complete diagnosis.", "Inspect cabling and spanning-tree state before blaming the endpoint."], "task": "Write an investigation for repeated MAC movement on a two-switch lab.", "steps": ["Record the MAC, ports, and timing.", "Draw redundant links and inspect show spanning-tree.", "Identify a controlled lab test and the result that would support a loop hypothesis."], "hint": "Look for repeated learning through multiple paths.", "answer": "Check physical topology, STP roles, and whether a loop is forwarding. In an isolated saved lab, remove one suspected redundant link and compare stability; do not make that change on a live network. Stable relearning after a deliberate recable is different from continuing flapping.", "check": "You justify the test and preserve alternative explanations."}]}, "clients-servers": {"introduction": "A client requests a service and a server supplies it. A browser is a web client. HTTP commonly uses TCP port 80 and HTTPS 443; DNS resolves names and DHCP supplies network settings. Reaching a server’s IP address does not prove that the application you want is running.", "levels": [{"difficulty": "Easy", "title": "Identify the roles", "scenario": "Chrome requests a page from a web server using HTTPS.", "reasoning": ["Chrome is the client, the page-hosting service is the server.", "HTTPS protects web communication; its common TCP port is 443."], "task": "Label a laptop browser opening an HTTP page from 192.168.20.20.", "steps": ["Name the client and server.", "Name the service and common port.", "Explain why the roles describe software behavior."], "hint": "One device can host a service and also request another service.", "answer": "The browser is the client, 192.168.20.20 hosts the web service, and HTTP commonly uses TCP 80. Client and server are roles, not fixed categories of hardware.", "check": "You identify roles, service, and port."}, {"difficulty": "Hard", "title": "Ping works but the page fails", "scenario": "A Packet Tracer server answers ping, but its HTTP service is disabled.", "reasoning": ["Ping tests ICMP reachability, not the HTTP application.", "A disabled service cannot respond with a page even when the host is reachable."], "task": "Build PC .10 and Server .20 on 192.168.20.0/24; compare HTTP on and off.", "steps": ["Enable HTTP in Server Services and open http://192.168.20.20.", "Disable HTTP and repeat the browser and ping tests.", "Record which result changes and why."], "hint": "Test the service you actually need.", "answer": "With HTTP enabled the page should load. With it disabled, ping can still succeed while browsing fails. The network and application results must be recorded separately.", "check": "You diagnose the service without calling it a general network outage."}, {"difficulty": "Very Hard", "title": "Distinguish name and service failures", "scenario": "A lab page opens by IP but not by name. Later, the name resolves correctly but the page still fails.", "reasoning": ["IP success with name failure suggests investigating DNS first.", "Correct DNS only proves a name-to-address answer, not an available web service.", "Check the resolved address, service state, and TCP policy after DNS."], "task": "Write a test sequence for a named lab website, showing two different failure cases.", "steps": ["Verify the IP-based page.", "Use nslookup to compare the answer with the intended lab server.", "If resolution is correct, inspect HTTP state and any ACL affecting TCP 80."], "hint": "Keep name resolution and application connectivity as separate tests.", "answer": "Case one: investigate a missing/wrong DNS record or client DNS setting. Case two: investigate service state, path, or policy even when DNS answers correctly. Neither result alone identifies the exact fault.", "check": "Your next test changes when new evidence rules out DNS."}]}, "layers": {"introduction": "Layers divide communication into jobs. An HTTP message can be carried by TCP, inside IP, inside an Ethernet frame. IP identifies endpoints across networks; Ethernet MAC addresses deliver on a local link. At a router, the outgoing link gets a new frame. TCP offers ordered reliable transport; UDP leaves delivery guarantees to higher layers.", "levels": [{"difficulty": "Easy", "title": "Unpack the layers", "scenario": "A lab browser sends an HTTP request across Ethernet.", "reasoning": ["HTTP is application content.", "TCP carries the application conversation, IP handles network delivery, and Ethernet carries it on the local link."], "task": "Put Ethernet frame, IP packet, TCP segment, and HTTP message in outside-to-inside order.", "steps": ["Write the four names.", "State one responsibility for each."], "hint": "A frame contains a packet, rather than the other way around.", "answer": "Ethernet frame → IP packet → TCP segment → HTTP message. Link delivery, routed addressing, transport, and application each serve a distinct job.", "check": "You explain the order without memorizing only names."}, {"difficulty": "Hard", "title": "Follow addresses across a router", "scenario": "A PC sends to a server in another subnet through its gateway.", "reasoning": ["The first Ethernet destination is the gateway’s MAC, not the remote server’s MAC.", "At the router, the old frame is removed and a new link frame is built.", "Without NAT, the endpoint IP addresses remain while link MAC addresses change."], "task": "Sketch PC, router, and remote server; label the first and second frames.", "steps": ["Give each link its own MAC labels.", "Keep the PC and server IP labels consistent.", "Explain how the PC resolves its gateway MAC using ARP."], "hint": "MAC addresses are for the current Ethernet link.", "answer": "First frame: PC MAC to gateway MAC. Outgoing frame: router outgoing MAC to the next local receiver MAC. The packet still targets the server IP, assuming no NAT.", "check": "You distinguish local link addresses from end-to-end IP addresses."}, {"difficulty": "Very Hard", "title": "Diagnose bottom-up", "scenario": "A lab cable is unplugged; DNS and HTTP tests both fail.", "reasoning": ["Layer 1 loss prevents the dependent higher layers from communicating.", "Changing DNS cannot restore an unplugged link.", "After restoring the link, verify addressing, reachability, and the service rather than assuming every fault is gone."], "task": "Create a layered investigation for a page failure with link down, then link up but HTTP disabled.", "steps": ["Check the link first and record its state.", "After link restoration, test IP reachability.", "Test the page and identify the remaining application failure."], "hint": "A successful repair at one layer does not prove all layers work.", "answer": "First repair the lab link. Then verify address/gateway and IP reachability. If ping succeeds but the HTTP service is off, enable the service in the lab and retest; the second fault is application-related.", "check": "You identify two faults with distinct evidence."}]}, "addressing-basics": {"introduction": "An IPv4 address and mask identify a subnet and a host within it. A /24 mask is 255.255.255.0. In 192.168.10.0/24, .0 is the network, .255 is broadcast, and .1–.254 are ordinary host addresses. Hosts send local traffic directly and remote traffic through a gateway reachable on their LAN.", "levels": [{"difficulty": "Easy", "title": "Recognize valid hosts", "scenario": "192.168.10.10/24 and .11/24 are valid hosts in the same subnet.", "reasoning": ["The network is .0 and broadcast is .255.", "The different host addresses can communicate locally when the link/VLAN is correct."], "task": "Find the network, broadcast, and usable range for 192.168.7.25/24.", "steps": ["Apply the /24 mask.", "List the first and last usable addresses.", "Choose a valid gateway address."], "hint": "A gateway is normally another usable host address in that subnet.", "answer": "Network 192.168.7.0, broadcast 192.168.7.255, hosts .1–.254; .1 is a possible gateway if actually configured on the router.", "check": "You avoid assigning network or broadcast addresses to hosts."}, {"difficulty": "Hard", "title": "Check a /26 boundary", "scenario": "192.168.10.70/26 belongs to the block .64–.127.", "reasoning": ["A /26 has 64 total addresses.", "Network .64 and broadcast .127 leave hosts .65–.126."], "task": "Decide whether 192.168.10.60/26 and .70/26 are local peers.", "steps": ["Write the /26 block size.", "Find each network boundary.", "State whether routing is needed."], "hint": "The blocks start at 0, 64, 128, and 192.", "answer": ".60 is in .0/26; .70 is in .64/26. They are in different subnets and need routing despite sharing the first three octets.", "check": "You use the mask rather than only comparing address appearance."}, {"difficulty": "Very Hard", "title": "Spot an unreachable gateway", "scenario": "A host is 192.168.10.100/27 with gateway .65.", "reasoning": ["/27 blocks contain 32 addresses.", ".100 belongs to .96/27, hosts .97–.126.", ".65 is in .64/27 and is not an ordinary locally reachable gateway for this host."], "task": "Audit host .150/27, gateway .129, and peer .158/27.", "steps": ["Find the host subnet and usable range.", "Check gateway and peer membership.", "Propose one valid correction if gateway .129 is the actual router address."], "hint": "Determine the block before making changes.", "answer": ".150/27 is in .128/27, hosts .129–.158, broadcast .159. Gateway .129 and peer .158 are valid members; no correction is required. The task tests whether you can verify a good configuration rather than invent a fault.", "check": "You can explain why this configuration is valid and the earlier one is not."}]}, "firewalls-basics": {"introduction": "A firewall decides which traffic is allowed. Read a rule by source, destination, protocol, port, and direction. A stateful firewall also tracks connections so replies can be permitted. NAT translates addresses; it does not replace a deliberate traffic policy. Inspect your live PC settings only; make experiments in an isolated lab.", "levels": [{"difficulty": "Easy", "title": "Read one connection rule", "scenario": "A client connects to a server on TCP 443.", "reasoning": ["443 is the server’s destination service port for common HTTPS traffic.", "The return packet has the server as source and the client as destination."], "task": "Write a rule description allowing a client to a web server on TCP 443.", "steps": ["Name source and destination.", "Name protocol and destination port.", "State the intended direction."], "hint": "Specify the intended service rather than all traffic.", "answer": "Allow the client source to the web-server destination using TCP destination port 443 in the direction of the request.", "check": "Your rule identifies the exact flow."}, {"difficulty": "Hard", "title": "Interpret stateful replies", "scenario": "A stateful firewall permits an outbound HTTPS session and its established return traffic.", "reasoning": ["The initiating rule allows the intended session.", "Connection state distinguishes replies from unrelated unsolicited inbound traffic."], "task": "Compare an established HTTPS reply with a new inbound connection from an unknown host.", "steps": ["Draw the original request and its reply.", "Label a separate unsolicited request.", "Describe the difference in expected policy."], "hint": "Being inbound does not mean every packet is a new inbound session.", "answer": "The established reply can be permitted by state tracking. A new unsolicited session needs its own policy permission; it is not automatically accepted because outbound HTTPS is allowed.", "check": "You explain state without saying every inbound packet is allowed."}, {"difficulty": "Very Hard", "title": "Handle a policy exception", "scenario": "Staff need HTTPS to one server; management needs SSH; ordinary staff must not reach management services.", "reasoning": ["Separate service requirements into distinct rules.", "Order and scope matter; broad permits can undermine specific restrictions.", "Test an allowed and denied flow for every intended boundary."], "task": "Build a written policy table for staff, web server, and management networks.", "steps": ["List HTTPS and SSH requirements with exact source/destination groups.", "Add a default-deny policy and explain reply handling for a stateful firewall.", "Write positive and negative tests, including staff-to-SSH."], "hint": "Do not treat address translation as your deny rule.", "answer": "Allow staff → web server TCP 443; allow management → administered devices TCP 22; deny other new traffic by default. Established replies follow state policy. Verify HTTPS works, management SSH works, and staff SSH is denied; document any required supporting services separately.", "check": "You can justify every permit and test the restriction."}]}, "first-troubleshooting": {"introduction": "Troubleshooting narrows a fault with evidence. Start with who is affected and what fails. Then check link, address, local gateway, remote path, DNS, and application. A ping failure alone is not proof of an outage because ICMP can be filtered. Record observations before changing configuration.", "levels": [{"difficulty": "Easy", "title": "Find the scope", "scenario": "One laptop fails; other devices on the same connection browse normally.", "reasoning": ["The issue is not affecting every client.", "Start with the affected laptop’s link and settings instead of rebooting all equipment."], "task": "Write three scope questions for a customer who says “the internet is down.”", "steps": ["Ask which devices are affected.", "Ask whether wired and Wi-Fi differ.", "Ask whether one site or every service fails."], "hint": "Questions should separate possible causes.", "answer": "Useful questions identify device scope, connection type, and application scope. Ask what changed and when it began next.", "check": "Your questions narrow the fault rather than guessing a repair."}, {"difficulty": "Hard", "title": "Interpret DNS evidence", "scenario": "Gateway ping works, a lab site opens by IP, and nslookup of its name fails.", "reasoning": ["Local connectivity works for the tested path.", "An IP-based web request works, so investigate name resolution.", "Check the configured DNS server and the intended record."], "task": "Write a support note for those three results.", "steps": ["State issue and scope.", "List each test and result.", "Choose the next DNS check without changing the live connection."], "hint": "A note needs evidence, not just “DNS broken.”", "answer": "Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration.", "check": "Your conclusion is limited to what the tests establish."}, {"difficulty": "Very Hard", "title": "Avoid a misleading ping", "scenario": "Gateway and website pings fail, but HTTPS browsing works on the same PC.", "reasoning": ["ICMP and HTTPS are different traffic types.", "Browsing proves an application connection works; ping can be filtered.", "Select a test for the reported symptom rather than forcing every probe to succeed."], "task": "Diagnose a complaint where one HTTPS site fails, three others work, and all pings time out.", "steps": ["Record which applications work.", "Check the failing name’s DNS response and browser error.", "Choose a service/path test and an escalation note without asserting a total outage."], "hint": "Filter the evidence by the actual service.", "answer": "Investigate the affected site’s name, service, certificate/browser error, or specific path/policy. The working sites contradict a complete internet outage. Ping timeouts alone do not resolve the site-specific fault.", "check": "You reconcile apparently conflicting results and propose a focused next test."}]}, "ios": {"introduction": "Cisco IOS has user EXEC, privileged EXEC, global configuration, and interface configuration modes. show commands inspect state; configuration commands change it. An administratively down interface is disabled in configuration. Running configuration is active now; startup configuration is used after a restart. Use console access and an isolated Packet Tracer lab for these exercises.", "levels": [{"difficulty": "Easy", "title": "Read the interface state", "scenario": "show ip interface brief lists GigabitEthernet0/0 as administratively down/down.", "reasoning": ["The interface is disabled by configuration.", "no shutdown enables it, but the link still needs a connected peer and working cable."], "task": "Inspect a Packet Tracer router and identify its connected interface.", "steps": ["Enter enable, then show ip interface brief.", "Match the interface to the topology cable.", "Explain administratively down versus up/up."], "hint": "The exact interface name depends on the router model.", "answer": "Administratively down means disabled locally. up/up means the physical and line-protocol states are up. Enabling alone does not guarantee up/up.", "check": "You choose the actual connected interface rather than copying an unrelated name."}, {"difficulty": "Hard", "title": "Configure and save a gateway", "scenario": "A PC is 192.168.1.10/24 and the router must be 192.168.1.1.", "reasoning": ["The router address must be on the PC LAN.", "Configure the connected interface, enable it, verify, and save."], "task": "Bring up a lab router gateway for PC 192.168.2.10/24.", "steps": ["Set PC gateway 192.168.2.1.", "On the router enter enable; configure terminal; interface \u003cconnected-interface>; ip address 192.168.2.1 255.255.255.0; no shutdown; end.", "Run show ip interface brief, ping from the PC, and copy running-config startup-config."], "hint": "Replace \u003cconnected-interface> with the actual interface name; enter each command separately.", "answer": "The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration.", "check": "You verify both interface state and host reachability before saving."}, {"difficulty": "Very Hard", "title": "Find two independent mistakes", "scenario": "A router has the wrong LAN address and is administratively down; enabling it alone does not repair the address.", "reasoning": ["A single symptom can hide multiple errors.", "Compare intended addressing with running configuration, then examine operational state.", "Retest after each repair and save only the verified result."], "task": "In a saved lab, configure gateway .3.1/24 as .4.1/24 and shut it down, then diagnose from PC .3.10/24.", "steps": ["Use show ip interface brief and show running-config.", "Corre
