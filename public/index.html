estination using TCP destination port 443 in the direction of the request.", "Verify intended addresses and TCP 22 rule/counters, apply only the required lab permit, retest SSH and an intended denied service."], "c": 0, "h": "A port tells a transport selector, not full application behavior."}, {"id": "firewalls-basics/Very Hard/3", "q": "Give a regression test plan for a revised inter-VLAN policy.", "o": ["No. Restrict source, destination and service to the actual requirement.", "Allow the client source to the web-server destination using TCP destination port 443 in the direction of the request.", "Test authorized client/service pairs, denied sources/services, return behavior and relevant counters; document rollback.", "Verify the return route and where connection state is tracked, plus source/destination/service identity."], "c": 2, "h": "Success must include intended denies as well as intended permits."}, {"id": "firewalls-basics/Very Hard/4", "q": "What conclusion is justified by one deny event?", "o": ["Allow the client source to the web-server destination using TCP destination port 443 in the direction of the request.", "No. Other applications can use that port; endpoint and application controls may be needed.", "Path asymmetry or missing state synchronization can affect sessions. Correlate both directions, devices and session logs.", "That observed traffic matched a denial. Investigate other activity before asserting no compromise or no successful access."], "c": 3, "h": "A logged block does not establish the whole host is safe."}, {"id": "firewalls-basics/Very Hard/5", "q": "Staff need HTTPS to one server; management needs SSH; ordinary staff must not reach management services.\nWhich explanation is supported by these facts?", "o": ["Separate service requirements into distinct rules.", "B may reject replies whose state it does not know.", "443 is the server’s destination service port for common HTTPS traffic.", "That result tests ICMP, not every transport service."], "c": 0, "h": "Do not treat address translation as your deny rule."}, {"id": "firewalls-basics/Very Hard/6", "q": "Outbound traffic crosses firewall A; reply crosses B without shared state.\nWhich explanation is supported by these facts?", "o": ["Separate service requirements into distinct rules.", "B may reject replies whose state it does not know.", "It can allow matching return traffic through connection state.", "443 is the server’s destination service port for common HTTPS traffic."], "c": 1, "h": "B may reject replies whose state it does not know."}, {"id": "firewalls-basics/Very Hard/7", "q": "TLS on port 443 is not automatically a trusted application.\nWhich explanation is supported by these facts?", "o": ["443 is the server’s destination service port for common HTTPS traffic.", "That result tests ICMP, not every transport service.", "A port tells a transport selector, not full application behavior.", "Separate service requirements into distinct rules."], "c": 2, "h": "A port tells a transport selector, not full application behavior."}, {"id": "firewalls-basics/Very Hard/8", "q": "A permit fixes access but unintentionally exposes another subnet.\nWhich explanation is supported by these facts?", "o": ["Success must include intended denies as well as intended permits.", "B may reject replies whose state it does not know.", "Permit the required source/service instead of every client.", "Separate service requirements into distinct rules."], "c": 0, "h": "Success must include intended denies as well as intended permits."}, {"id": "firewalls-basics/Very Hard/9", "q": "One blocked login attempt appears in a log.\nWhich explanation is supported by these facts?", "o": ["Separate service requirements into distinct rules.", "Success must include intended denies as well as intended permits.", "A logged block does not establish the whole host is safe.", "A rule applies to a defined direction and traffic selector."], "c": 2, "h": "A logged block does not establish the whole host is safe."}]}, "first-troubleshooting": {"Easy": [{"id": "first-troubleshooting/lesson-check/Easy/0", "q": "What should you establish before changing settings?", "o": ["Which users, destinations and services are affected.", "Which replacement router to install first.", "Which settings to reset on every PC."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "first-troubleshooting/lesson-check/Easy/1", "q": "Which testing approach matches the lesson?", "o": ["Test only the application and assume lower stages work.", "Change DNS and gateway together before gathering evidence.", "Check connection, addressing, local path, DNS and application."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "first-troubleshooting/lesson-check/Easy/2", "q": "What does one failed ping prove?", "o": ["That the probe did not receive its expected reply.", "That the device has definitely lost power.", "That every destination service is unavailable."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "first-troubleshooting/lesson-check/Easy/3", "q": "What belongs in the support note?", "o": ["Only the guessed cause before testing.", "Problem scope, tests, results and next reasoning.", "Only the repair without original symptoms."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "first-troubleshooting/lesson-check/Easy/4", "q": "What should you record after a test?", "o": ["Only whether the original guess was right.", "The intended repair instead of the observation.", "The test, result and implication for the next test."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "first-troubleshooting/lesson-check/Easy/5", "q": "Which approach narrows a fault reliably?", "o": ["Collect evidence and make one justified change at a time.", "Change every suspected setting simultaneously.", "Treat one failed site as a complete ISP outage."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "first-troubleshooting/Hard/0", "q": "Write a support note for those three results.", "o": ["Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration.", "No. Inspect status/application evidence and dependencies rather than assuming a physical failure.", "No. Correlate destination/application tests and other evidence; record absence of a probe reply only."], "c": 0, "h": "A note needs evidence, not just “DNS broken.”"}, {"id": "first-troubleshooting/Hard/1", "q": "Choose three checks when only a guest SSID fails.", "o": ["No. Correlate destination/application tests and other evidence; record absence of a probe reply only.", "Join/authentication, guest addressing/gateway and guest isolation/policy; compare another guest client.", "Address, prefix/mask, gateway and DNS, plus the actual interface/link state."], "c": 1, "h": "The difference narrows investigation to wireless-specific dependencies."}, {"id": "first-troubleshooting/Hard/2", "q": "How do you verify a DNS repair?", "o": ["It obscures which change mattered and may add faults. Change one supported cause, record it and retest.", "Read the updated answer, account for caching/TTL, then test the intended service by name and IP.", "Join/authentication, guest addressing/gateway and guest isolation/policy; compare another guest client."], "c": 1, "h": "A wrong name record explains that difference."}, {"id": "first-troubleshooting/Hard/3", "q": "Can one asterisk establish a broken forwarding path?", "o": ["Useful questions identify device scope, connection type, and application scope. Ask what changed and when it began next.", "No. Compare that laptop with a working client before escalating a shared path.", "No. Correlate destination/application tests and other evidence; record absence of a probe reply only."], "c": 2, "h": "Intermediate probe replies may be filtered or rate-limited."}, {"id": "first-troubleshooting/Hard/4", "q": "Why avoid changing gateway, DNS and VLAN simultaneously?", "o": ["It obscures which change mattered and may add faults. Change one supported cause, record it and retest.", "Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration.", "Join/authentication, guest addressing/gateway and guest isolation/policy; compare another guest client."], "c": 0, "h": "Retest the original symptom and nearby requirements."}, {"id": "first-troubleshooting/Hard/5", "q": "Gateway ping works, a lab site opens by IP, and nslookup of its name fails.\nWhich explanation is supported by these facts?", "o": ["Local connectivity works for the tested path.", "The issue is not affecting every client.", "The difference narrows investigation to wireless-specific dependencies."], "c": 0, "h": "A note needs evidence, not just “DNS broken.”"}, {"id": "first-troubleshooting/Hard/6", "q": "Wired access works; Wi-Fi fails.\nWhich explanation is supported by these facts?", "o": ["The difference narrows investigation to wireless-specific dependencies.", "The issue is not affecting every client.", "Intermediate probe replies may be filtered or rate-limited."], "c": 0, "h": "The difference narrows investigation to wireless-specific dependencies."}, {"id": "first-troubleshooting/Hard/7", "q": "The intended server responds by IP but DNS returns an old address.\nWhich explanation is supported by these facts?", "o": ["Retest the original symptom and nearby requirements.", "Intermediate probe replies may be filtered or rate-limited.", "A wrong name record explains that difference."], "c": 2, "h": "A wrong name record explains that difference."}, {"id": "first-troubleshooting/Hard/8", "q": "One traceroute hop times out but the destination answers.\nWhich explanation is supported by these facts?", "o": ["Fix the observed physical break before testing names.", "Intermediate probe replies may be filtered or rate-limited.", "Local connectivity works for the tested path."], "c": 1, "h": "Intermediate probe replies may be filtered or rate-limited."}, {"id": "first-troubleshooting/Hard/9", "q": "A lab gateway is corrected and access returns.\nWhich explanation is supported by these facts?", "o": ["The issue is not affecting every client.", "Fix the observed physical break before testing names.", "Retest the original symptom and nearby requirements."], "c": 2, "h": "Retest the original symptom and nearby requirements."}, {"id": "first-troubleshooting/Hard/10", "q": "During a lab handover, someone asks: What should you record after a test? Which explanation should you give?", "o": ["From the sender: the source MAC address and the port where the frame arrived.", "The test, its result and what that result tells you. Then choose the next test from that evidence.", "No. Ping tests an ICMP response. The web service and its connection need their own test."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "first-troubleshooting/Hard/11", "q": "You are explaining this topic to a colleague. What is a useful first response to a network problem?", "o": ["Assume the ISP is at fault.", "Change several settings at once.", "Gather symptoms and check basic connection/settings."], "c": 2, "h": "Correct. Evidence helps narrow the problem before changing anything."}], "Very Hard": [{"id": "first-troubleshooting/Very Hard/0", "q": "Diagnose a complaint where one HTTPS site fails, three others work, and all pings time out.", "o": ["Investigate the affected site’s name, service, certificate/browser error, or specific path/policy. The working sites contradict a complete internet outage. Ping timeouts alone do not resolve the site-specific fault.", "No. Compare that laptop with a working client before escalating a shared path.", "Continue through address, routes, DNS and service tests; do not assume the repair failed because another dependency remains.", "Include times, affected clients/services, address/link observations, local versus external results and changes tried; separate facts from guesses."], "c": 0, "h": "Filter the evidence by the actual service."}, {"id": "first-troubleshooting/Very Hard/1", "q": "What should you do when a fixed link still leaves browsing broken?", "o": ["Repeat comparable wired/Wi-Fi local/remote tests during quiet and busy periods; record delay, loss, time and traffic load.", "Read the updated answer, account for caching/TTL, then test the intended service by name and IP.", "Continue through address, routes, DNS and service tests; do not assume the repair failed because another dependency remains.", "No. Correlate destination/application tests and other evidence; record absence of a probe reply only."], "c": 2, "h": "The first repair may expose a second failure."}, {"id": "first-troubleshooting/Very Hard/2", "q": "Design observations for intermittent upload-time latency.", "o": ["Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration.", "Include times, affected clients/services, address/link observations, local versus external results and changes tried; separate facts from guesses.", "Investigate the affected site’s name, service, certificate/browser error, or specific path/policy. The working sites contradict a complete internet outage. Ping timeouts alone do not resolve the site-specific fault.", "Repeat comparable wired/Wi-Fi local/remote tests during quiet and busy periods; record delay, loss, time and traffic load."], "c": 3, "h": "A quiet successful test cannot eliminate a load-related problem."}, {"id": "first-troubleshooting/Very Hard/3", "q": "What evidence should accompany a proposed rollback?", "o": ["No. Correlate destination/application tests and other evidence; record absence of a probe reply only.", "Investigate the affected site’s name, service, certificate/browser error, or specific path/policy. The working sites contradict a complete internet outage. Ping timeouts alone do not resolve the site-specific fault.", "Before/after configuration, logs, reproducible symptom, alternative causes and an authorized rollback/verification plan.", "Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration."], "c": 2, "h": "Timing suggests a hypothesis but does not prove causation."}, {"id": "first-troubleshooting/Very Hard/4", "q": "Write a useful provider escalation record.", "o": ["Issue: named lab website fails. Evidence: gateway responds; page opens by IP; lookup fails. Next: inspect client DNS configuration and query the intended DNS server for the record. This points toward DNS but does not yet identify server versus client configuration.", "No. Correlate destination/application tests and other evidence; record absence of a probe reply only.", "Include times, affected clients/services, address/link observations, local versus external results and changes tried; separate facts from guesses.", "Address, prefix/mask, gateway and DNS, plus the actual interface/link state."], "c": 2, "h": "A shared upstream problem is plausible but the exact device is unconfirmed."}, {"id": "first-troubleshooting/Very Hard/5", "q": "Gateway and website pings fail, but HTTPS browsing works on the same PC.\nWhich explanation is supported by these facts?", "o": ["Timing suggests a hypothesis but does not prove causation.", "A shared upstream problem is plausible but the exact device is unconfirmed.", "ICMP and HTTPS are different traffic types.", "A quiet successful test cannot eliminate a load-related problem."], "c": 2, "h": "Filter the evidence by the actual service."}, {"id": "first-troubleshooting/Very Hard/6", "q": "A VLAN is repaired but DNS is also wrong.\nWhich explanation is supported by these facts?", "o": ["The first repair may expose a second failure.", "Fix the observed physical break before testing names.", "ICMP and HTTPS are different traffic types.", "Timing suggests a hypothesis but does not prove causation."], "c": 0, "h": "The first repair may expose a second failure."}, {"id": "first-troubleshooting/Very Hard/7", "q": "A client fails only during busy periods.\nWhich explanation is supported by these facts?", "o": ["A quiet successful test cannot eliminate a load-related problem.", "A shared upstream problem is plausible but the exact device is unconfirmed.", "Timing suggests a hypothesis but does not prove causation.", "ICMP and HTTPS are different traffic types."], "c": 0, "h": "A quiet successful test cannot eliminate a load-related problem."}, {"id": "first-troubleshooting/Very Hard/8", "q": "A firmware change coincides with a new symptom.\nWhich explanation is supported by these facts?", "o": ["A shared upstream problem is plausible but the exact device is unconfirmed.", "Timing suggests a hypothesis but does not prove causation.", "Retest the original symptom and nearby requirements.", "ICMP and HTTPS are different traffic types."], "c": 1, "h": "Timing suggests a hypothesis but does not prove causation."}, {"id": "first-troubleshooting/Very Hard/9", "q": "Local gateway works; external tests fail on several clients.\nWhich explanation is supported by these facts?", "o": ["A response means some service exchange occurred, though the request may fail.", "Local connectivity works for the tested path.", "A shared upstream problem is plausible but the exact device is unconfirmed.", "The first repair may expose a second failure."], "c": 2, "h": "A shared upstream problem is plausible but the exact device is unconfirmed."}]}, "ios": {"Easy": [{"id": "ios/lesson-check/Easy/0", "q": "What does an IOS prompt identify?", "o": ["Whether the remote service replied.", "The selected default route.", "The current command mode."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ios/lesson-check/Easy/1", "q": "Where do interface settings belong?", "o": ["At user EXEC without configuration mode.", "Only in startup configuration, leaving running state unchanged.", "Under the selected interface in configuration mode."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ios/lesson-check/Easy/2", "q": "What does no shutdown do?", "o": ["Save the configuration through a restart.", "Remove the interface’s administrative disable state.", "Guarantee the cable and remote endpoint work."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ios/lesson-check/Easy/3", "q": "Why save to startup configuration?", "o": ["Verify delivery to the remote service.", "Apply running commands for the first time.", "Retain intended settings for a restart."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ios/lesson-check/Easy/4", "q": "How do you establish that configuration works?", "o": ["Rely on commands being accepted without errors.", "Inspect state and test the intended connection.", "Check only that configuration was saved."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ios/lesson-check/Easy/5", "q": "How do running and startup differ?", "o": ["Every running change automatically persists in startup.", "Running is active now; startup is used after restart.", "Startup is active now; running is only a backup."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "ios/Hard/0", "q": "Bring up a lab router gateway for PC 192.168.2.10/24.", "o": ["Router(config)#; enter with configure terminal from privileged EXEC.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state.", "The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration."], "c": 2, "h": "Replace \u003cconnected-interface> with the actual interface name; enter each command separately."}, {"id": "ios/Hard/1", "q": "What lab change may enable an intentionally shut interface?", "o": ["show ip interface brief on compatible Cisco IOS devices.", "Router(config)#; enter with configure terminal from privileged EXEC.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state."], "c": 2, "h": "The configuration disables it; cabling alone cannot enable it."}, {"id": "ios/Hard/2", "q": "Why compare filtered output with surrounding configuration when diagnosing?", "o": ["No. Inspect mode, software/model, feature support and official syntax; simulator support may be limited.", "A filter may omit dependencies such as routing, VLAN or policy settings; inspect the relevant full sections too.", "The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration."], "c": 1, "h": "Filters improve inspection but can hide related configuration."}, {"id": "ios/Hard/3", "q": "Name checks beyond merely creating a username for SSH.", "o": ["The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration.", "Inspect SSH/key support, domain/key setup where required, VTY authentication/transport, addressing and policy.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state."], "c": 1, "h": "Secure remote login requires platform-specific prerequisites and reachable addressing."}, {"id": "ios/Hard/4", "q": "How do you correct a wrong-mode error without changing unrelated settings?", "o": ["Restore 192.168.3.1/24, no shutdown, and correct the PC gateway to .3.1 if needed. Confirm up/up and ping; copy running-config startup-config. Both the shutdown state and wrong subnet explain distinct parts of the failure.", "Read the prompt/error, enter the intended interface or global context and check command help.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state."], "c": 1, "h": "Commands are valid in specific contexts."}, {"id": "ios/Hard/5", "q": "A PC is 192.168.1.10/24 and the router must be 192.168.1.1.\nWhich explanation is supported by these facts?", "o": ["The router address must be on the PC LAN.", "The configuration disables it; cabling alone cannot enable it.", "The interface is disabled by configuration."], "c": 0, "h": "Replace \u003cconnected-interface> with the actual interface name; enter each command separately."}, {"id": "ios/Hard/6", "q": "An interface is administratively down.\nWhich explanation is supported by these facts?", "o": ["Commands are valid in specific contexts.", "The interface is disabled by configuration.", "The configuration disables it; cabling alone cannot enable it."], "c": 2, "h": "The configuration disables it; cabling alone cannot enable it."}, {"id": "ios/Hard/7", "q": "show running-config | section interface narrows output.\nWhich explanation is supported by these facts?", "o": ["The router address must be on the PC LAN.", "Filters improve inspection but can hide related configuration.", "The interface is disabled by configuration."], "c": 1, "h": "Filters improve inspection but can hide related configuration."}, {"id": "ios/Hard/8", "q": "A lab device has a local account and SSH transport configured.\nWhich explanation is supported by these facts?", "o": ["Commands are valid in specific contexts.", "Secure remote login requires platform-specific prerequisites and reachable addressing.", "The configuration disables it; cabling alone cannot enable it."], "c": 1, "h": "Secure remote login requires platform-specific prerequisites and reachable addressing."}, {"id": "ios/Hard/9", "q": "An IP command entered in wrong mode is rejected.\nWhich explanation is supported by these facts?", "o": ["Available syntax depends on mode/platform.", "Filters improve inspection but can hide related configuration.", "Commands are valid in specific contexts."], "c": 2, "h": "Commands are valid in specific contexts."}, {"id": "ios/Hard/10", "q": "During a lab handover, someone asks: After typing a configuration command, how do you know it worked? Which explanation should you give?", "o": ["Verify device state with the appropriate show command and a connection test. Typing the command alone is not proof.", "No. Inspect the DNS setting and test name resolution separately.", "No. Test the failure and verify that routing or switching uses a working alternative correctly."], "c": 0, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "ios/Hard/11", "q": "You are explaining this topic to a colleague. Why use show commands before changing a switch configuration?", "o": ["They reveal current state so you can choose a justified change.", "They automatically repair the switch.", "They erase old configuration."], "c": 0, "h": "Correct. Inspect interfaces and configuration, then make a targeted change."}], "Very Hard": [{"id": "ios/Very Hard/0", "q": "In a saved lab, configure gateway .3.1/24 as .4.1/24 and shut it down, then diagnose from PC .3.10/24.", "o": ["Administratively down means disabled locally. up/up means the physical and line-protocol states are up. Enabling alone does not guarantee up/up.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state.", "Save/export evidence and intended changes separately, verify startup baseline and console access, then reload only the isolated lab and validate.", "Restore 192.168.3.1/24, no shutdown, and correct the PC gateway to .3.1 if needed. Confirm up/up and ping; copy running-config startup-config. Both the shutdown state and wrong subnet explain distinct parts of the failure."], "c": 3, "h": "An up interface can still have incorrect addressing."}, {"id": "ios/Very Hard/1", "q": "What should you capture before a planned lab reload rollback?", "o": ["Inspect running state and functional tests, confirm startup persistence where required, and document exact changes and recovery.", "The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration.", "Read the prompt/error, enter the intended interface or global context and check command help.", "Save/export evidence and intended changes separately, verify startup baseline and console access, then reload only the isolated lab and validate."], "c": 3, "h": "Reload loses all unsaved changes, not just the last bad one."}, {"id": "ios/Very Hard/2", "q": "Design a safer isolated-lab SSH policy change.", "o": ["A filter may omit dependencies such as routing, VLAN or policy settings; inspect the relevant full sections too.", "No. Inspect mode, software/model, feature support and official syntax; simulator support may be limited.", "Inspect running state and functional tests, confirm startup persistence where required, and document exact changes and recovery.", "Keep console access, record baseline, add/test the new allowed path before removing the old one, and prepare rollback."], "c": 3, "h": "Management reachability must be protected through change sequencing."}, {"id": "ios/Very Hard/3", "q": "Does an invalid command prove the concept is wrong?", "o": ["Read the prompt/error, enter the intended interface or global context and check command help.", "Inspect SSH/key support, domain/key setup where required, VTY authentication/transport, addressing and policy.", "No. Inspect mode, software/model, feature support and official syntax; simulator support may be limited.", "Administratively down means disabled locally. up/up means the physical and line-protocol states are up. Enabling alone does not guarantee up/up."], "c": 2, "h": "Image, license and model affect feature/syntax support."}, {"id": "ios/Very Hard/4", "q": "What evidence verifies a completed configuration change?", "o": ["copy running-config startup-config; verify the copy succeeded.", "Inspect running state and functional tests, confirm startup persistence where required, and document exact changes and recovery.", "The connected interface should have .2.1 and become up/up with a working link. The PC should reach it. Saving copies the current configuration to startup configuration.", "Enter the correct interface context and use no shutdown, then inspect physical/protocol state."], "c": 1, "h": "Current operation and after-reload operation can differ."}, {"id": "ios/Very Hard/5", "q": "A router has the wrong LAN address and is administratively down; enabling it alone does not repair the address.\nWhich explanation is supported by these facts?", "o": ["A single symptom can hide multiple errors.", "The router address must be on the PC LAN.", "The configuration disables it; cabling alone cannot enable it.", "Management reachability must be protected through change sequencing."], "c": 0, "h": "An up interface can still have incorrect addressing."}, {"id": "ios/Very Hard/6", "q": "A lab config is broken and the saved baseline is known.\nWhich explanation is supported by these facts?", "o": ["Reload loses all unsaved changes, not just the last bad one.", "Current operation and after-reload operation can differ.", "The interface is disabled by configuration.", "Privileged EXEC allows more inspection; configuration mode is separate."], "c": 0, "h": "Reload loses all unsaved changes, not just the last bad one."}, {"id": "ios/Very Hard/7", "q": "A remote VTY policy change excludes the administrator.\nWhich explanation is supported by these facts?", "o": ["The router address must be on the PC LAN.", "Management reachability must be protected through change sequencing.", "The interface is disabled by configuration.", "Reload loses all unsaved changes, not just the last bad one."], "c": 1, "h": "Management reachability must be protected through change sequencing."}, {"id": "ios/Very Hard/8", "q": "A command works on one switch but not another.\nWhich explanation is supported by these facts?", "o": ["A single symptom can hide multiple errors.", "Current operation and after-reload operation can differ.", "Image, license and model affect feature/syntax support.", "The interface is disabled by configuration."], "c": 2, "h": "Image, license and model affect feature/syntax support."}, {"id": "ios/Very Hard/9", "q": "Running configuration works; startup still holds the old gateway.\nWhich explanation is supported by these facts?", "o": ["Filters improve inspection but can hide related configuration.", "Unsaved changes can be lost after reload.", "The configuration disables it; cabling alone cannot enable it.", "Current operation and after-reload operation can differ."], "c": 3, "h": "Current operation and after-reload operation can differ."}]}, "subnetting": {"Easy": [{"id": "subnetting/lesson-check/Easy/0", "q": "What must a subnet plan satisfy?", "o": ["The same routed range for every team.", "Enough host space and non-overlapping ranges.", "Identical subnet sizes regardless of need."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "subnetting/lesson-check/Easy/1", "q": "What does a longer IPv4 prefix mean?", "o": ["The same block with a different gateway only.", "Fewer host bits and a smaller block.", "More host bits and a larger block."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "subnetting/lesson-check/Easy/2", "q": "How many ordinary usable hosts fit a /26 LAN?", "o": ["30 because /26 leaves five host bits.", "64 because network and broadcast are hosts.", "62 from 64 total addresses."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "subnetting/lesson-check/Easy/3", "q": "How should a VLSM allocation begin?", "o": ["Start each subnet at the next free individual address.", "Place the largest needed block on a valid boundary.", "Place the smallest block without checking larger boundaries."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "subnetting/lesson-check/Easy/4", "q": "Why allocate the largest group first?", "o": ["It makes every subnet use the largest group’s mask.", "It helps place aligned large blocks before smaller ones.", "It removes the need to count gateways as hosts."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "subnetting/lesson-check/Easy/5", "q": "Which capacity statement is correct?", "o": ["Subtract two for every IPv4 prefix without exceptions.", "Ordinary LANs reserve network/broadcast; /31 and /32 differ.", "Count PCs only; routers use no host addresses."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "subnetting/Hard/0", "q": "Plan those three blocks inside 192.168.50.0/24 and choose gateways.", "o": ["14: 16 total minus network and broadcast. /31 and /32 have special uses.", "Network .16, broadcast .23; usable .17–.22.", ".0/26: hosts .1–.62, broadcast .63; .64/27: hosts .65–.94, broadcast .95; .96/28: hosts .97–.110, broadcast .111. Gateways can be .1, .65, and .97. This plan assumes the given counts include all required interfaces."], "c": 2, "h": "A requirement of 30 PCs plus one gateway needs more than 30 usable addresses."}, {"id": "subnetting/Hard/1", "q": "Allocate 50 and 20 hosts from 192.168.8.0/24.", "o": ["Use .0/26 (62 usable) and .64/27 (30 usable), with non-overlapping aligned ranges.", "/28 gives 14 usable; /29 gives only 6.", "No. At least 64 usable addresses are required; an ordinary /25 supplies 126."], "c": 0, "h": "Largest-first allocation helps avoid fragmentation."}, {"id": "subnetting/Hard/2", "q": "Are .63/27 and .64/27 usable peers in one subnet?", "o": ["14: 16 total minus network and broadcast. /31 and /32 have special uses.", "No. .63 is broadcast for .32/27; .64 is the next subnet network address.", "Network .16, broadcast .23; usable .17–.22."], "c": 1, "h": "Compare the derived network, not only the last octet."}, {"id": "subnetting/Hard/3", "q": "Network/broadcast for 192.168.3.19/29?", "o": ["Network .64, broadcast .127, hosts .65–.126, 62 usable.", "192.168.2.127; usable range .97–.126.", "Network .16, broadcast .23; usable .17–.22."], "c": 2, "h": "The interesting octet determines block size."}, {"id": "subnetting/Hard/4", "q": "Can 10.0.1.0/24 and 10.0.2.0/24 form exactly one /23?", "o": ["No. They straddle /23 boundaries; a broader summary would include additional networks.", "Use .50.0/25 (126 usable), .50.128/26 (62), .50.192/26 (62), and .51.0/27 (30) inside 192.168.50.0/23. Their broadcasts are .50.127, .50.191, .50.255, and .51.31. They do not overlap. A /23 gives room for all four.", "Use .0/26 (62 usable) and .64/27 (30 usable), with non-overlapping aligned ranges."], "c": 0, "h": "A summary requires contiguous aligned prefixes."}, {"id": "subnetting/Hard/5", "q": "A /24 must hold total requirements of 60, 30, and 12 usable addresses.\nWhich explanation is supported by these facts?", "o": ["Gateway and future devices must count in the address requirement.", "Five host bits give 2^5 addresses; network/broadcast consume two in ordinary IPv4 LANs.", "60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable)."], "c": 2, "h": "A requirement of 30 PCs plus one gateway needs more than 30 usable addresses."}, {"id": "subnetting/Hard/6", "q": "A /24 is allocated /25 first, then /26 in the remaining aligned space.\nWhich explanation is supported by these facts?", "o": ["32−26 = 6 host bits; 2^6 = 64 total addresses.", "Largest-first allocation helps avoid fragmentation.", "The interesting octet determines block size."], "c": 1, "h": "Largest-first allocation helps avoid fragmentation."}, {"id": "subnetting/Hard/7", "q": "10.0.0.33/27 and .60/27 share .32/27.\nWhich explanation is supported by these facts?", "o": ["The interesting octet determines block size.", "60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable).", "Compare the derived network, not only the last octet."], "c": 2, "h": "Compare the derived network, not only the last octet."}, {"id": "subnetting/Hard/8", "q": "/29 is 255.255.255.248, increment 8.\nWhich explanation is supported by these facts?", "o": ["The interesting octet determines block size.", "Largest-first allocation helps avoid fragmentation.", "A summary requires contiguous aligned prefixes."], "c": 0, "h": "The interesting octet determines block size."}, {"id": "subnetting/Hard/9", "q": "10.0.0.0/24 and 10.0.1.0/24 align into 10.0.0.0/23.\nWhich explanation is supported by these facts?", "o": ["A summary requires contiguous aligned prefixes.", "Five host bits give 2^5 addresses; network/broadcast consume two in ordinary IPv4 LANs.", "60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable)."], "c": 0, "h": "A summary requires contiguous aligned prefixes."}, {"id": "subnetting/Hard/10", "q": "During a lab handover, someone asks: Why plan the largest group first? Which explanation should you give?", "o": ["So you can connect the symptom, evidence and repair to one cause rather than guess which change mattered.", "No. It is the local router address your device uses to reach other networks.", "It makes it easier to place the larger blocks correctly and leaves the remaining space for smaller groups."], "c": 2, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "subnetting/Hard/11", "q": "You are explaining this topic to a colleague. A conventional IPv4 /26 LAN contains how many usable host addresses?", "o": ["62", "30", "64"], "c": 0, "h": "Correct. There are 64 total addresses and 62 conventional usable host addresses."}], "Very Hard": [{"id": "subnetting/Very Hard/0", "q": "Explain why the request cannot fit and propose a valid larger allocation on paper.", "o": ["192.168.2.127; usable range .97–.126.", "Network .64, broadcast .127, hosts .65–.126, 62 usable.", "Use .50.0/25 (126 usable), .50.128/26 (62), .50.192/26 (62), and .51.0/27 (30) inside 192.168.50.0/23. Their broadcasts are .50.127, .50.191, .50.255, and .51.31. They do not overlap. A /23 gives room for all four.", "/28 gives 14 usable; /29 gives only 6."], "c": 2, "h": "Do not subtract gateway needs from the device counts."}, {"id": "subnetting/Very Hard/1", "q": "Can /25, /26, /26 and /27 fit into one /24?", "o": ["No. At least 64 usable addresses are required; an ordinary /25 supplies 126.", "14: 16 total minus network and broadcast. /31 and /32 have special uses.", "They overlap: .0/25 covers .0–.127, including the entire .64–.127 /26.", "No. 128+64+64+32=288 addresses exceeds 256."], "c": 3, "h": "Address block sizes, not usable-host totals, determine fit."}, {"id": "subnetting/Very Hard/2", "q": "Audit .0/25 and .64/26 in one /24.", "o": ["No. 128+64+64+32=288 addresses exceeds 256.", "Use .50.0/25 (126 usable), .50.128/26 (62), .50.192/26 (62), and .51.0/27 (30) inside 192.168.50.0/23. Their broadcasts are .50.127, .50.191, .50.255, and .51.31. They do not overlap. A /23 gives room for all four.", "No. At least 64 usable addresses are required; an ordinary /25 supplies 126.", "They overlap: .0/25 covers .0–.127, including the entire .64–.127 /26."], "c": 3, "h": "Separate network-looking labels can still share addresses."}, {"id": "subnetting/Very Hard/3", "q": "Should every user LAN be converted to /31 for efficiency?", "o": ["14: 16 total minus network and broadcast. /31 and /32 have special uses.", "No. At least 64 usable addresses are required; an ordinary /25 supplies 126.", "Use .50.0/25 (126 usable), .50.128/26 (62), .50.192/26 (62), and .51.0/27 (30) inside 192.168.50.0/23. Their broadcasts are .50.127, .50.191, .50.255, and .51.31. They do not overlap. A /23 gives room for all four.", "No. /31 is for supported point-to-point use, not an ordinary multi-host broadcast LAN."], "c": 3, "h": "RFC 3021 changes ordinary network/broadcast interpretation there."}, {"id": "subnetting/Very Hard/4", "q": "A department needs 62 PCs plus gateway and printer. Does /26 fit?", "o": ["No. At least 64 usable addresses are required; an ordinary /25 supplies 126.", "/28 gives 14 usable; /29 gives only 6.", "No. /31 is for supported point-to-point use, not an ordinary multi-host broadcast LAN.", "192.168.2.127; usable range .97–.126."], "c": 0, "h": "Gateway and future devices must count in the address requirement."}, {"id": "subnetting/Very Hard/5", "q": "A /24 must support 100, 60, 30, and 14 end devices, each group also needing a gateway.\nWhich explanation is supported by these facts?", "o": ["Five host bits give 2^5 addresses; network/broadcast consume two in ordinary IPv4 LANs.", "Host needs become 101, 61, 31, and 15.", "Address block sizes, not usable-host totals, determine fit.", "Separate network-looking labels can still share addresses."], "c": 1, "h": "Do not subtract gateway needs from the device counts."}, {"id": "subnetting/Very Hard/6", "q": "/25 + /26 + /26 exactly fills a /24.\nWhich explanation is supported by these facts?", "o": ["Gateway and future devices must count in the address requirement.", "60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable).", "Address block sizes, not usable-host totals, determine fit.", "Choose sufficient host capacity, accounting for infrastructure."], "c": 2, "h": "Address block sizes, not usable-host totals, determine fit."}, {"id": "subnetting/Very Hard/7", "q": "A /26 at .64 covers .64–.127; a /27 at .96 overlaps it.\nWhich explanation is supported by these facts?", "o": ["Address block sizes, not usable-host totals, determine fit.", "Separate network-looking labels can still share addresses.", "Gateway and future devices must count in the address requirement.", "Compare the derived network, not only the last octet."], "c": 1, "h": "Separate network-looking labels can still share addresses."}, {"id": "subnetting/Very Hard/8", "q": "A /31 can number both ends of a supported point-to-point link.\nWhich explanation is supported by these facts?", "o": ["Address block sizes, not usable-host totals, determine fit.", "RFC 3021 changes ordinary network/broadcast interpretation there.", "Gateway and future devices must count in the address requirement.", "Compare the derived network, not only the last octet."], "c": 1, "h": "RFC 3021 changes ordinary network/broadcast interpretation there."}, {"id": "subnetting/Very Hard/9", "q": "A 60-host requirement barely fits 62 usable in /26.\nWhich explanation is supported by these facts?", "o": ["Gateway and future devices must count in the address requirement.", "Choose sufficient host capacity, accounting for infrastructure.", "60 fits /26 (62 usable), 30 fits /27 (30 usable), and 12 fits /28 (14 usable).", "32−26 = 6 host bits; 2^6 = 64 total addresses."], "c": 0, "h": "Gateway and future devices must count in the address requirement."}]}, "ipv6": {"Easy": [{"id": "ipv6/lesson-check/Easy/0", "q": "How are IPv6 addresses represented?", "o": ["48 bits in six MAC groups.", "32 bits in dotted decimal.", "128 bits written in hexadecimal groups."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ipv6/lesson-check/Easy/1", "q": "Which compression rule is valid?", "o": ["Remove trailing zeros within any group.", "Use :: for two separate zero runs.", "Remove leading zeros; use :: once for consecutive zero groups."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ipv6/lesson-check/Easy/2", "q": "How does IPv6 discover neighbors?", "o": ["IPv4 ARP broadcasts containing IPv6 addresses.", "DHCPv4 messages sent to all neighbors.", "ICMPv6 Neighbor Discovery on the local link."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ipv6/lesson-check/Easy/3", "q": "What should you check when adding IPv6?", "o": ["Only IPv4 ping, which proves IPv6 works.", "Only that all eight groups remain visibly written.", "IPv6 local reachability and neighbor information."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ipv6/lesson-check/Easy/4", "q": "Why may :: appear only once?", "o": ["Multiple omitted runs would have ambiguous lengths.", "A second run becomes an IPv4 mask.", "Only the first group can contain zeros."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "ipv6/lesson-check/Easy/5", "q": "Which scope statement is correct?", "o": ["Link-local is globally routed by default.", "Link-local applies to the current link; IPv6 has no broadcast.", "Broadcast replaces multicast in IPv6 neighbor discovery."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "ipv6/Hard/0", "q": "Add IPv6 to a working Packet Tracer IPv4 LAN.", "o": ["No. It is link-local all-nodes multicast; distinguish multicast from broadcast.", "With links up and correct settings, local pings work. The neighbor table can show discovered link-layer peers. A /64 prefix is shared, but each endpoint has its own address.", "It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy."], "c": 1, "h": "Neighbor Discovery supplies link-layer neighbor information; it is not ARP."}, {"id": "ipv6/Hard/1", "q": "Does DHCPv6 normally provide the IPv6 default gateway?", "o": ["It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy.", "The default router is learned through Router Advertisements, not a normal DHCPv6 gateway option.", "Inspect AAAA answer, IPv6 address/default route, ND, policy and service binding, then compare equivalent IPv4 tests."], "c": 1, "h": "SLAAC uses advertised information; DHCPv6 is a separate mechanism."}, {"id": "ipv6/Hard/2", "q": "Why is a duplicate IPv6 address problematic even with a /64?", "o": ["2001:db8:1::2; use :: only once in an address.", "No. Global/appropriate addressing, a route, policy and upstream connectivity still need to work.", "Address space size does not prevent configuration duplicates; conflicting ownership disrupts delivery."], "c": 2, "h": "Duplicate Address Detection checks for another owner on the link."}, {"id": "ipv6/Hard/3", "q": "Does seeing fe80:: alone prove global IPv6 internet access?", "o": ["No. Global/appropriate addressing, a route, policy and upstream connectivity still need to work.", "IPv4 success supports working link and IPv4 configuration; it does not prove IPv6 is correct. Restoring B’s intended /64 resolves this prefix error when other settings and policy are correct.", "Inspect AAAA answer, IPv6 address/default route, ND, policy and service binding, then compare equivalent IPv4 tests."], "c": 0, "h": "Addresses have different scopes and purposes."}, {"id": "ipv6/Hard/4", "q": "Which installed route matches 2001:db8:5::8: 2001:db8:5::/64 or ::/0?", "o": ["The /64, because it is more specific.", "It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy.", "2001:db8:1::2; use :: only once in an address."], "c": 0, "h": "IPv6 also uses longest-prefix matching."}, {"id": "ipv6/Hard/5", "q": "Router ::1 and PCs ::10 and ::11 use 2001:db8:1::/64.\nWhich explanation is supported by these facts?", "o": ["Addresses have different scopes and purposes.", "They share a /64 and can communicate locally.", "Leading zeros are omitted; one consecutive zero run can use ::."], "c": 1, "h": "Neighbor Discovery supplies link-layer neighbor information; it is not ARP."}, {"id": "ipv6/Hard/6", "q": "A host learns an on-link prefix and router information from RA.\nWhich explanation is supported by these facts?", "o": ["Duplicate Address Detection checks for another owner on the link.", "SLAAC uses advertised information; DHCPv6 is a separate mechanism.", "They share a /64 and can communicate locally."], "c": 1, "h": "SLAAC uses advertised information; DHCPv6 is a separate mechanism."}, {"id": "ipv6/Hard/7", "q": "A host probes a tentative address before ordinary use.\nWhich explanation is supported by these facts?", "o": ["It has no IPv4-style broadcast address.", "Addresses have different scopes and purposes.", "Duplicate Address Detection checks for another owner on the link."], "c": 2, "h": "Duplicate Address Detection checks for another owner on the link."}, {"id": "ipv6/Hard/8", "q": "A host has link-local and global addresses.\nWhich explanation is supported by these facts?", "o": ["They share a /64 and can communicate locally.", "Addresses have different scopes and purposes.", "Each protocol family has its own addresses/routes and failure evidence."], "c": 1, "h": "Addresses have different scopes and purposes."}, {"id": "ipv6/Hard/9", "q": "A destination matches a /64 and a /0 route.\nWhich explanation is supported by these facts?", "o": ["IPv6 also uses longest-prefix matching.", "SLAAC uses advertised information; DHCPv6 is a separate mechanism.", "Leading zeros inside a group can be removed."], "c": 0, "h": "IPv6 also uses longest-prefix matching."}, {"id": "ipv6/Hard/10", "q": "During a lab handover, someone asks: Can you use :: twice in the same IPv6 address? Which explanation should you give?", "o": ["So you can connect the symptom, evidence and repair to one cause rather than guess which change mattered.", "It makes it easier to place the larger blocks correctly and leaves the remaining space for smaller groups.", "No. Two uses would make it ambiguous where the omitted zero groups belong."], "c": 2, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "ipv6/Hard/11", "q": "You are explaining this topic to a colleague. Which statement about IPv6 is correct?", "o": ["IPv6 uses ARP exactly like IPv4.", "All IPv6 addresses are globally reachable.", "IPv6 uses neighbor discovery instead of IPv4 ARP."], "c": 2, "h": "Correct. IPv6 neighbor discovery uses ICMPv6 for tasks including link-layer address resolution."}], "Very Hard": [{"id": "ipv6/Very Hard/0", "q": "Repair the saved dual-stack lab and describe what IPv4 success proves.", "o": ["IPv4 success supports working link and IPv4 configuration; it does not prove IPv6 is correct. Restoring B’s intended /64 resolves this prefix error when other settings and policy are correct.", "It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy.", "Address space size does not prevent configuration duplicates; conflicting ownership disrupts delivery.", "No. It is link-local all-nodes multicast; distinguish multicast from broadcast."], "c": 0, "h": "Treat the two protocol configurations separately."}, {"id": "ipv6/Very Hard/1", "q": "Expand 2001:db8:0:1::a to eight groups.", "o": ["No. Link-local addresses require interface/link context and are not forwarded across routers.", "IPv4 success supports working link and IPv4 configuration; it does not prove IPv6 is correct. Restoring B’s intended /64 resolves this prefix error when other settings and policy are correct.", "It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy.", "2001:0db8:0000:0001:0000:0000:0000:000a."], "c": 3, "h": "Two :: runs leave expansion ambiguous."}, {"id": "ipv6/Very Hard/2", "q": "Why is an IPv4-style block-all-ICMP policy risky for IPv6?", "o": ["It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy.", "ICMPv6 Neighbor Discovery using solicitation/advertisement messages.", "With links up and correct settings, local pings work. The neighbor table can show discovered link-layer peers. A /64 prefix is shared, but each endpoint has its own address.", "The /64, because it is more specific."], "c": 0, "h": "ICMPv6 carries essential network functions beyond ping."}, {"id": "ipv6/Very Hard/3", "q": "Is ff02::1 an IPv6 broadcast?", "o": ["Inspect AAAA answer, IPv6 address/default route, ND, policy and service binding, then compare equivalent IPv4 tests.", "2001:0db8:0000:0001:0000:0000:0000:000a.", "No. It is link-local all-nodes multicast; distinguish multicast from broadcast.", "It may block neighbor/router discovery and Packet Too Big messages; use a considered role-specific ICMPv6 policy."], "c": 2, "h": "It has no IPv4-style broadcast address."}, {"id": "ipv6/Very Hard/4", "q": "How would you investigate a service failing only over IPv6?", "o": ["Address space size does not prevent configuration duplicates; conflicting ownership disrupts delivery.", "The default router is learned through Router Advertisements, not a normal DHCPv6 gateway option.", "2001:db8:1::2; use :: only once in an address.", "Inspect AAAA answer, IPv6 address/default route, ND, policy and service binding, then compare equivalent IPv4 tests."], "c": 3, "h": "Each protocol family has its own addresses/routes and failure evidence."}, {"id": "ipv6/Very Hard/5", "q": "PC A is 2001:db8:1::10/64; PC B was accidentally set to 2001:db8:2::11/64 on the same isolated LAN.\nWhich explanation is supported by these facts?", "o": ["ICMPv6 carries essential network functions beyond ping.", "It has no IPv4-style broadcast address.", "Duplicate Address Detection checks for another owner on the link.", "The physical link does not make different IP prefixes the same subnet."], "c": 3, "h": "Treat the two protocol configurations separately."}, {"id": "ipv6/Very Hard/6", "q": "2001:db8::1::2 is invalid.\nWhich explanation is supported by these facts?", "o": ["It has no IPv4-style broadcast address.", "Two :: runs leave expansion ambiguous.", "Leading zeros inside a group can be removed.", "Each protocol family has its own addresses/routes and failure evidence."], "c": 1, "h": "Two :: runs leave expansion ambiguous."}, {"id": "ipv6/Very Hard/7", "q": "Blocking all ICMPv6 can break ND and path MTU discovery.\nWhich explanation is supported by these facts?", "o": ["It has no IPv4-style broadcast address.", "ICMPv6 carries essential network functions beyond ping.", "Leading zeros are omitted; one consecutive zero run can use ::.", "Leading zeros inside a group can be removed."], "c": 1, "h": "ICMPv6 carries essential network functions beyond ping."}, {"id": "ipv6/Very Hard/8", "q": "IPv6 uses multicast for several local discovery functions.\nWhich explanation is supported by these facts?", "o": ["It has no IPv4-style broadcast address.", "Its reach is local to a link, not globally routed.", "It does not use IPv4 ARP.", "The physical link does not make different IP prefixes the same subnet."], "c": 0, "h": "It has no IPv4-style broadcast address."}, {"id": "ipv6/Very Hard/9", "q": "IPv4 works but the IPv6 default route is absent.\nWhich explanation is supported by these facts?", "o": ["The physical link does not make different IP prefixes the same subnet.", "IPv6 also uses longest-prefix matching.", "Each protocol family has its own addresses/routes and failure evidence.", "ICMPv6 carries essential network functions beyond ping."], "c": 2, "h": "Each protocol family has its own addresses/routes and failure evidence."}]}, "vlans": {"Easy": [{"id": "vlans/lesson-check/Easy/0", "q": "What does a VLAN create?", "o": ["An automatic application access policy.", "A separate Layer 2 broadcast domain.", "One shared routing table for all hosts."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "vlans/lesson-check/Easy/1", "q": "How do access ports and trunks differ?", "o": ["An access port serves a data VLAN; a trunk carries several.", "Access ports carry all VLANs; trunks always carry only one.", "Access ports route VLANs; trunks supply leases."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "vlans/lesson-check/Easy/2", "q": "What enables communication between VLAN IP networks?", "o": ["A trunk alone without routing.", "A router or Layer 3 switching function.", "Sharing one physical switch chassis."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "vlans/lesson-check/Easy/3", "q": "Which lab order separates switching and routing?", "o": ["Assume working trunks prove all gateway settings.", "Prove same-VLAN access across switches, then add routing.", "Test cross-VLAN access before creating VLANs."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "vlans/lesson-check/Easy/4", "q": "Does a trunk alone route between VLANs?", "o": ["Yes; tags automatically install routes.", "No; it carries identified VLAN traffic.", "Yes; native VLAN selection supplies every gateway."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "vlans/lesson-check/Easy/5", "q": "Which VLAN statement is correct?", "o": ["Every physical switch has just one broadcast domain.", "Naming a VLAN automatically blocks unwanted services.", "One physical switch can host different broadcast domains."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "vlans/Hard/0", "q": "Extend the lab to two switches with VLANs 10 and 20.", "o": ["Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state.", "The omitted VLAN cannot cross that trunk even though its local access ports work. Restoring both intended VLANs repairs the selective trunk fault. For inter-VLAN traffic also verify router subinterfaces, dot1Q tags, and gateways.", "VLAN 10 peers should communicate across the trunk, as should VLAN 20 peers, with correct addressing and links. Different VLANs still need routing; trunking alone does not route."], "c": 2, "h": "A PC access port and an inter-switch trunk have different jobs."}, {"id": "vlans/Hard/1", "q": "What should you inspect when one VLAN crosses a trunk and another fails?", "o": ["The omitted VLAN cannot cross that trunk even though its local access ports work. Restoring both intended VLANs repairs the selective trunk fault. For inter-VLAN traffic also verify router subinterfaces, dot1Q tags, and gateways.", "Test VLAN/local gateway reachability, inspect host mask/gateway, then routed service and return path.", "Check VLAN existence, both trunk allowed lists, active forwarding state and endpoint membership."], "c": 2, "h": "Existence and transport permission are separate."}, {"id": "vlans/Hard/2", "q": "Does an up trunk prove native VLAN settings match?", "o": ["Check VLAN existence, both trunk allowed lists, active forwarding state and endpoint membership.", "No. Compare both ends explicitly and resolve the mismatch in the isolated lab.", "The omitted VLAN cannot cross that trunk even though its local access ports work. Restoring both intended VLANs repairs the selective trunk fault. For inter-VLAN traffic also verify router subinterfaces, dot1Q tags, and gateways."], "c": 1, "h": "Untagged frames may be assigned inconsistently even while link remains up."}, {"id": "vlans/Hard/3", "q": "Which two sides must agree for a VLAN 30 subinterface?", "o": ["The two team-10 PC ports belong to VLAN 10; the third belongs to VLAN 20. Same-subnet addressing is needed for same-VLAN IP tests; inter-VLAN delivery needs a router.", "Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state.", "No. Management can use a separate tagged VLAN with planned routing and security; native settings must still agree."], "c": 1, "h": "The attached switch link must carry that VLAN to the router."}, {"id": "vlans/Hard/4", "q": "Why inspect VLAN membership before adding more routes for a down SVI?", "o": ["Check VLAN existence, both trunk allowed lists, active forwarding state and endpoint membership.", "The gateway itself may lack an active VLAN path; repair the relevant VLAN/interface state first.", "Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state."], "c": 1, "h": "SVI operational state can depend on active VLAN/ports and platform behavior."}, {"id": "vlans/Hard/5", "q": "Each of two switches has a VLAN 10 PC; a trunk connects the switches.\nWhich explanation is supported by these facts?", "o": ["Native VLAN, management VLAN and user VLAN roles are independent choices.", "Both switches need VLAN 10 present.", "Put each PC access port in the intended VLAN."], "c": 1, "h": "A PC access port and an inter-switch trunk have different jobs."}, {"id": "vlans/Hard/6", "q": "VLAN 20 exists but is absent from a trunk allowed list.\nWhich explanation is supported by these facts?", "o": ["VLAN separation alone is not an inter-VLAN authorization policy.", "Unplanned database propagation can change VLAN information.", "Existence and transport permission are separate."], "c": 2, "h": "Existence and transport permission are separate."}, {"id": "vlans/Hard/7", "q": "One end uses native 10, the other native 20.\nWhich explanation is supported by these facts?", "o": ["Existence and transport permission are separate.", "Untagged frames may be assigned inconsistently even while link remains up.", "Both switches need VLAN 10 present."], "c": 1, "h": "Untagged frames may be assigned inconsistently even while link remains up."}, {"id": "vlans/Hard/8", "q": "A router subinterface uses encapsulation dot1Q 10.\nWhich explanation is supported by these facts?", "o": ["VLAN separation alone is not an inter-VLAN authorization policy.", "The attached switch link must carry that VLAN to the router.", "VLAN 20 is a separate domain."], "c": 1, "h": "The attached switch link must carry that VLAN to the router."}, {"id": "vlans/Hard/9", "q": "A VLAN interface is configured but down.\nWhich explanation is supported by these facts?", "o": ["VLAN separation alone is not an inter-VLAN authorization policy.", "802.1Q labels VLAN traffic, with native-VLAN behavior configured separately.", "SVI operational state can depend on active VLAN/ports and platform behavior."], "c": 2, "h": "SVI operational state can depend on active VLAN/ports and platform behavior."}, {"id": "vlans/Hard/10", "q": "During a lab handover, someone asks: Does a trunk by itself route between VLANs? Which explanation should you give?", "o": ["No. Ping tests an ICMP response. The web service and its connection need their own test.", "No. It carries VLAN traffic. A routing function is needed to communicate between their networks.", "Allow the access needed for the task, rather than granting broad access without a reason."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "vlans/Hard/11", "q": "You are explaining this topic to a colleague. Two hosts are in different VLANs. What is normally needed for communication between their IP subnets?", "o": ["A shared MAC address.", "Layer 3 routing.", "Only a longer cable."], "c": 1, "h": "Correct. A router or appropriately configured Layer 3 switch can route between the subnets, subject to policy."}], "Very Hard": [{"id": "vlans/Very Hard/0", "q": "Remove VLAN 20 from one lab trunk, diagnose it, and restore it.", "o": ["No. An ordinary access port belongs to one data VLAN; voice VLAN features are a distinct case.", "The omitted VLAN cannot cross that trunk even though its local access ports work. Restoring both intended VLANs repairs the selective trunk fault. For inter-VLAN traffic also verify router subinterfaces, dot1Q tags, and gateways.", "Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state.", "The two team-10 PC ports belong to VLAN 10; the third belongs to VLAN 20. Same-subnet addressing is needed for same-VLAN IP tests; inter-VLAN delivery needs a router."], "c": 1, "h": "Use the full intended allowed list; do not accidentally replace VLAN 10."}, {"id": "vlans/Very Hard/1", "q": "Plan staged verification after fixing the trunk.", "o": ["Check VLAN existence, both trunk allowed lists, active forwarding state and endpoint membership.", "Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state.", "Inspect mode/version/domain/revision and VLAN database; follow the documented reset/integration procedure and preserve a backup.", "Test VLAN/local gateway reachability, inspect host mask/gateway, then routed service and return path."], "c": 3, "h": "Repairing transport may leave remote access broken."}, {"id": "vlans/Very Hard/2", "q": "What should precede connecting an unknown switch to a VTP domain?", "o": ["Inspect mode/version/domain/revision and VLAN database; follow the documented reset/integration procedure and preserve a backup.", "The gateway itself may lack an active VLAN path; repair the relevant VLAN/interface state first.", "No. It floods eligible ports in VLAN 30.", "No. An ordinary access port belongs to one data VLAN; voice VLAN features are a distinct case."], "c": 0, "h": "Unplanned database propagation can change VLAN information."}, {"id": "vlans/Very Hard/3", "q": "How do you permit staff HTTPS to a server but deny guest access?", "o": ["No. An ordinary access port belongs to one data VLAN; voice VLAN features are a distinct case.", "Use VLAN/subnet separation plus explicit routed ACL/firewall policy for sources/destination/service; test permits and denies.", "Configure the intended port as access and assign access VLAN 20 on a compatible switch.", "Switch trunk transport and router dot1Q 30 subinterface, plus VLAN 30 gateway/subnet and operational state."], "c": 1, "h": "VLAN separation alone is not an inter-VLAN authorization policy."}, {"id": "vlans/Very Hard/4", "q": "Must the management SVI use the native VLAN number?", "o": ["No. Management can use a separate tagged VLAN with planned routing and security; native settings must still agree.", "Check VLAN existence, both trunk allowed lists, active forwarding state and endpoint membership.", "No. An ordinary access port belongs to one data VLAN; voice VLAN features are a distinct case.", "No. Configure addressing, gateways and a working routed path with suitable policy."], "c": 0, "h": "Native VLAN, management VLAN and user VLAN roles are independent choices."}, {"id": "vlans/Very Hard/5", "q": "VLAN 10 works across switches; VLAN 20 works locally but fails across the trunk because it was omitted from an allowed list.\nWhich explanation is supported by these facts?", "o": ["VLAN separation alone is not an inter-VLAN authorization policy.", "The attached switch link must carry that VLAN to the router.", "Local VLAN 20 success narrows attention to its inter-switch path.", "VLAN 20 is a separate domain."], "c": 2, "h": "Use the full intended allowed list; do not accidentally replace VLAN 10."}, {"id": "vlans/Very Hard/6", "q": "VLAN 20 is missing from trunk and its host gateway is wrong.\nWhich explanation is supported by these facts?", "o": ["VLAN separation alone is not an inter-VLAN authorization policy.", "Repairing transport may leave remote access broken.", "Put each PC access port in the intended VLAN.", "An ordinary access port carries its selected data VLAN untagged."], "c": 1, "h": "Repairing transport may leave remote access broken."}, {"id": "vlans/Very Hard/7", "q": "A switch joins with a higher revision under VTP v1/v2.\nWhich explanation is supported by these facts?", "o": ["Put each PC access port in the intended VLAN.", "Unplanned database propagation can change VLAN information.", "Both switches need VLAN 10 present.", "VLAN 20 is a separate domain."], "c": 1, "h": "Unplanned database propagation can change VLAN information."}, {"id": "vlans/Very Hard/8", "q": "Routing allows VLANs to communicate unless policy restricts it.\nWhich explanation is supported by these facts?", "o": ["Both switches need VLAN 10 present.", "VLAN separation alone is not an inter-VLAN authorization policy.", "Native VLAN, management VLAN and user VLAN roles are independent choices.", "A VLAN separates switching domains; routing connects IP networks."], "c": 1, "h": "VLAN separation alone is not an inter-VLAN authorization policy."}, {"id": "vlans/Very Hard/9", "q": "An unused native VLAN is selected consistently.\nWhich explanation is supported by these facts?", "o": ["VLAN 20 is a separate domain.", "Both switches need VLAN 10 present.", "Native VLAN, management VLAN and user VLAN roles are independent choices.", "An ordinary access port carries its selected data VLAN untagged."], "c": 2, "h": "Native VLAN, management VLAN and user VLAN roles are independent choices."}]}, "stp": {"Easy": [{"id": "stp/lesson-check/Easy/0", "q": "Why use spanning tree with redundant Layer 2 links?", "o": ["Loops can make frames circulate.", "Spare cables prevent switches learning any MACs.", "Every extra cable creates an IP subnet."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "stp/lesson-check/Easy/1", "q": "How does STP organize forwarding?", "o": ["Elect a root and maintain a loop-free active topology.", "Permanently remove all spare paths even after failures.", "Make every redundant link forward ordinary traffic simultaneously."], "c": 0, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "stp/lesson-check/Easy/2", "q": "What does EtherChannel do?", "o": ["Translate Ethernet frames into IP packets.", "Group compatible links into one logical connection.", "Keep every member as an independent ungrouped forwarding loop."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "stp/lesson-check/Easy/3", "q": "What should you inspect before the cable-failure lab?", "o": ["Only cable colours and host addresses.", "Only client lease times.", "The root and current non-forwarding path."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "stp/lesson-check/Easy/4", "q": "Why can a healthy redundant link be non-forwarding?", "o": ["Its hosts must use a different subnet.", "Prevent a Layer 2 loop while another path is active.", "Every non-forwarding link is physically damaged."], "c": 1, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}, {"id": "stp/lesson-check/Easy/5", "q": "What should the failover test establish?", "o": ["No forwarding change after losing the sole active path.", "All independent physical links always forwarding simultaneously.", "A usable alternative after an active-path failure."], "c": 2, "h": "Review the explanation of this role or action in the lesson. Compare what each choice claims before retrying."}], "Hard": [{"id": "stp/Hard/0", "q": "Build a three-switch triangle in Packet Tracer with consistent VLANs/trunks.", "o": ["Active/passive can negotiate; passive/passive does not initiate. Verify that ports are actually bundled and that the logical port-channel is correct. Do not infer success solely from entered commands.", "Compare root IDs, port roles/costs and event logs against the baseline; correlate physical status rather than guessing.", "The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover."], "c": 2, "h": "Expect convergence behavior, not guaranteed zero packet loss."}, {"id": "stp/Hard/1", "q": "Does the physically shortest-looking diagram path always win?", "o": ["No. Configured/derived costs and subsequent tie breakers determine selection.", "The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover.", "Active/passive can negotiate; passive/passive does not initiate. Verify that ports are actually bundled and that the logical port-channel is correct. Do not infer success solely from entered commands."], "c": 0, "h": "Root port choice compares received root-path information and tie breakers."}, {"id": "stp/Hard/2", "q": "Why test BPDU Guard with a lab switch rather than just a PC ping?", "o": ["The remaining topology should regain connectivity if a valid alternate path exists. Port roles/states change; transient loss can occur. Record actual timings instead of asserting instant failover.", "The trigger is a BPDU; ordinary host traffic does not exercise that behavior.", "No. Classify edge versus switch links and use the supported design."], "c": 1, "h": "BPDU Guard can error-disable it on compatible configurations."}, {"id": "stp/Hard/3", "q": "How would you verify that the intended root actually won?", "o": ["No. Revision and VLAN mappings must also match; verify the digest/configuration.", "Inspect spanning-tree output for the relevant VLAN/instance and root ID on multiple switches.", "Record roles, fail one planned link, measure loss/recovery, inspect new roles and MAC stability, then restore and verify the baseline."], "c": 1, "h": "Explicit suitable priority supports predictable paths."}, {"id": "stp/Hard/4", "q": "Why check the bundle before interpreting blocked individual links?", "o": ["No. Classify edge versus switch links and use the supported design.", "Misconfigured or unbundled members may appear as separate ports; inspect channel state and spanning tree together.", "Record roles, fail one planned link, measure loss/recovery, inspect new roles and MAC stability, then restore and verify the baseline."], "c": 1, "h": "STP treats a correctly formed channel as one logical port."}, {"id": "stp/Hard/5", "q": "A triangle of switches has an alternate blocked/discarding path.\nWhich explanation is supported by these facts?", "o": ["RSTP states are discarding, learning and forwarding.", "An election change can move forwarding paths without a cable failure.", "STP keeps redundant paths from all forwarding simultaneously."], "c": 2, "h": "Expect convergence behavior, not guaranteed zero packet loss."}, {"id": "stp/Hard/6", "q": "A switch selects the lowest total cost path to the root.\nWhich explanation is supported by these facts?", "o": ["Root port choice compares received root-path information and tie breakers.", "STP keeps redundant paths from all forwarding simultaneously.", "Lower priority contributes to a lower bridge ID."], "c": 0, "h": "Root port choice compares received root-path information and tie breakers."}, {"id": "stp/Hard/7", "q": "An edge port receives an unexpected BPDU.\nWhich explanation is supported by these facts?", "o": ["BPDU Guard can error-disable it on compatible configurations.", "Explicit suitable priority supports predictable paths.", "STP treats a correctly formed channel as one logical port."], "c": 0, "h": "BPDU Guard can error-disable it on compatible configurations."}, {"id": "stp/Hard/8", "q": "The distribution switch is intended as root.\nWhich explanation is supported by these facts?", "o": ["STP keeps redundant paths from all forwarding simultaneously.", "Explicit suitable priority supports predictable paths.", "Compare priority including extended system ID, then MAC."], "c": 1, "h": "Explicit suitable priority supports predictable paths."}, {"id": "stp/Hard/9", "q": "Two physical links join one EtherChannel.\nWhich explanation is supported by these facts?", "o": ["Root port choice compares received root-path information and tie breakers.", "STP treats a correctly formed channel as one logical port.", "Lower priority contributes to a lower bridge ID."], "c": 1, "h": "STP treats a correctly formed channel as one logical port."}, {"id": "stp/Hard/10", "q": "During a lab handover, someone asks: Why might a healthy redundant switch link not forward data? Which explanation should you give?", "o": ["So you can connect the symptom, evidence and repair to one cause rather than guess which change mattered.", "Spanning tree can keep it out of the active forwarding path to prevent a Layer 2 loop.", "Check the expected OSPF neighbor adjacency, along with the link and compatible settings."], "c": 1, "h": "Separate the roles described in the lesson before drawing a conclusion."}, {"id": "stp/Hard/11", "q": "You are explaining this topic to a colleague. Why does spanning tree block some redundant Layer 2 paths?", "o": ["To stop all broadcasts.", "To prevent forwarding loops while retaining redundancy.", "To increase the VLAN count."], "c": 1, "h": "Correct. An alternate path can become active if the topology changes."}], "Very Hard": [{"id": "stp/Very Hard/0", "q": "On a separate lab pair, compare active/passive with passive/passive.", "o": ["8192 wins among these priorities. With equal priority/system-ID extension, the lowest MAC decides. Check the actual VLAN instance rather than assuming one root for all VLANs.", "Record roles, fail one planned link, measure loss/recovery, inspect new roles and MAC stability, then restore and verify the baseline.", "Active/passive can negotiate; passive/passive does not initiate. Verify that ports are actually bundled and that the logical port-channel is correct. Do not infer success solely from entered commands.", "The trigger is a BPDU; ordinary host traffic does not exercise that behavior."], "c": 2, "h": "An unformed channel is not automatically a loop; STP still governs independent links."}, {"id": "stp/Very Hard/1", "q": "Is every RSTP failure guaranteed to converge in six seconds?", "o": ["Active/passive can negotiate; passive/passive does not initiate. Verify that ports are actually bundled and that the logical port-channel is co
